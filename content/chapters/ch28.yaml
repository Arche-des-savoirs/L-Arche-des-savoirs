            - { id: ch28-j2-ra-m2b, subject: espagnol, level: 3, kind: qcm, prompt: "Traduis : « Cada peldaño tiene su lugar. »", choices: ["Chaque marche a sa place.", "Chaque marche disparaît vite.", "Chaque marche brille au soleil.", "Chaque marche fait du bruit.", "Chaque marche reste froide."], answer: "Chaque marche a sa place.", hint: "« Tiene su lugar » = a sa place." }
