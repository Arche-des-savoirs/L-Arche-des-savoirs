          maelle:
            - { id: ch28-j2-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 288 ÷ 4.", choices: ["68", "70", "72", "74", "76"], answer: "72", hint: "4 × 72 = 288." }
            - { id: ch28-j2-ma-m3b, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi est-il souvent utile de bien comprendre les avantages et les limites de chaque option avant de choisir une solution technique ?", choices: ["parce que cela permet de choisir en toute connaissance de cause, selon ses priorités réelles", "parce que comprendre les options n'a jamais aucune utilité pour décider", "cela n'a aucun lien avec la prise de décision technique", "parce qu'il vaut toujours mieux choisir au hasard, sans réflexion", "parce qu'une seule option est toujours la bonne, sans comparaison possible"], answer: "parce que cela permet de choisir en toute connaissance de cause, selon ses priorités réelles", hint: "Pense à l'explication détaillée de l'architecte, sur les deux formes de marches possibles." }
