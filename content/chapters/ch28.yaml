            - { id: ch28-j2-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi un choix technique, comme la forme d'un escalier, implique-t-il souvent un compromis entre plusieurs qualités opposées ?", choices: ["parce qu'améliorer une qualité, comme la rapidité, se fait souvent au détriment d'une autre, comme la sécurité", "parce qu'un choix technique n'implique jamais aucun compromis", "cela n'a aucun lien avec la conception d'un escalier", "parce qu'il existe toujours une solution parfaite sans aucun compromis", "parce que la rapidité et la sécurité vont toujours ensemble, sans exception"], answer: "parce qu'améliorer une qualité, comme la rapidité, se fait souvent au détriment d'une autre, comme la sécurité", hint: "Pense au compromis entre sécurité et rapidité, expliqué par l'architecte." }
            - { id: ch28-j2-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 16 × 6.", choices: ["90", "92", "94", "96", "98"], answer: "96", hint: "16 × 6 = 16 × 3 × 2." }
