# Chapitre 28 — L'Architecte des Hauteurs
# Personnage mineur à voix partagée (Rasalgethi, comme le Scribe) : une architecte qui
# conçoit un escalier de pierre taillé à même la montagne, pour atteindre les hauteurs
# proches du sommet. Pas d'effet ORVANE ni de drapeau pour ce chapitre (absent de
# decisions.ts) : décision purement narrative sur la façon de concevoir l'escalier final.

id: ch28
number: 28
act: 2
title: L'Architecte des Hauteurs
introImage: ch28
scene: escalier-des-hauteurs

espagnol:
  - { es: "La escalera sube hasta la cumbre.", fr: "L'escalier monte jusqu'au sommet." }
  - { es: "Cada peldaño tiene su lugar.", fr: "Chaque marche a sa place." }
  - { es: "Construir pide mediciones exactas.", fr: "Construire demande des mesures exactes." }
  - { es: "La piedra guarda la forma elegida.", fr: "La pierre garde la forme choisie." }
  - { es: "Subir requiere un buen plan.", fr: "Monter demande un bon plan." }

decision:
  prompt: "L'architecte déroule un grand plan couvert de lignes et de chiffres, posé sur un établi de pierre. « Pour que cet escalier mène sans encombre jusqu'aux hauteurs, il me faut choisir sa forme : des marches larges et régulières, plus longues à tailler mais plus sûres, ou des marches étroites et rapides à poser, plus risquées par temps de pluie. Qu'en pensez-vous ? »"
  options:
    A:
      label: Choisir des marches larges et régulières, plus sûres
      scene: "Maelle conseille à l'architecte de choisir des marches larges et régulières, même si elles demandent plus de temps à tailler, pour garantir la sécurité de tous les voyageurs futurs."
      line: { who: architecte, text: "Un choix prudent et réfléchi, petite Cartographe. C'est exactement ce que choisirait une architecte soucieuse de la sécurité de tous." }
      habillage: "Les épreuves prennent la forme d'un travail minutieux et prolongé, marche par marche, pour un escalier durable et sûr."
    B:
      label: Choisir des marches étroites et rapides à poser
      scene: "Rafaelle, pressée de continuer la route, convainc l'architecte de choisir des marches étroites et rapides à poser, pour que l'escalier soit prêt le plus vite possible."
      line: { who: architecte, text: "Un escalier plus rapide à construire, petite Archiviste, mais qui demandera une prudence redoublée, surtout par temps de pluie." }
      habillage: "Les épreuves se déroulent dans la rapidité et l'urgence, au prix d'une solution un peu moins sûre à long terme."
    C:
      label: Proposer un compromis entre largeur et rapidité
      scene: "Axelle suggère un compromis : des marches ni trop larges ni trop étroites, pour que l'escalier soit à la fois raisonnablement sûr et raisonnablement rapide à construire."
      line: { who: architecte, text: "Un compromis réfléchi, petite Veilleuse. Ni la solution la plus sûre, ni la plus rapide, mais un équilibre souvent très judicieux." }
      habillage: "Les épreuves prennent la forme d'un travail équilibré, mêlant précision et efficacité, pour un escalier à michemin entre les deux extrêmes."

repliquesAbsurdes:
  - "Si chaque marche a sa place, est-ce qu'il y a des marches jalouses de la place des autres, plus proches du sommet ?"
  - "Mon renard a essayé de sauter trois marches d'un coup. Résultat : il a roulé jusqu'en bas, très vexé, la queue pleine de poussière de pierre."
  - "Est-ce qu'on peut demander à l'escalier de nous porter directement, sans qu'on ait à monter nous-mêmes, juste pour cette fois ?"
  - "Si construire demande des mesures exactes, est-ce que l'architecte compte aussi le nombre exact de soupirs qu'elle pousse par marche ?"
  - "Après une serre pleine de fleurs et un carrousel réparé, tailler un escalier dans la montagne, ça paraît presque un jeu d'enfant, en fait."

days:
  # ─────────────────────────── JOUR 1 ───────────────────────────
  - n: 1
    title: Un escalier inachevé
    decor: Un chantier à flanc de montagne, où un escalier de pierre, à moitié taillé, s'arrête brutalement au milieu d'une paroi rocheuse abrupte.
    opening:
      - { who: narrateur, text: "Le sentier, après la serre de Dame Alambic, déboucha sur un chantier à flanc de montagne, où un escalier de pierre, à moitié taillé, s'arrêtait brutalement au milieu d'une paroi rocheuse abrupte." }
      - { who: narrateur, text: "Une femme en tablier de travail, un grand plan déroulé sous le bras, observait la paroi avec une concentration qui ne semblait jamais se relâcher." }
      - { who: axelle, text: "Bonjour ! Cet escalier a l'air inachevé. Qu'est-ce qui s'est passé, exactement ?" }
      - { who: narrateur, text: "La femme se retourna, un sourire fatigué mais sincère aux lèvres, et roula son plan avec des gestes précis, habitués." }
      - { who: architecte, text: "Je suis l'architecte de cet escalier, petites voyageuses. Il doit mener jusqu'aux hauteurs proches du sommet, mais le chantier avance lentement, par manque de bras." }
      - { who: maelle, text: "Vous construisez cet escalier toute seule, depuis le début ?" }
      - { who: architecte, text: "Presque seule, petite Cartographe. Quelques aides passagères, de temps en temps, mais jamais bien longtemps." }
      - { who: rafaelle, text: "Et on pourrait vous aider, nous, pendant quelques jours ?" }
      - { who: architecte, text: "Avec grand plaisir, petite Archiviste. J'ai justement une décision importante à prendre, et vos avis seront les bienvenus." }
    manches:
      - id: m1
        title: Un chantier à flanc de montagne
        tours:
          axelle:
            - { id: ch28-j1-ax-m1a, subject: histoire-geo, level: 1, kind: qcm, prompt: "Comment appelle-t-on une personne dont le métier est de concevoir des bâtiments, des ponts ou des escaliers ?", choices: ["une architecte", "une bergère", "une messagère", "une tisserande", "une marchande"], answer: "une architecte", hint: "C'est le métier pratiqué par la femme rencontrée sur le chantier." }
            - { id: ch28-j1-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 7 + 8.", choices: ["13", "14", "15", "16", "17"], answer: "15", hint: "7 + 8 = 7 + 7 + 1." }
          maelle:
            - { id: ch28-j1-ma-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Pourquoi tailler des marches directement dans la roche d'une paroi abrupte est-il un travail particulièrement long et exigeant ?", choices: ["la roche est un matériau dur qui demande du temps et de la précision pour être façonné sans risque d'effondrement", "tailler la roche n'a jamais aucune difficulté particulière", "cela n'a aucune explication particulière", "la roche se façonne toujours instantanément, sans aucun effort", "un escalier dans la roche ne présente jamais aucun risque"], answer: "la roche est un matériau dur qui demande du temps et de la précision pour être façonné sans risque d'effondrement", hint: "Pense à la raison pour laquelle le chantier de l'architecte avance si lentement." }
            - { id: ch28-j1-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 64 + 58.", choices: ["118", "120", "122", "124", "126"], answer: "122", hint: "64 + 60 − 2." }
          rafaelle:
            - { id: ch28-j1-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi, historiquement, la construction d'escaliers taillés dans la roche a-t-elle souvent nécessité un travail collectif, sur plusieurs années ?", choices: ["parce que l'ampleur du travail et la dureté du matériau dépassent souvent les capacités d'une seule personne", "parce qu'un tel travail n'a jamais nécessité aucune aide", "cela n'a aucune importance historique", "parce qu'il est toujours possible de tailler un escalier en une seule journée", "parce que la roche se taille toujours plus facilement seule"], answer: "parce que l'ampleur du travail et la dureté du matériau dépassent souvent les capacités d'une seule personne", hint: "Pense à la difficulté de l'architecte, qui travaille presque seule depuis le début." }
            - { id: ch28-j1-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 17 × 5.", choices: ["75", "80", "82", "85", "88"], answer: "85", hint: "17 × 5 = 17 × 10 ÷ 2." }
      - id: m2
        title: Un plan déroulé
        tours:
          axelle:
            - { id: ch28-j1-ax-m2a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le sujet de « Une femme observait la paroi. » ?", choices: ["la paroi", "observait", "Une femme", "une", "femme"], answer: "Une femme", hint: "Qui observe la paroi rocheuse, sur le chantier ?" }
            - { id: ch28-j1-ax-m2b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 13 − 6.", choices: ["5", "6", "7", "8", "9"], answer: "7", hint: "13 − 6 = 7." }
          maelle:
            - { id: ch28-j1-ma-m2a, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « fatigué » dans « un sourire fatigué » ?", choices: ["nom", "verbe", "adjectif", "adverbe", "pronom"], answer: "adjectif", hint: "Il décrit le sourire de l'architecte, après tant de travail." }
            - { id: ch28-j1-ma-m2b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 376 ÷ 4.", choices: ["86", "88", "90", "92", "94"], answer: "94", hint: "4 × 94 = 376." }
          rafaelle:
            - { id: ch28-j1-ra-m2a, subject: francais, level: 4, kind: qcm, prompt: "« Quelques aides passagères, de temps en temps, mais jamais bien longtemps. » : que révèle cette phrase sur la situation de l'architecte ?", choices: ["qu'elle manque d'un soutien stable et continu pour mener à bien son chantier", "qu'elle a toujours bénéficié d'une aide constante et suffisante", "qu'elle refuse systématiquement toute forme d'aide", "qu'elle n'a jamais eu besoin d'aide pour ce chantier", "qu'elle considère son chantier comme terminé depuis longtemps"], answer: "qu'elle manque d'un soutien stable et continu pour mener à bien son chantier", hint: "Repense à ce que dit l'architecte sur les aides passagères qu'elle a reçues." }
            - { id: ch28-j1-ra-m2b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 12² − 80.", choices: ["58", "60", "62", "64", "68"], answer: "64", hint: "144 − 80." }
      - id: m3
        title: Une aide bienvenue
        tours:
          axelle:
            - { id: ch28-j1-ax-m3a, subject: maths, level: 1, kind: qcm, prompt: "L'escalier compte déjà 6 marches taillées, et il en manque encore 3 jusqu'au premier palier. Combien de marches au total jusqu'au palier ?", choices: ["7", "8", "9", "10", "11"], answer: "9", hint: "6 + 3." }
            - { id: ch28-j1-ax-m3b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi un escalier taillé dans la roche doit-il suivre un plan précis, établi avant de commencer le travail ?", choices: ["un plan permet d'anticiper la forme, la pente et la sécurité de l'ensemble avant de tailler la pierre", "un plan n'a jamais aucune utilité pour un tel chantier", "cela n'a aucune explication particulière", "il vaut toujours mieux tailler sans aucun plan préalable", "la forme d'un escalier n'a jamais besoin d'être anticipée"], answer: "un plan permet d'anticiper la forme, la pente et la sécurité de l'ensemble avant de tailler la pierre", hint: "Pense au grand plan que déroule l'architecte, couvert de lignes et de chiffres." }
          maelle:
            - { id: ch28-j1-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 48 × 4.", choices: ["182", "186", "188", "190", "192"], answer: "192", hint: "48 × 4 = 50 × 4 − 2 × 4." }
            - { id: ch28-j1-ma-m3b, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi proposer son aide à quelqu'un visiblement surchargé de travail, comme l'architecte, est-il souvent un geste précieux ?", choices: ["parce que cela permet d'avancer un travail important qui, autrement, risquerait de s'éterniser", "parce qu'une telle aide n'a jamais aucune utilité", "cela n'a aucun lien avec l'avancement d'un chantier", "parce qu'il vaut toujours mieux ne jamais proposer son aide à personne", "parce qu'un chantier avance toujours mieux sans aucune aide extérieure"], answer: "parce que cela permet d'avancer un travail important qui, autrement, risquerait de s'éterniser", hint: "Pense à la proposition de Rafaelle d'aider l'architecte pendant quelques jours." }
          rafaelle:
            - { id: ch28-j1-ra-m3a, subject: maths, level: 4, kind: qcm, prompt: "Résous : 5x + 7 = 42.", choices: ["5", "6", "7", "8", "9"], answer: "7", hint: "5x = 35." }
            - { id: ch28-j1-ra-m3b, subject: francais, level: 3, kind: qcm, prompt: "Conjugue au passé composé : « L'architecte (rouler) son plan avec des gestes précis. »", choices: ["a roulé", "roulait", "roulera", "roule", "roulant"], answer: "a roulé", hint: "« Rouler » se conjugue avec avoir au passé composé." }
      - id: m4
        title: Premiers pas sur le chantier
        tours:
          axelle:
            - { id: ch28-j1-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 8 × 4.", choices: ["28", "30", "31", "32", "34"], answer: "32", hint: "8 × 4 = 8 × 2 × 2." }
            - { gen: maths.addition }
          maelle:
            - { id: ch28-j1-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 305 − 148.", choices: ["155", "157", "159", "161", "163"], answer: "157", hint: "305 − 150 + 2." }
            - { gen: maths.multiplication }
          rafaelle:
            - { id: ch28-j1-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « La escalera sube hasta la cumbre. »", choices: ["L'escalier monte jusqu'au sommet.", "L'escalier descend vers la vallée.", "L'escalier reste immobile.", "L'escalier tombe en ruine.", "L'escalier change de forme."], answer: "L'escalier monte jusqu'au sommet.", hint: "« Sube hasta la cumbre » = monte jusqu'au sommet." }
            - { gen: maths.fraction-de }
    pause: "Le jeu des marches imaginaires : chaque sœur compte, à voix haute, un nombre de pas qu'elle imagine nécessaires pour grimper jusqu'au sommet, en expliquant brièvement son raisonnement."
    closing:
      - { who: narrateur, text: "Le soir tomba sur le chantier, et l'escalier inachevé se découpa, sombre et silencieux, contre le ciel qui s'assombrissait peu à peu au-dessus de la paroi rocheuse." }
      - { who: architecte, text: "Demain, nous choisirons ensemble la forme exacte des marches restantes. Reposez-vous bien, la décision mérite d'être prise avec l'esprit clair." }
      - { who: axelle, text: "On y réfléchira sérieusement, c'est promis." }
      - { who: narrateur, text: "Et tandis que la nuit enveloppait le chantier, l'architecte resta encore un long moment penchée sur son plan, comme si le repos, pour elle, attendrait encore un peu." }
    reward: "la découverte du chantier inachevé, et de l'architecte"
  # ─────────────────────────── JOUR 2 ───────────────────────────
  - n: 2
    title: Les deux formes de marches
    decor: Le chantier, au petit matin, où l'architecte explique aux trois sœurs la différence entre des marches larges et régulières, et des marches étroites et rapides à poser.
    opening:
      - { who: narrateur, text: "Le lendemain matin, l'architecte entreprit d'expliquer aux trois sœurs la différence entre les deux formes de marches possibles pour achever l'escalier." }
      - { who: architecte, text: "Regardez cette marche-ci, large et régulière : elle offre un appui sûr, même par temps de pluie, mais elle demande deux fois plus de temps à tailler." }
      - { who: rafaelle, text: "Et l'autre forme, la plus étroite, elle a quel avantage, alors ?" }
      - { who: architecte, text: "La rapidité, petite Archiviste. On peut en tailler bien davantage en une seule journée, mais elles glissent plus facilement sous la pluie." }
      - { who: maelle, text: "C'est un vrai choix entre sécurité et rapidité, alors." }
      - { who: architecte, text: "Exactement, petite Cartographe. Et c'est justement la décision qu'il nous faudra prendre, tous ensemble, dans les jours qui viennent." }
      - { who: axelle, text: "On va bien y réfléchir, c'est promis." }
      - { who: architecte, text: "J'en suis certaine, petite Veilleuse." }
