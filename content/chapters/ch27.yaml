  # ─────────────────────────── JOUR 2 ───────────────────────────
  - n: 2
    title: La patience du feu
    decor: La serre de verre, au petit matin, où Dame Alambic enseigne aux trois sœurs les rudiments de la surveillance d'un feu de distillation.
    opening:
      - { who: narrateur, text: "Le lendemain matin, Dame Alambic entreprit d'enseigner aux trois sœurs les rudiments de la surveillance d'un feu de distillation, aussi régulier que patient." }
      - { who: alambic, text: "Regardez bien cette petite flamme, petites voyageuses : elle doit rester constante, ni trop vive, ni trop faible, pendant de longues heures." }
      - { who: rafaelle, text: "Et si elle devient trop vive, qu'est-ce qui se passe, exactement ?" }
      - { who: alambic, text: "L'essence se brûle, petite Archiviste, et tout le travail des derniers jours se perd en un instant. C'est pour cela qu'il faut une attention constante." }
      - { who: maelle, text: "Et si elle devient trop faible, au contraire ?" }
      - { who: alambic, text: "L'essence ne vient jamais, petite Cartographe. La fleur garde alors son secret, et tout le travail n'aura servi à rien." }
      - { who: axelle, text: "C'est un équilibre très précis à tenir, alors." }
      - { who: alambic, text: "Extrêmement précis, petite Veilleuse. C'est justement pour cela que je vous propose, aujourd'hui, de réfléchir ensemble à la meilleure façon de m'aider." }
