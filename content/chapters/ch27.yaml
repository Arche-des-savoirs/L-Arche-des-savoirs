# Chapitre 27 — Dame Alambic et la Serre de Verre
# Nouveau personnage : Dame Alambic, une alchimiste solitaire qui vit dans une serre de verre
# accrochée à flanc de montagne, où elle distille de rares essences de fleurs d'altitude.
# Voix : Zubenelgenubi. Pas d'effet ORVANE ni de drapeau pour ce chapitre (absent de
# decisions.ts) : décision purement narrative sur la façon de l'aider dans une distillation
# délicate.

id: ch27
number: 27
act: 2
title: Dame Alambic et la Serre de Verre
introImage: ch27
scene: serre-de-verre

espagnol:
  - { es: "La flor crece en la altura.", fr: "La fleur pousse en altitude." }
  - { es: "El alambique no miente nunca.", fr: "L'alambic ne ment jamais." }
  - { es: "Cada gota cuenta mucho.", fr: "Chaque goutte compte beaucoup." }
  - { es: "La paciencia hace la esencia.", fr: "La patience fait l'essence." }
  - { es: "El vidrio refleja la luz.", fr: "Le verre reflète la lumière." }

decision:
  prompt: "Dame Alambic surveille un alambic de cuivre et de verre, d'où s'échappe un filet de vapeur parfumée. « Cette distillation est délicate : trop de chaleur, et l'essence se perd ; pas assez, et elle ne vient jamais. Voulez-vous m'aider à surveiller le feu avec patience, ou préférez-vous que je m'en charge seule, pendant que vous vous reposez ? »"
  options:
    A:
      label: Aider Dame Alambic à surveiller le feu, patiemment
      scene: "Rafaelle propose d'aider Dame Alambic à surveiller le feu de l'alambic, avec toute la patience nécessaire, sans se laisser distraire par l'attente."
      line: { who: alambic, text: "Une patience bien placée, petite Archiviste. C'est exactement ce que demande ce genre de distillation, aussi longue soit-elle." }
      habillage: "Les épreuves prennent la forme d'une surveillance attentive et silencieuse, rythmée par le léger crépitement du feu sous l'alambic."
    B:
      label: Laisser Dame Alambic travailler seule, et se reposer
      scene: "Maelle propose plutôt de laisser Dame Alambic s'occuper seule de sa distillation délicate, pendant que les trois sœurs se reposent un peu, après tant de chemin parcouru."
      line: { who: alambic, text: "Un repos bien mérité, petite Cartographe. Je veillerai sur mon alambic comme je le fais depuis toujours, seule face au feu." }
      habillage: "Les épreuves se déroulent dans un moment de repos et de calme, pendant que Dame Alambic travaille de son côté."
    C:
      label: Proposer de se relayer pour surveiller le feu à tour de rôle
      scene: "Axelle suggère un compromis : se relayer, chacune à tour de rôle, pour surveiller le feu de l'alambic avec Dame Alambic, afin que personne ne s'épuise à la tâche."
      line: { who: alambic, text: "Une idée pleine de bon sens, petite Veilleuse. Ainsi, personne ne se fatigue trop, et la distillation n'en sera pas moins réussie." }
      habillage: "Les épreuves prennent la forme d'une surveillance partagée et organisée, où chacune prend son tour avec sérieux."

repliquesAbsurdes:
  - "Si l'alambic ne ment jamais, est-ce qu'il dit parfois des vérités qu'on préférerait ne pas entendre, genre « tu as trop chauffé le feu » ?"
  - "Mon renard a essayé de laper une goutte d'essence tombée par terre. Résultat : il a éternué trois fois et boudé pendant une heure."
  - "Est-ce que Dame Alambic pourrait distiller un peu de courage, un jour, pour les moments où on en a vraiment besoin ?"
  - "Si chaque goutte compte beaucoup, est-ce qu'il existe une goutte qui, à elle seule, compte plus que toutes les autres ?"
  - "Après un carrousel réparé et des étoiles à moitié apprises, surveiller un petit feu sous un alambic, ça semble presque reposant, en fait."

days:
  # ─────────────────────────── JOUR 1 ───────────────────────────
  - n: 1
    title: La serre accrochée à la montagne
    decor: Une serre de verre et de fer forgé, accrochée à flanc de montagne, remplie de fleurs rares et d'un alambic de cuivre installé en son centre.
    opening:
      - { who: narrateur, text: "Le sentier, après le carrousel de Chrono, grimpa jusqu'à une serre de verre et de fer forgé, accrochée à flanc de montagne, remplie de fleurs aux couleurs inattendues." }
      - { who: narrateur, text: "Au centre de la serre trônait un alambic de cuivre poli, d'où s'échappait un filet de vapeur parfumée, surveillé par une femme élégante aux mains tachées de pigments colorés." }
      - { who: maelle, text: "Bonjour ! C'est une serre magnifique. Qu'est-ce que vous cultivez, exactement, avec toutes ces fleurs ?" }
      - { who: narrateur, text: "La femme leva les yeux de son alambic, un sourire discret aux lèvres, et s'essuya les mains sur son tablier déjà bien marqué par le travail." }
      - { who: alambic, text: "On m'appelle Dame Alambic, petites voyageuses. Je cultive des fleurs d'altitude, rares et capricieuses, pour en distiller les essences les plus précieuses." }
      - { who: rafaelle, text: "Distiller, ça veut dire quoi, exactement ? J'ai déjà entendu ce mot, mais jamais bien expliqué." }
      - { who: alambic, text: "Extraire, goutte après goutte, ce qu'une fleur a de plus pur, petite Archiviste, en la chauffant doucement jusqu'à ce qu'elle livre son parfum." }
      - { who: axelle, text: "Ça a l'air délicat, comme travail." }
      - { who: alambic, text: "Extrêmement délicat, petite Veilleuse. C'est justement ce que je m'apprête à faire, en ce moment même." }
