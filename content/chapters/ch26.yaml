          maelle:
            - { id: ch26-j4-ma-m1a, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi une décision prise après avoir écouté l'histoire et les explications d'un spécialiste est-elle souvent plus solide ?", choices: ["parce qu'elle s'appuie sur des connaissances concrètes plutôt que sur une simple impression", "parce qu'une décision collective n'a jamais aucun avantage", "cela n'a aucun lien avec la qualité d'une décision", "parce qu'une décision sans information est toujours meilleure", "parce qu'écouter un spécialiste retarde toujours inutilement une décision"], answer: "parce qu'elle s'appuie sur des connaissances concrètes plutôt que sur une simple impression", hint: "Pense à tout ce que Chrono a enseigné aux sœurs sur le mécanisme, cette semaine." }
            - { id: ch26-j4-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 92 + 59.", choices: ["146", "148", "150", "151", "153"], answer: "151", hint: "92 + 60 − 1." }
          rafaelle:
            - { id: ch26-j4-ra-m1a, subject: francais, level: 4, kind: qcm, prompt: "« Je ferai de mon mieux pour la mener à bien. » : que révèle cette phrase sur l'attitude de Chrono ?", choices: ["qu'il reste engagé dans son travail, quelle que soit la décision des sœurs", "qu'il refusera forcément leur décision", "qu'il attend d'elles une seule réponse précise", "qu'il n'a aucune considération pour leur choix", "qu'il préfère décider lui-même à leur place"], answer: "qu'il reste engagé dans son travail, quelle que soit la décision des sœurs", hint: "Repense à l'attitude de Chrono depuis le début de ce chapitre." }
            - { id: ch26-j4-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 13² − 100.", choices: ["59", "63", "66", "69", "73"], answer: "69", hint: "169 − 100." }
      - id: m2
        title: Les trois propositions
        tours:
          axelle:
            - { id: ch26-j4-ax-m2a, subject: maths, level: 1, kind: qcm, prompt: "Calcule 15 − 8.", choices: ["6", "7", "8", "9", "10"], answer: "7", hint: "15 − 5 = 10, puis − 3." }
            - { id: ch26-j4-ax-m2b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi partager le travail entre réparation durable sur l'essentiel et rapidité sur le reste peut-il être une approche efficace ?", choices: ["cela permet de concentrer l'effort le plus soigné là où il compte le plus, sans tout ralentir", "partager le travail de cette façon n'a jamais aucun effet sur l'efficacité", "cela n'a aucune explication particulière", "il vaut toujours mieux appliquer la même méthode à toutes les pièces, sans distinction", "un compromis technique n'a jamais aucun avantage réel"], answer: "cela permet de concentrer l'effort le plus soigné là où il compte le plus, sans tout ralentir", hint: "Pense à la proposition d'Axelle, pour partager le travail entre durabilité et rapidité." }
