# Chapitre 26 — Le Carrousel du Temps Suspendu
# Réutilise Chrono (voix Kore, déjà introduit au chapitre 21). Pas d'effet ORVANE ni de
# drapeau pour ce chapitre (absent de decisions.ts) : décision purement narrative sur la
# façon de réparer un grand carrousel astronomique qui marque le passage des saisons.

id: ch26
number: 26
act: 2
title: Le Carrousel du Temps Suspendu
introImage: ch26
scene: carrousel-du-temps

espagnol:
  - { es: "El carrusel marca las estaciones.", fr: "Le carrousel marque les saisons." }
  - { es: "Una pieza falta en el engranaje.", fr: "Une pièce manque dans l'engrenage." }
  - { es: "El tiempo no se repara solo.", fr: "Le temps ne se répare pas seul." }
  - { es: "Cada estación tiene su lugar.", fr: "Chaque saison a sa place." }
  - { es: "Reparar pide manos pacientes.", fr: "Réparer demande des mains patientes." }

decision:
  prompt: "Chrono s'agenouille devant un immense carrousel de bronze, orné de quatre figures représentant les saisons, dont l'une est figée, bloquée par un engrenage rouillé. « Je peux réparer cette pièce rapidement, de façon provisoire, pour qu'elle reparte tout de suite, ou prendre le temps de la reconstruire entièrement, à l'identique, pour qu'elle dure encore des siècles. Que préférez-vous ? »"
  options:
    A:
      label: Prendre le temps de tout reconstruire à l'identique
      scene: "Maelle encourage Chrono à prendre tout le temps nécessaire pour reconstruire la pièce manquante à l'identique, afin que le carrousel dure encore longtemps après leur passage."
      line: { who: chrono, text: "Un choix qui respecte le travail bien fait, petite Cartographe. Cela prendra plus de jours, mais le résultat en vaudra la peine." }
      habillage: "Les épreuves prennent la forme d'un travail minutieux et prolongé, pièce par pièce, pour une réparation durable."
    B:
      label: Réparer rapidement, de façon provisoire
      scene: "Rafaelle, pressée de continuer la route, convainc Chrono de réparer la pièce rapidement, de façon provisoire, pour repartir sans trop de retard."
      line: { who: chrono, text: "Une réparation rapide tiendra quelques années, petite Archiviste, mais il faudra qu'un autre horloger reprenne ce travail, un jour." }
      habillage: "Les épreuves se déroulent dans la rapidité et l'efficacité immédiate, au prix d'une solution moins durable."
    C:
      label: Proposer d'aider Chrono à partager le travail entre réparation durable et rapidité
      scene: "Axelle propose un compromis : aider Chrono à réparer solidement la pièce la plus visible du carrousel, tout en acceptant une réparation plus rapide pour les éléments moins essentiels."
      line: { who: chrono, text: "Un compromis sensé, petite Veilleuse. Ni trop lent, ni trop hâtif. C'est souvent la meilleure voie, en matière d'horlogerie comme ailleurs." }
      habillage: "Les épreuves prennent la forme d'un travail équilibré, mêlant minutie sur l'essentiel et rapidité sur le reste."

repliquesAbsurdes:
  - "Si le carrousel marque les saisons, est-ce qu'il se trompe parfois et annonce l'hiver en plein été, juste pour rire ?"
  - "Mon renard a essayé de pousser la figure de l'automne pour la faire avancer plus vite. Résultat : il s'est juste retrouvé couvert de feuilles de bronze imaginaires."
  - "Est-ce qu'on peut demander au carrousel de sauter directement à la saison des vacances, ou ce n'est pas comme ça que ça marche ?"
  - "Si le temps ne se répare pas seul, est-ce qu'il demande au moins poliment de l'aide, ou il attend juste qu'on s'en occupe ?"
  - "Après une nacelle au-dessus d'un gouffre et une tour pleine d'étoiles, réparer un carrousel géant, ça commence presque à devenir une habitude, en fait."

days:
  # ─────────────────────────── JOUR 1 ───────────────────────────
  - n: 1
    title: Le carrousel figé
    decor: Une place circulaire pavée de pierre claire, au centre de laquelle trône un immense carrousel de bronze orné de quatre figures représentant les saisons, dont l'une est figée.
    opening:
      - { who: narrateur, text: "Le sentier, après la tour de Véra, déboucha sur une place circulaire pavée de pierre claire, au centre de laquelle trônait un immense carrousel de bronze." }
      - { who: narrateur, text: "Quatre figures sculptées, représentant les saisons, étaient censées tourner lentement autour d'un axe central, mais l'une d'elles restait étrangement figée, bloquée dans son mouvement." }
      - { who: rafaelle, text: "Attendez, est-ce que ce n'est pas... Chrono ? Qu'est-ce qu'il fait ici, si loin de son horloge-mère ?" }
      - { who: narrateur, text: "L'horloger, agenouillé devant le mécanisme, leva la tête en entendant son nom, et un sourire se dessina sur son visage marqué par les années." }
      - { who: chrono, text: "Petite Archiviste ! Quelle joie de vous retrouver. Depuis notre dernière rencontre, je voyage de mécanisme en mécanisme, pour réparer ce qui en a besoin." }
      - { who: axelle, text: "Et ce carrousel, là, qu'est-ce qu'il a exactement ?" }
      - { who: chrono, text: "Une pièce manque dans son engrenage, petite Veilleuse. Depuis, la figure de l'automne reste bloquée, et les saisons ne tournent plus correctement." }
      - { who: maelle, text: "Et vous savez comment la réparer ?" }
      - { who: chrono, text: "Je crois bien, petite Cartographe. Mais il faudra d'abord décider ensemble de la meilleure façon de procéder." }
    manches:
      - id: m1
        title: Un carrousel de bronze
        tours:
          axelle:
            - { id: ch26-j1-ax-m1a, subject: histoire-geo, level: 1, kind: qcm, prompt: "Combien de saisons y a-t-il en une année ?", choices: ["deux", "trois", "quatre", "cinq", "six"], answer: "quatre", hint: "C'est le nombre de figures sculptées sur le carrousel." }
            - { id: ch26-j1-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 8 + 7.", choices: ["13", "14", "15", "16", "17"], answer: "15", hint: "8 + 7 = 8 + 8 − 1." }
          maelle:
            - { id: ch26-j1-ma-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Pourquoi un engrenage rouillé peut-il bloquer complètement le mouvement d'un mécanisme, comme celui du carrousel ?", choices: ["la rouille crée des frottements qui empêchent les pièces de glisser correctement entre elles", "la rouille n'a jamais aucun effet sur un mécanisme", "cela n'a aucune explication particulière", "un engrenage rouillé fonctionne toujours mieux qu'un engrenage neuf", "le mouvement d'un mécanisme ne dépend jamais de ses engrenages"], answer: "la rouille crée des frottements qui empêchent les pièces de glisser correctement entre elles", hint: "Pense à la pièce manquante et rouillée qui bloque la figure de l'automne." }
            - { id: ch26-j1-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 66 + 57.", choices: ["118", "120", "122", "123", "125"], answer: "123", hint: "66 + 60 − 3." }
          rafaelle:
            - { id: ch26-j1-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi des carrousels ou mécanismes astronomiques marquant les saisons ont-ils souvent été construits dans l'histoire ?", choices: ["pour aider les communautés à suivre le passage du temps et à organiser leurs activités selon les saisons", "parce que ces mécanismes n'ont jamais eu aucune utilité", "cela n'a aucune importance historique", "parce qu'un tel mécanisme est toujours purement décoratif", "parce que les saisons n'ont jamais eu besoin d'être suivies"], answer: "pour aider les communautés à suivre le passage du temps et à organiser leurs activités selon les saisons", hint: "Pense à l'utilité du carrousel pour marquer le passage des saisons." }
            - { id: ch26-j1-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 19 × 5.", choices: ["85", "90", "92", "95", "98"], answer: "95", hint: "19 × 5 = 20 × 5 − 5." }
      - id: m2
        title: Retrouver Chrono
