            - { id: ch26-j1-ax-m2b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 14 − 6.", choices: ["6", "7", "8", "9", "10"], answer: "8", hint: "14 − 6 = 8." }
          maelle:
            - { id: ch26-j1-ma-m2a, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « marqué » dans « un visage marqué par les années » ?", choices: ["nom", "verbe", "adjectif", "adverbe", "pronom"], answer: "adjectif", hint: "Il décrit le visage de Chrono, après tant d'années." }
            - { id: ch26-j1-ma-m2b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 357 ÷ 3.", choices: ["109", "115", "117", "119", "121"], answer: "119", hint: "3 × 119 = 357." }
          rafaelle:
            - { id: ch26-j1-ra-m2a, subject: francais, level: 4, kind: qcm, prompt: "« Je voyage de mécanisme en mécanisme, pour réparer ce qui en a besoin. » : que révèle cette phrase sur la vie actuelle de Chrono ?", choices: ["qu'il a trouvé une nouvelle vocation en parcourant le monde pour réparer des mécanismes", "qu'il est resté enfermé dans son horloge-mère depuis leur dernière rencontre", "qu'il a abandonné définitivement tout travail d'horlogerie", "qu'il ne répare plus jamais rien depuis cette rencontre", "qu'il refuse désormais de voyager où que ce soit"], answer: "qu'il a trouvé une nouvelle vocation en parcourant le monde pour réparer des mécanismes", hint: "Repense à ce que dit Chrono sur sa vie depuis la dernière rencontre avec les sœurs." }
            - { id: ch26-j1-ra-m2b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 14² − 100.", choices: ["86", "90", "92", "94", "96"], answer: "96", hint: "196 − 100." }
      - id: m3
        title: Une décision à prendre ensemble
        tours:
          axelle:
            - { id: ch26-j1-ax-m3a, subject: maths, level: 1, kind: qcm, prompt: "Il y a 4 figures sur le carrousel, et une seule est bloquée. Combien de figures tournent encore normalement ?", choices: ["2", "3", "4", "5", "6"], answer: "3", hint: "4 − 1." }
            - { id: ch26-j1-ax-m3b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi une seule pièce manquante peut-elle bloquer tout un mécanisme complexe comme un carrousel astronomique ?", choices: ["les pièces d'un mécanisme sont souvent interdépendantes, et l'une bloquée peut arrêter tout l'ensemble", "une pièce manquante n'a jamais aucun effet sur le reste du mécanisme", "cela n'a aucune explication particulière", "un mécanisme fonctionne toujours mieux avec une pièce en moins", "seules les pièces les plus grandes ont une réelle importance"], answer: "les pièces d'un mécanisme sont souvent interdépendantes, et l'une bloquée peut arrêter tout l'ensemble", hint: "Pense à la figure de l'automne, bloquée à cause d'une seule pièce manquante." }
          maelle:
            - { id: ch26-j1-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 48 × 4.", choices: ["182", "186", "188", "190", "192"], answer: "192", hint: "48 × 4 = 50 × 4 − 2 × 4." }
            - { id: ch26-j1-ma-m3b, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi est-il souvent utile, face à un choix technique important, de consulter plusieurs personnes avant de décider ?", choices: ["parce que chacun peut apporter un point de vue différent, utile pour une décision équilibrée", "parce qu'il vaut toujours mieux décider seul, sans consulter personne", "cela n'a aucun lien avec la qualité d'une décision", "parce que consulter plusieurs personnes retarde toujours inutilement une décision", "parce qu'un choix technique n'a jamais besoin d'être partagé"], answer: "parce que chacun peut apporter un point de vue différent, utile pour une décision équilibrée", hint: "Pense à la proposition de Chrono de décider ensemble de la meilleure façon de procéder." }
          rafaelle:
