            - { id: ch26-j1-ra-m3b, subject: francais, level: 3, kind: qcm, prompt: "Conjugue au passé composé : « Chrono (lever) la tête en entendant son nom. »", choices: ["a levé", "levait", "lèvera", "lève", "levant"], answer: "a levé", hint: "« Lever » se conjugue avec avoir au passé composé." }
      - id: m4
        title: Observer le mécanisme
        tours:
          axelle:
            - { id: ch26-j1-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 7 × 4.", choices: ["24", "26", "27", "28", "30"], answer: "28", hint: "7 × 4 = 7 × 2 × 2." }
            - { gen: maths.addition }
          maelle:
            - { id: ch26-j1-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 310 − 148.", choices: ["158", "160", "162", "164", "166"], answer: "162", hint: "310 − 150 + 2." }
            - { gen: maths.multiplication }
          rafaelle:
            - { id: ch26-j1-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « El carrusel marca las estaciones. »", choices: ["Le carrousel marque les saisons.", "Le carrousel reste immobile.", "Le carrousel tombe en morceaux.", "Le carrousel brille le soir.", "Le carrousel change de couleur."], answer: "Le carrousel marque les saisons.", hint: "« Marca las estaciones » = marque les saisons." }
            - { gen: maths.fraction-de }
    pause: "Le jeu des quatre saisons : chaque sœur mime, tour à tour, une saison différente par un geste simple, pendant que les autres devinent laquelle elle représente."
    closing:
      - { who: narrateur, text: "Le soir tomba sur la place circulaire, et les trois figures mobiles du carrousel continuèrent de tourner lentement, tandis que celle de l'automne restait immobile, comme suspendue hors du temps." }
      - { who: chrono, text: "Demain, nous choisirons ensemble la meilleure façon de la réparer. Reposez-vous bien, la décision mérite d'être prise avec l'esprit clair." }
      - { who: maelle, text: "On y réfléchira sérieusement, c'est promis." }
      - { who: narrateur, text: "Et tandis que la nuit enveloppait la place, le léger grincement de la figure bloquée résonnait encore, par intermittence, comme un rappel discret du travail qui attendait." }
    reward: "la découverte du carrousel figé, et la joie de retrouver Chrono"
  # ─────────────────────────── JOUR 2 ───────────────────────────
  - n: 2
    title: Comprendre l'engrenage
    decor: La place circulaire, au petit matin, où Chrono explique aux trois sœurs le fonctionnement précis de l'engrenage qui bloque la figure de l'automne.
    opening:
      - { who: narrateur, text: "Le lendemain matin, Chrono entreprit d'expliquer aux trois sœurs le fonctionnement précis de l'engrenage qui bloquait la figure de l'automne." }
      - { who: chrono, text: "Regardez bien cette petite roue dentée, ici : c'est elle qui transmet le mouvement à la figure. Sans la pièce manquante, elle tourne dans le vide." }
      - { who: rafaelle, text: "Et cette pièce manquante, elle ressemble à quoi, exactement ?" }
      - { who: chrono, text: "À une petite dent de bronze, petite Archiviste, usée par des décennies de mouvement. On peut la refaire à l'identique, ou en poser une plus simple, plus rapide à tailler." }
      - { who: axelle, text: "Et la différence entre les deux, concrètement, ce serait quoi ?" }
      - { who: chrono, text: "La durée, surtout, petite Veilleuse. Une pièce fidèle à l'originale durera des décennies ; une pièce simplifiée tiendra sans doute moins longtemps." }
      - { who: maelle, text: "C'est un peu comme choisir entre une réparation rapide et une réparation qui dure, alors." }
      - { who: chrono, text: "Exactement, petite Cartographe. Et c'est justement la décision qu'il nous faudra prendre, tous ensemble." }
