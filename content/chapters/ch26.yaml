            - { id: ch26-j2-ax-m3b, subject: maths, level: 2, kind: qcm, prompt: "Calcule 8 × 4.", choices: ["28", "30", "32", "34", "36"], answer: "32", hint: "8 × 4 = 8 × 2 × 2." }
          maelle:
            - { id: ch26-j2-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 275 ÷ 5.", choices: ["50", "52", "55", "58", "60"], answer: "55", hint: "5 × 55 = 275." }
            - { id: ch26-j2-ma-m3b, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi comparer une réparation rapide et une réparation durable est-il souvent utile avant de choisir une solution technique ?", choices: ["parce que cela permet de mesurer les avantages et les limites de chaque option avant de décider", "parce que comparer deux solutions n'a jamais aucune utilité", "cela n'a aucun lien avec la prise de décision technique", "parce qu'il vaut toujours mieux choisir la solution la plus rapide, sans réflexion", "parce qu'une réparation durable est toujours inutile à envisager"], answer: "parce que cela permet de mesurer les avantages et les limites de chaque option avant de décider", hint: "Pense à l'explication de Maelle, qui compare les deux options à une réparation rapide ou durable." }
