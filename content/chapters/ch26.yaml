    pause: "Le jeu de l'engrenage humain : les trois sœurs se tiennent par la main en cercle et tournent lentement ensemble, en essayant de garder un rythme parfaitement régulier, comme un mécanisme bien huilé."
    closing:
      - { who: narrateur, text: "Le soir venu, les trois sœurs observèrent longuement le mécanisme du carrousel, essayant d'imaginer la meilleure façon de rendre à la figure de l'automne son mouvement perdu." }
      - { who: chrono, text: "Demain, il faudra choisir : reconstruire à l'identique, réparer rapidement, ou partager le travail entre les deux approches. Réfléchissez-y bien, cette nuit." }
      - { who: rafaelle, text: "On y réfléchira sérieusement, c'est promis." }
      - { who: narrateur, text: "Et tandis que la nuit tombait sur la place circulaire, les trois figures mobiles continuèrent de tourner, indifférentes au sort de leur sœur immobile, comme si le temps, pour elles, ne s'était jamais arrêté." }
    reward: "la compréhension du mécanisme, expliquée par Chrono"
  # ─────────────────────────── JOUR 3 ───────────────────────────
  - n: 3
    title: L'histoire d'un vieux mécanisme
    decor: La place circulaire, où Chrono raconte aux trois sœurs l'histoire ancienne du carrousel, construit par un horloger disparu depuis longtemps.
    opening:
      - { who: narrateur, text: "Le troisième jour, tandis que la lumière du matin baignait la place circulaire, Chrono raconta aux trois sœurs l'histoire ancienne du carrousel, construit par un horloger disparu depuis longtemps." }
      - { who: chrono, text: "Cet horloger, dit-on, a passé toute sa vie à construire ce mécanisme, pièce par pièce, pour que les saisons ne soient jamais oubliées par ceux qui vivaient ici." }
      - { who: axelle, text: "Et qu'est-ce qui lui est arrivé, à cet horloger ? Pourquoi il n'est plus là, pour s'en occuper ?" }
      - { who: chrono, text: "Le temps a fait son œuvre, petite Veilleuse, comme il le fait pour nous tous. Mais son carrousel, lui, a continué de tourner, bien après son départ." }
      - { who: maelle, text: "C'est un peu triste, et beau en même temps, non ?" }
      - { who: chrono, text: "Exactement, petite Cartographe. C'est pour ça que je tiens particulièrement à bien réparer ce mécanisme-là, par respect pour son travail." }
      - { who: rafaelle, text: "Alors peut-être qu'on devrait vraiment prendre soin de bien choisir, pour continuer cet héritage." }
      - { who: chrono, text: "C'est tout à fait mon avis, petite Archiviste." }
    manches:
