      - id: m4
        title: S'exercer à observer le mécanisme
        tours:
          axelle:
            - { id: ch26-j2-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 6 × 6.", choices: ["30", "32", "34", "36", "38"], answer: "36", hint: "6 × 6 = 6 × 3 × 2." }
            - { gen: maths.comparer }
          maelle:
