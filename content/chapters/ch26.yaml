            - { id: ch26-j4-ma-m3b, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi annoncer une décision claire à un artisan expérimenté lui permet-il de mieux organiser son travail ?", choices: ["parce qu'il peut ainsi anticiper et préparer précisément les outils et le temps nécessaires selon le choix fait", "parce qu'annoncer une décision n'a jamais aucune utilité pour un artisan", "cela n'a aucun lien avec l'organisation d'un travail technique", "parce qu'il vaut toujours mieux rester dans l'incertitude", "parce que la clarté retarde toujours une décision"], answer: "parce qu'il peut ainsi anticiper et préparer précisément les outils et le temps nécessaires selon le choix fait", hint: "Pense à l'utilité, pour Chrono, de connaître la décision des sœurs à l'avance." }
