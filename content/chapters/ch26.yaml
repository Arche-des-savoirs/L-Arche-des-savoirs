            - { id: ch26-j2-ma-m2b, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « simplifiée » dans « une pièce simplifiée » ?", choices: ["nom", "verbe", "adjectif", "adverbe", "pronom"], answer: "adjectif", hint: "Il décrit une pièce plus rapide à tailler." }
