            - { gen: maths.ranger }
          rafaelle:
            - { id: ch26-j4-ra-m4a, subject: maths, level: 4, kind: qcm, prompt: "Calcule 15 × 6.", choices: ["86", "88", "90", "92", "94"], answer: "90", hint: "15 × 6 = 15 × 3 × 2." }
            - { gen: maths.duree }
    pause: "Le jeu du compte à rebours avant la réparation : chaque sœur compte, à voix haute, de 5 à 1, avant de prononcer, toutes ensemble, le mot qui résume leur décision commune."
    closing:
      - { who: narrateur, text: "Les trois sœurs échangèrent un dernier regard, puis, d'une seule voix, annoncèrent à Chrono la décision qu'elles avaient prise ensemble, après mûre réflexion." }
      - { who: chrono, text: "Je vous entends, petites voyageuses, et je respecte votre choix. Préparons-nous, alors, pour demain." }
      - { who: maelle, text: "On espère vraiment que la figure de l'automne retrouvera son mouvement." }
      - { who: narrateur, text: "Et tandis que le soir tombait sur la place circulaire, les trois sœurs se préparèrent, chacune à sa façon, à aider Chrono dans la réparation qui les attendait." }
