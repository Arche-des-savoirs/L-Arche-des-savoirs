      - id: m1
        title: La roue dentée
        tours:
          axelle:
            - { id: ch26-j2-ax-m1a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le contraire de « manquante » (en parlant d'une pièce) ?", choices: ["présente", "absente", "cassée", "usée", "rouillée"], answer: "présente", hint: "Le contraire de ce qu'est la pièce du carrousel, actuellement absente." }
            - { id: ch26-j2-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 9 + 6.", choices: ["13", "14", "15", "16", "17"], answer: "15", hint: "9 + 6 = 9 + 1 + 5." }
