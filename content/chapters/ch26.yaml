        tours:
          axelle:
            - { id: ch26-j3-ax-m1a, subject: maths, level: 1, kind: qcm, prompt: "Il y a 6 pièces anciennes retrouvées, et 3 pièces manquantes. Combien de pièces en tout, à l'origine ?", choices: ["7", "8", "9", "10", "11"], answer: "9", hint: "6 + 3." }
            - { id: ch26-j3-ax-m1b, subject: francais, level: 1, kind: qcm, prompt: "Quel est le contraire de « oubliées » (en parlant des saisons) ?", choices: ["rappelées", "disparues", "effacées", "perdues", "ignorées"], answer: "rappelées", hint: "Le contraire de ce que l'horloger voulait éviter, pour les saisons." }
          maelle:
            - { id: ch26-j3-ma-m1a, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi un objet ou un mécanisme construit par quelqu'un disparu depuis longtemps peut-il garder une grande valeur pour une communauté ?", choices: ["parce qu'il porte la mémoire du travail et de l'intention de celui qui l'a créé", "parce qu'un tel objet n'a jamais aucune valeur une fois son créateur disparu", "cela n'a aucune explication particulière", "parce que seuls les objets récents ont une quelconque valeur", "parce que la disparition d'un créateur efface toujours la valeur de son œuvre"], answer: "parce qu'il porte la mémoire du travail et de l'intention de celui qui l'a créé", hint: "Pense à ce que représente le carrousel, pour la mémoire de l'horloger disparu." }
            - { id: ch26-j3-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 87 + 56.", choices: ["138", "140", "142", "143", "145"], answer: "143", hint: "87 + 60 − 4." }
          rafaelle:
            - { id: ch26-j3-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi réparer soigneusement l'œuvre d'un artisan disparu peut-il être vu comme une forme de respect envers son travail ?", choices: ["parce que cela honore l'effort et l'intention initiale de la personne qui a créé cette œuvre", "parce que réparer une œuvre ancienne n'a jamais aucun lien avec le respect", "cela n'a aucune importance historique", "parce qu'il vaut toujours mieux laisser une œuvre ancienne se dégrader", "parce qu'un artisan disparu ne mérite jamais d'être honoré"], answer: "parce que cela honore l'effort et l'intention initiale de la personne qui a créé cette œuvre", hint: "Repense à ce que dit Chrono sur son souhait de bien réparer, par respect pour le travail de l'horloger disparu." }
            - { id: ch26-j3-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 14 × 6.", choices: ["80", "82", "84", "86", "88"], answer: "84", hint: "14 × 6 = 14 × 3 × 2." }
      - id: m2
        title: Un héritage à continuer
        tours:
          axelle:
            - { id: ch26-j3-ax-m2a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le sujet de « Le carrousel a continué de tourner. » ?", choices: ["de tourner", "a continué", "Le carrousel", "le", "carrousel"], answer: "Le carrousel", hint: "Qu'est-ce qui a continué de tourner, après le départ de l'horloger ?" }
            - { id: ch26-j3-ax-m2b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 7 + 9.", choices: ["14", "15", "16", "17", "18"], answer: "16", hint: "7 + 9 = 7 + 7 + 2." }
          maelle:
            - { id: ch26-j3-ma-m2a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 312 ÷ 4.", choices: ["72", "76", "78", "80", "82"], answer: "78", hint: "4 × 78 = 312." }
            - { id: ch26-j3-ma-m2b, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « triste » dans « c'est un peu triste » ?", choices: ["nom", "verbe", "adjectif", "adverbe", "pronom"], answer: "adjectif", hint: "Il décrit le sentiment exprimé par Maelle face à l'histoire de l'horloger." }
          rafaelle:
            - { id: ch26-j3-ra-m2a, subject: maths, level: 5, kind: qcm, prompt: "Calcule 10² − 36.", choices: ["58", "61", "64", "66", "70"], answer: "64", hint: "100 − 36." }
            - { id: ch26-j3-ra-m2b, subject: francais, level: 4, kind: qcm, prompt: "« C'est un peu triste, et beau en même temps. » : que révèle cette phrase sur la perception de Maelle ?", choices: ["qu'elle perçoit à la fois la mélancolie et la beauté d'un héritage qui perdure après son créateur", "qu'elle trouve l'histoire de l'horloger entièrement joyeuse", "qu'elle ne ressent absolument rien face à cette histoire", "qu'elle trouve cette histoire uniquement effrayante", "qu'elle considère cette histoire comme sans aucun intérêt"], answer: "qu'elle perçoit à la fois la mélancolie et la beauté d'un héritage qui perdure après son créateur", hint: "Relis bien la phrase de Maelle, et la réponse de Chrono qui suit." }
      - id: m3
        title: Choisir avec soin
        tours:
          axelle:
            - { id: ch26-j3-ax-m3a, subject: maths, level: 1, kind: qcm, prompt: "Calcule 12 − 5.", choices: ["5", "6", "7", "8", "9"], answer: "7", hint: "12 − 5 = 7." }
            - { id: ch26-j3-ax-m3b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi un mécanisme conçu pour durer très longtemps, comme le carrousel, nécessite-t-il un entretien régulier malgré sa qualité initiale ?", choices: ["même les matériaux les plus solides s'usent progressivement avec le temps et l'usage", "un mécanisme bien conçu n'a jamais besoin d'entretien", "cela n'a aucune explication particulière", "l'entretien n'a jamais aucun effet sur la durée de vie d'un mécanisme", "un mécanisme ancien fonctionne toujours mieux sans aucun entretien"], answer: "même les matériaux les plus solides s'usent progressivement avec le temps et l'usage", hint: "Pense à la raison pour laquelle le carrousel, malgré sa qualité, a fini par se bloquer." }
          maelle:
            - { id: ch26-j3-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 46 × 4.", choices: ["178", "182", "184", "186", "190"], answer: "184", hint: "46 × 4 = 50 × 4 − 4 × 4." }
            - { id: ch26-j3-ma-m3b, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi écouter l'histoire d'un objet ancien, comme le carrousel, peut-il aider à mieux décider de la façon de le réparer ?", choices: ["parce que comprendre l'intention initiale du créateur peut orienter le choix vers une réparation plus respectueuse de l'œuvre", "parce qu'un tel récit n'a jamais aucune utilité pour décider", "cela n'a aucun lien avec la prise de décision", "parce que seules les décisions techniques comptent, jamais l'histoire", "parce qu'écouter un récit retarde toujours inutilement une décision"], answer: "parce que comprendre l'intention initiale du créateur peut orienter le choix vers une réparation plus respectueuse de l'œuvre", hint: "Repense à ce que ressent Rafaelle après avoir écouté l'histoire du carrousel." }
          rafaelle:
            - { id: ch26-j3-ra-m3a, subject: maths, level: 4, kind: qcm, prompt: "Résous : 6x − 3 = 39.", choices: ["5", "6", "7", "8", "9"], answer: "7", hint: "6x = 42." }
            - { id: ch26-j3-ra-m3b, subject: espagnol, level: 3, kind: qcm, prompt: "Traduis : « Cada estación tiene su lugar. »", choices: ["Chaque saison a sa place.", "Chaque saison disparaît vite.", "Chaque saison se ressemble.", "Chaque saison fait peur.", "Chaque saison dure peu."], answer: "Chaque saison a sa place.", hint: "« Tiene su lugar » = a sa place." }
      - id: m4
        title: Comprendre l'héritage
        tours:
          axelle:
            - { id: ch26-j3-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 9 × 5.", choices: ["40", "42", "44", "45", "48"], answer: "45", hint: "9 × 5 = 9 × 10 ÷ 2." }
            - { gen: maths.suite }
          maelle:
            - { id: ch26-j3-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 295 − 137.", choices: ["150", "154", "156", "158", "160"], answer: "158", hint: "295 − 140 + 3." }
            - { gen: maths.addition }
          rafaelle:
            - { id: ch26-j3-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « Reparar pide manos pacientes. »", choices: ["Réparer demande des mains patientes.", "Réparer est toujours impossible.", "Réparer ne demande rien du tout.", "Réparer effraie les artisans.", "Réparer prend une minute."], answer: "Réparer demande des mains patientes.", hint: "« Pide manos pacientes » = demande des mains patientes." }
            - { gen: maths.multiplication }
    pause: "Le jeu du récit transmis : chaque sœur raconte, en une phrase, ce qu'elle aimerait qu'on dise d'elle, plus tard, à propos de quelque chose qu'elle aurait construit ou réparé avec soin."
    closing:
      - { who: narrateur, text: "La soirée se prolongea doucement sur la place circulaire, entre récits et silences, tandis que le mécanisme bloqué semblait, lui aussi, attendre patiemment sa délivrance." }
      - { who: chrono, text: "Demain, il faudra enfin vous décider. Prenez cette dernière nuit pour y réfléchir une dernière fois, à la lumière de ce qu'on vient de partager." }
      - { who: axelle, text: "On y réfléchira, c'est promis. Merci de nous avoir raconté cette histoire." }
      - { who: narrateur, text: "Et tandis que les trois sœurs regagnaient leur campement pour la nuit, Nilo observait Chrono s'affairer encore un peu, pensif, comme s'il comprenait, lui aussi, le poids d'un héritage à honorer." }
    reward: "l'histoire du vieil horloger, et de son carrousel inachevé"
  # ─────────────────────────── JOUR 4 ───────────────────────────
  - n: 4
    title: Se décider ensemble
    decor: La place circulaire, dans la lumière du petit matin, où les trois sœurs retrouvent Chrono pour lui annoncer, enfin, leur décision.
    opening:
      - { who: narrateur, text: "Le quatrième jour, les trois sœurs retrouvèrent Chrono au pied du carrousel, dans la lumière du petit matin, prêtes à lui annoncer leur décision." }
      - { who: chrono, text: "Je peux réparer cette pièce rapidement, de façon provisoire, pour qu'elle reparte tout de suite, ou prendre le temps de la reconstruire entièrement, à l'identique. Que préférez-vous ? »" }
      - { who: axelle, text: "On y a bien réfléchi, Chrono. Et on a pris une décision, toutes les trois ensemble." }
      - { who: chrono, text: "Je vous écoute, petite Veilleuse. Quelle qu'elle soit, je ferai de mon mieux pour la mener à bien." }
