          rafaelle:
            - { id: ch26-j2-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi un artisan peut-il parfois choisir de fabriquer une pièce de remplacement à l'identique de l'originale, plutôt qu'une version simplifiée ?", choices: ["parce qu'une pièce fidèle à l'originale respecte le fonctionnement et la durabilité prévus par le mécanisme", "parce qu'une pièce simplifiée est toujours meilleure qu'une pièce fidèle", "cela n'a aucun lien avec la durabilité d'un mécanisme", "parce qu'il vaut toujours mieux ignorer la conception originale", "parce qu'une pièce fidèle n'a jamais aucun avantage"], answer: "parce qu'une pièce fidèle à l'originale respecte le fonctionnement et la durabilité prévus par le mécanisme", hint: "Pense à la différence expliquée par Chrono entre une pièce fidèle et une pièce simplifiée." }
