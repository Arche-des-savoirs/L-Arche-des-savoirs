          axelle:
            - { id: ch22-j2-ax-m2a, subject: maths, level: 1, kind: qcm, prompt: "Calcule 16 − 7.", choices: ["7", "8", "9", "10", "11"], answer: "9", hint: "16 − 6 = 10, puis − 1." }
            - { id: ch22-j2-ax-m2b, subject: francais, level: 1, kind: qcm, prompt: "Quel est le sujet de « Rafaelle se glissa prudemment entre les engrenages. » ?", choices: ["entre les engrenages", "se glissa", "Rafaelle", "prudemment", "les engrenages"], answer: "Rafaelle", hint: "Qui se glisse entre les engrenages ?" }
          maelle:
            - { id: ch22-j2-ma-m2a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 38 × 5.", choices: ["180", "185", "188", "190", "195"], answer: "190", hint: "40 × 5 − 2 × 5." }
            - { id: ch22-j2-ma-m2b, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « minuscule » dans « un minuscule sablier » ?", choices: ["nom", "verbe", "adjectif", "adverbe", "pronom"], answer: "adjectif", hint: "Il décrit la taille du sablier trouvé par Rafaelle." }
          rafaelle:
            - { id: ch22-j2-ra-m2a, subject: maths, level: 5, kind: qcm, prompt: "Calcule 7² + 2 × 10.", choices: ["59", "63", "66", "69", "73"], answer: "69", hint: "49 + 20." }
            - { id: ch22-j2-ra-m2b, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « Un pequeño reloj de arena puede salvar mucho. »", choices: ["Un petit sablier peut sauver beaucoup.", "Un petit sablier se casse facilement.", "Un petit sablier ne sert à rien.", "Un petit sablier coûte très cher.", "Un petit sablier est très lourd."], answer: "Un petit sablier peut sauver beaucoup.", hint: "« Puede salvar mucho » = peut sauver beaucoup." }
      - id: m3
        title: Le risque de se tromper
        tours:
          axelle:
