            - { id: ch22-j4-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 92 + 58.", choices: ["140", "145", "148", "150", "152"], answer: "150", hint: "92 + 60 − 2." }
          rafaelle:
            - { id: ch22-j4-ra-m1a, subject: francais, level: 4, kind: qcm, prompt: "« Je vous fais confiance, petites voyageuses. » : que révèle cette phrase sur l'attitude de Chrono face au choix des sœurs ?", choices: ["qu'il leur laisse une réelle responsabilité, malgré la gravité de la situation", "qu'il ne croit pas du tout en leurs capacités", "qu'il préfère décider lui-même, sans les écouter", "qu'il n'a plus aucune confiance envers qui que ce soit", "qu'il refuse catégoriquement toute aide de leur part"], answer: "qu'il leur laisse une réelle responsabilité, malgré la gravité de la situation", hint: "Repense à l'attitude de Chrono depuis le début de ce chapitre." }
            - { id: ch22-j4-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 12² − 44.", choices: ["96", "100", "104", "108", "112"], answer: "100", hint: "144 − 44." }
