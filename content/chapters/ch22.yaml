# Chapitre 22 — Le Cœur de l'Horloge-Mère
# Chapitre MAJEUR (decisions.ts : MAJOR = {9, 12, 20, 22, 30}). Réutilise Chrono (déjà
# établi, voix Kore). Pas d'effet ORVANE pour ce chapitre (absent de ORVANE), mais des
# flags critiques : addFlags(22,'A',[CHRONO_DEBOUT,SABLIER_DE_POCHE]) et pareil pour 'C' ;
# l'option B ne pose aucun flag (le Sablier de Poche est confié à Chrono, donc perdu, et
# Chrono reste affaibli). Introduction du Sablier de Poche, un objet magique découvert
# dans une caverne sous la mer intérieure, où bat l'Horloge-Mère, mécanisme originel dont
# dépendent toutes les autres horloges.

id: ch22
number: 22
act: 2
title: Le Cœur de l'Horloge-Mère
introImage: ch22
scene: coeur-horloge-mere

espagnol:
  - { es: "El corazón del mecanismo late despacio.", fr: "Le cœur du mécanisme bat lentement." }
  - { es: "Un pequeño reloj de arena puede salvar mucho.", fr: "Un petit sablier peut sauver beaucoup." }
  - { es: "Chrono necesita ayuda urgente.", fr: "Chrono a besoin d'aide urgente." }
  - { es: "Cada segundo cuenta ahora.", fr: "Chaque seconde compte maintenant." }
  - { es: "La sabiduría vale más que el sacrificio inútil.", fr: "La sagesse vaut plus que le sacrifice inutile." }

decision:
  prompt: "Dans la caverne tremblante, l'Horloge-Mère se fissure de toutes parts, et Chrono, épuisé, s'effondre devant son mécanisme. Un minuscule Sablier de Poche, trouvé niché entre deux rouages, semble être la clé. « Que faisons-nous de ce sablier ? » demande Rafaelle, le cœur battant."
  options:
    A:
      label: "Utiliser le Sablier pour relancer l'Horloge-Mère, puis le reprendre"
      scene: "Axelle verse, avec une précision extrême, le sable du Sablier de Poche dans le mécanisme fissuré de l'Horloge-Mère, juste assez pour la relancer, avant de récupérer le sablier intact."
      line: { who: chrono, text: "Juste assez, et pas une seconde de trop. Vous avez fait preuve d'une maîtrise que je n'espérais même plus, petite Veilleuse." }
      habillage: "Les épreuves prennent la forme de gestes d'une extrême précision, où chaque geste compte, sans rien gaspiller."
    B:
      label: "Confier directement le Sablier de Poche à Chrono"
      scene: "Rafaelle, pressée par l'urgence, tend directement le Sablier de Poche à Chrono, pour qu'il s'en serve lui-même, sans chercher davantage de précision dans le geste."
      line: { who: chrono, text: "Ce sablier... il faudra que je le garde, désormais, pour stabiliser ce qui reste de l'Horloge-Mère. Ce n'est pas la solution que j'aurais choisie, mais elle me permettra de tenir, tant bien que mal." }
      habillage: "Les épreuves se résolvent dans l'urgence, avec les moyens disponibles, sans chercher la solution la plus élégante."
    C:
      label: "Laisser Maelle calculer, avec soin, la bonne quantité de sable nécessaire"
      scene: "Maelle prend le temps, malgré l'urgence, de calculer précisément la quantité de sable nécessaire pour stabiliser l'Horloge-Mère sans épuiser totalement le Sablier de Poche."
      line: { who: chrono, text: "Un calcul juste, au bon moment, voilà exactement ce qu'il fallait, petite Cartographe. L'Horloge-Mère et moi-même vous devons beaucoup." }
      habillage: "Les épreuves prennent la forme de calculs précis à effectuer rapidement, sans se laisser déborder par l'urgence."

repliquesAbsurdes:
  - "Si l'Horloge-Mère a un cœur, est-ce qu'elle a aussi des petits-enfants horloges, quelque part dans la montagne ?"
  - "Mon renard a essayé de lécher le Sablier de Poche. Résultat : plus rien de grave, mais beaucoup de sable sur le museau."
  - "Est-ce qu'on peut demander au Sablier de Poche de ralentir juste la fin des vacances, tant qu'on y est ?"
  - "Si chaque seconde compte maintenant, est-ce qu'on doit aussi compter les secondes où on compte les secondes ?"
  - "Après une mer entière d'horloges, un cœur mécanique géant sous terre, ça semble presque logique, à ce stade du voyage."

days:
  # ─────────────────────────── JOUR 1 ───────────────────────────
  - n: 1
    title: Un tremblement sous la mer
    decor: Une caverne immense sous la mer intérieure, traversée de vibrations sourdes, où un gigantesque mécanisme d'engrenages dorés, l'Horloge-Mère, occupe tout l'espace central.
    opening:
      - { who: narrateur, text: "Alors que les trois sœurs reprenaient le chemin après avoir quitté Chrono, un tremblement sourd parcourut soudain le sol, les faisant toutes trois trébucher." }
      - { who: narrateur, text: "Chrono apparut, hors d'haleine, surgissant d'une faille rocheuse. « L'Horloge-Mère ! Elle se fissure ! Suivez-moi, vite ! »" }
      - { who: narrateur, text: "Les sœurs le suivirent jusqu'à une caverne immense, creusée sous la mer intérieure, où un gigantesque mécanisme d'engrenages dorés occupait tout l'espace central, parcouru de craquelures lumineuses." }
      - { who: rafaelle, text: "C'est... c'est elle qui règle toutes les autres horloges, n'est-ce pas ? L'Horloge-Mère ?" }
      - { who: chrono, text: "Exactement, petite Archiviste. Si elle cède complètement, c'est tout le temps de cette montagne qui s'arrêtera, ou pire, qui s'emballera sans contrôle." }
      - { who: axelle, text: "Comment est-ce qu'on peut vous aider, pour de vrai, cette fois ?" }
      - { who: chrono, text: "Je ne sais pas encore, petite Veilleuse. Mais il va falloir trouver vite, car ces craquelures s'élargissent à chaque battement de son cœur mécanique." }
      - { who: maelle, text: "Son cœur mécanique ? Elle a vraiment un cœur, cette horloge ?" }
      - { who: chrono, text: "D'une certaine façon, oui, petite Cartographe. Et ce cœur, en ce moment précis, bat bien trop lentement pour rester en vie." }
    manches:
      - id: m1
        title: Un mécanisme gigantesque
        tours:
          axelle:
            - { id: ch22-j1-ax-m1a, subject: histoire-geo, level: 1, kind: qcm, prompt: "Comment appelle-t-on une petite fente ou une fissure qui apparaît à la surface d'un objet abîmé ?", choices: ["une craquelure", "une peinture", "une couture", "une ombre", "une poussière"], answer: "une craquelure", hint: "C'est le mot utilisé pour décrire les fentes de l'Horloge-Mère." }
            - { id: ch22-j1-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 7 + 6.", choices: ["11", "12", "13", "14", "15"], answer: "13", hint: "7 + 6 = 7 + 7 − 1." }
          maelle:
            - { id: ch22-j1-ma-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Pourquoi un mécanisme central très sollicité peut-il s'user ou se fissurer plus vite que les mécanismes qui en dépendent ?", choices: ["parce qu'il supporte, en permanence, la charge de tout le système qu'il régule", "parce qu'un mécanisme central n'a jamais aucune charge particulière", "cela n'a aucune explication particulière", "parce que les mécanismes centraux sont toujours les plus solides, sans exception", "parce qu'un mécanisme central ne sert jamais à réguler autre chose"], answer: "parce qu'il supporte, en permanence, la charge de tout le système qu'il régule", hint: "Pense à ce que représente l'Horloge-Mère pour toutes les autres horloges de la mer." }
            - { id: ch22-j1-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 86 + 57.", choices: ["138", "141", "143", "145", "148"], answer: "143", hint: "86 + 60 − 3." }
          rafaelle:
            - { id: ch22-j1-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi, historiquement, la défaillance d'un système central (une horloge de ville, un barrage, un pont) a-t-elle souvent des conséquences bien plus larges que celle d'un élément isolé ?", choices: ["parce que de nombreux autres éléments dépendent directement de son bon fonctionnement", "parce qu'un système central n'a jamais aucune conséquence sur le reste", "cela n'a aucune importance historique", "parce que seuls les éléments isolés ont une réelle importance", "parce qu'un système central ne concerne jamais que lui-même"], answer: "parce que de nombreux autres éléments dépendent directement de son bon fonctionnement", hint: "Pense à ce que dit Chrono sur les conséquences d'une défaillance totale de l'Horloge-Mère." }
            - { id: ch22-j1-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 17 × 6.", choices: ["96", "100", "102", "104", "108"], answer: "102", hint: "17 × 6 = 17 × 3 × 2." }
      - id: m2
        title: Un cœur mécanique
        tours:
          axelle:
            - { id: ch22-j1-ax-m2a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le sujet de « Un tremblement sourd parcourut le sol. » ?", choices: ["le sol", "parcourut", "Un tremblement sourd", "sourd", "un"], answer: "Un tremblement sourd", hint: "Qu'est-ce qui parcourt le sol de la caverne ?" }
            - { id: ch22-j1-ax-m2b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 13 − 6.", choices: ["5", "6", "7", "8", "9"], answer: "7", hint: "13 − 6 = 7." }
          maelle:
            - { id: ch22-j1-ma-m2a, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « gigantesque » dans « un mécanisme gigantesque » ?", choices: ["nom", "verbe", "adjectif", "adverbe", "pronom"], answer: "adjectif", hint: "Il décrit l'Horloge-Mère." }
            - { id: ch22-j1-ma-m2b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 392 ÷ 7.", choices: ["52", "54", "56", "58", "60"], answer: "56", hint: "7 × 56 = 392." }
          rafaelle:
            - { id: ch22-j1-ra-m2a, subject: francais, level: 4, kind: qcm, prompt: "« Ce cœur, en ce moment précis, bat bien trop lentement pour rester en vie. » : que révèle cette métaphore sur l'état de l'Horloge-Mère ?", choices: ["qu'elle est présentée comme un être vivant dont la survie est menacée", "qu'elle n'a jamais eu aucun lien avec la notion de vie", "qu'elle fonctionne parfaitement normalement", "qu'elle n'a jamais eu de rythme particulier", "que son état n'a aucune importance pour Chrono"], answer: "qu'elle est présentée comme un être vivant dont la survie est menacée", hint: "Repense à la façon dont Chrono parle de l'Horloge-Mère, comme s'il s'agissait d'un être vivant." }
            - { id: ch22-j1-ra-m2b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 13² − 100.", choices: ["59", "63", "65", "69", "73"], answer: "69", hint: "169 − 100." }
      - id: m3
        title: L'urgence s'installe
        tours:
          axelle:
            - { id: ch22-j1-ax-m3a, subject: maths, level: 1, kind: qcm, prompt: "Il y a 6 craquelures d'un côté de l'Horloge-Mère, et 3 de plus apparaissent. Combien de craquelures en tout ?", choices: ["7", "8", "9", "10", "11"], answer: "9", hint: "6 + 3." }
            - { id: ch22-j1-ax-m3b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi une fissure qui s'élargit sans être réparée peut-elle devenir de plus en plus dangereuse avec le temps ?", choices: ["la pression ou l'usure continue d'agir et aggrave progressivement les dégâts", "une fissure ne s'aggrave jamais avec le temps", "cela n'a aucune explication particulière", "une fissure se répare toujours seule, sans intervention", "une fissure n'a jamais aucun effet sur un mécanisme"], answer: "la pression ou l'usure continue d'agir et aggrave progressivement les dégâts", hint: "Pense à ce que dit Chrono sur les craquelures qui s'élargissent." }
          maelle:
            - { id: ch22-j1-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 48 × 4.", choices: ["182", "186", "188", "190", "192"], answer: "192", hint: "48 × 4 = 50 × 4 − 2 × 4." }
            - { id: ch22-j1-ma-m3b, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi, face à une situation d'urgence, est-il important de rester calme malgré la pression du temps ?", choices: ["parce que la panique peut conduire à des erreurs qui aggravent la situation", "parce que rester calme n'a jamais aucun effet en situation d'urgence", "cela n'a aucun lien avec la gestion d'une urgence", "parce qu'il vaut toujours mieux agir sans réfléchir du tout", "parce que la panique résout toujours plus vite un problème"], answer: "parce que la panique peut conduire à des erreurs qui aggravent la situation", hint: "Pense à l'attitude que vont devoir adopter les sœurs devant l'urgence de l'Horloge-Mère." }
          rafaelle:
            - { id: ch22-j1-ra-m3a, subject: maths, level: 4, kind: qcm, prompt: "Résous : 5x + 4 = 39.", choices: ["5", "6", "7", "8", "9"], answer: "7", hint: "5x = 35." }
            - { id: ch22-j1-ra-m3b, subject: francais, level: 3, kind: qcm, prompt: "Conjugue au passé composé : « Chrono (surgir) d'une faille rocheuse. »", choices: ["a surgi", "surgissait", "surgira", "surgit", "surgissant"], answer: "a surgi", hint: "Passé composé = avoir + participe passé." }
      - id: m4
        title: Explorer la caverne
        tours:
          axelle:
            - { id: ch22-j1-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 9 × 3.", choices: ["24", "25", "27", "29", "30"], answer: "27", hint: "9 × 3 = 9 + 9 + 9." }
            - { gen: maths.addition }
          maelle:
            - { id: ch22-j1-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 235 − 88.", choices: ["140", "144", "147", "149", "152"], answer: "147", hint: "235 − 90 + 2." }
            - { gen: maths.multiplication }
          rafaelle:
            - { id: ch22-j1-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « El corazón del mecanismo late despacio. »", choices: ["Le cœur du mécanisme s'est arrêté.", "Le cœur du mécanisme bat lentement.", "Le cœur du mécanisme brille fort.", "Le cœur du mécanisme a disparu.", "Le cœur du mécanisme tourne vite."], answer: "Le cœur du mécanisme bat lentement.", hint: "« Late despacio » = bat lentement." }
            - { gen: maths.fraction-de }
    pause: "Le jeu de l'écoute attentive : chaque sœur colle son oreille contre un objet proche (un mur, une table, un livre) et décrit le bruit le plus discret qu'elle parvient à entendre, comme pour s'entraîner à écouter le cœur de l'Horloge-Mère."
    closing:
      - { who: narrateur, text: "Chrono, épuisé par sa course, s'adossa contre un rocher, le souffle court, tandis que les craquelures de l'Horloge-Mère continuaient de s'étendre lentement sous leurs yeux." }
      - { who: chrono, text: "Il nous reste une nuit, tout au plus, avant que la situation ne devienne vraiment critique. Reposez-vous, petites voyageuses. Demain, nous chercherons une solution." }
      - { who: rafaelle, text: "On sera prêtes, Chrono. On ne vous laissera pas seul face à ça." }
      - { who: narrateur, text: "Et tandis que la nuit s'installait dans la caverne, le battement sourd et irrégulier de l'Horloge-Mère continuait de résonner, comme un pouls fragile qu'il fallait, à tout prix, stabiliser." }
    reward: "la découverte de l'Horloge-Mère et de son état critique"
  # ─────────────────────────── JOUR 2 ───────────────────────────
  - n: 2
    title: Une faille entre les rouages
    decor: Le pied de l'Horloge-Mère, où les trois sœurs, aidées de Chrono, explorent les engrenages à la recherche d'une cause précise au dérèglement du mécanisme.
    opening:
      - { who: narrateur, text: "Le lendemain, Chrono et les trois sœurs explorèrent le pied de l'Horloge-Mère, cherchant, parmi les engrenages immenses, la cause précise de son dérèglement." }
      - { who: maelle, text: "Regardez, là ! Il y a quelque chose qui brille, niché tout au fond, entre deux rouages !" }
      - { who: narrateur, text: "Rafaelle se glissa prudemment entre les engrenages et en ressortit avec un minuscule sablier, à peine plus grand que sa paume, dont le sable scintillait d'une lumière douce." }
      - { who: chrono, text: "Un Sablier de Poche... Je n'en avais jamais vu de mes propres yeux, mais j'en avais entendu parler, dans de très vieux récits." }
      - { who: axelle, text: "À quoi sert-il, exactement ?" }
      - { who: chrono, text: "Il contient, dit-on, un temps très pur, capable de relancer un mécanisme en détresse, s'il est utilisé avec la plus grande précision, petite Veilleuse." }
      - { who: rafaelle, text: "Et si on ne l'utilise pas avec assez de précision ?" }
      - { who: chrono, text: "Alors le sable se perd, et avec lui, toute chance de réparer correctement l'Horloge-Mère. Il faudra être prudentes, petite Archiviste." }
    manches:
      - id: m1
        title: Un objet rare
        tours:
          axelle:
            - { id: ch22-j2-ax-m1a, subject: histoire-geo, level: 1, kind: qcm, prompt: "Comment appelle-t-on un petit instrument rempli de sable qui s'écoule pour mesurer le temps ?", choices: ["un sablier", "une horloge murale", "une boussole", "une lanterne", "un cadran solaire"], answer: "un sablier", hint: "C'est le mot du titre de l'objet trouvé." }
            - { id: ch22-j2-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 9 + 5.", choices: ["12", "13", "14", "15", "16"], answer: "14", hint: "9 + 5 = 9 + 9 − 4." }
          maelle:
            - { id: ch22-j2-ma-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Pourquoi un sablier mesure-t-il le temps de façon régulière, quelle que soit la quantité de sable restante ?", choices: ["le sable s'écoule toujours au même débit par le même petit passage étroit", "le sable s'écoule toujours plus vite à la fin", "un sablier ne mesure jamais le temps de façon régulière", "cela n'a aucune explication particulière", "le sable s'écoule toujours plus lentement au début"], answer: "le sable s'écoule toujours au même débit par le même petit passage étroit", hint: "Pense au principe de fonctionnement d'un sablier classique." }
            - { id: ch22-j2-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 315 ÷ 5.", choices: ["58", "61", "63", "65", "68"], answer: "63", hint: "5 × 63 = 315." }
          rafaelle:
            - { id: ch22-j2-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi un objet rare et mal connu, comme ce Sablier de Poche, nécessite-t-il une utilisation particulièrement prudente ?", choices: ["parce que son fonctionnement précis et ses limites ne sont pas totalement maîtrisés", "parce qu'un objet rare n'a jamais besoin d'être utilisé avec prudence", "cela n'a aucune raison particulière", "parce que seuls les objets courants méritent de la prudence", "parce qu'un objet mal connu est toujours sans danger"], answer: "parce que son fonctionnement précis et ses limites ne sont pas totalement maîtrisés", hint: "Repense à ce que dit Chrono sur sa propre méconnaissance du Sablier de Poche." }
            - { id: ch22-j2-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 19 × 5.", choices: ["90", "92", "93", "95", "98"], answer: "95", hint: "19 × 5 = 20 × 5 − 5." }
      - id: m2
        title: Un temps très pur
