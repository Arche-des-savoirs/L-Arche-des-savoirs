            - { id: ch22-j2-ax-m3b, subject: maths, level: 2, kind: qcm, prompt: "Calcule 8 × 3.", choices: ["21", "22", "24", "26", "28"], answer: "24", hint: "8 × 3 = 8 + 8 + 8." }
          maelle:
            - { id: ch22-j2-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 405 ÷ 5.", choices: ["75", "78", "80", "81", "85"], answer: "81", hint: "5 × 81 = 405." }
            - { id: ch22-j2-ma-m3b, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi, face à une ressource rare et non renouvelable, vaut-il souvent mieux agir avec méthode plutôt que dans la précipitation ?", choices: ["parce qu'une mauvaise utilisation pourrait gaspiller définitivement cette ressource précieuse", "parce qu'une ressource rare se renouvelle toujours facilement", "cela n'a aucun lien avec la gestion d'une ressource rare", "parce que la précipitation permet toujours de mieux utiliser une ressource", "parce qu'une ressource rare n'a jamais besoin d'être préservée"], answer: "parce qu'une mauvaise utilisation pourrait gaspiller définitivement cette ressource précieuse", hint: "Repense à ce que dit Chrono sur le risque de perdre le sable du Sablier de Poche." }
          rafaelle:
            - { id: ch22-j2-ra-m3a, subject: maths, level: 4, kind: qcm, prompt: "Résous : 6x − 5 = 31.", choices: ["5", "6", "7", "8", "9"], answer: "6", hint: "6x = 36." }
            - { id: ch22-j2-ra-m3b, subject: francais, level: 4, kind: qcm, prompt: "« Le sable se perd, et avec lui, toute chance de réparer correctement l'Horloge-Mère. » : que signifie cette phrase ?", choices: ["qu'une erreur dans l'utilisation du sablier aurait des conséquences irréversibles sur la réparation", "que le sable se régénère toujours tout seul", "que l'Horloge-Mère n'a besoin d'aucune réparation", "que le sablier n'a aucun lien avec l'Horloge-Mère", "qu'il existe toujours une seconde chance, quoi qu'il arrive"], answer: "qu'une erreur dans l'utilisation du sablier aurait des conséquences irréversibles sur la réparation", hint: "Relis bien la phrase de Chrono, en lien avec la prudence nécessaire." }
      - id: m4
        title: Peser les options
        tours:
          axelle:
            - { id: ch22-j2-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 6 × 9.", choices: ["48", "50", "52", "54", "56"], answer: "54", hint: "6 × 9 = 6 × 10 − 6." }
            - { gen: maths.comparer }
          maelle:
