      - { who: narrateur, text: "Le quatrième jour, la tension monta encore d'un cran dans la caverne, tandis que Chrono et les trois sœurs discutaient une dernière fois de la méthode à employer." }
      - { who: chrono, text: "Dans la caverne tremblante, l'Horloge-Mère se fissure de toutes parts, et je m'effondre, épuisé, devant son mécanisme. Ce sablier semble être la clé. Que faisons-nous de ce sablier ?" }
      - { who: rafaelle, text: "On a trois façons possibles de procéder, et chacune a ses risques. Il va falloir choisir avec soin, cette fois plus que jamais." }
