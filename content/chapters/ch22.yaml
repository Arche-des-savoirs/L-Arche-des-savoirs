            - { gen: maths.ranger }
    pause: "Le jeu du geste précis : chaque sœur essaie de verser, aussi précisément que possible, une petite quantité d'eau ou de sable imaginaire d'une main à l'autre, sans en perdre une goutte, pour s'entraîner à la précision du lendemain."
    closing:
      - { who: narrateur, text: "Chrono enveloppa précautionneusement le Sablier de Poche dans un linge doux, le posant au centre d'un petit cercle de pierres, comme pour le protéger jusqu'au lendemain." }
      - { who: chrono, text: "Demain, il faudra décider, ensemble, de la meilleure façon de l'utiliser. L'Horloge-Mère ne tiendra plus très longtemps, hélas." }
      - { who: maelle, text: "On y réfléchira sérieusement, cette nuit encore." }
      - { who: narrateur, text: "Et tandis que la caverne s'assombrissait pour la nuit, le battement irrégulier de l'Horloge-Mère semblait, plus que jamais, résonner comme un appel à l'aide silencieux." }
    reward: "la découverte du Sablier de Poche, niché entre les rouages"
  # ─────────────────────────── JOUR 3 ───────────────────────────
  - n: 3
    title: Apprendre à mesurer
    decor: Le pied de l'Horloge-Mère, où Chrono enseigne aux trois sœurs les rudiments délicats du calcul nécessaire pour utiliser correctement le Sablier de Poche.
    opening:
      - { who: narrateur, text: "Le troisième jour, Chrono entreprit d'enseigner aux trois sœurs les rudiments délicats du calcul nécessaire pour utiliser correctement le Sablier de Poche." }
      - { who: chrono, text: "Il faut calculer, avec précision, la quantité exacte de sable nécessaire pour stabiliser l'Horloge-Mère, sans en gaspiller la moindre pincée." }
      - { who: maelle, text: "Comment est-ce qu'on peut savoir, exactement, quelle quantité est nécessaire ?" }
      - { who: chrono, text: "En observant le rythme des craquelures, petite Cartographe, et en mesurant précisément l'écart entre leur battement actuel et leur battement normal." }
      - { who: rafaelle, text: "Et si on se trompe dans le calcul, même d'un tout petit peu ?" }
      - { who: chrono, text: "Le risque existe, petite Archiviste, c'est vrai. Mais un calcul juste, mené avec sérieux, est souvent bien plus sûr qu'un geste précipité." }
      - { who: axelle, text: "On va s'entraîner, alors, avant d'essayer pour de vrai sur l'Horloge-Mère ?" }
      - { who: chrono, text: "Exactement, petite Veilleuse. Mieux vaut s'entraîner longuement que risquer de tout perdre en un seul geste malheureux." }
    manches:
      - id: m1
        title: Mesurer avec précision
        tours:
          axelle:
            - { id: ch22-j3-ax-m1a, subject: maths, level: 1, kind: qcm, prompt: "Il y a 5 grains de sable comptés dans une petite poignée, et 3 dans une autre. Combien de grains en tout ?", choices: ["6", "7", "8", "9", "10"], answer: "8", hint: "5 + 3." }
            - { id: ch22-j3-ax-m1b, subject: francais, level: 1, kind: qcm, prompt: "Quel est le contraire de « précipité » ?", choices: ["réfléchi", "rapide", "pressé", "hâtif", "urgent"], answer: "réfléchi", hint: "Le contraire d'un geste fait sans prendre le temps de réfléchir." }
          maelle:
            - { id: ch22-j3-ma-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Pourquoi mesurer un écart précis, comme un rythme anormal, nécessite-t-il de comparer avec une valeur de référence normale ?", choices: ["parce que c'est uniquement la différence entre les deux qui révèle l'ampleur du problème", "parce qu'une mesure n'a jamais besoin de référence", "cela n'a aucune explication particulière", "parce que la valeur normale n'a jamais aucune utilité", "parce que l'écart ne se mesure jamais par comparaison"], answer: "parce que c'est uniquement la différence entre les deux qui révèle l'ampleur du problème", hint: "Pense à la méthode de calcul expliquée par Chrono." }
            - { id: ch22-j3-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 480 ÷ 6.", choices: ["70", "75", "78", "80", "85"], answer: "80", hint: "6 × 80 = 480." }
          rafaelle:
            - { id: ch22-j3-ra-m1a, subject: histoire-geo, level: 4, kind: qcm, prompt: "Pourquoi un calcul rigoureux, même effectué sous pression, offre-t-il souvent plus de garanties qu'une estimation rapide et approximative ?", choices: ["parce qu'il réduit le risque d'erreur en s'appuyant sur des données vérifiées plutôt que sur l'intuition", "parce qu'un calcul rigoureux n'a jamais aucune utilité sous pression", "cela n'a aucun lien avec la fiabilité d'une décision", "parce qu'une estimation rapide est toujours plus fiable qu'un calcul", "parce que la rigueur n'a jamais d'importance en situation d'urgence"], answer: "parce qu'il réduit le risque d'erreur en s'appuyant sur des données vérifiées plutôt que sur l'intuition", hint: "Repense à ce que dit Chrono sur le calcul juste, plus sûr qu'un geste précipité." }
            - { id: ch22-j3-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 16 × 6.", choices: ["90", "92", "94", "96", "98"], answer: "96", hint: "16 × 6 = 16 × 3 × 2." }
      - id: m2
        title: S'entraîner avant d'agir
        tours:
          axelle:
            - { id: ch22-j3-ax-m2a, subject: maths, level: 1, kind: qcm, prompt: "Calcule 12 − 5.", choices: ["5", "6", "7", "8", "9"], answer: "7", hint: "12 − 5 = 7." }
            - { id: ch22-j3-ax-m2b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi s'entraîner sur un modèle ou une simulation avant d'agir sur un objet rare et fragile est-il une bonne pratique ?", choices: ["cela permet de corriger ses erreurs sans risquer d'endommager l'objet véritable", "s'entraîner n'a jamais aucune utilité avant une action importante", "cela n'a aucune explication particulière", "il vaut toujours mieux agir directement sans aucun entraînement", "un entraînement rend toujours une action plus risquée"], answer: "cela permet de corriger ses erreurs sans risquer d'endommager l'objet véritable", hint: "Pense à ce que propose Chrono avant d'utiliser le vrai Sablier de Poche." }
          maelle:
            - { id: ch22-j3-ma-m2a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 504 ÷ 7.", choices: ["68", "70", "72", "74", "76"], answer: "72", hint: "7 × 72 = 504." }
            - { id: ch22-j3-ma-m2b, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « délicats » dans « les rudiments délicats du calcul » ?", choices: ["nom", "adjectif", "verbe", "adverbe", "pronom"], answer: "adjectif", hint: "Il décrit les rudiments du calcul enseignés par Chrono." }
          rafaelle:
            - { id: ch22-j3-ra-m2a, subject: maths, level: 5, kind: qcm, prompt: "Calcule 8² − 3².", choices: ["46", "50", "52", "55", "58"], answer: "55", hint: "64 − 9." }
            - { id: ch22-j3-ra-m2b, subject: espagnol, level: 3, kind: qcm, prompt: "Traduis : « Cada segundo cuenta ahora. »", choices: ["Chaque seconde compte maintenant.", "Chaque seconde passe lentement.", "Chaque seconde est oubliée.", "Chaque seconde revient en arrière.", "Chaque seconde se répète."], answer: "Chaque seconde compte maintenant.", hint: "« Cuenta ahora » = compte maintenant." }
      - id: m3
        title: La confiance qui grandit
        tours:
          axelle:
            - { id: ch22-j3-ax-m3a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le sujet de « Chrono enseigne les rudiments du calcul. » ?", choices: ["les rudiments du calcul", "enseigne", "Chrono", "du calcul", "les rudiments"], answer: "Chrono", hint: "Qui enseigne les rudiments du calcul aux sœurs ?" }
            - { id: ch22-j3-ax-m3b, subject: maths, level: 2, kind: qcm, prompt: "Calcule 7 × 4.", choices: ["24", "26", "27", "28", "30"], answer: "28", hint: "7 × 4 = 7 × 2 × 2." }
          maelle:
            - { id: ch22-j3-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 29 × 5.", choices: ["135", "140", "142", "145", "148"], answer: "145", hint: "30 × 5 − 5." }
            - { id: ch22-j3-ma-m3b, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi la confiance en ses propres capacités augmente-t-elle souvent après un entraînement sérieux et répété ?", choices: ["parce que la répétition permet de mieux maîtriser un geste ou un calcul, ce qui réduit l'incertitude", "parce que la confiance n'a jamais de lien avec l'entraînement", "cela n'a aucune explication particulière", "parce qu'un seul essai suffit toujours à être parfaitement sûr de soi", "parce que s'entraîner rend toujours plus incertain"], answer: "parce que la répétition permet de mieux maîtriser un geste ou un calcul, ce qui réduit l'incertitude", hint: "Pense à l'évolution de la confiance des sœurs au fil de leur entraînement." }
          rafaelle:
            - { id: ch22-j3-ra-m3a, subject: maths, level: 4, kind: qcm, prompt: "Résous : 7x − 4 = 38.", choices: ["5", "6", "7", "8", "9"], answer: "6", hint: "7x = 42." }
            - { id: ch22-j3-ra-m3b, subject: francais, level: 4, kind: qcm, prompt: "Conjugue au présent : « Nous (calculer) l'écart avec soin. »", choices: ["nous calculons", "nous calculez", "nous calculent", "nous calculions", "nous calculerons"], answer: "nous calculons", hint: "Nous : -ons." }
      - id: m4
        title: Presque prêtes à agir
        tours:
          axelle:
            - { id: ch22-j3-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 8 × 4.", choices: ["28", "30", "32", "34", "36"], answer: "32", hint: "8 × 4 = 8 × 2 × 2." }
            - { gen: maths.suite }
          maelle:
            - { id: ch22-j3-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 285 − 119.", choices: ["160", "164", "166", "168", "170"], answer: "166", hint: "285 − 120 + 1." }
            - { gen: maths.addition }
          rafaelle:
            - { id: ch22-j3-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « La sabiduría vale más que el sacrificio inútil. »", choices: ["La sagesse vaut plus que le sacrifice inutile.", "La sagesse n'a aucune valeur.", "Le sacrifice est toujours nécessaire.", "La sagesse se perd avec le temps.", "Le sacrifice vaut plus que tout."], answer: "La sagesse vaut plus que le sacrifice inutile.", hint: "« Vale más que » = vaut plus que." }
            - { gen: maths.multiplication }
    pause: "Le jeu du calcul à voix haute : chaque sœur propose, à voix haute, un petit calcul qu'elle pourrait utiliser pour mesurer un écart précis, et les deux autres vérifient si le résultat semble juste."
    closing:
      - { who: narrateur, text: "Chrono observa les trois sœurs s'entraîner, encore et encore, jusqu'à ce que leurs gestes et leurs calculs deviennent, peu à peu, presque naturels." }
      - { who: chrono, text: "Je crois que vous êtes prêtes, ou presque. Demain, il faudra faire le choix final, et agir, pour de vrai, sur l'Horloge-Mère." }
      - { who: axelle, text: "On sera prêtes, Chrono. On a fait tout ce qu'on pouvait pour ça." }
      - { who: narrateur, text: "Et tandis que la nuit retombait sur la caverne, le battement de l'Horloge-Mère sembla, pour la première fois depuis leur arrivée, légèrement plus régulier, comme porté par un espoir nouveau." }
    reward: "la maîtrise, enfin acquise, du calcul nécessaire pour utiliser le Sablier"
  # ─────────────────────────── JOUR 4 ───────────────────────────
  - n: 4
    title: L'heure du choix approche
