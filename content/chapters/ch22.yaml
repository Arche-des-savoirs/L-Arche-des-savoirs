            - { id: ch22-j4-ax-m2b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi, dans une situation critique, est-il parfois préférable de privilégier une méthode un peu plus lente mais plus sûre, plutôt qu'une méthode rapide mais risquée ?", choices: ["parce qu'une erreur en situation critique peut avoir des conséquences bien plus graves qu'un délai supplémentaire", "parce qu'une méthode plus sûre n'est jamais préférable", "cela n'a aucun lien avec la gestion d'une situation critique", "parce qu'il vaut toujours mieux agir le plus vite possible, quel qu'en soit le risque", "parce que la rapidité élimine toujours tout risque d'erreur"], answer: "parce qu'une erreur en situation critique peut avoir des conséquences bien plus graves qu'un délai supplémentaire", hint: "Pense aux trois méthodes envisagées pour utiliser le Sablier de Poche." }
