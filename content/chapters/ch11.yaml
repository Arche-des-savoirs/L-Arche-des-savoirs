# Chapitre 11 — Les Jardins de l'Aube
# Suite directe du chapitre 10 : l'Arche appareille vers la terre fraîchement nommée par Dame
# Cartéa — l'Aube — et y découvre des jardins en terrasses, silencieux, dont les fleurs ne
# s'ouvrent plus. Nouveau personnage discret : Albin, l'Écho du Jardin (voix sans corps, née du
# cercle rituel visible sur l'illustration officielle ch11.webp — une apprentie à l'écoute du sol).
# Rédigé directement en YAML, canon établi tiré de la mémoire du projet (« fais au mieux »).

id: ch11
number: 11
act: 2
title: Les Jardins de l'Aube
introImage: ch11
scene: jardins-aube

espagnol:
  - { es: "El jardín canta.", fr: "Le jardin chante." }
  - { es: "Escucho la tierra.", fr: "J'écoute la terre." }
  - { es: "Las flores florecen.", fr: "Les fleurs fleurissent." }
  - { es: "El agua cae.", fr: "L'eau tombe." }
  - { es: "Todo vuelve a crecer.", fr: "Tout recommence à pousser." }

# Décision du Conseil des Jardins (début du jour 5). A = Lien, B = Courage, C = Mémoire.
decision:
  prompt: "Albin s'est tu depuis si longtemps qu'il doute de pouvoir encore chanter. Comment l'aider à retrouver sa voix ?"
  options:
    A:
      label: Écouter la terre
      scene: "Les trois sœurs s'allongent toutes les trois autour du cercle rituel, l'oreille contre le sol, et restent longtemps silencieuses, à ne rien faire d'autre qu'écouter battre le jardin sous elles."
      line: { who: albin, text: "Personne n'avait pris le temps de m'écouter sans rien attendre en retour. Je crois que ça suffit à me redonner un peu de voix." }
      habillage: "Chaque épreuve devient un moment où l'on s'arrête d'agir pour simplement observer et ressentir avant de répondre."
    B:
      label: Faire refleurir sans attendre
      scene: "Rafaelle attrape l'arrosoir doré abandonné près du cercle et se met en route le long des terrasses, sans attendre l'accord de qui que ce soit, réveillant une à une les fleurs de brume sur son passage."
      line: { who: albin, text: "Personne n'avait osé arroser avant de me demander la permission. C'est audacieux. C'est même, je crois, exactement ce qu'il me fallait." }
      habillage: "Les épreuves deviennent une course le long des terrasses, comme si chaque fleur rouverte donnait un peu plus d'élan."
    C:
      label: Recouper les saisons
      scene: "Maelle compare, dans son carnet, les dates de floraison notées sur chaque terrasse, et comprend que les fleurs de brume ne s'ouvrent que lorsque l'aube et le crépuscule se touchent presque — un instant précis qu'elle calcule, terrasse par terrasse."
      line: { who: albin, text: "Vous avez pris la peine de comprendre mon rythme plutôt que de m'en imposer un autre. Personne n'avait fait cela avant vous." }
      habillage: "Les épreuves deviennent des énigmes de calcul et de déduction à recouper avant d'agir."

repliquesAbsurdes:
  - "Si les fleurs dorment, est-ce qu'il faut leur souhaiter bonne nuit avant de repartir ?"
  - "Mon renard a essayé de manger une fleur de brume. Elle a éternué. La fleur, pas le renard."
  - "On a déjà parlé à une carte vivante. Un jardin qui chante, c'est presque reposant, en fait."
  - "Si j'arrose assez fort, est-ce que je peux faire pousser un deuxième petit-déjeuner ?"
  - "Dame Cartéa nous a donné un compas. Est-ce qu'il indique aussi la direction du goûter ?"

days:
  # ─────────────────────────── JOUR 1 ───────────────────────────
  - n: 1
    title: Les Jardins Muets
    decor: Les terrasses de l'Aube — un escalier de jardins suspendus taillés dans de vieilles ruines, où des cascades tombent en silence entre des rangées de fleurs fermées.
    opening:
      - { who: narrateur, text: "Il était une fois une terre si récemment nommée qu'elle semblait encore retenir son souffle. L'Arche se posa en douceur au pied de terrasses de pierre ancienne, sculptées à flanc de colline, où des cascades glissaient sans un bruit entre des rangées de fleurs blanches, toutes closes." }
      - { who: narrateur, text: "Nilo bondit le premier sur la première terrasse, un arrosoir doré trouvé près de la coque de l'Arche, serré contre lui, bien décidé à être utile avant même d'avoir compris à quoi." }
      - { who: nilo, text: "Un jardin entier, rien que pour nous ! Enfin, pour l'instant il a surtout l'air de bouder, mais je suis sûr qu'on peut arranger ça." }
      - { who: narrateur, text: "Rafaelle grimpa les marches quatre à quatre, dépassant Nilo, et s'arrêta net devant la première rangée de fleurs : des pétales blancs, repliés sur eux-mêmes comme des mains jointes, pas un seul ouvert sur toute la terrasse." }
      - { who: rafaelle, text: "Elles sont toutes fermées. Pas une seule ouverte, même à moitié. Un jardin, normalement, ça a au moins une fleur qui fait sa maligne." }
      - { who: narrateur, text: "Maelle s'agenouilla près d'une cascade et remarqua que l'eau, elle non plus, ne faisait aucun bruit en tombant — comme si le son lui-même avait oublié comment se répandre dans ces jardins." }
      - { who: maelle, text: "Même l'eau est silencieuse. Ça ne devrait pas être possible. L'eau qui tombe, normalement, ça fait du bruit, même tout doucement." }
      - { who: axelle, text: "C'est comme si le jardin dormait. Mais un sommeil triste, pas un sommeil reposant." }
      - { who: plume, text: "Je sens un peu de peine, ici. Pas de danger. Juste... de la fatigue, très ancienne, qui attend qu'on s'en occupe." }
    manches:
      - id: m1
        title: Un jardin qui dort
        intro: "Avant de réveiller un jardin, il faut comprendre de quoi il a besoin."
        tours:
          axelle:
            - { id: ch11-j1-ax-m1a, subject: sciences, level: 1, kind: qcm, prompt: "De quoi une plante a-t-elle besoin pour grandir, en plus de la terre ?", choices: ["de musique", "d'eau et de lumière", "de neige", "de sable sec", "de froid constant"], answer: "d'eau et de lumière", hint: "Pense à ce qu'on donne à une plante de pot." }
            - { id: ch11-j1-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 7 + 6.", choices: ["11", "12", "13", "14", "15"], answer: "13", hint: "7 + 6 = 7 + 7 − 1." }
          maelle:
            - { id: ch11-j1-ma-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Comment s'appelle le phénomène par lequel une fleur s'ouvre le matin et se referme le soir ?", choices: ["la photosynthèse", "la nyctinastie (le mouvement jour/nuit des fleurs)", "la pollinisation", "la germination", "l'évaporation"], answer: "la nyctinastie (le mouvement jour/nuit des fleurs)", hint: "C'est un mouvement lié à la lumière du jour." }
            - { id: ch11-j1-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 68 + 57.", choices: ["115", "120", "122", "125", "130"], answer: "125", hint: "68 + 60 − 3." }
          rafaelle:
            - { id: ch11-j1-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Comment appelle-t-on des jardins construits en paliers successifs à flanc de colline, comme ceux de l'Aube ?", choices: ["des jardins suspendus ou en terrasses", "des jardins clos", "des vergers", "des jardins potagers", "des jardins flottants"], answer: "des jardins suspendus ou en terrasses", hint: "Pense à la forme en escalier du relief." }
            - { id: ch11-j1-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 144 ÷ 12.", choices: ["10", "11", "12", "13", "14"], answer: "12", hint: "12 × 12 = 144." }
      - id: m2
        title: Le silence de l'eau
        tours:
          axelle:
            - { id: ch11-j1-ax-m2a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le contraire de « silencieux » ?", choices: ["calme", "doux", "bruyant", "petit", "lent"], answer: "bruyant", hint: "C'est l'opposé du silence." }
            - { id: ch11-j1-ax-m2b, subject: maths, level: 2, kind: qcm, prompt: "Calcule 16 − 9.", choices: ["5", "6", "7", "8", "9"], answer: "7", hint: "16 − 10 = 6, puis + 1." }
          maelle:
            - { id: ch11-j1-ma-m2a, subject: sciences, level: 2, kind: qcm, prompt: "D'où vient, à l'origine, l'eau qui tombe en cascade sur une colline ?", choices: ["elle sort directement de la roche", "des pluies et des sources en amont, qui descendent par gravité", "elle est toujours salée", "elle vient uniquement de la mer", "elle est créée par les plantes"], answer: "des pluies et des sources en amont, qui descendent par gravité", hint: "Pense au cycle de l'eau, et à ce qui coule toujours vers le bas." }
            - { id: ch11-j1-ma-m2b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 9 × 11.", choices: ["88", "90", "99", "100", "108"], answer: "99", hint: "9 × 11 = 9 × 10 + 9." }
          rafaelle:
            - { id: ch11-j1-ra-m2a, subject: francais, level: 3, kind: qcm, prompt: "« Comme si le son lui-même avait oublié comment se répandre » : quelle figure de style prête à l'eau un comportement humain ?", choices: ["une comparaison", "une personnification", "une hyperbole", "une allitération", "une énumération"], answer: "une personnification", hint: "On prête à l'eau le pouvoir d'« oublier », comme une personne." }
            - { id: ch11-j1-ra-m2b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 7/10 − 3/10.", choices: ["4/10", "4/20", "2/5", "1/2", "10/10"], answer: "4/10", hint: "7 − 3 = 4, sur le même dénominateur." }
      - id: m3
        title: Les fleurs closes
        tours:
          axelle:
            - { id: ch11-j1-ax-m3a, subject: maths, level: 1, kind: qcm, prompt: "Calcule 10 + 8.", choices: ["16", "17", "18", "19", "20"], answer: "18", hint: "10 + 8 = 18." }
            - { id: ch11-j1-ax-m3b, subject: sciences, level: 1, kind: qcm, prompt: "Quelle couleur sont la plupart des fleurs décrites dans les jardins de l'Aube ?", choices: ["rouges", "blanches", "noires", "bleues", "vertes"], answer: "blanches", hint: "Relis la description du jardin au début du jour." }
          maelle:
            - { id: ch11-j1-ma-m3a, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « closes » dans « des fleurs blanches, toutes closes » ?", choices: ["nom", "verbe", "adjectif", "adverbe", "préposition"], answer: "adjectif", hint: "Il décrit l'état des fleurs." }
            - { id: ch11-j1-ma-m3b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 420 ÷ 7.", choices: ["50", "55", "58", "60", "62"], answer: "60", hint: "7 × 60 = 420." }
          rafaelle:
            - { id: ch11-j1-ra-m3a, subject: histoire-geo, level: 4, kind: qcm, prompt: "Pourquoi construisait-on historiquement des jardins en terrasses sur des collines, plutôt que de cultiver directement la pente ?", choices: ["pour faire plus joli uniquement", "pour retenir la terre et l'eau et éviter qu'elles ne dévalent la pente", "parce que c'était une tradition sans raison pratique", "pour cacher les cultures aux voisins", "parce que les plantes poussent plus vite en hauteur"], answer: "pour retenir la terre et l'eau et éviter qu'elles ne dévalent la pente", hint: "Pense à ce qui se passerait si la terre et l'eau glissaient tout droit vers le bas." }
            - { id: ch11-j1-ra-m3b, subject: maths, level: 4, kind: qcm, prompt: "Résous : 3x + 2 = 20.", choices: ["5", "6", "7", "8", "9"], answer: "6", hint: "3x = 18." }
      - id: m4
        title: Premiers pas sur les terrasses
        tours:
          axelle:
            - { id: ch11-j1-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 6 × 4.", choices: ["20", "22", "24", "26", "28"], answer: "24", hint: "6 × 4 = 6 + 6 + 6 + 6." }
            - { gen: maths.addition }
          maelle:
            - { id: ch11-j1-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 93 − 48.", choices: ["43", "44", "45", "46", "47"], answer: "45", hint: "93 − 50 + 2." }
            - { gen: maths.comparer }
          rafaelle:
            - { id: ch11-j1-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « El jardín canta. »", choices: ["Le jardin dort.", "Le jardin chante.", "Le jardin pleure.", "Le jardin pousse.", "Le jardin tombe."], answer: "Le jardin chante.", hint: "« Canta » ressemble à « chante »." }
            - { gen: maths.fraction-de }
    pause: "Le jeu de l'arrosoir silencieux : une sœur mime « arroser » une plante imaginaire sans faire aucun bruit, les deux autres doivent deviner quelle fleur elle arrose rien qu'à ses gestes !"
    closing:
      - { who: narrateur, text: "Au centre de la terrasse la plus haute, Maelle découvrit un grand cercle tracé à même la pierre, entouré de symboles presque effacés par le temps — et en son centre, une légère chaleur montait du sol, comme un souffle très lent." }
      - { who: maelle, text: "Il y a quelque chose, ici. Pas dangereux. Juste... endormi, très profondément." }
      - { who: narrateur, text: "Rafaelle s'agenouilla la première, posa l'oreille contre la pierre tiède, et resta un long moment immobile, pendant que ses sœurs retenaient leur souffle autour d'elle." }
      - { who: rafaelle, text: "J'entends quelque chose. Très loin. Comme une voix qui a oublié comment parler fort." }
      - { who: narrateur, text: "Un murmure, à peine audible, traversa alors la terrasse entière — pas vraiment une voix, plutôt l'écho d'une voix, comme si elle venait de très loin en dessous du sol." }
      - { who: albin, text: "...quelqu'un... écoute ?" }
      - { who: axelle, text: "Oui ! On est là. On t'écoute." }
      - { who: narrateur, text: "Le murmure se tut aussitôt, comme effrayé par sa propre audace, et les fleurs de la terrasse restèrent closes — mais, pour la première fois, une légère chaleur semblait monter d'elles aussi, comme une respiration qui reprenait, timide." }
    reward: "la découverte du cercle rituel, et un premier murmure"
  # ─────────────────────────── JOUR 2 ───────────────────────────
  - n: 2
    title: L'Écho Endormi
    decor: Le cercle rituel de la terrasse haute, où une légère brume dorée s'élève doucement du sol à mesure que le jour avance.
    opening:
      - { who: narrateur, text: "Le lendemain, les trois sœurs retournèrent directement au cercle rituel, bien avant le réveil des cascades. Une fine brume dorée s'en élevait déjà, comme une respiration patiente qui attendait leur retour." }
      - { who: narrateur, text: "Nilo, qui n'avait pas tenu en place de la nuit, avait déjà arrosé trois terrasses entières avant le petit-déjeuner — sans grand résultat, sinon des bottes trempées et un renard extrêmement fier de lui." }
      - { who: nilo, text: "Techniquement, rien n'a fleuri. Mais tout est très, très hydraté. C'est un début." }
      - { who: narrateur, text: "Maelle s'agenouilla de nouveau près du cercle, et cette fois, le murmure revint plus vite, un peu plus clair, comme une voix qui retrouvait, phrase après phrase, le chemin des mots." }
      - { who: albin, text: "Vous êtes revenues. Je ne pensais pas que... que quelqu'un reviendrait un deuxième jour." }
      - { who: maelle, text: "On ne part jamais après une seule journée. C'est une règle, chez nous." }
      - { who: narrateur, text: "La voix hésita un instant, comme intimidée par cette réponse si simple, puis reprit, un peu plus assurée." }
      - { who: albin, text: "Je m'appelle Albin. Enfin... je crois. Il y a si longtemps que personne ne m'a appelé par mon nom que je ne suis plus tout à fait sûr de le porter correctement." }
      - { who: plume, text: "Moi, des fois, j'oublie même le nom des jours de la semaine. Ça ne veut rien dire du tout sur qui on est." }
    manches:
      - id: m1
        title: Une voix sans corps
        tours:
          axelle:
            - { id: ch11-j2-ax-m1a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le sujet de la phrase « Albin murmure doucement. » ?", choices: ["murmure", "doucement", "Albin", "la voix", "le jardin"], answer: "Albin", hint: "Qui fait l'action de murmurer ?" }
            - { id: ch11-j2-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 9 + 7.", choices: ["14", "15", "16", "17", "18"], answer: "16", hint: "9 + 7 = 9 + 1 + 6." }
          maelle:
            - { id: ch11-j2-ma-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Pourquoi une brume peut-elle apparaître au-dessus du sol tôt le matin ?", choices: ["le sol fabrique de la fumée", "l'air frais du matin refroidit la vapeur d'eau qui se condense", "c'est toujours de la magie", "le sol chauffe trop fort", "il n'y a jamais de brume le matin"], answer: "l'air frais du matin refroidit la vapeur d'eau qui se condense", hint: "Pense à la buée qui se forme sur une fenêtre froide." }
            - { id: ch11-j2-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 13 × 7.", choices: ["81", "88", "91", "93", "98"], answer: "91", hint: "13 × 7 = 13 × 5 + 13 × 2." }
          rafaelle:
            - { id: ch11-j2-ra-m1a, subject: francais, level: 4, kind: qcm, prompt: "« Une voix qui retrouvait, phrase après phrase, le chemin des mots » : que suggère cette image sur l'état d'Albin ?", choices: ["qu'il ne parle pas la même langue", "qu'il reprend confiance et mémoire petit à petit", "qu'il récite un texte appris par cœur", "qu'il ment délibérément", "qu'il est en colère"], answer: "qu'il reprend confiance et mémoire petit à petit", hint: "Pense à ce que signifie « retrouver un chemin » peu à peu." }
            - { id: ch11-j2-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 6² − 5².", choices: ["9", "10", "11", "12", "13"], answer: "11", hint: "36 − 25." }
      - id: m2
        title: Le nom qu'on porte
        tours:
          axelle:
            - { id: ch11-j2-ax-m2a, subject: maths, level: 1, kind: qcm, prompt: "Calcule 14 − 6.", choices: ["6", "7", "8", "9", "10"], answer: "8", hint: "14 − 4 = 10, puis − 2." }
            - { id: ch11-j2-ax-m2b, subject: francais, level: 1, kind: qcm, prompt: "Quel petit mot utilise-t-on pour se présenter : « Je m'... Albin » ?", choices: ["appelle", "nomme pas", "parle", "trouve", "vois"], answer: "appelle", hint: "« Je m'appelle… »" }
          maelle:
            - { id: ch11-j2-ma-m2a, subject: sciences, level: 2, kind: qcm, prompt: "Pourquoi certaines cascades sont-elles presque silencieuses alors que d'autres grondent fort ?", choices: ["cela dépend uniquement de la couleur de l'eau", "le bruit dépend de la hauteur de chute et de la force du courant", "les cascades silencieuses sont toujours plus grandes", "aucune cascade ne fait jamais de bruit", "cela dépend du jour de la semaine"], answer: "le bruit dépend de la hauteur de chute et de la force du courant", hint: "Pense à une petite chute d'eau comparée à une grande chute." }
