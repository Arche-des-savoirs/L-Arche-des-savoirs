# Chapitre 1 — La Porte des Trois Lueurs
# Source : doc « Chapitre 1, version 2 (séance commune) », validé le 16/11.
# Lueurs : dorée (Axelle, Veilleuse), blanche (Maelle, Cartographe), rose (Rafaelle, Archiviste).
# Niveaux : 1 à 3 = classe de la fille ; 4 et 5 = classe supérieure.
# Une ligne « gen » tire une question d'un générateur à graine fixe (src/generators).

id: ch01
number: 1
act: 1
title: La Porte des Trois Lueurs
introImage: ch01
scene: porte-trois-lueurs

espagnol:
  - { es: "Bienvenida.", fr: "Bienvenue." }
  - { es: "La luz abre la puerta.", fr: "La lumière ouvre la porte." }
  - { es: "El camino empieza aquí.", fr: "Le chemin commence ici." }
  - { es: "Los siglos duermen en los libros.", fr: "Les siècles dorment dans les livres." }
  - { es: "Tres luces, una puerta.", fr: "Trois lumières, une porte." }

# Décision du Conseil de la Lanterne (début du jour 5) — doc des 93 variantes, chapitre 1.
# A = Lien, B = Courage, C = Mémoire. Effets sur les compteurs : src/content/decisions.ts.
decision:
  prompt: "Une trace de sable gris mène à la Porte. Que faire de cette trace ?"
  options:
    A:
      label: Rassurer Plume
      scene: "Plume se blottit entre les trois et chuchote ce qu'il ressent : une odeur de maison. La porte s'ouvre sur une lumière tiède."
      line: { who: plume, text: "Quand vous êtes là, la trace fait moins peur." }
      habillage: "Les partitions sont écrites comme trois berceuses ; la mesure manquante est la note qui « réconforte »."
    B:
      label: Suivre la trace
      scene: "La trace de sable court jusqu'à la porte, que les filles doivent ouvrir avant qu'elle ne s'efface."
      line: { who: thessaly, text: "Vite, elle s'efface !" }
      habillage: "Les partitions deviennent une course : chaque mesure est un pas, le métronome accélère d'un cran."
    C:
      label: Noter la trace
      scene: "Le Livre des traces se pose sur le pupitre ; la porte ne s'ouvre qu'avec une page remplie."
      line: { who: thessaly, text: "Une trace bien notée vaut un chemin." }
      habillage: "Chaque mesure est copiée dans le Livre ; la note manquante est « recopiée » avant d'être jouée."

repliquesAbsurdes:
  - "Excusez-moi, monsieur le Gardien, vous avez du sable sur le nez."
  - "Je réponds si vous me dites votre gâteau préféré."
  - "Mon loup dit que vous êtes mal coiffé. Moi, je n'ai rien dit."
  - "Un, deux, trois, soleil ! Ah zut, vous avez bougé."

days:
  # ─────────────────────────── JOUR 1 ───────────────────────────
  - n: 1
    title: L'arrivée à l'Arche
    decor: Le pont d'un navire-bibliothèque sur une mer de brume. Du sable gris recouvre une partie des étagères.
    opening:
      - { who: narrateur, text: "Écoutez. Il existe, quelque part entre le jour et le rêve, une mer que personne ne trouve sur les cartes : la Mer des Jours. Sur cette mer navigue un navire immense, plus haut qu'une cathédrale, dont les coques et les tours sont faites d'étagères. C'est l'Arche des Savoirs. Elle porte tous les livres du monde, et dans chaque livre dort un souvenir." }
      - { who: narrateur, text: "Ce soir-là, dans trois maisons, trois livres se sont allumés en même temps. Un livre doré, comme le soleil qui se lève. Un livre blanc, comme le plein midi. Un livre rose, comme le ciel du soir. Leurs pages se sont envolées en tourbillon, tels des oiseaux de lumière, et elles ont emporté trois sœurs à travers la nuit." }
      - { who: narrateur, text: "Quand le vent retombe, Axelle, Maelle et Rafaelle se tiennent sur le pont de l'Arche. Le bois craque doucement sous leurs pieds. Des lanternes flottent au-dessus des mâts, et l'air sent le papier ancien, la cire et le sel." }
      - { who: thessaly, text: "Trois lueurs, en un seul soir. Cela n'était plus arrivé depuis des siècles. Je m'appelle Thessaly, Grande Archiviste de l'Arche. Approchez, n'ayez pas peur : ce navire vous attendait." }
      - { who: thessaly, to: axelle, text: "Axelle, ta lanterne est dorée comme le matin. Tu seras la Veilleuse : rien de petit ne t'échappe, ni une graine, ni un secret, ni une étoile." }
      - { who: thessaly, to: maelle, text: "Maelle, ta lanterne est blanche comme le plein jour. Tu seras la Cartographe : les chemins te font confiance, même les plus fous." }
      - { who: thessaly, to: rafaelle, text: "Rafaelle, ta lanterne est rose comme le ciel du soir. Tu seras l'Archiviste : tu sauras lire ce que les anciens ont laissé. Bienvenida, como dicen en el sur." }
      - { who: narrateur, text: "Alors une petite boule de lumière rousse dégringole du grand mât. C'est un renardeau, avec une lanterne dorée accrochée au bout de la queue. Il fait une pirouette, une deuxième… et pouf ! le voilà coupé en trois petits renards de lumière, un sur chaque épaule." }
      - { who: plume, text: "C'est moi le vrai Plume ! — Non, c'est moi ! — Arrêtez, c'est évidemment moi, j'ai la plus belle queue !" }
      - { who: narrateur, text: "Les trois étincelles se chamaillent, puis se changent en compagnons : un lionceau doré pour Axelle, un louveteau gris-bleu pour Maelle, un fauconneau caramel pour Rafaelle. Plume, redevenu un seul renard, fait semblant de n'avoir rien vu." }
      - { who: thessaly, text: "Écoutez-moi bien, maintenant. Depuis quelques nuits, un Brouillard d'Oubli monte de la mer. Là où il passe, les livres se vident et les gens oublient. Du sable gris tombe des étagères, et personne ne sait d'où il vient." }
      - { who: thessaly, text: "Au cœur de l'Arche se trouve la Porte des Trois Lueurs. Si elle s'ouvre, l'Arche reprendra des forces. Mais elle n'obéit qu'à trois clés, trouvées ensemble. Avant cela, le Gardien du Seuil veut savoir ce que vous valez. Montez l'échelle des savoirs, marche après marche." }
    manches:
      - id: m1
        title: L'épreuve d'entrée
        intro: "Chaque apprentie gravit l'échelle des savoirs. Une marche réussie sans aide : on monte d'un cran."
        placement: true
        tours:
          axelle:
            - { id: ch01-j1-ax-p1, subject: maths, level: 1, kind: qcm, prompt: "Complète : 396, 397, …, 399.", choices: ["397", "398", "399", "400", "396"], answer: "398", hint: "On avance de 1 à chaque fois." }
            - { id: ch01-j1-ax-p2, subject: maths, level: 2, kind: ordre, prompt: "Range du plus petit au plus grand.", choices: ["305", "530", "350", "503", "53"], answer: ["53", "305", "350", "503", "530"], hint: "Le nombre qui a le moins de chiffres est le plus petit." }
            - { id: ch01-j1-ax-p3, subject: maths, level: 3, kind: qcm, prompt: "Pose et calcule : 247 + 135.", choices: ["372", "382", "383", "392", "112"], answer: "382", hint: "7 + 5 = 12 : on écrit 2 et on retient 1." }
            - { id: ch01-j1-ax-p4, subject: maths, level: 4, kind: qcm, prompt: "4 caisses de 12 livres. Combien de livres en tout ?", choices: ["36", "44", "48", "52", "16"], answer: "48", hint: "C'est 12 + 12 + 12 + 12." }
            - { id: ch01-j1-ax-p5, subject: maths, level: 5, kind: qcm, prompt: "Partage 36 livres en 4 piles égales. Combien par pile ?", choices: ["8", "9", "10", "12", "4"], answer: "9", hint: "Combien de fois 4 dans 36 ?" }
          maelle:
            - { id: ch01-j1-ma-p1, subject: maths, level: 1, kind: qcm, prompt: "Quel nombre est le plus grand ?", choices: ["304 799", "340 799", "304 798", "340 789", "299 999"], answer: "340 799", hint: "Compare les chiffres des dizaines de mille." }
            - { id: ch01-j1-ma-p2, subject: maths, level: 2, kind: qcm, prompt: "Calcule les 3/4 de 20.", choices: ["5", "10", "15", "16", "20"], answer: "15", hint: "Un quart de 20, c'est 5." }
            - { id: ch01-j1-ma-p3, subject: maths, level: 3, kind: qcm, prompt: "Un spectacle commence à 14 h 45 et dure 1 h 50. Quand finit-il ?", choices: ["15 h 45", "16 h 25", "16 h 35", "16 h 45", "17 h 35"], answer: "16 h 35", clock: "14:45", hint: "Ajoute 1 h, puis 50 minutes : 15 h 45 + 50 min." }
            - { id: ch01-j1-ma-p4, subject: maths, level: 4, kind: qcm, prompt: "Quel est le chiffre des dixièmes dans 52,87 ?", choices: ["2", "5", "7", "8", "52"], answer: "8", hint: "Le chiffre juste après la virgule." }
            - { id: ch01-j1-ma-p5, subject: maths, level: 5, kind: qcm, prompt: "Entre quels nombres entiers se place 7/4 ?", choices: ["entre 0 et 1", "entre 1 et 2", "entre 2 et 3", "entre 3 et 4", "entre 4 et 5"], answer: "entre 1 et 2", hint: "4/4 = 1 et 8/4 = 2." }
          rafaelle:
            - { id: ch01-j1-ra-p1, subject: maths, level: 1, kind: qcm, prompt: "Arrondis 3,68 au dixième.", choices: ["3,6", "3,7", "3,68", "4,0", "3,0"], answer: "3,7", hint: "Regarde le chiffre des centièmes." }
            - { id: ch01-j1-ra-p2, subject: maths, level: 2, kind: qcm, prompt: "Calcule les 2/5 de 35.", choices: ["7", "14", "17", "21", "28"], answer: "14", hint: "Un cinquième de 35, c'est 7." }
            - { id: ch01-j1-ra-p3, subject: maths, level: 3, kind: qcm, prompt: "Calcule 12,5 × 0,1.", choices: ["0,125", "1,2", "1,25", "12,5", "125"], answer: "1,25", hint: "Multiplier par 0,1, c'est diviser par 10." }
            - { id: ch01-j1-ra-p4, subject: maths, level: 4, kind: qcm, prompt: "Calcule (−3) + 5.", choices: ["−8", "−2", "2", "3", "8"], answer: "2", hint: "Pars de −3 et avance de 5 sur la droite graduée." }
            - { id: ch01-j1-ra-p5, subject: maths, level: 5, kind: qcm, prompt: "Calcule 25 % de 80.", choices: ["15", "20", "25", "40", "60"], answer: "20", hint: "25 %, c'est le quart." }
      - id: m2
        title: Le plan de l'Arche
        intro: "Le plan du pont est effacé. Chaque apprentie en rétablit une partie."
        tours:
          axelle:
            - { id: ch01-j1-ax-m2a, subject: maths, level: 2, kind: qcm, prompt: "Le pont est à gauche de la tour. Où est la tour par rapport au pont ?", choices: ["à gauche", "à droite", "devant", "derrière", "au milieu"], answer: "à droite", hint: "Si le pont est à gauche de la tour, la tour est de l'autre côté." }
            - { id: ch01-j1-ax-m2b, subject: maths, level: 2, kind: qcm, prompt: "Les trois chemins mesurent 3 m, 4 m et 5 m. Quelle est la longueur totale, en mètres ?", choices: ["9", "11", "12", "13", "15"], answer: "12", hint: "Ajoute les trois longueurs." }
            - { gen: maths.conversion }
          maelle:
            - { id: ch01-j1-ma-m2a, subject: sciences, level: 2, kind: qcm, prompt: "Le loup-boussole regarde le soleil couchant. Vers où pointe-t-il ?", choices: ["le nord", "le sud", "l'est", "l'ouest", "le nord-est"], answer: "l'ouest", hint: "Le soleil se lève à l'est et se couche à l'ouest." }
            - { id: ch01-j1-ma-m2b, subject: maths, level: 3, kind: qcm, prompt: "Sur le plan, 1 cm = 10 m. Le pont mesure 4,5 cm. Quelle est sa longueur réelle, en mètres ?", choices: ["4,5", "40", "45", "50", "450"], answer: "45", hint: "Chaque centimètre vaut 10 mètres." }
            - { gen: maths.conversion }
          rafaelle:
            - { id: ch01-j1-ra-m2a, subject: maths, level: 2, kind: qcm, prompt: "Le pont fait les 3/4 de 80 m. Combien de mètres ?", choices: ["20", "40", "60", "70", "80"], answer: "60", hint: "Un quart de 80, c'est 20." }
            - { id: ch01-j1-ra-m2b, subject: maths, level: 3, kind: qcm, prompt: "Comment s'appelle la droite formée des points à égale distance des deux tours ?", choices: ["la médiane", "la médiatrice", "la bissectrice", "la diagonale", "la tangente"], answer: "la médiatrice", hint: "Elle coupe le segment en son milieu, à angle droit." }
            - { id: ch01-j1-ra-m2c, subject: maths, level: 4, kind: qcm, prompt: "Calcule le périmètre d'un bassin rond de rayon 5 m (π ≈ 3,14), en mètres.", choices: ["15,7", "25", "31,4", "62,8", "78,5"], answer: "31,4", hint: "Périmètre = 2 × π × rayon." }
      - id: m3
        title: La Salle des Signes
        intro: "Des lettres ont glissé hors des murs. Il faut leur rendre leur sens."
        tours:
          axelle:
            - id: ch01-j1-ax-m3a
              subject: francais
              level: 2
              kind: libre
              validation: soeurs
              read: "Chères apprenties, l'Arche est en danger. Le sable gris couvre les livres. Plume a peur, car il sent quelque chose qu'il connaît. Restez ensemble et suivez les lueurs. Thessaly."
              prompt: "Lis le message de Thessaly à voix haute. Pourquoi Plume tremble-t-il ?"
              hint: "Relis la phrase qui commence par « Plume a peur »."
            - { id: ch01-j1-ax-m3b, subject: francais, level: 3, kind: qcm, prompt: "Conjugue « nous chantons » à l'imparfait.", choices: ["nous chantons", "nous chantions", "nous chantiont", "nous chanterons", "nous chantâmes"], answer: "nous chantions", hint: "À l'imparfait, « nous » se termine par -ions." }
          maelle:
            - { id: ch01-j1-ma-m3a, subject: francais, level: 2, kind: qcm, prompt: "« La louve garde la clé. » Quel est le complément d'objet direct ?", choices: ["la louve", "garde", "la clé", "le loup", "la porte"], answer: "la clé", hint: "La louve garde quoi ?" }
            - { id: ch01-j1-ma-m3b, subject: francais, level: 3, kind: qcm, prompt: "Mets « nous ouvrons la porte » au passé composé.", choices: ["nous avons ouvert la porte", "nous avons ouvrit la porte", "nous avions ouvert la porte", "nous ouvrons la porte", "nous sommes ouvertes la porte"], answer: "nous avons ouvert la porte", hint: "Auxiliaire avoir + participe passé d'ouvrir." }
          rafaelle:
            - { id: ch01-j1-ra-m3a, subject: francais, level: 2, kind: qcm, prompt: "Accorde : « Les apprenties sont (arrivé). »", choices: ["arrivé", "arrivée", "arrivés", "arrivées", "arrivante"], answer: "arrivées", hint: "Avec être, le participe s'accorde avec le sujet : féminin pluriel." }
            - { id: ch01-j1-ra-m3b, subject: francais, level: 3, kind: qcm, prompt: "« Bibliothèque » vient de biblio (livre) et thèque (rangement). Donne un autre mot de la même famille.", choices: ["bibliothèque", "bibliothécaire", "librairie", "lecture", "page"], answer: "bibliothécaire", hint: "Qui travaille dans une bibliothèque ?" }
            - { id: ch01-j1-ra-m3c, subject: espagnol, level: 3, kind: qcm, prompt: "Traduis : « La luz abre la puerta ».", choices: ["la lumière ferme la porte", "la lumière ouvre la fenêtre", "la lumière ouvre la porte", "le soleil ouvre la porte", "la luz abre la puerta"], answer: "la lumière ouvre la porte", hint: "Luz a donné « lucide » et « lumière »." }
      - id: m4
        title: Le Défi du Gardien
        intro: "Une créature de sable bloque l'escalier : le Gardien de l'Oubli du pont."
        tours:
          axelle:
            - { id: ch01-j1-ax-m4a, subject: sciences, level: 2, kind: qcm, prompt: "La glace fond au soleil. Comment s'appelle ce changement ?", choices: ["la condensation", "l'évaporation", "la fusion", "la solidification", "la sublimation"], answer: "la fusion", hint: "Le solide devient liquide." }
            - { id: ch01-j1-ax-m4b, subject: sciences, level: 2, kind: qcm, prompt: "Quels sont les trois états de l'eau ?", choices: ["solide, liquide, gaz", "chaud, tiède, froid", "glace, neige, pluie", "eau, vapeur, glace", "dur, mou, liquide"], answer: "solide, liquide, gaz", hint: "Glace, eau, vapeur." }
            - { id: ch01-j1-ax-m4c, subject: maths, level: 4, kind: qcm, prompt: "Un coffre contient 4 piles de 12 livres. On en retire 9. Combien en reste-t-il ?", choices: ["37", "38", "39", "41", "48"], answer: "39", hint: "4 × 12 = 48, puis enlève 9." }
          maelle:
            - { id: ch01-j1-ma-m4a, subject: sciences, level: 3, kind: qcm, prompt: "Comment séparer du sable, de l'eau et du sel ?", choices: ["filtrer, puis laisser l'eau s'évaporer", "tout faire bouillir", "secouer très fort", "ajouter du sucre", "verser dans un autre verre"], answer: "filtrer, puis laisser l'eau s'évaporer", hint: "Le filtre garde le sable ; le sel reste quand l'eau s'en va." }
            - { id: ch01-j1-ma-m4b, subject: maths, level: 3, kind: qcm, prompt: "L'ombre du cadran a avancé de 20 minutes. Il était 14 h 45 : quelle heure est-il ?", choices: ["14 h 55", "15 h 00", "15 h 05", "15 h 15", "15 h 25"], answer: "15 h 05", clock: "14:45", hint: "14 h 45 + 15 min = 15 h. Il reste 5 minutes." }
          rafaelle:
            - { id: ch01-j1-ra-m4a, subject: sciences, level: 3, kind: qcm, prompt: "Comment séparer l'huile et l'eau ?", choices: ["la décantation", "la dissolution", "la distillation", "l'évaporation", "la filtration"], answer: "la décantation", hint: "On laisse reposer : l'huile remonte." }
            - { id: ch01-j1-ra-m4b, subject: maths, level: 4, kind: qcm, prompt: "L'huile représente 25 % de 80 mL de mélange. Combien de mL d'eau y a-t-il ?", choices: ["20", "40", "55", "60", "65"], answer: "60", hint: "25 % de 80, c'est 20 mL d'huile." }
    pause: "Gardiennes, debout ! Comptez ensemble 10 sauts, ou faites trois pas de danse au rythme de la guitare."
    closing:
      - { who: narrateur, text: "La dernière marche s'illumine. Le Gardien du Seuil, une haute silhouette de pierre et de lierre, incline lentement la tête, puis se dissout en poussière d'étoiles." }
      - { who: narrateur, text: "À sa place tombe un fragment de carte, tiède comme une main. Trois chiffres y brillent, mais ils sont mélangés, comme si quelqu'un avait voulu les cacher." }
      - { who: plume, text: "Ça sent… la maison. Ça sent quelqu'un qui cherche. Je ne sais pas pourquoi je dis ça. Oubliez." }
      - { who: thessaly, text: "Vous avez bien travaillé, toutes les trois. Ce soir, vous dormirez dans la cabine des apprenties, sous les hublots qui regardent les étoiles." }
      - { who: narrateur, text: "Mais avant de s'endormir, Rafaelle remarque une chose étrange : sur l'étagère près de son lit, un livre a perdu tous ses mots. À leur place, il ne reste qu'un fin sable gris." }

  # ─────────────────────────── JOUR 2 ───────────────────────────
  - n: 2
    title: La Salle des Signes
    decor: Une salle ronde aux murs couverts de lettres et de nombres, des chiffres recouverts de sable gris.
    opening:
      - { who: narrateur, text: "Le matin se lève sur la Mer des Jours. Les voiles de l'Arche se gonflent d'un vent doux qui sent l'encre fraîche, et les mouettes de papier tournent autour des mâts." }
      - { who: narrateur, text: "Thessaly guide les trois sœurs dans un escalier en colimaçon qui descend, descend, jusqu'à une porte ronde couverte de chiffres. Derrière elle s'ouvre la Salle des Signes." }
      - { who: narrateur, text: "C'est une salle ronde comme l'intérieur d'une montre. Sur ses murs, des milliers de lettres et de nombres sont gravés dans la pierre. Autrefois, ils brillaient et chantaient. Aujourd'hui, ils sont couverts de sable gris, et ils se sont mélangés comme des feuilles après la tempête." }
      - { who: thessaly, text: "Chaque signe de cette salle a une place. Quand ils sont en ordre, ils forment une clé. Le Brouillard les a mélangés pour que personne ne la retrouve." }
      - { who: thessaly, to: axelle, text: "Axelle, tu vois ce petit chiffre qui tremble là-bas, sous la poussière ? Il attend que quelqu'un le remette à sa place." }
      - { who: plume, text: "Moi, je compte jusqu'à… heu… beaucoup. Après beaucoup, il y a quoi ? Beaucoup-et-demi ?" }
      - { who: maelle, text: "Après beaucoup, il y a « encore plus ». Tout le monde sait ça, Plume." }
      - { who: narrateur, text: "Le louveteau de Maelle pose sa truffe contre le mur et grogne doucement. Sous ses yeux, une rangée de nombres frissonne, comme si elle se réveillait." }
      - { who: thessaly, text: "Le Gardien des Signes vit dans les murs. Il ne se montre qu'à ceux qui savent compter avec patience. Commencez par les suites : elles sont le chemin le plus sûr vers la clé." }
    manches:
      - id: m1
        title: Les suites du mur
        tours:
          axelle:
            - { id: ch01-j2-ax-m1a, subject: maths, level: 2, kind: qcm, prompt: "Complète : 15, 30, 45, …, … (écris les deux nombres).", choices: ["50 65", "55 70", "60 75", "60 70", "65 80"], answer: "60 75", hint: "On ajoute 15 à chaque fois." }
            - { gen: maths.suite, count: 2 }
          maelle:
            - { gen: maths.suite }
            - { gen: maths.comparer }
          rafaelle:
            - { gen: maths.suite }
            - { gen: maths.arrondi }
      - id: m2
        title: Les nombres écrits
        tours:
          axelle:
            - { id: ch01-j2-ax-m2a, subject: maths, level: 2, kind: qcm, prompt: "Quel est le double de 35 ?", choices: ["60", "65", "70", "75", "80"], answer: "70", hint: "35 + 35." }
            - { id: ch01-j2-ax-m2b, subject: maths, level: 2, kind: qcm, prompt: "Quelle est la moitié de 90 ?", choices: ["40", "43", "45", "47", "50"], answer: "45", hint: "Partage 90 en deux parts égales." }
            - { gen: maths.multiplication }
          maelle:
            - { id: ch01-j2-ma-m2a, subject: francais, level: 2, kind: qcm, prompt: "Écris 407 205 en lettres.", choices: ["quarante-sept mille deux cent cinq", "quatre cent sept mille deux cent cinq", "quatre cent sept mille deux cents", "quatre cent soixante-dix-sept mille deux cent cinq", "sept mille quatre cent cinq"], answer: "quatre cent sept mille deux cent cinq", hint: "Lis d'abord les milliers : quatre cent sept mille." }
            - { id: ch01-j2-ma-m2b, subject: maths, level: 4, kind: qcm, prompt: "Écris 23,5 sous forme de fraction décimale.", choices: ["23/10", "235/10", "235/100", "2350/10", "23,5/10"], answer: "235/10", hint: "23,5 = 235 dixièmes." }
          rafaelle:
            - { id: ch01-j2-ra-m2a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 12,5 + 7,75.", choices: ["19,25", "20,2", "20,25", "20,3", "21,25"], answer: "20,25", hint: "Aligne les virgules." }
            - { id: ch01-j2-ra-m2b, subject: espagnol, level: 2, kind: qcm, prompt: "Écris 47 en espagnol.", choices: ["cuarenta y cinco", "cuarenta y ocho", "cuarenta y siete", "cuatro y siete", "setenta y cuatro"], answer: "cuarenta y siete", hint: "40 = cuarenta, 7 = siete." }
      - id: m3
        title: Problèmes de signes
        tours:
          axelle:
            - { id: ch01-j2-ax-m3a, subject: maths, level: 4, kind: qcm, prompt: "Calcule 8 × 6.", choices: ["42", "46", "48", "54", "56"], answer: "48", hint: "8 × 5 = 40, plus 8." }
            - { id: ch01-j2-ax-m3b, subject: maths, level: 4, kind: qcm, prompt: "Combien de dizaines y a-t-il dans 370 ?", choices: ["3", "30", "37", "40", "370"], answer: "37", hint: "Cache le zéro des unités." }
          maelle:
            - { id: ch01-j2-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Les aiguilles montrent 3 h 40. Quelle heure sera-t-il 35 minutes plus tard ?", choices: ["4 h 05", "4 h 10", "4 h 15", "4 h 20", "4 h 25"], answer: "4 h 15", clock: "3:40", hint: "3 h 40 + 20 min = 4 h. Il reste 15 minutes." }
            - { id: ch01-j2-ma-m3b, subject: maths, level: 4, kind: qcm, prompt: "Quel est le chiffre des centièmes dans 8,076 ?", choices: ["0", "6", "7", "8", "76"], answer: "7", hint: "Dixièmes, puis centièmes, puis millièmes." }
          rafaelle:
            - { id: ch01-j2-ra-m3a, subject: maths, level: 4, kind: qcm, prompt: "Calcule (−4) + (−3).", choices: ["−12", "−7", "−1", "1", "7"], answer: "−7", hint: "Deux dettes s'additionnent." }
            - { id: ch01-j2-ra-m3b, subject: maths, level: 5, kind: qcm, prompt: "Un nombre augmenté de 25 % donne 100. Quel est ce nombre ?", choices: ["75", "80", "90", "100", "125"], answer: "80", hint: "Le nombre + son quart = 100." }
      - id: m4
        title: Le Défi du Gardien des Signes
        tours:
          axelle:
            - { gen: maths.addition }
            - { gen: maths.fraction-de }
          maelle:
            - { gen: maths.duree }
            - { gen: maths.fraction-de }
          rafaelle:
            - { gen: maths.multiplication }
            - { gen: maths.fraction-de }
    pause: "Mime ton compagnon : le lion rugit, le loup hurle à la lune, le faucon déploie ses ailes !"
    closing:
      - { who: narrateur, text: "Un à un, les signes reprennent leur place. Le sable gris glisse des murs comme une neige qui fond, et toute la salle se met à briller d'un bleu profond." }
      - { who: narrateur, text: "Au centre, là où les murs se rejoignent, une clé dorée se détache de la pierre et descend lentement, en tournant sur elle-même, jusqu'aux mains d'Axelle." }
      - { who: plume, text: "Une clé ! Je savais qu'elle était là. Enfin… presque. Enfin… j'espérais." }
      - { who: thessaly, text: "La Clé des Signes. Une sur trois. Gardez-la bien : le Brouillard voudra la reprendre." }
      - { who: narrateur, text: "Ce soir-là, Plume reste longtemps éveillé à la proue, à regarder la mer. Sa lanterne clignote, comme si elle cherchait à envoyer un message à quelqu'un, très loin." }
    reward: "la Clé des Signes"

  # ─────────────────────────── JOUR 3 ───────────────────────────
  - n: 3
    title: La Salle des Chemins
    decor: Une rotonde dont le sol est un grand planisphère aux couleurs délavées.
    opening:
      - { who: narrateur, text: "Le troisième jour, l'Arche entre dans un banc de brume si épais que les lanternes des mâts ne sont plus que des points pâles. On n'entend plus que le clapotis de l'eau, et le grincement du bois." }
      - { who: narrateur, text: "Thessaly ouvre une porte de cuivre. Derrière, une immense rotonde : son sol est une carte du monde, peinte il y a mille ans. Mais les couleurs ont pâli, et les chemins qui reliaient les villes se sont effacés, comme des traces de pas dans la neige." }
      - { who: thessaly, text: "Voici la Salle des Chemins. Chaque route que les marins de l'Arche ont suivie est inscrite ici. Si les chemins disparaissent, l'Arche ne saura plus où aller." }
      - { who: thessaly, to: maelle, text: "Maelle, ton louveteau sent déjà le nord, n'est-ce pas ?" }
      - { who: maelle, text: "Il dit que le nord, c'est par là. Ou par là. Il réfléchit. C'est un loup très réfléchi." }
      - { who: narrateur, text: "Le louveteau tourne trois fois sur lui-même, la boussole dorée à son cou s'agite… puis s'arrête net, pointée vers une montagne peinte sur le sol." }
      - { who: plume, text: "Moi aussi, je sens le nord ! Il sent… le fromage. Non, pardon, ça c'est la cuisine." }
      - { who: thessaly, to: rafaelle, text: "Pour redessiner les chemins, il faudra mesurer les distances, calculer les durées et suivre la lumière. Rafaelle, ton fauconneau voit loin : qu'il surveille le plafond." }
      - { who: narrateur, text: "Car là-haut, dans l'ombre de la coupole, quelque chose bouge. Une fine pluie de sable gris tombe sans bruit, grain après grain, sur la carte du monde." }
    manches:
      - id: m1
        title: Le planisphère
        tours:
          axelle:
            - { id: ch01-j3-ax-m1a, subject: histoire-geo, level: 2, kind: qcm, prompt: "Quel océan se trouve à l'ouest de l'Europe ?", choices: ["l'océan Atlantique", "l'océan Pacifique", "l'océan Indien", "l'océan Arctique", "la mer Méditerranée"], answer: "l'océan Atlantique", hint: "C'est l'océan qui borde la France." }
            - { id: ch01-j3-ax-m1b, subject: maths, level: 2, kind: qcm, prompt: "Un trajet dure 30 minutes. Quelle fraction d'heure est-ce ?", choices: ["le quart", "la moitié", "les trois quarts", "le tiers", "le dixième"], answer: "la moitié", hint: "Une heure, c'est 60 minutes." }
          maelle:
            - { id: ch01-j3-ma-m1a, subject: histoire-geo, level: 2, kind: qcm, prompt: "Lequel de ces noms est un océan ?", choices: ["l'Afrique", "l'océan Indien", "l'Amérique", "l'Antarctique", "l'Europe"], answer: "l'océan Indien", hint: "Les continents sont des terres, les océans sont de l'eau." }
            - { id: ch01-j3-ma-m1b, subject: histoire-geo, level: 3, kind: ordre, prompt: "Range du plus ancien au plus récent.", choices: ["Louis XIV", "château fort", "François Ier"], answer: ["château fort", "François Ier", "Louis XIV"], hint: "Le château fort date du Moyen Âge." }
          rafaelle:
            - { id: ch01-j3-ra-m1a, subject: histoire-geo, level: 2, kind: qcm, prompt: "Lequel de ces lieux est un grand foyer de peuplement mondial ?", choices: ["l'Asie de l'Est", "le Sahara", "l'Antarctique", "l'Europe de l'Ouest", "l'Amérique du Sud"], answer: "l'Asie de l'Est", hint: "Pense aux pays les plus peuplés du monde." }
            - id: ch01-j3-ra-m1b
              subject: histoire-geo
              level: 3
              kind: libre
              validation: soeurs
              prompt: "Habiter une métropole : cite deux fonctions importantes d'une très grande ville."
              hint: "Pense aux sièges d'entreprises, aux universités, aux gares et aéroports, aux musées."
      - id: m2
        title: Durées et distances
        tours:
          axelle:
            - { id: ch01-j3-ax-m2a, subject: maths, level: 4, kind: qcm, prompt: "Départ à 9 h, trajet de 1 h 30. À quelle heure arrive-t-on ?", choices: ["10 h 00", "10 h 15", "10 h 30", "10 h 45", "11 h 00"], answer: "10 h 30", clock: "9:00", hint: "9 h + 1 h = 10 h. Ajoute la demi-heure." }
            - { gen: maths.duree }
          maelle:
            - { id: ch01-j3-ma-m2a, subject: maths, level: 4, kind: qcm, prompt: "Un convoi part à 8 h 20 et roule 2 h 45. À quelle heure arrive-t-il ?", choices: ["10 h 05", "10 h 45", "11 h 00", "11 h 05", "11 h 15"], answer: "11 h 05", clock: "8:20", hint: "8 h 20 + 2 h = 10 h 20. Ajoute 45 minutes." }
            - { id: ch01-j3-ma-m2b, subject: maths, level: 4, kind: qcm, prompt: "La route fait 2,5 km. Combien de mètres ?", choices: ["25", "250", "2 500", "25 000", "250 000"], answer: "2 500", hint: "1 km = 1 000 m." }
          rafaelle:
            - { id: ch01-j3-ra-m2a, subject: maths, level: 4, kind: qcm, prompt: "À 12 km/h, quelle distance parcourt-on en 30 minutes, en km ?", choices: ["3", "4", "6", "12", "24"], answer: "6", hint: "30 minutes, c'est la moitié d'une heure." }
            - { id: ch01-j3-ra-m2b, subject: maths, level: 4, kind: qcm, prompt: "3 livres coûtent 12 €. Combien coûtent 5 livres, en euros ?", choices: ["15", "16", "20", "24", "25"], answer: "20", hint: "Cherche d'abord le prix d'un livre." }
      - id: m3
        title: La lumière des chemins
        tours:
          axelle:
            - { id: ch01-j3-ax-m3a, subject: sciences, level: 2, kind: qcm, prompt: "Le matin, le Soleil se lève…", choices: ["à l'est", "à l'ouest", "au nord", "au sud", "au zénith"], answer: "à l'est", hint: "Il se couche à l'ouest." }
            - { gen: maths.conversion }
          maelle:
            - { id: ch01-j3-ma-m3a, subject: sciences, level: 2, kind: qcm, prompt: "À midi, l'ombre d'un bâton est…", choices: ["la plus courte de la journée", "la plus longue de la journée", "invisible", "la plus longue du matin", "toujours la même"], answer: "la plus courte de la journée", hint: "À midi, le Soleil est le plus haut dans le ciel." }
            - { gen: maths.duree }
          rafaelle:
            - { id: ch01-j3-ra-m3a, subject: sciences, level: 3, kind: qcm, prompt: "Pourquoi voit-on un objet qui n'émet pas de lumière ?", choices: ["il renvoie la lumière qu'il reçoit", "il est chaud", "nos yeux envoient de la lumière", "il absorbe toute la lumière", "il crée sa propre lumière"], answer: "il renvoie la lumière qu'il reçoit", hint: "Sans lampe, dans le noir, on ne voit plus le livre." }
            - { gen: maths.conversion }
      - id: m4
        title: Le Défi du Gardien des Chemins
        tours:
          axelle:
            - { gen: maths.multiplication }
            - { gen: maths.ranger }
          maelle:
            - { gen: maths.multiplication }
            - { gen: maths.arrondi }
          rafaelle:
            - { gen: maths.addition }
            - { gen: maths.fraction-de }
    pause: "Boussole humaine : tout le monde se tourne vers le nord… puis vers le sud… puis on tourne sur soi-même !"
    closing:
      - { who: narrateur, text: "Les routes se redessinent sur le sol, une à une, en fils d'argent. Des mers bleues reprennent leur couleur, des forêts verdissent, des montagnes se dressent dans la lumière." }
      - { who: narrateur, text: "Au bout du plus long chemin, là où il touche le bord du monde, une clé blanche brille comme une étoile tombée. Maelle la ramasse : elle est fraîche comme l'eau d'une source." }
      - { who: thessaly, text: "Deux clés. Il en manque une. Et le sable gris continue de tomber… plus vite qu'hier." }
      - { who: plume, text: "Je n'aime pas ce sable. Il me fait penser à… à rien. C'est ça qui est bizarre : il me fait penser à rien du tout." }
      - { who: narrateur, text: "Cette nuit-là, Axelle rêve d'une plage grise et d'une lanterne qui s'éloigne sur l'eau. Quand elle se réveille, elle ne se souvient plus de rien. Seule sa lanterne dorée brille un peu plus fort que d'habitude." }
    reward: "la Clé des Routes"

  # ─────────────────────────── JOUR 4 ───────────────────────────
  - n: 4
    title: La Salle des Âges
    decor: Un couloir en spirale ; chaque tour descend d'une époque.
    opening:
      - { who: narrateur, text: "Le quatrième jour, Thessaly conduit les apprenties vers le cœur le plus ancien de l'Arche. Ici, les couloirs sont si vieux que le bois est devenu pierre, et la pierre est devenue presque transparente." }
      - { who: narrateur, text: "Devant elles s'ouvre un couloir en spirale qui descend dans le noir. À chaque tour, l'air change : il sent d'abord le papier, puis le parchemin, puis l'argile des tablettes, puis la fumée des premiers feux." }
      - { who: thessaly, text: "C'est la Salle des Âges. Chaque tour de la spirale descend d'une époque. Tout en bas dorment les premiers souvenirs des hommes." }
      - { who: thessaly, to: rafaelle, text: "Rafaelle, c'est ici que tu seras la plus précieuse. Tu sauras lire ce que les siècles ont laissé, même quand l'écriture a vieilli." }
      - { who: rafaelle, text: "Si les murs me parlent en latin, je ferai de mon mieux. S'ils parlent en espagnol, ça ira tout seul." }
      - { who: plume, text: "Il fait noir… Ma lanterne fait de son mieux. Elle fait vraiment de son mieux. Vous voulez que je la secoue ?" }
      - { who: narrateur, text: "La lanterne de Plume éclaire des fresques : des chasseurs qui dessinent des bisons, des bâtisseurs qui élèvent des pyramides, des moines qui recopient des livres à la lueur d'une bougie. Tous ont un point commun : ils transmettent ce qu'ils savent." }
      - { who: thessaly, text: "La dernière clé est cachée tout au fond. Mais pour descendre, il faut remettre les époques dans l'ordre. Le Gardien des Âges n'ouvre le passage qu'à ceux qui savent d'où ils viennent." }
      - { who: narrateur, text: "Tout en bas, très loin, quelque chose respire lentement. Une lueur grise monte, puis s'éteint, puis remonte, comme le battement d'un cœur endormi." }
    manches:
      - id: m1
        title: La frise des époques
        tours:
          axelle:
            - { id: ch01-j4-ax-m1a, subject: histoire-geo, level: 2, kind: ordre, prompt: "Range du plus ancien au plus récent.", choices: ["Moyen Âge", "Préhistoire", "Antiquité"], answer: ["Préhistoire", "Antiquité", "Moyen Âge"], hint: "La Préhistoire, c'est avant l'écriture." }
            - { id: ch01-j4-ax-m1b, subject: histoire-geo, level: 2, kind: qcm, prompt: "Le silex taillé vient…", choices: ["d'autrefois", "d'aujourd'hui", "de demain", "d'une usine", "d'un robot"], answer: "d'autrefois", hint: "Les premiers humains taillaient la pierre." }
          maelle:
            - { id: ch01-j4-ma-m1a, subject: histoire-geo, level: 2, kind: qcm, prompt: "Au Moyen Âge, qui travaille la terre du seigneur ?", choices: ["les paysans", "les chevaliers", "les moines", "les seigneurs", "les marchands"], answer: "les paysans", hint: "Ils vivent au village, près du château." }
            - { id: ch01-j4-ma-m1b, subject: histoire-geo, level: 3, kind: qcm, prompt: "Louis XIV (1638-1715) a vécu surtout au…", choices: ["XVIe siècle", "XVIIe siècle", "XVIIIe siècle", "XVe siècle", "XIXe siècle"], answer: "XVIIe siècle", hint: "Les années 1600 forment le XVIIe siècle." }
          rafaelle:
            - { id: ch01-j4-ra-m1a, subject: histoire-geo, level: 2, kind: ordre, prompt: "Range du plus ancien au plus récent.", choices: ["premières écritures", "chasseurs-cueilleurs", "premiers agriculteurs"], answer: ["chasseurs-cueilleurs", "premiers agriculteurs", "premières écritures"], hint: "L'agriculture apparaît au Néolithique, l'écriture plus tard." }
            - { id: ch01-j4-ra-m1b, subject: maths, level: 3, kind: qcm, prompt: "Écris 8 milliards en chiffres.", choices: ["8 000 000", "800 000 000", "8 000 000 000", "80 000 000 000", "8 000 000 000 000"], answer: "8 000 000 000", hint: "Un milliard, c'est 1 suivi de 9 zéros." }
      - id: m2
        title: Les grands nombres des siècles
        tours:
          axelle:
            - { gen: maths.comparer }
            - { gen: maths.suite }
          maelle:
            - { id: ch01-j4-ma-m2a, subject: maths, level: 4, kind: qcm, prompt: "Louis XIV naît en 1638 et meurt en 1715. Quel âge a-t-il à sa mort ?", choices: ["67", "76", "77", "78", "87"], answer: "77", hint: "Calcule 1715 − 1638." }
            - { id: ch01-j4-ma-m2b, subject: maths, level: 4, kind: qcm, prompt: "Une horloge indique 5 h 50. Quelle heure sera-t-il 40 minutes plus tard ?", choices: ["6 h 00", "6 h 10", "6 h 20", "6 h 30", "6 h 40"], answer: "6 h 30", clock: "5:50", hint: "5 h 50 + 10 min = 6 h. Il reste 30 minutes." }
          rafaelle:
            - { id: ch01-j4-ra-m2a, subject: maths, level: 4, kind: qcm, prompt: "Entre −753 et +476, combien d'années s'écoulent ?", choices: ["277", "723", "1228", "1229", "1230"], answer: "1229", hint: "753 ans jusqu'à l'an 0, puis 476 ans." }
            - { gen: maths.comparer }
      - id: m3
        title: Les archives parlent
        tours:
          axelle:
            - id: ch01-j4-ax-m3a
              subject: histoire-geo
              level: 4
              kind: libre
              validation: soeurs
              prompt: "Au Néolithique, les humains deviennent éleveurs. Pourquoi cela change-t-il leur vie ?"
              hint: "Ils n'ont plus besoin de suivre les troupeaux : ils restent au même endroit."
            - { id: ch01-j4-ax-m3b, subject: histoire-geo, level: 2, kind: qcm, prompt: "La bougie servait à…", choices: ["s'éclairer", "téléphoner", "se chauffer les pieds", "voler", "nager"], answer: "s'éclairer", hint: "Avant l'électricité." }
          maelle:
            - { id: ch01-j4-ma-m3a, subject: francais, level: 3, kind: qcm, prompt: "Mets au pluriel : « le vieux château ».", choices: ["le vieux châteaux", "les vieilles châteaux", "les vieux chateaus", "les vieux châteaux", "les vieus châteaux"], answer: "les vieux châteaux", hint: "Les noms en -eau prennent un x au pluriel." }
            - { gen: maths.conversion }
          rafaelle:
            - id: ch01-j4-ra-m3a
              subject: espagnol
              level: 4
              kind: libre
              validation: soeurs
              read: "Los siglos duermen en los libros."
              prompt: "Lis l'inscription en espagnol et explique-la à tes sœurs."
              hint: "Siglos = siècles ; duermen = dorment."
            - { gen: maths.arrondi }
      - id: m4
        title: Le Défi du Gardien des Âges
        tours:
          axelle:
            - { gen: maths.addition }
            - { gen: maths.multiplication }
          maelle:
            - { gen: maths.ranger }
            - { gen: maths.duree }
          rafaelle:
            - { gen: maths.ranger }
            - { gen: maths.multiplication }
    pause: "Statues du temps : quand la musique s'arrête, figez-vous comme une statue antique !"
    closing:
      - { who: narrateur, text: "Au fond de la spirale, la pierre s'ouvre comme une fleur. Une clé rose en sort, encore tiède, gravée de minuscules lettres que seule Rafaelle sait lire : « Celui qui se souvient n'est jamais seul. »" }
      - { who: narrateur, text: "Mais au même instant, un filet de sable gris coule du plafond, puis un autre, puis un troisième. La lueur grise, tout en bas, s'est rapprochée." }
      - { who: plume, text: "Hiii ! … Non, rien. J'ai juste éternué. En criant. Ça arrive à tout le monde." }
      - { who: thessaly, text: "Remontons. Vite, mais sans courir. Le Brouillard sent la peur, mais il ne supporte pas les rires." }
      - { who: narrateur, text: "Alors les trois sœurs remontent la spirale en riant de l'éternuement de Plume, et le sable gris, derrière elles, s'arrête de couler." }
      - { who: thessaly, text: "Demain, nous jouerons pour la Porte. Dormez bien : il vous faudra vos trois voix." }
    reward: "la Clé des Âges"

  # ─────────────────────────── JOUR 5 ───────────────────────────
  - n: 5
    title: Le Concert de la Porte
    decor: Devant la Porte des Trois Lueurs, trois cordes tendues attendent les trois clés.
    opening:
      - { who: narrateur, text: "Le cinquième jour, toute l'Arche retient son souffle. Les livres se taisent sur les étagères, les voiles ne claquent plus, et même la mer semble écouter." }
      - { who: narrateur, text: "Au bout d'un long couloir de colonnes se dresse la Porte des Trois Lueurs. Elle est haute comme trois arbres, sculptée de lianes et de constellations. En son centre, trois serrures attendent : une dorée, une blanche, une rose." }
      - { who: thessaly, text: "Voici la Guitare de l'Arche. Elle a été construite par les premiers Archivistes. Ses cordes ne vibrent que si plusieurs cœurs jouent ensemble." }
      - { who: thessaly, text: "La Porte ne s'ouvre pas à la force. Elle s'ouvre à la musique. Chacune de vous jouera sa mesure, et les trois clés devront sonner ensemble." }
      - { who: thessaly, text: "Souvenez-vous : une mesure dure quatre temps. La ronde dure quatre temps, la blanche deux, la noire un, et la croche un demi-temps." }
      - { who: plume, text: "Moi, je chante faux. Mais très fort. C'est une qualité, non ?" }
      - { who: narrateur, text: "Mais sur le seuil de la Porte, quelque chose attire l'œil de Plume : une trace de sable gris, longue et fine, qui serpente vers le pont. Comme si quelqu'un était venu ici pendant la nuit." }
    manches:
      - id: m1
        title: Les trois partitions
        intro: "Chaque apprentie trouve la note qui manque dans sa mesure."
        tours:
          axelle:
            - { id: ch01-j5-ax-m1a, subject: musique, level: 3, kind: qcm, prompt: "Noire + noire + ? = 4 temps.", choices: ["une ronde", "une blanche", "une croche", "une noire", "deux croches"], answer: "une blanche", hint: "Deux noires font 2 temps. Il en manque 2." }
          maelle:
            - { id: ch01-j5-ma-m1a, subject: musique, level: 3, kind: qcm, prompt: "Blanche + noire + croche + ? = 4 temps.", choices: ["une noire", "une croche", "une blanche", "une ronde", "deux noires"], answer: "une croche", hint: "2 + 1 + 1/2 = 3 et demi. Il manque un demi-temps." }
          rafaelle:
            - { id: ch01-j5-ra-m1a, subject: musique, level: 4, kind: qcm, prompt: "La mesure vaut 1. Blanche = 1/2, noire = 1/4, croche = 1/8. Il y a une blanche, une noire et une croche : quelle fraction manque ?", choices: ["1/4", "1/2", "1/8", "3/8", "7/8"], answer: "1/8", hint: "1/2 + 1/4 + 1/8 = 7/8." }
      - id: m2
        title: Réviser pour ouvrir
        intro: "La Porte tremble : elle redemande une épreuve de chaque jour, au niveau supérieur."
        tours:
          axelle:
