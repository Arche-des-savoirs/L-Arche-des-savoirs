    concert:
      measures:
        axelle: { given: [1, 1], missing: 2, prompt: "Noire, noire, blanche" }
        maelle: { given: [2, 1, 0.5], missing: 0.5, prompt: "Blanche, noire, croche, croche" }
        rafaelle: { given: [2, 1, 0.5], missing: 0.5, prompt: "Blanche, noire, croche, croche" }
    pause: "Danse et guitare : inventez ensemble une phrase de trois mesures et jouez-la !"
    closing:
      - { who: narrateur, text: "La dernière note s'envole. Pendant un instant, il n'y a plus un bruit. Puis les trois serrures s'allument en même temps, dorée, blanche et rose, et la Porte s'ouvre sans un grincement." }
      - { who: narrateur, text: "Derrière elle s'étend le Hall des Cartes. Son plafond est une immense carte du monde qui palpite comme un ciel vivant. Les trois clés s'envolent des mains des filles, se rejoignent dans les airs, et fondent en une seule lanterne." }
      - { who: thessaly, text: "Vous avez joué à trois voix, et la Porte a écouté. C'est la première fois depuis très longtemps qu'elle s'ouvre sans force. Vous êtes désormais apprenties de l'Arche." }
      - { who: narrateur, text: "Thessaly pose sur leurs épaules trois capes bleu nuit, brodées d'étoiles d'or. Elles sont un peu grandes, mais elles sentent la lavande et l'aventure." }
      - { who: plume, text: "Quand vous êtes là, la trace fait moins peur. Mais elle est toujours là. Et elle sent… je ne sais pas. Elle sent quelqu'un de triste." }
      - { who: narrateur, text: "Au même moment, loin à l'avant du navire, le jardin de l'Arche perd sa récolte en une seule nuit. Et dans l'ombre des épis gris, un inconnu observe les lumières, une carte roulée sous le bras." }
    reward: "les Capes d'Apprenties, la Guitare de l'Arche et le premier fragment de la Carte Vivante"
