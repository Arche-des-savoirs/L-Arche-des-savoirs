# Chapitre 16 — Le Grenier aux Lettres Oubliées
# Suite directe du chapitre 15 : la carte vivante mène les sœurs vers un grenier poussiéreux
# accroché au flanc de la montagne, rempli de lettres jamais envoyées. Aucun nouveau
# personnage voisé : le grenier est gardé par Pigeon (déjà établi, voix Sadaltager), messager
# qui n'a jamais pu livrer ces lettres faute de destinataire retrouvé. Décision NON majeure
# (aucune entrée MAJOR ni ORVANE pour ch16) : effets génériques Lien/Courage/Mémoire.

id: ch16
number: 16
act: 2
title: Le Grenier aux Lettres Oubliées
introImage: ch16
scene: grenier-lettres

espagnol:
  - { es: "Esta carta nunca llegó.", fr: "Cette lettre n'est jamais arrivée." }
  - { es: "Vamos a encontrar su destino.", fr: "Nous allons trouver son destinataire." }
  - { es: "El polvo cubre los recuerdos.", fr: "La poussière couvre les souvenirs." }
  - { es: "Cada palabra cuenta una historia.", fr: "Chaque mot raconte une histoire." }
  - { es: "Nunca es tarde para leerla.", fr: "Il n'est jamais trop tard pour la lire." }

decision:
  prompt: "Pigeon dépose devant vous la toute dernière lettre du grenier, jaunie, jamais ouverte, adressée à personne en particulier. « Celle-ci attend depuis plus longtemps que toutes les autres. Qu'en faites-vous ? »"
  options:
    A:
      label: La lire ensemble, à voix haute, toutes les trois
      scene: "Axelle insiste pour que les trois sœurs ouvrent la lettre ensemble, assises en cercle, et la lisent à tour de rôle, une phrase chacune, jusqu'au bout."
      line: { who: pigeon, text: "Une lettre lue à trois voix n'est plus tout à fait une lettre oubliée. Elle devient, enfin, un souvenir partagé." }
      habillage: "Chaque épreuve devient un texte à lire ensemble, phrase après phrase, jusqu'à la toute fin."
    B:
      label: La ranger soigneusement, sans la lire
      scene: "Rafaelle propose de respecter le silence de cette lettre, et de la ranger avec le plus grand soin dans une boîte dédiée, sans jamais l'ouvrir, par respect pour celui ou celle qui ne l'a jamais reçue."
      line: { who: pigeon, text: "Certains silences méritent d'être gardés tels quels. Je vous remercie de comprendre cela mieux que je ne l'espérais." }
      habillage: "Les épreuves deviennent des rangements précis, où chaque chose doit trouver sa juste place."
    C:
      label: Essayer de deviner, ensemble, à qui elle était destinée
      scene: "Maelle examine l'écriture, le papier, le sceau à moitié effacé, et propose à ses sœurs de mener l'enquête ensemble pour deviner, à partir de tous les indices, à qui cette lettre aurait pu être adressée."
      line: { who: pigeon, text: "Personne n'avait pris la peine de chercher, avant vous. Même sans réponse certaine, votre attention vaut, à elle seule, une réponse." }
      habillage: "Les épreuves deviennent des énigmes où il faut assembler des indices pour reconstituer la vérité."

repliquesAbsurdes:
  - "Si une lettre attend depuis cent ans, est-ce qu'elle a le droit de se plaindre qu'on est en retard pour la lire ?"
  - "Mon renard a essayé de manger une enveloppe. Pigeon n'a pas trouvé ça très respectueux envers le courrier."
  - "Est-ce que Pigeon livre aussi les lettres qu'on n'a jamais écrites, ou juste celles qui existent vraiment ?"
  - "Si j'écris une lettre à mon renard, est-ce que Pigeon va vraiment essayer de la lui livrer ?"
  - "On a réveillé un automate la semaine dernière. Un grenier plein de lettres, c'est presque calme, en comparaison."

days:
  # ─────────────────────────── JOUR 1 ───────────────────────────
  - n: 1
    title: Le grenier accroché à la montagne
    decor: Un grenier de bois incliné, accroché à flanc de montagne par de lourdes chaînes, rempli de malles ouvertes débordant de lettres jaunies, certaines encore scellées, d'autres éparpillées par le vent.
    opening:
      - { who: narrateur, text: "La carte vivante mena les trois sœurs jusqu'à un étrange grenier de bois incliné, accroché à la montagne par de lourdes chaînes, dont les fenêtres entrouvertes laissaient échapper des volutes de poussière dorée." }
      - { who: narrateur, text: "À l'intérieur, des malles entières débordaient de lettres jaunies, certaines encore scellées d'un sceau de cire, d'autres éparpillées sur le sol par le vent qui s'engouffrait entre les planches." }
      - { who: rafaelle, text: "Toutes ces lettres... Elles n'ont jamais été envoyées ?" }
      - { who: narrateur, text: "Un battement d'ailes résonna soudain au-dessus d'elles, et un oiseau familier vint se poser sur le rebord d'une malle ouverte." }
      - { who: pigeon, text: "Jamais, petite Archiviste. C'est bien pour cela que je les garde ici, en attendant de trouver, un jour, le bon destinataire pour chacune." }
      - { who: axelle, text: "Pigeon ! On ne pensait pas te retrouver si loin, toi aussi !" }
      - { who: pigeon, text: "Je vais où le courrier m'appelle, petite Veilleuse. Et ce grenier contient le courrier le plus difficile de toute ma carrière : celui que personne n'a jamais pu livrer." }
      - { who: maelle, text: "Pourquoi personne ne les a jamais livrées, alors ?" }
      - { who: pigeon, text: "Parce que leurs destinataires ont disparu, ont déménagé sans laisser d'adresse, ou n'ont tout simplement jamais existé que dans l'imagination de celui qui écrivait. C'est le lot de tout messager, parfois." }
    manches:
      - id: m1
        title: Un grenier accroché par des chaînes
        tours:
          axelle:
            - { id: ch16-j1-ax-m1a, subject: histoire-geo, level: 1, kind: qcm, prompt: "Comment appelle-t-on une personne qui porte des lettres et des messages ?", choices: ["un messager", "un marchand", "un cartographe", "un peseur", "un gardien"], answer: "un messager", hint: "C'est le métier de Pigeon." }
            - { id: ch16-j1-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 8 + 5.", choices: ["11", "12", "13", "14", "15"], answer: "13", hint: "8 + 5 = 8 + 2 + 3." }
          maelle:
            - { id: ch16-j1-ma-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Pourquoi un vieux papier conservé longtemps devient-il souvent jauni ?", choices: ["à cause de la lumière et du temps qui l'oxydent lentement", "parce que le papier est toujours jaune au départ", "parce que la poussière le teint directement", "cela n'a aucune explication connue", "parce que l'encre change la couleur du papier"], answer: "à cause de la lumière et du temps qui l'oxydent lentement", hint: "Pense à l'état des lettres les plus anciennes du grenier." }
            - { id: ch16-j1-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 68 + 57.", choices: ["120", "123", "125", "128", "130"], answer: "125", hint: "68 + 60 − 3." }
          rafaelle:
            - { id: ch16-j1-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi, avant les moyens modernes de communication, une lettre pouvait-elle rester sans réponse pendant des années ?", choices: ["parce que le voyage du courrier était long et incertain", "parce que personne n'écrivait jamais de lettres", "parce que c'était toujours interdit de répondre", "parce que les lettres se perdaient magiquement", "cela n'arrivait jamais autrefois"], answer: "parce que le voyage du courrier était long et incertain", hint: "Pense aux difficultés qu'un messager pouvait rencontrer." }
            - { id: ch16-j1-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 17 × 6.", choices: ["96", "100", "102", "104", "108"], answer: "102", hint: "17 × 6 = 17 × 3 × 2." }
      - id: m2
        title: Pigeon, gardien du grenier
        tours:
          axelle:
            - { id: ch16-j1-ax-m2a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le sujet de « Un battement d'ailes résonna. » ?", choices: ["résonna", "d'ailes", "Un battement d'ailes", "un", "battement"], answer: "Un battement d'ailes", hint: "Qu'est-ce qui résonne ?" }
            - { id: ch16-j1-ax-m2b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 15 − 7.", choices: ["6", "7", "8", "9", "10"], answer: "8", hint: "15 − 5 = 10, puis − 2." }
          maelle:
            - { id: ch16-j1-ma-m2a, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « difficile » dans « le courrier le plus difficile » ?", choices: ["nom", "verbe", "adjectif", "adverbe", "pronom"], answer: "adjectif", hint: "Il décrit le courrier dont parle Pigeon." }
            - { id: ch16-j1-ma-m2b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 315 ÷ 5.", choices: ["58", "61", "63", "65", "68"], answer: "63", hint: "5 × 63 = 315." }
          rafaelle:
            - { id: ch16-j1-ra-m2a, subject: francais, level: 4, kind: qcm, prompt: "« C'est le lot de tout messager, parfois. » : que signifie l'expression « le lot de » dans cette phrase ?", choices: ["la récompense habituelle", "la part difficile qui revient naturellement à quelqu'un", "un jeu de hasard", "un cadeau surprise", "une punition injuste"], answer: "la part difficile qui revient naturellement à quelqu'un", hint: "Pense au contexte : Pigeon parle des lettres jamais livrées." }
            - { id: ch16-j1-ra-m2b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 12² − 90.", choices: ["44", "48", "52", "54", "58"], answer: "54", hint: "144 − 90." }
      - id: m3
        title: Des malles débordantes
        tours:
          axelle:
            - { id: ch16-j1-ax-m3a, subject: maths, level: 1, kind: qcm, prompt: "Il y a 7 malles de lettres, et 3 de plus arrivent. Combien de malles en tout ?", choices: ["8", "9", "10", "11", "12"], answer: "10", hint: "7 + 3." }
            - { id: ch16-j1-ax-m3b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi fermait-on autrefois une lettre avec de la cire fondue et un sceau ?", choices: ["pour la fermer et prouver qu'elle n'avait pas été ouverte en chemin", "pour la rendre plus lourde", "pour qu'elle sente bon", "cela n'avait aucune utilité", "pour la décorer uniquement"], answer: "pour la fermer et prouver qu'elle n'avait pas été ouverte en chemin", hint: "Pense à l'utilité d'un sceau de cire sur une enveloppe." }
          maelle:
            - { id: ch16-j1-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 49 × 3.", choices: ["141", "144", "145", "147", "150"], answer: "147", hint: "50 × 3 − 3." }
            - { id: ch16-j1-ma-m3b, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi un grenier était-il souvent utilisé, autrefois, pour entreposer de vieux objets et documents ?", choices: ["parce qu'il offrait un espace sec et à l'écart pour les conserver", "parce que c'était toujours interdit ailleurs", "parce que les greniers étaient toujours humides", "cela n'avait aucune raison pratique", "parce que personne n'y montait jamais"], answer: "parce qu'il offrait un espace sec et à l'écart pour les conserver", hint: "Pense à l'utilité d'un espace en hauteur, à l'abri." }
          rafaelle:
            - { id: ch16-j1-ra-m3a, subject: maths, level: 4, kind: qcm, prompt: "Résous : 6x + 4 = 40.", choices: ["5", "6", "7", "8", "9"], answer: "6", hint: "6x = 36." }
            - { id: ch16-j1-ra-m3b, subject: francais, level: 3, kind: qcm, prompt: "Conjugue au passé composé : « Le vent (éparpiller) les lettres sur le sol. »", choices: ["a éparpillé", "éparpillait", "éparpillera", "éparpille", "éparpillant"], answer: "a éparpillé", hint: "Passé composé = avoir + participe passé." }
      - id: m4
        title: Premiers pas dans le grenier
        tours:
          axelle:
            - { id: ch16-j1-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 9 × 3.", choices: ["24", "25", "27", "29", "30"], answer: "27", hint: "9 × 3 = 9 + 9 + 9." }
            - { gen: maths.addition }
          maelle:
            - { id: ch16-j1-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 225 − 78.", choices: ["140", "144", "147", "149", "152"], answer: "147", hint: "225 − 80 + 2." }
            - { gen: maths.multiplication }
          rafaelle:
            - { id: ch16-j1-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « Esta carta nunca llegó. »", choices: ["Cette lettre arrive demain.", "Cette lettre n'est jamais arrivée.", "Cette lettre a disparu.", "Cette lettre est trop lourde.", "Cette lettre est fermée."], answer: "Cette lettre n'est jamais arrivée.", hint: "« Nunca llegó » = n'est jamais arrivée." }
            - { gen: maths.fraction-de }
    pause: "Le jeu du courrier silencieux : une sœur mime, sans un mot, la façon dont elle imagine qu'on écrivait une lettre autrefois (plume, cire, sceau) ; les deux autres devinent chaque étape mimée."
    closing:
      - { who: narrateur, text: "Alors que le soleil commençait à décliner derrière les sommets, Pigeon replia soigneusement ses ailes et se posa sur une vieille malle, observant les trois sœurs avec une attention nouvelle." }
      - { who: pigeon, text: "Demain, je vous montrerai les lettres les plus anciennes de ce grenier. Peut-être trouverez-vous, parmi elles, celle que je n'ai jamais réussi à livrer moi-même." }
      - { who: rafaelle, text: "On vous aidera, si on peut. Ça semble important, pour vous." }
      - { who: pigeon, text: "Plus important que vous ne l'imaginez, petite Archiviste. Un messager qui échoue une fois n'oublie jamais vraiment cet échec." }
      - { who: narrateur, text: "En quittant le grenier pour la nuit, Maelle remarqua, dans un coin sombre, une pile de lettres particulièrement épaisse, soigneusement attachée par un ruban rouge délavé." }
    reward: "la découverte du Grenier aux Lettres Oubliées, gardé par Pigeon"
  # ─────────────────────────── JOUR 2 ───────────────────────────
  - n: 2
    title: Les lettres les plus anciennes
    decor: Un coin reculé du grenier où une pile de lettres particulièrement anciennes, attachée par un ruban rouge délavé, repose sur un petit bureau de bois couvert de poussière.
    opening:
      - { who: narrateur, text: "Le lendemain, Pigeon guida les trois sœurs vers le coin reculé du grenier, jusqu'au petit bureau de bois où reposait la pile de lettres attachée par le ruban rouge délavé que Maelle avait remarquée la veille." }
      - { who: pigeon, text: "Celles-ci sont les plus anciennes de tout le grenier. Je les porte avec moi depuis si longtemps que j'en ai presque oublié pourquoi je ne les ai jamais livrées." }
      - { who: axelle, text: "Vous ne vous souvenez même plus pourquoi ?" }
      - { who: pigeon, text: "Je me souviens d'avoir cherché, encore et encore, sans jamais trouver. À force, la recherche elle-même est devenue plus familière que la réponse que je cherchais." }
      - { who: rafaelle, text: "Est-ce qu'on peut lire une de ces lettres, pour essayer de comprendre ?" }
      - { who: pigeon, text: "Je vous en prie. Peut-être qu'un regard neuf verra ce que mes vieux yeux de messager ont fini par ne plus voir." }
      - { who: maelle, text: "Celle-ci parle d'un rendez-vous, au sommet d'une montagne, un jour de pleine lune. Mais elle ne dit pas avec qui." }
      - { who: pigeon, text: "C'est exactement le genre de mystère qui m'a tenu éveillé, nuit après nuit, pendant des années." }
