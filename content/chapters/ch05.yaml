# Chapitre 5 — Le Pigeon et le Câble
# Sources : Plan narratif v2 (message de Thessaly par trois canaux, codé de trois façons ; coupé au milieu d'un nom ; le pigeon lit à l'envers),
# doc « Saison 1, chapitres 2 à 9 » (station de télégraphe, Fil Sans Fin, signal « Je suis vivante », Pigeon-Messager, accroche du Royaume des Ombres),
# Banque d'exercices S1-C5 (questions), doc des variantes (décision : comment répondre à Thessaly ?).
# Les légendes sont racontées par Nilo et par Pigeon, vieil ami de Thessaly.

id: ch05
number: 5
act: 1
title: Le Pigeon et le Câble
introImage: ch05
scene: pigeon-et-cable

espagnol:
  - { es: "La paloma lleva una carta.", fr: "Le pigeon porte une lettre." }
  - { es: "Enciende la luz.", fr: "Allume la lumière." }
  - { es: "El mensaje es secreto.", fr: "Le message est secret." }
  - { es: "Estoy viva.", fr: "Je suis vivante." }
  - { es: "Te escribimos pronto.", fr: "Nous t'écrivons bientôt." }

decision:
  prompt: "Le câble est réparé : vous pouvez enfin répondre à Thessaly. Mais le Brouillard écoute peut-être. Comment lui répondre ?"
  options:
    A:
      label: Un mot de tendresse
      scene: "Le message est doux. Chaque apprentie y ajoute un mot qui réchauffe le câble, et le long du fil, de petites lumières s'allument comme des lucioles."
      line: { who: pigeon, text: "Elle va sourire. Je la connais : elle va sourire jusqu'aux oreilles." }
      habillage: "Le code à déchiffrer est une lettre d'amitié ; le programme fait briller une lampe."
    B:
      label: Un plan audacieux
      scene: "Le message annonce un plan pour la délivrer. Le câble crachote, des étincelles jaillissent : le Brouillard écoute, et il faut faire vite."
      line: { who: thessaly, text: "(une voix entrecoupée, dans le câble) Pas si fort, mes lueurs… pas si fort !" }
      habillage: "Le code est à déchiffrer vite ; le programme doit éteindre une lampe avant la fin."
    C:
      label: Un code prudent
      scene: "Les apprenties inventent un code que le Brouillard ne sait pas lire. Le message part en silence, caché dans une suite de lettres décalées."
      line: { who: plume, text: "Un code, c'est un secret qui marche. Même le Brouillard ne pourra pas le lire." }
      habillage: "Le code est plus complexe (clé de César) ; le programme masque le message."

repliquesAbsurdes:
  - "Monsieur le Fil, vous êtes tout emmêlé. Vous voulez que je vous coiffe ?"
  - "Si je coupe un fil, est-ce que vous dites aïe ? Non ? Tant mieux."
  - "Pigeon, tu lis à l'envers. Alors pour toi, Nilo s'appelle Olin !"
  - "Mon loup dit que l'électricité, ça chatouille. Il a raison ?"
  - "Je réponds si vous jouez une chanson avec vos fils. Comme une harpe !"

days:
  # ─────────────────────────── JOUR 1 ───────────────────────────
  - n: 1
    title: La station
    decor: Une station de télégraphe abandonnée au sommet d'une falaise. Des câbles pendent du toit, une grande antenne rouillée grince dans le vent.
    opening:
      - { who: narrateur, text: "Il était une fois un pigeon qui avait traversé tout le ciel du monde pour porter un seul message. Il s'appelait Pigeon, tout simplement, parce que, disait-il, quand on a un travail important, on n'a pas le temps d'avoir un nom compliqué." }
      - { who: narrateur, text: "Rafaelle le tenait au creux de ses mains. Il était gris et blanc, avec des plumes ébouriffées et un œil orange très vif. Il avait dormi toute la nuit dans le capuchon de sa cape, et au matin, il s'était réveillé en criant." }
      - { who: pigeon, text: "Le message ! Où est le message ? Ah, il est là. Ouf. Bonjour, mesdemoiselles. Je suis un vieil ami de Thessaly. Elle m'a confié l'adresse de la station du Grand Câble. Elle a dit : « Va chercher mes lueurs. Elles sauront réparer. »" }
      - { who: nilo, text: "Un pigeon qui parle. Bon. Après un épouvantail, un loup-boussole et un renard-lanterne, plus rien ne m'étonne." }
      - { who: pigeon, text: "Je ne parle pas, jeune homme. Je roucoule avec des mots. Ce n'est pas pareil." }
      - { who: narrateur, text: "Pigeon les guida jusqu'en haut d'une falaise battue par le vent. Là se dressait une vieille station de télégraphe, une maison de briques rouges avec une antenne immense, rouillée, qui grinçait comme une porte. Des câbles noirs sortaient du toit et filaient dans toutes les directions, au-dessus de la mer et des forêts." }
      - { who: pigeon, text: "Autrefois, ce câble reliait toutes les villes de l'Arche. On pouvait dire bonjour d'un bout du monde à l'autre en un battement d'aile. C'est ici que Thessaly envoyait ses lettres. Mais le Brouillard a coupé le Grand Câble, et depuis, toutes les villes sont seules." }
      - { who: narrateur, text: "À l'intérieur, tout était couvert de poussière. Des lampes éteintes, des manettes, des piles grosses comme des bocaux. Et sur la table, une feuille avec le mode d'emploi, à moitié effacée." }
      - { who: plume, text: "Si on arrive à tout rallumer, peut-être que Thessaly pourra nous parler. Vraiment nous parler. Pas juste une voix dans la canne." }
      - { who: narrateur, text: "Axelle s'approcha d'une grosse lampe de verre. Sa lueur dorée se refléta dedans. Et pendant une seconde, très faiblement, le filament de la lampe sembla frémir." }
    manches:
      - id: m1
        title: Les objets de la station
        intro: "À quoi sert chaque objet ? Il faut le savoir pour tout rallumer."
        tours:
          axelle:
            - { id: ch05-j1-ax-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Pour allumer une lampe, le circuit doit être…", choices: ["fermé", "ouvert", "cassé"], answer: "fermé", hint: "Le courant doit pouvoir faire le tour complet." }
            - { id: ch05-j1-ax-m1b, subject: sciences, level: 2, kind: qcm, prompt: "À quoi sert une pile dans une lampe de poche ?", choices: ["à donner l'énergie", "à faire joli", "à peser lourd"], answer: "à donner l'énergie", hint: "Sans elle, rien ne s'allume." }
          maelle:
            - { id: ch05-j1-ma-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Quel appareil ouvre ou ferme un circuit ?", choices: ["l'interrupteur", "l'ampoule", "le fil"], answer: "l'interrupteur", hint: "On appuie dessus pour allumer la lumière de la chambre." }
            - { id: ch05-j1-ma-m1b, subject: sciences, level: 1, kind: court, prompt: "Cite un matériau isolant (qui ne laisse pas passer le courant).", answer: "plastique", accept: ["le plastique", "bois", "le bois", "verre", "le verre", "caoutchouc", "le caoutchouc", "papier", "carton", "tissu"], hint: "La gaine autour des fils est faite de ce matériau." }
          rafaelle:
            - { id: ch05-j1-ra-m1a, subject: sciences, level: 1, kind: qcm, prompt: "Quelle est l'unité de l'intensité du courant électrique ?", choices: ["l'ampère", "le volt", "le mètre"], answer: "l'ampère", hint: "Elle porte le nom d'un savant français." }
            - { id: ch05-j1-ra-m1b, subject: sciences, level: 2, kind: qcm, prompt: "Une lampe grille et toutes les autres s'éteignent. Le montage est…", choices: ["en série", "en dérivation", "sans pile"], answer: "en série", hint: "Toutes les lampes sont sur une seule boucle." }
      - id: m2
        title: Le mode d'emploi
        tours:
          axelle:
            - { id: ch05-j1-ax-m2a, subject: francais, level: 1, kind: court, prompt: "« Le pigeon vole vers la tour. » Vers quoi vole-t-il ?", answer: "la tour", accept: ["tour", "vers la tour"], hint: "Lis la fin de la phrase." }
            - { id: ch05-j1-ax-m2b, subject: francais, level: 2, kind: nombre, prompt: "« pigeon » : combien de syllabes ?", answer: 2, hint: "Tape dans tes mains : pi – geon." }
          maelle:
            - { id: ch05-j1-ma-m2a, subject: francais, level: 1, kind: court, prompt: "« Le câble grince. » Quel est le verbe ?", answer: "grince", hint: "C'est ce que fait le câble." }
            - { id: ch05-j1-ma-m2b, subject: francais, level: 2, kind: court, prompt: "Conjugue au futur : « Il (envoyer) ».", answer: "il enverra", accept: ["enverra"], hint: "Attention, ce verbe est irrégulier au futur : env…" }
          rafaelle:
            - { id: ch05-j1-ra-m2a, subject: francais, level: 1, kind: qcm, prompt: "« rapidement » : quelle est sa nature ?", choices: ["adverbe", "adjectif", "verbe"], answer: "adverbe", hint: "Il dit comment, et il finit souvent par -ment." }
            - { id: ch05-j1-ra-m2b, subject: francais, level: 3, kind: libre, validation: soeurs, prompt: "Écris un mode d'emploi en trois étapes pour allumer la lampe de la station (d'abord, ensuite, enfin)." }
      - id: m3
        title: Les piles et les lampes
        tours:
          axelle:
            - { id: ch05-j1-ax-m3a, subject: maths, level: 1, kind: nombre, prompt: "Calcule 6 + 5.", answer: 11, hint: "6 + 4 = 10, puis encore 1." }
            - { id: ch05-j1-ax-m3b, subject: maths, level: 1, kind: nombre, prompt: "Calcule 15 − 7.", answer: 8, hint: "15 − 5 = 10, puis encore 2." }
          maelle:
            - { id: ch05-j1-ma-m3a, subject: maths, level: 1, kind: nombre, prompt: "Calcule 9 × 8.", answer: 72, hint: "9 × 8 = 8 × 10 − 8." }
            - { gen: maths.multiplication }
          rafaelle:
            - { id: ch05-j1-ra-m3a, subject: maths, level: 1, kind: nombre, prompt: "Calcule 5,6 × 3.", answer: 16.8, hint: "5 × 3 = 15 et 0,6 × 3 = 1,8." }
            - { id: ch05-j1-ra-m3b, subject: espagnol, level: 2, kind: court, prompt: "Traduis : « el mensaje ».", answer: "le message", accept: ["message"], hint: "Ça ressemble beaucoup au français." }
      - id: m4
        title: Le Défi de la station
        tours:
          axelle:
            - { id: ch05-j1-ax-m4a, subject: maths, level: 2, kind: nombre, prompt: "Calcule 38 + 25.", answer: 63, hint: "38 + 20 = 58, puis + 5." }
            - { gen: maths.comparer }
          maelle:
            - { id: ch05-j1-ma-m4a, subject: maths, level: 2, kind: nombre, prompt: "Calcule 47 × 6.", answer: 282, hint: "40 × 6 = 240 et 7 × 6 = 42." }
            - { gen: maths.ranger }
          rafaelle:
            - { id: ch05-j1-ra-m4a, subject: maths, level: 2, kind: nombre, prompt: "Calcule 3,6 ÷ 0,9.", answer: 4, hint: "C'est comme 36 ÷ 9." }
            - { gen: maths.arrondi }
    pause: "Le courant passe : formez une chaîne en vous tenant la main. La première serre la main de la suivante, qui serre la main de la dernière, de plus en plus vite !"
    closing:
      - { who: narrateur, text: "Quand la dernière réponse fut donnée, Rafaelle abaissa la grande manette de cuivre. Il y eut un claquement sec, une odeur de poussière chaude… et toutes les lampes de la station s'allumèrent d'un coup, jaunes et vibrantes, comme des soleils en bocal." }
      - { who: pigeon, text: "Ça marche ! Ça marche ! Thessaly avait raison. Elle a toujours raison, c'est très agaçant." }
      - { who: narrateur, text: "Mais au-dehors, quelque chose bougea. Les câbles noirs qui pendaient du toit se mirent à onduler, lentement, comme des serpents qui se réveillent. Ils glissèrent sur les murs, s'enroulèrent autour de l'antenne, et formèrent une grande silhouette de fils emmêlés." }
      - { who: fil, text: "Qui ose rallumer ma station ? Je suis le Fil Sans Fin. Le Brouillard m'a donné ce câble. Tous les messages du monde passent par moi, et moi, je les emmêle. Pour que personne ne se comprenne plus jamais." }
      - { who: narrateur, text: "Les apprenties reculèrent d'un pas. Le Fil Sans Fin n'était pas méchant comme un monstre de conte. Il avait l'air surtout fatigué. Fatigué et très emmêlé, comme une pelote qu'un chat aurait jouée pendant cent ans." }
      - { who: plume, text: "N'ayez pas peur. Il n'a pas de dents. Juste des nœuds. Et les nœuds, ça se défait. Patiemment. Un par un." }
      - { who: narrateur, text: "Le Fil Sans Fin se retira dans l'ombre de l'antenne, en grinçant. Et cette nuit-là, Pigeon se percha sur le rebord de la fenêtre, face à la mer, et ne dormit pas. Il attendait un message qui ne venait pas." }
      - { who: narrateur, text: "Rafaelle s'assit à côté de lui, sans rien dire. Au bout d'un moment, Pigeon posa sa petite tête grise contre son épaule. Et ils regardèrent la mer ensemble, jusqu'à ce que les étoiles s'allument." }

  # ─────────────────────────── JOUR 2 ───────────────────────────
  - n: 2
    title: Le tableau des fils
    decor: Un immense tableau de bois couvert de prises, de fils de cuivre et de petites lampes. Certains fils sont gainés, d'autres nus.
    opening:
      - { who: narrateur, text: "Le deuxième jour, au fond de la station, les apprenties découvrirent une porte cachée derrière une vieille tenture. Elle s'ouvrait sur une salle haute comme une chapelle. Et sur le mur du fond, il y avait un tableau immense, couvert de centaines de fils, de prises et de petites lampes éteintes." }
      - { who: pigeon, text: "Le tableau des fils ! C'est ici qu'on décidait où partaient les messages. Une prise pour la Ville de Brume, une pour les Champs, une pour l'Arche… Mais regardez : tout est mélangé." }
      - { who: narrateur, text: "Le Fil Sans Fin était passé par là. Il avait débranché, rebranché, noué et renoué les fils dans tous les sens. Des fils de cuivre brillants pendaient à côté de cordes de chanvre, de rubans de soie, de tiges de bois peintes en cuivre pour tromper l'œil." }
      - { who: nilo, text: "C'est un piège. Il a mélangé les vrais fils et les faux. Ça me rappelle une légende. La légende du fil d'or." }
      - { who: nilo, text: "Autrefois, une tisserande voulait relier son village à celui de son amie, de l'autre côté de la montagne. Elle a essayé avec un fil de laine : le message s'est perdu. Avec un fil de soie : le message s'est endormi. Avec une corde : le message est resté coincé. Puis elle a pris un fil de métal, tout simple, tout fin. Et le message a couru si vite qu'il est arrivé avant même qu'elle ait fini de le dire." }
      - { who: maelle, text: "Alors il faut trouver les fils qui laissent passer le courant. Les conducteurs. Et laisser de côté les autres." }
      - { who: pigeon, text: "Exactement ! Thessaly disait toujours : « Un bon fil, c'est comme un bon ami. Il laisse passer ce qu'on lui confie. »" }
      - { who: mouf, text: "Moi je suis un très bon isolant. Rien ne passe. Ni le courant, ni les leçons, ni les souvenirs. C'est un don." }
      - { who: narrateur, text: "Pigeon se gratta la tête avec sa patte. Puis il lut à voix haute l'étiquette du tableau : « Selbâc sed uaelbat ». Tout le monde le regarda." }
      - { who: rafaelle, text: "Pigeon… tu lis à l'envers. C'est écrit « Tableau des câbles »." }
      - { who: pigeon, text: "Je lis à l'envers depuis que je suis tout petit. C'est très pratique pour les messages secrets, et très gênant pour les menus de restaurant." }
    manches:
      - id: m1
        title: Conducteurs et isolants
        tours:
          axelle:
            - { id: ch05-j2-ax-m1a, subject: sciences, level: 3, kind: qcm, prompt: "Le métal laisse-t-il passer le courant ?", choices: ["oui", "non"], answer: "oui", hint: "Les fils électriques ont un cœur en cuivre." }
            - { id: ch05-j2-ax-m1b, subject: sciences, level: 3, kind: qcm, prompt: "Lequel ne laisse PAS passer le courant ?", choices: ["une règle en plastique", "une clé en fer", "une pièce de monnaie"], answer: "une règle en plastique", hint: "Le plastique protège les fils." }
          maelle:
            - { id: ch05-j2-ma-m1a, subject: sciences, level: 3, kind: qcm, prompt: "Une pile, un fil et une lampe sont reliés en boucle. Le circuit est-il fermé ?", choices: ["oui", "non"], answer: "oui", hint: "Une boucle complète, sans coupure." }
            - { id: ch05-j2-ma-m1b, subject: sciences, level: 2, kind: qcm, prompt: "On met une gomme à la place d'un fil. La lampe…", choices: ["reste éteinte", "brille plus fort", "brille pareil"], answer: "reste éteinte", hint: "La gomme est un isolant." }
          rafaelle:
            - { id: ch05-j2-ra-m1a, subject: sciences, level: 3, kind: qcm, prompt: "Quelles formes d'énergie se succèdent, de la pile à la lampe allumée ?", choices: ["chimique, puis électrique, puis lumineuse", "lumineuse, puis chimique, puis électrique", "électrique, puis chimique, puis sonore"], answer: "chimique, puis électrique, puis lumineuse", hint: "La pile contient des produits chimiques." }
            - { id: ch05-j2-ra-m1b, subject: sciences, level: 2, kind: qcm, prompt: "Pourquoi les fils électriques sont-ils entourés de plastique ?", choices: ["pour isoler et protéger", "pour conduire mieux", "pour être plus lourds"], answer: "pour isoler et protéger", hint: "Le plastique ne laisse pas passer le courant." }
      - id: m2
        title: Les suites du tableau
        tours:
          axelle:
            - { id: ch05-j2-ax-m2a, subject: maths, level: 2, kind: nombre, prompt: "Continue : 10, 20, 30, … Quel nombre vient après ?", answer: 40, hint: "Ajoute 10." }
            - { gen: maths.suite }
          maelle:
            - { id: ch05-j2-ma-m2a, subject: maths, level: 2, kind: nombre, prompt: "Calcule 138 ÷ 6.", answer: 23, hint: "120 ÷ 6 = 20. Reste 18." }
            - { id: ch05-j2-ma-m2b, subject: maths, level: 2, kind: nombre, prompt: "Pigeon vole 25 minutes. Combien de secondes ?", answer: 1500, hint: "1 minute = 60 secondes." }
          rafaelle:
            - { id: ch05-j2-ra-m2a, subject: maths, level: 2, kind: court, prompt: "Calcule 5/6 − 1/3.", answer: "1/2", accept: ["3/6"], hint: "1/3 = 2/6." }
            - { id: ch05-j2-ra-m2b, subject: maths, level: 3, kind: nombre, prompt: "4 messages prennent 6 secondes. Combien de secondes pour 10 messages ?", answer: 15, hint: "1 message = 1,5 seconde." }
      - id: m3
        title: Les instructions du câble
        intro: "Pour rebrancher les fils, il faut suivre des instructions dans le bon ordre."
        tours:
          axelle:
            - { id: ch05-j2-ax-m3a, subject: maths, level: 2, kind: nombre, prompt: "Un robot avance 2, tourne à droite, avance 1. Combien de pas en tout ?", answer: 3, hint: "On ne compte que les pas, pas le tournant." }
            - { id: ch05-j2-ax-m3b, subject: maths, level: 3, kind: nombre, prompt: "Répète 3 fois « avance de 2 ». Quelle distance en tout ?", answer: 6, hint: "2 + 2 + 2." }
          maelle:
            - { id: ch05-j2-ma-m3a, subject: maths, level: 1, kind: nombre, prompt: "« Avance 3, tourne à droite, avance 2 » : combien d'instructions ?", answer: 3, hint: "Compte les ordres, séparés par des virgules." }
            - { id: ch05-j2-ma-m3b, subject: maths, level: 2, kind: nombre, prompt: "« Répéter 5 fois : avancer 2 ». Quelle distance ?", answer: 10, hint: "5 fois 2." }
          rafaelle:
            - { id: ch05-j2-ra-m3a, subject: maths, level: 2, kind: nombre, prompt: "« Répéter 6 fois : avancer 5 ». Quelle distance totale ?", answer: 30, hint: "6 × 5." }
            - { id: ch05-j2-ra-m3b, subject: maths, level: 1, kind: qcm, prompt: "« Répéter 4 fois : avancer 4, tourner de 90° ». Quelle forme est dessinée ?", choices: ["un carré", "un triangle", "un cercle"], answer: "un carré", hint: "4 côtés égaux et 4 angles droits." }
      - id: m4
        title: Le Défi des fils
        tours:
          axelle:
            - { id: ch05-j2-ax-m4a, subject: maths, level: 2, kind: nombre, prompt: "Calcule 60 − 18.", answer: 42, hint: "60 − 20 = 40, puis on rajoute 2." }
            - { id: ch05-j2-ax-m4b, subject: maths, level: 3, kind: nombre, prompt: "Quel nombre est impair : 12, 15 ou 20 ?", answer: 15, hint: "Un nombre impair ne se partage pas en deux parts égales." }
          maelle:
            - { id: ch05-j2-ma-m4a, subject: maths, level: 3, kind: nombre, prompt: "Calcule 3,5 + 2,75.", answer: 6.25, hint: "Écris 3,50 pour aligner les virgules." }
            - { gen: maths.fraction-de }
          rafaelle:
            - { id: ch05-j2-ra-m4a, subject: maths, level: 3, kind: nombre, prompt: "Calcule 40 % de 250.", answer: 100, hint: "10 % = 25." }
            - { id: ch05-j2-ra-m4b, subject: maths, level: 3, kind: nombre, prompt: "Un triangle a deux angles de 50° et 60°. Combien mesure le troisième, en degrés ?", answer: 70, hint: "La somme des angles d'un triangle fait 180°." }
    pause: "Le tableau des fils : une sœur dit « conducteur » ou « isolant ». Pour conducteur, on court sur place ; pour isolant, on se fige comme une statue !"
    closing:
      - { who: narrateur, text: "Un à un, les vrais fils retrouvèrent leur prise. Et à chaque fil rebranché, une petite lampe du tableau s'allumait, rouge, verte ou dorée. Bientôt, le grand tableau brilla comme un ciel d'été plein d'étoiles." }
      - { who: pigeon, text: "La Ville de Brume ! Les Champs ! Et là… là, c'est l'Arche ! Les lignes reviennent. Le monde se reparle !" }
      - { who: narrateur, text: "Depuis la salle, on entendait maintenant de petits crépitements, comme des murmures lointains. C'étaient des messages qui passaient de nouveau dans les fils, après des années de silence. Des « bonjour », des « tu me manques », des recettes de soupe et des nouvelles de bébés." }
      - { who: fil, text: "Vous défaites mes nœuds… Personne n'avait jamais osé. Ça fait… bizarre. Ça fait presque du bien." }
      - { who: nilo, text: "Il a dit « presque du bien ». Je crois qu'il nous aime bien. Un tout petit peu. Comme une chaussette qu'on ne veut pas jeter." }
      - { who: narrateur, text: "Mais une lampe restait éteinte, tout en haut du tableau. Une seule. À côté d'elle, une étiquette usée portait un mot que Pigeon refusa de lire à voix haute. Il se contenta de la regarder, les plumes un peu hérissées." }
      - { who: pigeon, text: "Celle-là, c'est la ligne de Thessaly. Elle ne s'allume pas. Pas encore. Il faudra un code pour l'ouvrir." }
      - { who: narrateur, text: "Cette nuit-là, Axelle rêva de fils d'or qui reliaient toutes les maisons du monde. Au bout de l'un d'eux, quelqu'un tenait une canne d'argent et tirait doucement, comme on tire sur la ficelle d'un cerf-volant. Quand elle se réveilla, la canne de Thessaly était tiède dans sa main." }

  # ─────────────────────────── JOUR 3 ───────────────────────────
  - n: 3
    title: Le code
    decor: Le grenier de la station, plein de carnets, de clés de chiffrement et d'une vieille machine à écrire. Par la lucarne, on voit la mer.
    opening:
      - { who: narrateur, text: "Le troisième jour, un premier message arriva. Mais il n'arriva pas d'une seule façon. Il arriva par trois chemins à la fois, comme si quelqu'un voulait être sûr qu'au moins un des trois parviendrait jusqu'aux apprenties." }
      - { who: narrateur, text: "Le premier chemin, ce fut le câble : une suite de lettres crépita sur la vieille machine à écrire. Le deuxième, ce fut le ciel : un faisceau de lumière clignota sur la mer, long, court, long. Et le troisième, ce fut Pigeon lui-même, qui trouva un petit papier glissé sous son aile pendant la nuit, sans savoir qui l'avait mis là." }
      - { who: pigeon, text: "Trois messages ! Et tous codés. Elle a codé les trois de trois façons différentes. C'est tout Thessaly, ça. Elle ne fait jamais les choses à moitié." }
      - { who: rafaelle, text: "Elle se méfie du Brouillard. S'il intercepte un message, il ne doit pas pouvoir le lire." }
      - { who: nilo, text: "Ça, c'est le métier des voleurs. Et des espions. Et des conteurs. Écoutez la légende du roi qui écrivait à l'envers." }
      - { who: nilo, text: "Il y a très longtemps, un grand roi de l'Antiquité, qui s'appelait César, envoyait des lettres à ses généraux. Mais il avait peur que ses ennemis les lisent. Alors il a eu une idée : il décalait chaque lettre de l'alphabet. Le A devenait D, le B devenait E, et ainsi de suite. Ceux qui connaissaient le secret pouvaient lire. Les autres ne voyaient que du charabia. Et ça, c'est une légende vraie !" }
      - { who: rafaelle, text: "C'est vrai, on l'appelle encore le code de César. Mais Nilo, comment tu sais tout ça, toi, un voleur ?" }
      - { who: nilo, text: "Les voleurs écoutent aux portes. Et derrière les portes, il y a souvent des professeurs. J'ai appris l'Antiquité derrière la porte d'une école. Très instructif. Un peu froid l'hiver." }
      - { who: pigeon, text: "Et moi, je lis à l'envers. C'est aussi un code, si on y pense bien. Un code de pigeon." }
      - { who: axelle, text: "Alors il faut trouver la clé de chaque message. Comme pour une porte." }
      - { who: narrateur, text: "Sur la table du grenier, sous la poussière, il y avait un carnet de cuir. Sur la première page, d'une écriture élégante que les trois sœurs reconnurent tout de suite, quelqu'un avait écrit : « Pour mes lueurs, si un jour elles en ont besoin. » C'était l'écriture de Thessaly." }
    manches:
      - id: m1
        title: La clé des lettres
        intro: "Première clé : chaque lettre a un numéro. A = 1, B = 2, C = 3…"
        tours:
          axelle:
            - { id: ch05-j3-ax-m1a, subject: francais, level: 2, kind: court, prompt: "Avec la clé A = 1, B = 2, C = 3… quelle lettre porte le numéro 3 ?", answer: "C", hint: "A, B, C : la troisième." }
            - { id: ch05-j3-ax-m1b, subject: francais, level: 3, kind: court, prompt: "Décode avec A = 1, B = 2… : 12 – 21 – 14 – 5. (L = 12, U = 21, N = 14, E = 5)", answer: "lune", hint: "Lis les lettres dans l'ordre." }
          maelle:
            - { id: ch05-j3-ma-m1a, subject: francais, level: 3, kind: court, prompt: "Code : chaque lettre avance d'un cran (A devient B). Code le mot « CAB ».", answer: "DBC", hint: "C → D, A → B, B → C." }
            - { id: ch05-j3-ma-m1b, subject: francais, level: 3, kind: court, prompt: "Code : chaque lettre a avancé d'un cran. Décode « FMXFO » en reculant chaque lettre d'un cran.", answer: "ELWEN", hint: "F → E, M → L, X → W…" }
          rafaelle:
            - { id: ch05-j3-ra-m1a, subject: francais, level: 2, kind: court, prompt: "Code de César, décalage de 2 (A devient C). Code le mot « ELWEN ».", answer: "GNYGP", hint: "E → G, L → N, W → Y…" }
            - { id: ch05-j3-ra-m1b, subject: espagnol, level: 3, kind: court, prompt: "Le message caché est en espagnol : « El mensaje es secreto ». Traduis-le.", answer: "Le message est secret", accept: ["le message est secret."], read: "El mensaje es secreto.", hint: "Regarde la phrase du jour." }
      - id: m2
        title: Les signaux de lumière
        intro: "Deuxième message : la lumière clignote, longue ou courte, comme le code Morse."
        tours:
          axelle:
            - { id: ch05-j3-ax-m2a, subject: maths, level: 1, kind: qcm, prompt: "Complète la suite : long, court, long, court, …", choices: ["long", "court"], answer: "long", hint: "Ça alterne." }
            - { id: ch05-j3-ax-m2b, subject: maths, level: 3, kind: nombre, prompt: "Calcule 2 × 8.", answer: 16, hint: "8 + 8." }
          maelle:
            - { id: ch05-j3-ma-m2a, subject: maths, level: 3, kind: qcm, prompt: "En Morse, S = ··· (trois courts) et O = ––– (trois longs). Que veut dire ··· ––– ··· ?", choices: ["SOS", "OSO", "SSO"], answer: "SOS", hint: "Court, long, court : S, O, S." }
            - { id: ch05-j3-ma-m2b, subject: maths, level: 2, kind: court, prompt: "Sur une grille, la lampe est en colonne C, ligne 4. Écris sa case.", answer: "C4", accept: ["C 4", "c4"], hint: "La lettre de la colonne, puis le numéro de la ligne." }
          rafaelle:
            - { id: ch05-j3-ra-m2a, subject: maths, level: 3, kind: qcm, prompt: "« Si x > 5, afficher OUI, sinon afficher NON. » Avec x = 7, que s'affiche-t-il ?", choices: ["OUI", "NON"], answer: "OUI", hint: "7 est-il plus grand que 5 ?" }
            - { id: ch05-j3-ra-m2b, subject: maths, level: 3, kind: nombre, prompt: "a = 4, puis b = a × 3, puis a = b − 2. Que vaut a à la fin ?", answer: 10, hint: "b = 12, puis a = 12 − 2." }
      - id: m3
        title: Le papier sous l'aile
        intro: "Troisième message : le papier de Pigeon. Il faut le lire à voix haute, et à l'endroit !"
        tours:
          axelle:
            - { id: ch05-j3-ax-m3a, subject: francais, level: 2, kind: libre, validation: soeurs, prompt: "Lis à voix haute en marquant bien le point : « Le câble tremble. Plume attend. »", read: "Le câble tremble. Plume attend." }
            - { id: ch05-j3-ax-m3b, subject: francais, level: 3, kind: court, prompt: "« Le pigeon porte le message. » Quel est le verbe ?", answer: "porte", hint: "Que fait le pigeon ?" }
          maelle:
            - { id: ch05-j3-ma-m3a, subject: francais, level: 3, kind: qcm, prompt: "Choisis : « Plume (a / à) vu le pigeon. »", choices: ["a", "à"], answer: "a", hint: "Remplace par « avait » : « Plume avait vu », ça marche." }
            - { id: ch05-j3-ma-m3b, subject: francais, level: 3, kind: court, prompt: "Accorde : « Les fils sont (cassé) ».", answer: "cassés", accept: ["les fils sont cassés"], hint: "Les fils : masculin pluriel." }
          rafaelle:
            - { id: ch05-j3-ra-m3a, subject: francais, level: 3, kind: libre, validation: soeurs, prompt: "Lis avec l'intonation qui convient : « Vite ! Le câble cède ! Tenez bon ! »", read: "Vite ! Le câble cède ! Tenez bon !" }
            - { id: ch05-j3-ra-m3b, subject: francais, level: 3, kind: court, prompt: "« Elle écrit au pigeon. » Quel est le COI ?", answer: "au pigeon", hint: "Elle écrit à qui ?" }
      - id: m4
        title: Le Défi du code
        tours:
          axelle:
            - { id: ch05-j3-ax-m4a, subject: maths, level: 3, kind: nombre, prompt: "Pose et calcule : 57 + 36.", answer: 93, hint: "7 + 6 = 13 : on écrit 3 et on retient 1." }
            - { id: ch05-j3-ax-m4b, subject: maths, level: 3, kind: nombre, prompt: "Pose et calcule : 82 − 47.", answer: 35, hint: "2 − 7, impossible : on emprunte une dizaine." }
          maelle:
            - { id: ch05-j3-ma-m4a, subject: maths, level: 3, kind: nombre, prompt: "Calcule 1/5 de 40.", answer: 8, hint: "Partage 40 en 5." }
            - { id: ch05-j3-ma-m4b, subject: maths, level: 4, kind: nombre, prompt: "x = 3, puis x = x + 2. Que vaut x ?", answer: 5, hint: "On ajoute 2 à l'ancienne valeur." }
          rafaelle:
            - { id: ch05-j3-ra-m4a, subject: maths, level: 4, kind: nombre, prompt: "f(x) = 3x + 1. Calcule f(4).", answer: 13, hint: "3 × 4 + 1." }
            - { id: ch05-j3-ra-m4b, subject: maths, level: 4, kind: nombre, prompt: "Calcule 2⁴ (2 puissance 4).", answer: 16, hint: "2 × 2 × 2 × 2." }
    pause: "Le Morse en mouvement : un bras levé pour un signal court, deux bras pour un signal long. Envoyez S-O-S à vos sœurs !"
    closing:
      - { who: narrateur, text: "Quand les trois messages furent décodés, les apprenties les posèrent côte à côte sur la table. Séparément, ils ne voulaient rien dire. Mais ensemble, ils formaient une seule phrase, écrite de la main de Thessaly." }
      - { who: rafaelle, text: "« L'émetteur est au sommet de l'antenne. Rallumez-le, et je vous parlerai. »" }
      - { who: narrateur, text: "Un silence passa dans le grenier. Puis Axelle se mit à sauter sur place, Maelle à applaudir, et Rafaelle à sourire si fort qu'elle en eut mal aux joues. Thessaly allait leur parler. Pour de vrai." }
      - { who: pigeon, text: "Je vais pleurer. Non, je ne vais pas pleurer. Les pigeons ne pleurent pas. Ils roucoulent très fort, c'est tout." }
      - { who: narrateur, text: "Mais Maelle, elle, regardait encore le mot qu'elle avait décodé un peu plus tôt. FMXFO. ELWEN. Le même nom qui revenait, depuis la Ville de Brume, comme un écho. Elle le montra à Plume." }
      - { who: plume, text: "Elwen… C'est joli. On dirait un nom de… de quelqu'un qu'on attend. Je ne sais pas pourquoi j'ai dit ça." }
      - { who: narrateur, text: "Ce soir-là, le Fil Sans Fin vint s'enrouler doucement autour de la station, sans rien emmêler. Comme un chat qui ronronne contre une porte. Il écoutait, lui aussi." }
      - { who: narrateur, text: "Et quelque part, très loin, au bout du câble, une lumière minuscule clignota trois fois, puis s'éteignit. Seule Axelle la vit. Elle ne dit rien, pour ne pas réveiller les autres. Mais elle s'endormit en souriant." }
    reward: "le Carnet de Codes de Thessaly"

  # ─────────────────────────── JOUR 4 ───────────────────────────
  - n: 4
    title: L'émetteur
    decor: Le sommet de l'antenne, dans le vent et les étoiles. Un émetteur de cuivre et de verre, couvert de cadrans, attend qu'on le réveille.
    opening:
      - { who: narrateur, text: "Le quatrième jour, au coucher du soleil, les apprenties montèrent tout en haut de l'antenne. Il fallait grimper une échelle de fer qui tournait en spirale autour du grand mât, si haut que les nuages passaient sous leurs pieds." }
      - { who: narrateur, text: "Au sommet, sur une petite plateforme battue par le vent, il y avait l'émetteur. Une machine magnifique, en cuivre et en verre, couverte de cadrans, de boutons et d'une grosse ampoule en forme de goutte. Elle dormait, froide et silencieuse." }
      - { who: narrateur, text: "D'en haut, on voyait tout le chemin parcouru depuis l'Arche. Les Champs, tout petits, comme une couverture dorée. La Ville de Brume, avec ses toits pointus. La mer des Jours, et ses vagues qui portaient des lueurs. Tant de route, en si peu de temps. Les trois sœurs n'en revenaient pas." }
      - { who: pigeon, text: "Pour la réveiller, il faut écrire un message parfait. Pas une seule faute, pas un seul mot de trop. Sinon, le Fil Sans Fin l'emmêlera en chemin." }
      - { who: nilo, text: "Un message parfait… ça me rappelle la dernière légende de la station. Celle de la lettre qui a traversé la nuit." }
      - { who: nilo, text: "Il y avait une fois, dans une tempête, un bateau perdu en mer. Le marin n'avait plus de voile, plus de rame, plus d'espoir. Il ne lui restait qu'une lampe et une seule phrase à envoyer. Il a réfléchi longtemps. Puis il a envoyé quatre mots : qui il était, où il était, et qu'il était vivant. Et ces quatre mots ont suffi. Au matin, on l'a retrouvé. Parce qu'un bon message, ce n'est pas un long message. C'est un message clair." }
      - { who: rafaelle, text: "Qui, où, quand. Thessaly nous l'a appris dès le premier jour à l'Arche." }
      - { who: narrateur, text: "Le vent soufflait fort. Les étoiles s'allumaient une à une. Et en bas, enroulé autour du pied de l'antenne, le Fil Sans Fin attendait. Il ne disait rien. Il ne bougeait pas. Mais tout le monde savait qu'il était là." }
      - { who: plume, text: "Chacune écrit un morceau. Et on vérifie ensemble. Comme ça, il n'y aura pas de faute. Parce qu'à trois, on voit trois fois mieux." }
    manches:
      - id: m1
        title: La phrase parfaite
        intro: "Chaque apprentie écrit un morceau du message pour Thessaly."
        tours:
          axelle:
            - { id: ch05-j4-ax-m1a, subject: francais, level: 3, kind: court, prompt: "Recopie sans faute, avec la majuscule et le point : « Nous arrivons bientôt. »", answer: "Nous arrivons bientôt.", hint: "N majuscule, et un point à la fin." }
            - { id: ch05-j4-ax-m1b, subject: francais, level: 3, kind: court, prompt: "Accorde : « Les messages sont (court) ».", answer: "courts", accept: ["les messages sont courts"], hint: "Les messages : plusieurs, donc un s." }
          maelle:
            - { id: ch05-j4-ma-m1a, subject: francais, level: 3, kind: libre, validation: soeurs, prompt: "Écris un message court pour Thessaly qui dit QUI vous êtes, OÙ vous êtes et QUAND vous arrivez." }
            - { id: ch05-j4-ma-m1b, subject: francais, level: 4, kind: court, prompt: "« Plume lit le message. » Quel est le COD ?", answer: "le message", hint: "Plume lit quoi ?" }
          rafaelle:
            - { id: ch05-j4-ra-m1a, subject: francais, level: 3, kind: libre, validation: soeurs, prompt: "Rédige un message de secours d'une dizaine de lignes : ce qui s'est passé, où vous êtes, ce dont vous avez besoin, et ce que vous allez faire." }
            - { id: ch05-j4-ra-m1b, subject: francais, level: 4, kind: court, prompt: "« Il envoie un message qui part au matin. » Écris la proposition relative.", answer: "qui part au matin", hint: "Elle commence par un pronom relatif." }
      - id: m2
        title: Les cadrans de l'émetteur
        tours:
          axelle:
            - { id: ch05-j4-ax-m2a, subject: maths, level: 4, kind: nombre, prompt: "Calcule 7 × 4.", answer: 28, hint: "7 + 7 + 7 + 7." }
            - { id: ch05-j4-ax-m2b, subject: maths, level: 4, kind: nombre, prompt: "« Répéter 4 fois : avancer 3 ». Quelle distance en tout ?", answer: 12, hint: "4 fois 3." }
          maelle:
            - { id: ch05-j4-ma-m2a, subject: maths, level: 3, kind: court, prompt: "Le message part à 13 h 50 et arrive à 14 h 35. Combien de temps a-t-il mis ?", answer: "45 min", accept: ["45", "45 minutes"], clock: "13:50", hint: "De 13 h 50 à 14 h : 10 min. Puis 35 de plus." }
            - { id: ch05-j4-ma-m2b, subject: maths, level: 4, kind: nombre, prompt: "Calcule 132 ÷ 11.", answer: 12, hint: "11 × 12 = 132." }
          rafaelle:
            - { id: ch05-j4-ra-m2a, subject: maths, level: 4, kind: nombre, prompt: "Résous : 2x + 7 = 19.", answer: 6, accept: ["x = 6"], hint: "2x = 12." }
            - { id: ch05-j4-ra-m2b, subject: maths, level: 4, kind: nombre, prompt: "Calcule −6 × 3.", answer: -18, hint: "Un nombre négatif fois un positif donne un négatif." }
      - id: m3
        title: Les priorités du message
        tours:
          axelle:
            - { id: ch05-j4-ax-m3a, subject: francais, level: 4, kind: court, prompt: "Mets au passé composé : « Il envoie. »", answer: "Il a envoyé", accept: ["a envoyé", "il a envoyé."], hint: "Il a…" }
            - { id: ch05-j4-ax-m3b, subject: francais, level: 4, kind: court, prompt: "Un câble, des… ?", answer: "câbles", accept: ["des câbles"], hint: "On ajoute simplement un s." }
          maelle:
            - { id: ch05-j4-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Quel tableau montre le mieux les heures d'arrivée des messages ?", choices: ["un tableau avec une colonne « message » et une colonne « heure »", "une seule ligne avec tout mélangé", "un dessin sans chiffres"], answer: "un tableau avec une colonne « message » et une colonne « heure »", hint: "Une colonne pour chaque information." }
            - { id: ch05-j4-ma-m3b, subject: francais, level: 4, kind: court, prompt: "Conjugue au passé simple : « Ils (lire) ».", answer: "ils lurent", accept: ["lurent"], hint: "Lire au passé simple : il lut, ils…" }
          rafaelle:
            - { id: ch05-j4-ra-m3a, subject: francais, level: 4, kind: qcm, prompt: "« Un câble vivant » : quelle figure de style ?", choices: ["une personnification", "une comparaison", "une répétition"], answer: "une personnification", hint: "On donne une qualité humaine à un objet." }
            - { id: ch05-j4-ra-m3b, subject: espagnol, level: 4, kind: qcm, prompt: "« Ellos envían » : à quel temps ?", choices: ["présent", "futur", "passé"], answer: "présent", hint: "Ils envoient… maintenant." }
      - id: m4
        title: Le dernier interrupteur
        intro: "Les trois apprenties travaillent ensemble sur le dernier interrupteur. Pigeon tient la lampe dans son bec."
        tours:
          axelle:
            - { id: ch05-j4-ax-m4a, subject: maths, level: 4, kind: nombre, prompt: "Calcule 450 + 300.", answer: 750, hint: "4 centaines + 3 centaines." }
            - { id: ch05-j4-ax-m4b, subject: maths, level: 4, kind: nombre, prompt: "Calcule 18 ÷ 3.", answer: 6, hint: "3 × 6 = 18." }
          maelle:
            - { id: ch05-j4-ma-m4a, subject: maths, level: 4, kind: nombre, prompt: "Calcule 6,4 ÷ 8.", answer: 0.8, hint: "64 ÷ 8 = 8, puis place la virgule." }
            - { id: ch05-j4-ma-m4b, subject: sciences, level: 4, kind: qcm, prompt: "« Quand on clique, la lampe s'allume. » Quel est l'événement déclencheur ?", choices: ["le clic", "la lampe", "la lumière"], answer: "le clic", hint: "C'est ce qui se passe en premier." }
          rafaelle:
            - { id: ch05-j4-ra-m4a, subject: maths, level: 3, kind: nombre, prompt: "Combien d'axes de symétrie a un rectangle qui n'est pas un carré ?", answer: 2, hint: "Plie-le dans la longueur, puis dans la largeur." }
            - { id: ch05-j4-ra-m4b, subject: maths, level: 4, kind: nombre, prompt: "Calcule 2,4 × 0,5.", answer: 1.2, hint: "Multiplier par 0,5, c'est prendre la moitié." }
    pause: "L'antenne dans le vent : debout, les bras en l'air, balancez-vous comme une antenne dans la tempête… sans tomber !"
    closing:
      - { who: narrateur, text: "Rafaelle abaissa le dernier interrupteur. L'ampoule en forme de goutte se mit à briller, d'abord timidement, puis de plus en plus fort, jusqu'à éclairer toute la falaise d'une lumière bleue. Les cadrans s'agitèrent. L'émetteur ronronnait." }
      - { who: narrateur, text: "Le message partit dans la nuit. Puis il y eut un long, long silence. Le vent lui-même semblait retenir son souffle. Et soudain, un crépitement. Une voix. Brouillée, lointaine, mais vivante." }
      - { who: thessaly, text: "(une voix, dans l'émetteur) Mes lueurs… je suis vivante. Je suis vivante. Je suis loin, dans un pays où le soleil ne se lève plus. Cherchez… cherchez El—" }
      - { who: narrateur, text: "Et la voix se coupa. Net. Au milieu d'un nom. L'ampoule clignota, puis redevint bleue et silencieuse. Pigeon ouvrit le bec, mais aucun son ne sortit." }
      - { who: axelle, text: "Elle est vivante. Elle l'a dit. Elle l'a dit deux fois." }
      - { who: maelle, text: "« Cherchez El… » El quoi ? Elwen ? C'est Elwen qu'elle voulait dire ?" }
      - { who: pigeon, text: "La ligne a été coupée. Pas par le vent. Par quelque chose qui écoutait. Le Brouillard ne veut pas qu'on entende ce nom-là. Retenez-le bien." }
      - { who: narrateur, text: "Personne ne répondit. Les trois sœurs se serrèrent les unes contre les autres, au sommet de l'antenne, sous les étoiles. Elles pleuraient un peu et riaient un peu, toutes les trois en même temps. Plume, blotti au milieu, ne disait rien. Mais sa lanterne brillait d'une lumière qu'on ne lui avait jamais vue, une lumière couleur de souvenir." }
    reward: "le Cristal de l'Émetteur"

  # ─────────────────────────── JOUR 5 ───────────────────────────
  - n: 5
    title: Le Concert du Câble
    decor: La station illuminée, au petit matin. Le Grand Câble court de l'antenne jusqu'à l'horizon. La Guitare de l'Arche est posée sur la table de la salle des fils.
    opening:
      - { who: narrateur, text: "Le cinquième jour, à l'aube, toute la station bourdonnait comme une ruche. Les lampes brillaient, le tableau des fils clignotait de mille couleurs, et le Grand Câble, enfin réparé, filait de l'antenne jusqu'à l'horizon, au-dessus de la mer." }
      - { who: narrateur, text: "Il fallait maintenant répondre à Thessaly. Et cette fois, pas seulement avec un message : avec un concert. Car le Grand Câble était un instrument, disait Pigeon. Il fallait le faire chanter juste pour que la réponse traverse le monde." }
      - { who: pigeon, text: "Thessaly m'a raconté, un soir, l'histoire de ce câble. Autrefois, les gens de l'Arche ne savaient pas écrire de longues lettres. Alors ils s'envoyaient des chansons. Chaque village avait son rythme. Quand on entendait le rythme dans le câble, on savait qui appelait, avant même d'entendre les mots." }
      - { who: nilo, text: "Et alors ? La fin de l'histoire ?" }
      - { who: pigeon, text: "La fin, c'est que le Brouillard a coupé le câble, et que les villages ont oublié leurs rythmes. Sauf un. Celui de l'Arche. Thessaly l'a gardé dans sa tête pendant toutes ces années. Et elle vous l'a appris, sans vous le dire, dans le Concert de la Porte." }
      - { who: rafaelle, text: "La mélodie du premier jour… Bien sûr. Elle préparait tout, depuis le début." }
      - { who: axelle, text: "Alors on va jouer la musique de l'Arche. Et Thessaly va l'entendre, et elle saura que c'est nous. Même si on ne dit rien." }
      - { who: mouf, text: "Je peux chanter aussi ? Je chante très faux. Mais très fort. Ça compense." }
      - { who: narrateur, text: "Dans un coin de la salle, le Fil Sans Fin s'était roulé en boule. Il n'emmêlait plus rien. Il regardait la Guitare, posée sur la table, et ses fils frémissaient légèrement, comme quelqu'un qui a envie de chanter mais qui n'ose pas." }
      - { who: plume, text: "Avant de jouer, on doit choisir ce qu'on dit à Thessaly. Ensemble. Comme elle nous l'a appris." }
    manches:
      - id: m1
        title: Les trois sections du câble
        intro: "Axelle répare le circuit, Maelle déchiffre le code, Rafaelle corrige le programme. Les trois sections ne s'allument que si tout est juste."
        tours:
          axelle:
            - { id: ch05-j5-ax-m1a, subject: sciences, level: 4, kind: qcm, prompt: "Dans le circuit, quel élément donne l'énergie à la lampe ?", choices: ["la pile", "l'interrupteur", "le fil"], answer: "la pile", hint: "Sans elle, rien ne marche." }
            - { id: ch05-j5-ax-m1b, subject: maths, level: 3, kind: court, prompt: "Le robot doit aller à gauche, mais le code dit « droite ». Quel mot faut-il écrire à la place de « droite » ?", answer: "gauche", accept: ["à gauche"], hint: "C'est le contraire de droite." }
          maelle:
            - { id: ch05-j5-ma-m1a, subject: maths, level: 2, kind: qcm, prompt: "« Si la lampe est éteinte, appuie sur le bouton. » La lampe est éteinte. Que fais-tu ?", choices: ["j'appuie sur le bouton", "je ne fais rien", "je débranche tout"], answer: "j'appuie sur le bouton", hint: "La condition est vraie." }
            - { id: ch05-j5-ma-m1b, subject: maths, level: 5, kind: nombre, prompt: "« Tant que la lampe est éteinte, appuie. » Il faut 3 appuis pour l'allumer. Combien de fois appuie-t-on ?", answer: 3, hint: "On s'arrête dès qu'elle s'allume." }
          rafaelle:
            - { id: ch05-j5-ra-m1a, subject: maths, level: 5, kind: nombre, prompt: "Convertis 101 (écrit en binaire) en nombre décimal.", answer: 5, hint: "1 × 4 + 0 × 2 + 1 × 1." }
            - { id: ch05-j5-ra-m1b, subject: maths, level: 5, kind: nombre, prompt: "Calcule 10⁻² (10 puissance −2).", answer: 0.01, hint: "C'est 1 ÷ 100." }
      - id: m2
        title: Le défi du Grand Câble
        intro: "Pour que le câble porte la réponse jusqu'à Thessaly, chaque apprentie relève un défi de la classe supérieure."
        tours:
          axelle:
            - { id: ch05-j5-ax-m2a, subject: maths, level: 5, kind: nombre, prompt: "Calcule 9 × 6.", answer: 54, hint: "9 × 6 = 10 × 6 − 6." }
            - { id: ch05-j5-ax-m2b, subject: maths, level: 5, kind: nombre, prompt: "Calcule 1 000 − 250.", answer: 750, hint: "1 000 − 200 = 800, puis − 50." }
          maelle:
            - { id: ch05-j5-ma-m2a, subject: maths, level: 5, kind: nombre, prompt: "Calcule 5 − 8.", answer: -3, hint: "On descend en dessous de zéro." }
            - { id: ch05-j5-ma-m2b, subject: francais, level: 4, kind: court, prompt: "Conjugue au conditionnel présent : « Nous (envoyer) ».", answer: "nous enverrions", accept: ["enverrions"], hint: "Radical du futur (enverr-) + -ions." }
          rafaelle:
            - { id: ch05-j5-ra-m2a, subject: maths, level: 5, kind: court, prompt: "Développe (x + 1)(x + 2).", answer: "x² + 3x + 2", accept: ["x^2 + 3x + 2", "x²+3x+2", "x^2+3x+2"], hint: "x × x + x × 2 + 1 × x + 1 × 2." }
            - { id: ch05-j5-ra-m2b, subject: espagnol, level: 3, kind: court, prompt: "Traduis : « La paloma lleva una carta ».", answer: "Le pigeon porte une lettre", accept: ["la colombe porte une lettre", "le pigeon apporte une lettre"], read: "La paloma lleva una carta.", hint: "Paloma = pigeon (ou colombe)." }
      - id: m3
        title: La réponse lue à trois voix
        intro: "Le message final est lu à voix haute par les trois apprenties, chacune sa phrase."
        tours:
          axelle:
            - { id: ch05-j5-ax-m3a, subject: francais, level: 3, kind: libre, validation: soeurs, prompt: "Dis à voix haute ta phrase pour Thessaly. Elle commence par « Thessaly, nous… »." }
          maelle:
            - { id: ch05-j5-ma-m3a, subject: francais, level: 3, kind: libre, validation: soeurs, prompt: "Dis à voix haute ta phrase : où vous allez la chercher, et quand." }
          rafaelle:
            - { id: ch05-j5-ra-m3a, subject: espagnol, level: 3, kind: libre, validation: soeurs, prompt: "Dis en espagnol : « Nous t'écrivons bientôt. » Puis chante-le !", read: "Te escribimos pronto." }
    concert:
      measures:
        axelle: { given: [2, 1], missing: 1, prompt: "Blanche, noire" }
        maelle: { given: [1, 0.5, 0.5], missing: 2, prompt: "Noire, croche, croche" }
        rafaelle: { given: [0.5, 0.5, 2], missing: 1, prompt: "Croche, croche, blanche" }
    pause: "Le message qui voyage : la première chuchote un mot à la deuxième, qui le chuchote à la troisième. Le mot est-il arrivé intact ?"
    closing:
      - { who: narrateur, text: "La Guitare se mit à jouer, et le Grand Câble avec elle. Chaque note courait le long du fil comme une étincelle, au-dessus de la mer, au-dessus des forêts, jusqu'à l'horizon. Et derrière chaque note, le brouillard s'écartait, en longues traînées d'argent." }
      - { who: narrateur, text: "Alors le Fil Sans Fin se déroula, lentement. Tous ses nœuds se défirent d'un coup, avec un long soupir. Et sous les nœuds, il n'y avait plus un monstre : il y avait une simple corde de harpe, dorée, qui vibrait doucement avec la musique." }
      - { who: fil, text: "Je me souviens. Avant, je n'emmêlais pas. Je portais les chansons. C'était… c'était mon métier. Merci, apprenties. Merci de m'avoir démêlé." }
      - { who: narrateur, text: "Pigeon s'approcha des trois sœurs. Il leur fit une grande révérence, l'aile tendue, comme un chevalier devant des reines." }
      - { who: pigeon, text: "À partir d'aujourd'hui, je suis votre messager. Une fois par chapitre, je vous apporterai un mot de Thessaly. Et je vous promets d'essayer de le lire à l'endroit." }
      - { who: narrateur, text: "Ce soir-là, le Cristal de l'Émetteur s'alluma de lui-même. Une carte se dessina dans sa lumière : la direction du signal de Thessaly. Il montrait un pays au-delà des montagnes noires, un pays où, disait-on, le soleil ne se levait plus jamais." }
      - { who: nilo, text: "Le Royaume des Ombres. J'en ai entendu parler. Là-bas, dit-on, les ombres se détachent des gens et vivent leur propre vie. Et elles n'aiment pas beaucoup les visiteurs." }
      - { who: narrateur, text: "Les trois sœurs regardèrent la carte de lumière. Personne n'avait vraiment envie d'aller dans un pays sans soleil. Mais au bout de ce pays, il y avait Thessaly. Alors Axelle prit la canne, Maelle sa boussole, Rafaelle le carnet de codes. Et Pigeon, perché sur l'épaule de Plume, roucoula le signal du départ." }
    reward: "le Pigeon-Messager et un nouveau fragment de la Carte Vivante"
