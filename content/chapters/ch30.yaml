            - { id: ch30-j1-ax-m3a, subject: maths, level: 1, kind: qcm, prompt: "Le Veilleur a gardé des clés pendant 50 ans à la Tour, et encore 3 ans depuis leur dernière rencontre au Tribunal. Combien d'années en tout ?", choices: ["51", "52", "53", "54", "55"], answer: "53", hint: "50 + 3." }
