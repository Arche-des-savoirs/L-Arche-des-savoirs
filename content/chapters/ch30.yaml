            - { id: ch30-j1-ma-m2b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 376 ÷ 4.", choices: ["86", "88", "90", "92", "94"], answer: "94", hint: "4 × 94 = 376." }
          rafaelle:
            - { id: ch30-j1-ra-m2a, subject: francais, level: 4, kind: qcm, prompt: "« Vous l'avez forgée, sans le savoir, à chaque pas de votre voyage. » : que révèle cette phrase sur la clé mystérieuse ?", choices: ["qu'elle s'est construite progressivement, à travers les choix et les actions des sœurs tout au long du récit", "qu'elle existait déjà, achevée, avant même le début du voyage", "qu'elle n'a aucun lien avec les décisions prises par les sœurs", "qu'elle a été fabriquée uniquement par le Veilleur, seul", "qu'elle n'a jamais existé, et que le Veilleur se trompe"], answer: "qu'elle s'est construite progressivement, à travers les choix et les actions des sœurs tout au long du récit", hint: "Repense à ce que dit le Veilleur sur la clé forgée à chaque pas du voyage." }
            - { id: ch30-j1-ra-m2b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 12² − 80.", choices: ["58", "60", "62", "64", "68"], answer: "64", hint: "144 − 80." }
      - id: m3
