    pause: "Le jeu du souvenir résumé : chaque sœur résume, en une seule phrase, l'étape du voyage qui l'a le plus marquée depuis le tout premier chapitre, pour se préparer à la révélation à venir."
    closing:
      - { who: narrateur, text: "Le vent continua de souffler sur le sommet, tandis que le Veilleur observait les trois sœurs avec une tendresse mêlée de gravité, comme s'il mesurait, enfin, tout le chemin qu'elles avaient parcouru." }
      - { who: veilleur, text: "Demain, je vous raconterai ce que cette arche protège depuis si longtemps. Reposez-vous bien, cette nuit, car la suite demandera tout votre cœur." }
      - { who: maelle, text: "On sera prêtes, Veilleur. On l'a toujours été, jusqu'ici." }
      - { who: narrateur, text: "Et tandis que la nuit tombait sur le sommet, les étoiles semblèrent, cette fois, plus proches que jamais, comme si le ciel lui-même se penchait pour assister à ce qui allait suivre." }
    reward: "l'arrivée au sommet, et les retrouvailles avec le Veilleur"
  # ─────────────────────────── JOUR 2 ───────────────────────────
  - n: 2
    title: L'histoire d'Orvane
    decor: Le sommet, au petit matin, où le Veilleur raconte enfin aux trois sœurs l'histoire ancienne qu'il gardait depuis le début de leur voyage.
    opening:
      - { who: narrateur, text: "Le lendemain matin, le Veilleur rassembla les trois sœurs près de l'arche de pierre, et commença enfin à raconter l'histoire qu'il gardait depuis le début de leur voyage." }
      - { who: veilleur, text: "Il y a très longtemps, cette montagne et toutes les terres que vous avez traversées étaient veillées par un esprit ancien, un renard de lumière nommé Orvane." }
      - { who: rafaelle, text: "Un renard de lumière ? Un peu comme Plume, alors ?" }
      - { who: veilleur, text: "Plume lui-même descend d'Orvane, petite Archiviste, même s'il l'ignore encore tout à fait. Orvane est son aîné, son origine, le premier de tous les renards de ce royaume." }
      - { who: axelle, text: "Et pourquoi cet esprit a besoin de nous, exactement ?" }
      - { who: veilleur, text: "Parce que sa lumière, petite Veilleuse, se nourrit des liens, du courage et de la mémoire de ceux qui traversent ces terres. Et ces dernières années, elle s'est beaucoup affaiblie." }
      - { who: maelle, text: "Alors c'est pour ça que notre voyage a tant d'importance, depuis le début." }
      - { who: veilleur, text: "Exactement, petite Cartographe. Chacune de vos décisions, depuis le premier chapitre, a nourri ou affaibli la lumière d'Orvane, sans que vous le sachiez." }
