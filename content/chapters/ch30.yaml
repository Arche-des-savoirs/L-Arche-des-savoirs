            - { gen: maths.comparer }
          maelle:
            - { id: ch30-j4-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 260 − 118.", choices: ["138", "140", "142", "144", "146"], answer: "142", hint: "260 − 120 + 2." }
            - { gen: maths.ranger }
