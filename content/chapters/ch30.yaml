        title: Le sommet, enfin atteint
        tours:
          axelle:
            - { id: ch30-j1-ax-m1a, subject: histoire-geo, level: 1, kind: qcm, prompt: "Comment appelle-t-on le point le plus haut d'une montagne ?", choices: ["le sommet", "la vallée", "la plaine", "le gouffre", "la falaise"], answer: "le sommet", hint: "C'est l'endroit que les trois sœurs atteignent enfin, après tant de chapitres." }
            - { id: ch30-j1-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 7 + 8.", choices: ["13", "14", "15", "16", "17"], answer: "15", hint: "7 + 8 = 7 + 7 + 1." }
          maelle:
            - { id: ch30-j1-ma-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Pourquoi le vent est-il souvent plus fort et plus froid au sommet d'une montagne qu'en bas, dans la vallée ?", choices: ["l'altitude expose davantage aux courants d'air, et la température y baisse généralement", "le vent n'a jamais aucun lien avec l'altitude", "cela n'a aucune explication particulière", "il fait toujours plus chaud au sommet qu'en bas", "l'altitude n'a jamais aucun effet sur la température"], answer: "l'altitude expose davantage aux courants d'air, et la température y baisse généralement", hint: "Pense au vent clair et froid qui balaie le sommet, à l'arrivée des trois sœurs." }
            - { id: ch30-j1-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 64 + 58.", choices: ["118", "120", "122", "124", "126"], answer: "122", hint: "64 + 60 − 2." }
          rafaelle:
            - { id: ch30-j1-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi une arche gravée de symboles anciens et illisibles peut-elle signaler l'importance particulière d'un lieu, dans une histoire ou une légende ?", choices: ["des symboles oubliés suggèrent un savoir ou un rituel très ancien, lié à un moment ou un lieu exceptionnel", "des symboles illisibles n'ont jamais aucune signification particulière", "cela n'a aucune importance narrative", "il est toujours impossible qu'une arche porte un sens caché", "seuls les symboles récents ont une quelconque valeur"], answer: "des symboles oubliés suggèrent un savoir ou un rituel très ancien, lié à un moment ou un lieu exceptionnel", hint: "Pense à l'arche de pierre ancienne, gravée de symboles que nul ne semble plus savoir lire." }
            - { id: ch30-j1-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 17 × 5.", choices: ["75", "80", "82", "85", "88"], answer: "85", hint: "17 × 5 = 17 × 10 ÷ 2." }
