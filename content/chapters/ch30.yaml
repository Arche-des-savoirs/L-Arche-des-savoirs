          maelle:
            - { id: ch30-j1-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 48 × 4.", choices: ["182", "186", "188", "190", "192"], answer: "192", hint: "48 × 4 = 50 × 4 − 2 × 4." }
            - { id: ch30-j1-ma-m3b, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi retrouver, à la toute fin d'un long voyage, un personnage rencontré au tout début, comme le Veilleur, peut-il donner un sentiment particulier de cohérence au récit ?", choices: ["cela crée une boucle narrative, montrant que le début et la fin d'une histoire sont souvent liés", "retrouver un personnage du début n'a jamais aucun effet sur un récit", "cela n'a aucun lien avec la construction d'une histoire", "il vaut toujours mieux ne jamais revoir un personnage rencontré au début", "une telle rencontre finale n'apporte jamais rien de particulier au récit"], answer: "cela crée une boucle narrative, montrant que le début et la fin d'une histoire sont souvent liés", hint: "Pense à l'émotion des trois sœurs, de retrouver le Veilleur, tout en haut de la montagne." }
