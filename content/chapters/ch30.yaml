            - { id: ch30-j2-ax-m3b, subject: maths, level: 2, kind: qcm, prompt: "Calcule 7 × 4.", choices: ["24", "26", "27", "28", "30"], answer: "28", hint: "7 × 4 = 7 × 2 × 2." }
          maelle:
            - { id: ch30-j2-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 288 ÷ 4.", choices: ["68", "70", "72", "74", "76"], answer: "72", hint: "4 × 72 = 288." }
            - { id: ch30-j2-ma-m3b, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi apprendre que chacune de ses décisions a eu une conséquence réelle, même invisible, peut-il changer la façon de regarder son propre parcours ?", choices: ["cela donne un sens rétrospectif à chaque choix, même ceux qui semblaient anodins sur le moment", "apprendre cela n'a jamais aucun effet sur la façon de voir son parcours", "cela n'a aucun lien avec la perception d'un voyage", "il vaut toujours mieux ignorer les conséquences de ses propres décisions", "une telle révélation n'apporte jamais rien de particulier à une histoire personnelle"], answer: "cela donne un sens rétrospectif à chaque choix, même ceux qui semblaient anodins sur le moment", hint: "Pense à la réaction de Maelle, en apprenant que chaque décision a nourri ou affaibli la lumière d'Orvane." }
          rafaelle:
            - { id: ch30-j2-ra-m3a, subject: maths, level: 4, kind: qcm, prompt: "Résous : 8x − 6 = 42.", choices: ["5", "6", "7", "8", "9"], answer: "6", hint: "8x = 48." }
            - { id: ch30-j2-ra-m3b, subject: francais, level: 4, kind: qcm, prompt: "« Chacune de vos décisions a nourri ou affaibli la lumière d'Orvane. » : que révèle cette phrase sur la nature du voyage des sœurs ?", choices: ["que leurs choix successifs ont eu un impact cumulatif et invisible sur un être qu'elles ne connaissaient pas encore", "que leurs décisions n'ont jamais eu aucune conséquence réelle", "qu'Orvane n'a aucun lien avec le voyage des trois sœurs", "que seule la toute dernière décision aura une quelconque importance", "que les décisions passées ne comptent jamais dans un récit"], answer: "que leurs choix successifs ont eu un impact cumulatif et invisible sur un être qu'elles ne connaissaient pas encore", hint: "Relis bien la phrase du Veilleur, sur les décisions qui nourrissent ou affaiblissent la lumière d'Orvane." }
      - id: m4
        title: S'exercer à se souvenir
        tours:
          axelle:
            - { id: ch30-j2-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 6 × 5.", choices: ["25", "27", "28", "30", "32"], answer: "30", hint: "6 × 5 = 6 × 10 ÷ 2." }
            - { gen: maths.comparer }
          maelle:
            - { id: ch30-j2-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 330 − 157.", choices: ["170", "172", "173", "175", "177"], answer: "173", hint: "330 − 160 + 3." }
            - { gen: maths.ranger }
          rafaelle:
            - { id: ch30-j2-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « Cada vínculo lo mantiene con vida. »", choices: ["Chaque lien le maintient en vie.", "Chaque lien l'affaiblit toujours.", "Chaque lien disparaît vite.", "Chaque lien fait peur à Orvane.", "Chaque lien reste invisible."], answer: "Chaque lien le maintient en vie.", hint: "« Lo mantiene con vida » = le maintient en vie." }
            - { gen: maths.duree }
    pause: "Le jeu de la révélation partagée : chaque sœur raconte, en une phrase, ce qu'elle ressent en apprenant que son propre voyage avait, depuis le début, un sens plus grand qu'elle ne l'imaginait."
    closing:
      - { who: narrateur, text: "Le soir venu, les trois sœurs restèrent longuement silencieuses, assises près de l'arche, essayant de mesurer tout ce que cette révélation changeait à leur compréhension du voyage." }
      - { who: veilleur, text: "Demain, je vous conduirai enfin devant Orvane. Préparez-vous, cette nuit, à voir ce que peu de voyageurs ont eu la chance de contempler." }
      - { who: axelle, text: "On sera prêtes, Veilleur. Vraiment prêtes, cette fois." }
      - { who: narrateur, text: "Et tandis que la nuit tombait sur le sommet, une faible lueur argentée sembla percer, l'espace d'un instant, entre les pierres de l'arche ancienne." }
    reward: "l'histoire d'Orvane, révélée par le Veilleur"
  # ─────────────────────────── JOUR 3 ───────────────────────────
  - n: 3
    title: Ce que chaque chemin a construit
    decor: Le sommet, où le Veilleur invite les trois sœurs à se remémorer, ensemble, les grandes étapes de leur voyage, avant de franchir l'arche.
    opening:
      - { who: narrateur, text: "Le troisième jour, le Veilleur invita les trois sœurs à se remémorer, ensemble, les grandes étapes de leur voyage, avant de franchir enfin l'arche ancienne." }
      - { who: veilleur, text: "Repensez à tout ce chemin, petites voyageuses : Nilo retrouvé, Plume découvert, tant de personnages rencontrés, aidés, parfois perdus de vue. Tout cela a un poids, devant Orvane." }
      - { who: maelle, text: "C'est étrange de penser que tout ça compte encore, maintenant, au moment où on arrive enfin au bout." }
      - { who: veilleur, text: "C'est même maintenant que cela compte le plus, petite Cartographe. La fin d'un voyage révèle toujours ce que le voyage, en vérité, a construit." }
      - { who: rafaelle, text: "Et si on avait fait de mauvais choix, en chemin, qu'est-ce qui se serait passé pour Orvane ?" }
      - { who: veilleur, text: "Sa lumière se serait affaiblie davantage, petite Archiviste. Mais rien n'est jamais complètement perdu, tant qu'il reste un dernier geste à faire." }
      - { who: axelle, text: "C'est plutôt rassurant, dit comme ça." }
      - { who: veilleur, text: "C'est voulu, petite Veilleuse. L'espoir, lui aussi, fait partie de ce qui maintient Orvane en vie." }
    manches:
      - id: m1
        title: Se remémorer le chemin
        tours:
          axelle:
            - { id: ch30-j3-ax-m1a, subject: maths, level: 1, kind: qcm, prompt: "Il y a 6 personnages rencontrés durant les premiers chapitres, et 3 de plus durant les derniers. Combien de personnages en tout ?", choices: ["7", "8", "9", "10", "11"], answer: "9", hint: "6 + 3." }
            - { id: ch30-j3-ax-m1b, subject: francais, level: 1, kind: qcm, prompt: "Quel est le contraire de « perdu » (en parlant de vue) ?", choices: ["retrouvé", "oublié", "disparu", "égaré", "effacé"], answer: "retrouvé", hint: "Le contraire de ce qui est arrivé à certains personnages, selon le Veilleur." }
          maelle:
            - { id: ch30-j3-ma-m1a, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi la fin d'un long voyage révèle-t-elle souvent ce que ce voyage a véritablement construit chez ceux qui l'ont vécu ?", choices: ["parce que le recul permet de mesurer l'ensemble des expériences accumulées et leur effet cumulé", "parce que la fin d'un voyage n'a jamais aucun lien avec ce qu'il a construit", "cela n'a aucune explication particulière", "il est toujours impossible de mesurer l'effet d'un voyage sur une personne", "seul le tout début d'un voyage a une quelconque importance"], answer: "parce que le recul permet de mesurer l'ensemble des expériences accumulées et leur effet cumulé", hint: "Pense à ce que dit le Veilleur sur la fin d'un voyage, qui révèle ce qu'il a construit." }
            - { id: ch30-j3-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 87 + 56.", choices: ["138", "140", "142", "143", "145"], answer: "143", hint: "87 + 60 − 4." }
          rafaelle:
            - { id: ch30-j3-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi l'idée que « rien n'est jamais complètement perdu, tant qu'il reste un dernier geste à faire » peut-elle être une leçon précieuse, au-delà de ce récit ?", choices: ["elle rappelle que l'espoir et l'action restent possibles même après des difficultés ou des erreurs passées", "cette idée n'a jamais aucune valeur, dans aucun contexte", "cela n'a aucun lien avec la notion d'espoir", "il vaut toujours mieux considérer une situation comme définitivement perdue", "une telle leçon n'apporte jamais rien de concret à qui l'entend"], answer: "elle rappelle que l'espoir et l'action restent possibles même après des difficultés ou des erreurs passées", hint: "Repense à ce que dit le Veilleur sur l'espoir, qui fait partie de ce qui maintient Orvane en vie." }
            - { id: ch30-j3-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 14 × 6.", choices: ["80", "82", "84", "86", "88"], answer: "84", hint: "14 × 6 = 14 × 3 × 2." }
      - id: m2
        title: Le poids des choix passés
        tours:
          axelle:
            - { id: ch30-j3-ax-m2a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le sujet de « Tout ce chemin a un poids. » ?", choices: ["un poids", "a", "Tout ce chemin", "tout", "chemin"], answer: "Tout ce chemin", hint: "Qu'est-ce qui a un poids, devant Orvane, selon le Veilleur ?" }
            - { id: ch30-j3-ax-m2b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 9 + 7.", choices: ["14", "15", "16", "17", "18"], answer: "16", hint: "9 + 7 = 9 + 9 − 2." }
          maelle:
            - { id: ch30-j3-ma-m2a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 364 ÷ 4.", choices: ["86", "88", "90", "91", "93"], answer: "91", hint: "4 × 91 = 364." }
            - { id: ch30-j3-ma-m2b, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « rassurant » dans « c'est plutôt rassurant » ?", choices: ["nom", "verbe", "adjectif", "adverbe", "pronom"], answer: "adjectif", hint: "Il décrit le sentiment d'Axelle, après les explications du Veilleur." }
          rafaelle:
            - { id: ch30-j3-ra-m2a, subject: maths, level: 5, kind: qcm, prompt: "Calcule 11² − 70.", choices: ["48", "51", "53", "56", "58"], answer: "51", hint: "121 − 70." }
            - { id: ch30-j3-ra-m2b, subject: espagnol, level: 3, kind: qcm, prompt: "Traduis : « El final se escribe juntos. »", choices: ["La fin s'écrit ensemble.", "La fin se cache toujours.", "La fin n'existe jamais.", "La fin se répète souvent.", "La fin fait peur à tous."], answer: "La fin s'écrit ensemble.", hint: "« Se escribe juntos » = s'écrit ensemble." }
      - id: m3
        title: L'espoir qui demeure
        tours:
          axelle:
            - { id: ch30-j3-ax-m3a, subject: maths, level: 1, kind: qcm, prompt: "Calcule 14 − 6.", choices: ["6", "7", "8", "9", "10"], answer: "8", hint: "14 − 6 = 8." }
            - { id: ch30-j3-ax-m3b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi un être symbolique comme Orvane, dont la lumière dépend des actions des voyageurs, représente-t-il bien l'idée que les choix ont des conséquences durables ?", choices: ["parce qu'il incarne de façon sensible et visible l'accumulation des effets, souvent invisibles, de chaque décision", "un tel être n'a jamais aucun lien symbolique avec les conséquences des choix", "cela n'a aucune explication particulière", "les choix n'ont jamais aucune conséquence durable, dans aucun récit", "un être symbolique n'apporte jamais rien à la compréhension d'une histoire"], answer: "parce qu'il incarne de façon sensible et visible l'accumulation des effets, souvent invisibles, de chaque décision", hint: "Pense à ce que représente Orvane, dont la lumière reflète tout le chemin parcouru par les trois sœurs." }
          maelle:
            - { id: ch30-j3-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 46 × 4.", choices: ["178", "182", "184", "186", "190"], answer: "184", hint: "46 × 4 = 50 × 4 − 4 × 4." }
            - { id: ch30-j3-ma-m3b, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi se remémorer ensemble les étapes d'un voyage, juste avant un moment décisif, peut-il aider à mieux affronter ce moment ?", choices: ["parce que cela rassemble la force et la confiance accumulées tout au long du chemin parcouru", "se remémorer un voyage n'a jamais aucune utilité avant un moment décisif", "cela n'a aucun lien avec la préparation d'un moment important", "il vaut toujours mieux oublier complètement le chemin parcouru", "un tel rappel n'apporte jamais rien de concret avant une épreuve"], answer: "parce que cela rassemble la force et la confiance accumulées tout au long du chemin parcouru", hint: "Pense à l'objectif du Veilleur, en invitant les sœurs à se remémorer leur voyage avant de franchir l'arche." }
          rafaelle:
            - { id: ch30-j3-ra-m3a, subject: maths, level: 4, kind: qcm, prompt: "Résous : 7x − 8 = 34.", choices: ["5", "6", "7", "8", "9"], answer: "6", hint: "7x = 42." }
            - { id: ch30-j3-ra-m3b, subject: francais, level: 4, kind: qcm, prompt: "Conjugue au futur simple : « Nous (franchir) cette arche, ensemble, toutes les trois. »", choices: ["nous franchirons", "nous franchissons", "nous franchissions", "nous franchîmes", "nous franchirions"], answer: "nous franchirons", hint: "Futur simple de « franchir »." }
      - id: m4
        title: Comprendre le dernier geste
        tours:
          axelle:
            - { id: ch30-j3-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 9 × 5.", choices: ["40", "42", "44", "45", "48"], answer: "45", hint: "9 × 5 = 9 × 10 ÷ 2." }
            - { gen: maths.suite }
          maelle:
            - { id: ch30-j3-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 295 − 137.", choices: ["150", "154", "156", "158", "160"], answer: "158", hint: "295 − 140 + 3." }
            - { gen: maths.addition }
          rafaelle:
            - { id: ch30-j3-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « El viaje cambia a quien lo vive. »", choices: ["Le voyage change celui qui le vit.", "Le voyage reste toujours pareil.", "Le voyage n'apprend jamais rien.", "Le voyage effraie tout le monde.", "Le voyage prend une minute."], answer: "Le voyage change celui qui le vit.", hint: "« Cambia a quien lo vive » = change celui qui le vit." }
            - { gen: maths.multiplication }
    pause: "Le jeu du souvenir partagé : chaque sœur raconte, en une phrase, le moment du voyage dont elle est le plus fière, pour se préparer, le cœur léger, à franchir l'arche le lendemain."
    closing:
      - { who: narrateur, text: "La soirée se prolongea doucement sur le sommet, entre souvenirs et silences, tandis que la faible lueur argentée, derrière l'arche, semblait répondre, par instants, aux récits des trois sœurs." }
      - { who: veilleur, text: "Demain, enfin, vous franchirez cette arche, et vous verrez Orvane de vos propres yeux. Prenez cette dernière nuit pour vous y préparer, le cœur aussi léger que possible." }
      - { who: rafaelle, text: "On y réfléchira, c'est promis. Merci de nous avoir préparées à ça." }
      - { who: narrateur, text: "Et tandis que les trois sœurs s'installaient pour la nuit, Nilo observait le Veilleur rester encore un long moment près de l'arche, pensif, comme s'il mesurait, lui aussi, le poids de ce qui allait enfin se révéler." }
    reward: "le souvenir rassemblé de tout le voyage parcouru"
  # ─────────────────────────── JOUR 4 ───────────────────────────
  - n: 4
    title: Devant Orvane
    decor: Juste derrière l'arche de pierre, un espace baigné d'une lumière argentée et vacillante, où Orvane, l'antique renard de lumière, attend enfin les trois sœurs.
    opening:
      - { who: narrateur, text: "Le quatrième jour, le Veilleur conduisit enfin les trois sœurs à travers l'arche de pierre, jusqu'à un espace baigné d'une lumière argentée et vacillante." }
      - { who: narrateur, text: "Là, au centre, se tenait Orvane : un immense renard de lumière, aussi ancien que la montagne elle-même, dont l'éclat tremblait doucement, comme une flamme fatiguée par un trop long hiver." }
      - { who: axelle, text: "Il est... magnifique. Et un peu fragile, en même temps, non ?" }
      - { who: veilleur, text: "Exactement cela, petite Veilleuse. Sa lumière reflète tout ce que votre voyage a nourri, ou laissé s'affaiblir, sans que vous le sachiez jusqu'ici." }
      - { who: maelle, text: "Et il reste quelque chose à faire, pour l'aider vraiment, maintenant qu'on est là ?" }
      - { who: veilleur, text: "Un dernier geste, petite Cartographe, avant la décision la plus importante de tout votre voyage. C'est ce que nous préparerons, dans les jours qui viennent." }
      - { who: rafaelle, text: "On est prêtes à faire ce qu'il faut, pour lui." }
      - { who: veilleur, text: "J'en suis certain, petite Archiviste. Vous l'avez prouvé, chapitre après chapitre, depuis le tout début." }
    manches:
      - id: m1
        title: Le renard de lumière
        tours:
          axelle:
            - { id: ch30-j4-ax-m1a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le contraire de « vacillante » (en parlant d'une lumière) ?", choices: ["stable", "tremblante", "fragile", "faible", "incertaine"], answer: "stable", hint: "Le contraire de ce qu'est la lumière d'Orvane, en ce moment." }
            - { id: ch30-j4-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 8 + 6.", choices: ["12", "13", "14", "15", "16"], answer: "14", hint: "8 + 6 = 8 + 8 − 2." }
          maelle:
            - { id: ch30-j4-ma-m1a, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi une décision finale, prise après avoir compris tout l'enjeu d'une situation, est-elle souvent plus réfléchie qu'une décision prise sans aucune information ?", choices: ["parce qu'elle s'appuie sur une compréhension complète de ce qui est en jeu, plutôt que sur une simple impulsion", "parce qu'une décision finale n'a jamais aucun avantage particulier", "cela n'a aucun lien avec la qualité d'une décision", "parce qu'une décision sans information est toujours meilleure", "parce que comprendre une situation retarde toujours inutilement une décision"], answer: "parce qu'elle s'appuie sur une compréhension complète de ce qui est en jeu, plutôt que sur une simple impulsion", hint: "Pense à tout ce que le Veilleur a expliqué aux sœurs sur Orvane, avant cette rencontre." }
            - { id: ch30-j4-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 92 + 59.", choices: ["146", "148", "150", "151", "153"], answer: "151", hint: "92 + 60 − 1." }
          rafaelle:
            - { id: ch30-j4-ra-m1a, subject: francais, level: 4, kind: qcm, prompt: "« Vous l'avez prouvé, chapitre après chapitre, depuis le tout début. » : que révèle cette phrase sur le regard du Veilleur envers les trois sœurs ?", choices: ["qu'il reconnaît en elles une constance et une valeur démontrées tout au long du récit", "qu'il doute profondément de leur capacité à agir correctement", "qu'il n'a jamais observé leur comportement durant le voyage", "qu'il considère leur voyage comme sans aucune valeur", "qu'il préfère ignorer tout ce qu'elles ont accompli jusqu'ici"], answer: "qu'il reconnaît en elles une constance et une valeur démontrées tout au long du récit", hint: "Repense à la confiance exprimée par le Veilleur envers les trois sœurs, à la fin de cette scène." }
            - { id: ch30-j4-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 13² − 100.", choices: ["59", "63", "66", "69", "73"], answer: "69", hint: "169 − 100." }
      - id: m2
        title: Fragile et magnifique
        tours:
          axelle:
            - { id: ch30-j4-ax-m2a, subject: maths, level: 1, kind: qcm, prompt: "Calcule 15 − 8.", choices: ["6", "7", "8", "9", "10"], answer: "7", hint: "15 − 5 = 10, puis − 3." }
            - { id: ch30-j4-ax-m2b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi une flamme qui vacille, comme celle d'Orvane, est-elle souvent utilisée comme image pour représenter une vie fragile ou menacée ?", choices: ["une flamme instable évoque visuellement le risque de s'éteindre, comme une vie en danger", "une flamme vacillante n'a jamais aucun lien symbolique avec la fragilité", "cela n'a aucune explication particulière", "une flamme stable représente toujours mieux la fragilité qu'une flamme vacillante", "une image de flamme n'apporte jamais rien à la compréhension d'un récit"], answer: "une flamme instable évoque visuellement le risque de s'éteindre, comme une vie en danger", hint: "Pense à la lumière d'Orvane, comparée à une flamme fatiguée par un trop long hiver." }
          maelle:
            - { id: ch30-j4-ma-m2a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 351 ÷ 3.", choices: ["107", "111", "115", "117", "119"], answer: "117", hint: "3 × 117 = 351." }
            - { id: ch30-j4-ma-m2b, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « certaine » dans « j'en suis certaine » ?", choices: ["nom", "adjectif", "verbe", "adverbe", "pronom"], answer: "adjectif", hint: "Il décrit la confiance exprimée par le Veilleur." }
          rafaelle:
            - { id: ch30-j4-ra-m2a, subject: maths, level: 5, kind: qcm, prompt: "Calcule 8² + 2 × 10.", choices: ["74", "78", "82", "84", "88"], answer: "84", hint: "64 + 20." }
            - { id: ch30-j4-ra-m2b, subject: espagnol, level: 2, kind: qcm, prompt: "Comment dit-on « Le sommet garde un secret ancien » en espagnol ?", choices: ["La cumbre guarda un secreto antiguo.", "El zorro vigila desde siempre.", "Cada vínculo lo mantiene con vida.", "El final se escribe juntos.", "El viaje cambia a quien lo vive."], answer: "La cumbre guarda un secreto antiguo.", hint: "Relis la phrase du jour 1." }
      - id: m3
        title: Se préparer au dernier geste
        tours:
          axelle:
            - { id: ch30-j4-ax-m3a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le sujet de « Le Veilleur conduisit les trois sœurs. » ?", choices: ["les trois sœurs", "conduisit", "Le Veilleur", "le", "Veilleur"], answer: "Le Veilleur", hint: "Qui conduit les trois sœurs à travers l'arche ?" }
            - { id: ch30-j4-ax-m3b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 11 − 5.", choices: ["5", "6", "7", "8", "9"], answer: "6", hint: "11 − 5 = 6." }
          maelle:
            - { id: ch30-j4-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 29 × 4.", choices: ["108", "112", "114", "116", "120"], answer: "116", hint: "30 × 4 − 4." }
            - { id: ch30-j4-ma-m3b, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi prendre le temps de se préparer, ensemble, avant un moment décisif, comme le dernier geste envers Orvane, peut-il en améliorer l'issue ?", choices: ["parce que cela permet d'aborder le moment avec plus de clarté, de calme et de détermination", "se préparer avant un moment décisif n'a jamais aucune utilité", "cela n'a aucun lien avec la réussite d'un moment important", "il vaut toujours mieux agir sans aucune préparation", "une préparation collective n'apporte jamais rien à un moment décisif"], answer: "parce que cela permet d'aborder le moment avec plus de clarté, de calme et de détermination", hint: "Pense à l'objectif du Veilleur, en annonçant qu'il faudra préparer ce dernier geste, dans les jours qui viennent." }
          rafaelle:
            - { id: ch30-j4-ra-m3a, subject: maths, level: 4, kind: qcm, prompt: "Résous : 4x + 11 = 35.", choices: ["4", "5", "6", "7", "8"], answer: "6", hint: "4x = 24." }
            - { id: ch30-j4-ra-m3b, subject: francais, level: 4, kind: qcm, prompt: "« Il est magnifique, et un peu fragile, en même temps. » : quelle figure de style relie ici « magnifique » et « fragile » ?", choices: ["une opposition", "une comparaison", "une énumération", "une répétition", "une personnification"], answer: "une opposition", hint: "Les deux qualités semblent contraires, et pourtant coexistent chez Orvane." }
      - id: m4
        title: Un moment suspendu
        tours:
          axelle:
