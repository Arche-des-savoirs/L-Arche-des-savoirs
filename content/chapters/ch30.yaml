# Chapitre 30 — Le Sommet et le Veilleur d'Orvane
# Chapitre MAJEUR, dernier du récit. Réutilise le Veilleur (voix Iapetus, introduit au
# chapitre 3, réapparu brièvement au chapitre 9). Révélation finale : le Veilleur est le
# gardien d'Orvane, l'antique esprit-renard du royaume, dont la vitalité dépend de tout le
# chemin parcouru par les trois sœurs. Décision MAJEURE reflétant l'effet ORVANE [2, -1, 1]
# de decisions.ts : A = orvane +2, B = orvane -1, C = orvane +1. Ce chapitre ne couvre que sa
# première partie (le texte, la révélation, la décision) ; la seconde partie — le vote final
# entre les portes ouvertes — est gérée par le moteur (src/engine/counters.ts), hors de ce
# fichier.

id: ch30
number: 30
act: 3
title: Le Sommet et le Veilleur d'Orvane
introImage: ch30
scene: sommet-d-orvane

espagnol:
  - { es: "La cumbre guarda un secreto antiguo.", fr: "Le sommet garde un secret ancien." }
  - { es: "El zorro vigila desde siempre.", fr: "Le renard veille depuis toujours." }
  - { es: "Cada vínculo lo mantiene con vida.", fr: "Chaque lien le maintient en vie." }
  - { es: "El final se escribe juntos.", fr: "La fin s'écrit ensemble." }
  - { es: "El viaje cambia a quien lo vive.", fr: "Le voyage change celui qui le vit." }

decision:
  prompt: "Le Veilleur s'écarte en silence, et devant les trois sœurs apparaît enfin Orvane : un immense renard de lumière argentée, aussi ancien que la montagne elle-même, dont l'éclat vacille doucement, comme une flamme fatiguée. « Tout ce que vous avez vécu, dit le Veilleur, a nourri ou affaibli sa lumière. Il reste un dernier geste à faire, avant la toute dernière décision. Que voulez-vous offrir à Orvane, pour ce moment qui compte plus que tous les autres ? »"
  options:
    A:
      label: Offrir tous les liens tissés depuis le début du voyage
      scene: "Les trois sœurs, d'un même geste, posent la main sur le pelage de lumière d'Orvane, et lui offrent, ensemble, le souvenir de chaque lien tissé depuis le début de leur voyage : Nilo, Plume, Thessaly, et tous ceux qui les ont aidées en chemin."
      line: { who: veilleur, text: "Un don d'une telle ampleur, petites voyageuses, je n'en avais pas vu depuis bien longtemps. Regardez : sa lumière répond, et s'embrase à nouveau, plus forte qu'avant." }
      habillage: "Les épreuves prennent la forme d'un rassemblement solennel de tous les souvenirs de lien accumulés depuis le début du récit, offerts d'un seul geste."
    B:
      label: Offrir uniquement le courage de continuer, sans détour
      scene: "Rafaelle, pressée d'en finir avec cette ultime épreuve, préfère offrir à Orvane le simple courage d'avancer, sans s'attarder davantage sur les souvenirs du chemin déjà parcouru."
      line: { who: veilleur, text: "Un courage sincère, petite Archiviste, mais un peu sec, à lui seul, pour nourrir une lumière aussi ancienne. Elle vacille encore, affaiblie par la hâte." }
      habillage: "Les épreuves se déroulent dans la rapidité et la détermination brute, sans grand égard pour la mémoire du chemin parcouru."
    C:
      label: Offrir le souvenir du tout premier pas du voyage
      scene: "Maelle choisit d'offrir à Orvane le souvenir précis du tout premier pas de leur voyage, celui où tout a commencé, estimant que ce souvenir fondateur compte plus que tous les autres réunis."
      line: { who: veilleur, text: "Un choix empreint de sagesse, petite Cartographe. Se souvenir du commencement, c'est souvent la clé pour comprendre tout ce qui a suivi." }
      habillage: "Les épreuves prennent la forme d'un retour songeur vers le tout premier instant du voyage, raconté avec soin et précision."

repliquesAbsurdes:
  - "Si le renard veille depuis toujours, est-ce qu'il a quand même le droit de faire un petit somme, de temps en temps, sans que ça compte contre lui ?"
  - "Mon renard, enfin Plume, a essayé de saluer Orvane d'un coup de queue. Résultat : toute la montagne a semblé trembler un instant, impressionnée."
  - "Est-ce qu'Orvane connaît Plume depuis longtemps, ou c'est leur toute première rencontre, là, au sommet ?"
  - "Si chaque lien le maintient en vie, est-ce qu'on peut aussi lui offrir un lien qu'on n'a pas encore créé, juste pour voir si ça marche ?"
  - "Après trente chapitres de voyage, arriver enfin au sommet pour y trouver un renard géant de lumière, ça paraît presque logique, en fait."

days:
  # ─────────────────────────── JOUR 1 ───────────────────────────
  - n: 1
    title: Le sommet, enfin
    decor: Le sommet de la montagne, balayé par un vent clair, où un vieil homme familier attend, immobile, devant une arche de pierre ancienne gravée de symboles oubliés.
    opening:
      - { who: narrateur, text: "Après la dernière veillée avec Solen, le sentier grimpa une dernière fois, plus abrupt que jamais, jusqu'à déboucher, enfin, sur le sommet de la montagne, balayé par un vent clair et froid." }
      - { who: narrateur, text: "Là, devant une arche de pierre ancienne, gravée de symboles que nul ne semblait plus savoir lire, un vieil homme en manteau rapiécé attendait, immobile, un trousseau de clés à la ceinture." }
      - { who: rafaelle, text: "Attendez... Le Veilleur ? Celui de la Tour de Garde, et du Tribunal ? Qu'est-ce que vous faites ici, tout en haut ?" }
      - { who: narrateur, text: "Le vieil homme se retourna lentement, un sourire empreint d'une gravité nouvelle sur le visage, bien différent de celui qu'elles avaient connu au tout début de leur voyage." }
      - { who: veilleur, text: "Je vous attendais, petites voyageuses. J'ai gardé bien des clés, au fil de ma longue vie, mais celle qui ouvre cette arche n'a jamais été destinée à mes propres mains." }
      - { who: maelle, text: "Alors à qui est-elle destinée, cette clé ?" }
      - { who: veilleur, text: "À vous trois, petite Cartographe. Vous l'avez forgée, sans le savoir, à chaque pas de votre voyage, à chaque décision prise ensemble." }
      - { who: axelle, text: "C'est un peu mystérieux, comme façon de parler." }
      - { who: veilleur, text: "Tout deviendra clair, petite Veilleuse, je vous le promets. Mais il nous faudra quelques jours, avant que vous ne soyez tout à fait prêtes." }
    manches:
