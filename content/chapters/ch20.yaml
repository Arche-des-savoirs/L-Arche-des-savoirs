      - id: m1
        title: Un livre qui se complète
        tours:
          axelle:
            - { id: ch20-j2-ax-m1a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le contraire de « sincère » ?", choices: ["hypocrite", "honnête", "vrai", "fidèle", "franc"], answer: "hypocrite", hint: "Le contraire de quelqu'un qui dit vraiment ce qu'il pense." }
            - { id: ch20-j2-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 9 + 5.", choices: ["12", "13", "14", "15", "16"], answer: "14", hint: "9 + 5 = 9 + 9 − 4." }
          maelle:
            - { id: ch20-j2-ma-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Pourquoi un livre transmis de génération en génération peut-il contenir des écritures de styles très différents ?", choices: ["parce que chaque génération y écrit avec ses propres mots et sa propre façon de s'exprimer", "parce qu'un tel livre n'a jamais plusieurs auteurs", "cela n'a aucune explication particulière", "parce que le style d'écriture ne change jamais dans le temps", "parce que seule la première génération a le droit d'écrire"], answer: "parce que chaque génération y écrit avec ses propres mots et sa propre façon de s'exprimer", hint: "Pense à ce que représente le livre « Ce qui lie les voyageurs à Orvane »." }
