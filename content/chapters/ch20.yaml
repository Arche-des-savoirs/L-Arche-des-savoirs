          rafaelle:
            - { id: ch20-j2-ra-m1a, subject: histoire-geo, level: 4, kind: qcm, prompt: "Pourquoi un registre transmis sur plusieurs générations constitue-t-il une source précieuse pour comprendre l'évolution d'une relation ou d'une tradition ?", choices: ["parce qu'il permet de voir comment cette relation a été vécue et comprise différemment au fil du temps", "parce qu'un tel registre n'a jamais aucune valeur historique", "cela n'a aucun lien avec l'évolution d'une tradition", "parce que seule la dernière génération compte vraiment", "parce que les traditions ne changent jamais au fil du temps"], answer: "parce qu'il permet de voir comment cette relation a été vécue et comprise différemment au fil du temps", hint: "Repense à ce que représente ce livre pour comprendre le lien avec Orvane au fil des générations." }
            - { id: ch20-j2-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 17 × 6.", choices: ["96", "98", "100", "102", "104"], answer: "102", hint: "17 × 6 = 17 × 3 × 2." }
