            - { id: ch20-j2-ma-m3b, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi savoir que d'autres ont vécu une expérience avant nous peut-il rassurer face à une décision importante ?", choices: ["parce que cela montre que l'on n'est pas seul face à ce type de choix", "parce que cela n'a jamais aucun effet rassurant", "cela n'a aucun lien avec une décision importante", "parce que seules les décisions inédites comptent vraiment", "parce que savoir qu'on a été précédé rend toujours plus anxieux"], answer: "parce que cela montre que l'on n'est pas seul face à ce type de choix", hint: "Pense à ce que ressent Rafaelle en apprenant que d'autres ont déjà écrit dans ce livre." }
          rafaelle:
