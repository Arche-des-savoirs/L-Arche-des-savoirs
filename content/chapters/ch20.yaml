            - { id: ch20-j2-ax-m3b, subject: maths, level: 2, kind: qcm, prompt: "Calcule 6 × 7.", choices: ["36", "38", "40", "42", "44"], answer: "42", hint: "6 × 7 = 6 × 6 + 6." }
