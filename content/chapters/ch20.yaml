# Chapitre 20 — La Bibliothèque sans Fin
# Chapitre MAJEUR (decisions.ts : MAJOR = {9, 12, 20, 22, 30}). Effet ORVANE [2, 0, 1] :
# option A = orvane +2, B = orvane +0 (neutre), C = orvane +1. Réutilise le Scribe (déjà
# établi, voix Rasalgethi) dans une immense bibliothèque sans fin, où se trouve consigné
# tout ce qui a été écrit sur le lien entre les voyageurs et Orvane. Décision à forte
# portée narrative (chapitre majeur), sans introduction de personnage ni de flag nouveau.

id: ch20
number: 20
act: 2
title: La Bibliothèque sans Fin
introImage: ch20
scene: bibliotheque-sans-fin

espagnol:
  - { es: "La biblioteca no tiene fin.", fr: "La bibliothèque n'a pas de fin." }
  - { es: "Cada libro guarda un secreto.", fr: "Chaque livre garde un secret." }
  - { es: "El escriba conoce todas las historias.", fr: "Le scribe connaît toutes les histoires." }
  - { es: "Elegir con cuidado es sabio.", fr: "Choisir avec soin est sage." }
  - { es: "El pasado ilumina el futuro.", fr: "Le passé éclaire l'avenir." }

decision:
  prompt: "Le Scribe pose sur la table un immense livre relié de cuir sombre, intitulé « Ce qui lie les voyageurs à Orvane ». « Ce livre se complète à chaque génération. Aujourd'hui, c'est à vous d'écrire la page qui vous concerne. Que voulez-vous y inscrire ? »"
  options:
    A:
      label: "Inscrire la promesse de revenir, un jour, auprès d'Orvane"
      scene: "Axelle prend la plume que lui tend le Scribe et inscrit, d'une main ferme, une promesse solennelle de revenir un jour auprès d'Orvane, quoi qu'il arrive."
      line: { who: scribe, text: "Une promesse écrite dans ce livre engage plus profondément qu'une promesse murmurée dans le vent. Orvane la sentira, j'en suis certain." }
      habillage: "Les épreuves prennent la tournure d'un engagement solennel envers un lien ancien, renforcé par l'écrit."
    B:
      label: "Inscrire simplement la date de ce passage, sans promesse"
      scene: "Rafaelle, plus prudente, préfère n'inscrire que la date exacte de leur passage dans la bibliothèque, sans y ajouter de promesse qu'elle ne serait pas sûre de pouvoir tenir."
      line: { who: scribe, text: "Une date, sobrement inscrite, a aussi sa valeur, petite Archiviste. Elle dit : « nous sommes passées ici », sans rien promettre de plus que la vérité." }
      habillage: "Les épreuves deviennent des constats précis à consigner, sans engagement au-delà de ce qui est réellement su."
    C:
      label: "Inscrire ce que ce voyage leur a appris sur Orvane"
      scene: "Maelle choisit d'inscrire, avec soin, tout ce que ce voyage leur a appris jusqu'ici sur Orvane, sans promesse ni simple date, mais un véritable témoignage."
      line: { who: scribe, text: "Un témoignage sincère, petite Cartographe, voilà qui enrichit vraiment ce livre. Les pages suivantes s'en nourriront, je n'en doute pas." }
      habillage: "Les épreuves prennent la forme de témoignages à rédiger avec attention, fidèles à ce qui a réellement été vécu."

repliquesAbsurdes:
  - "Si la bibliothèque n'a pas de fin, est-ce que quelqu'un a déjà essayé de la ranger entièrement, juste pour voir ?"
  - "Mon renard a essayé de lire un livre. Il a surtout mangé un coin de page, et ça n'a rien résolu."
  - "Est-ce qu'il existe un livre, dans cette bibliothèque, qui parle uniquement des livres qui parlent des autres livres ?"
  - "Si chaque livre garde un secret, est-ce que la bibliothèque entière, c'est juste un immense coffre-fort en papier ?"
  - "Après un village entier et une reine de brume, une bibliothèque sans fin, ça semble presque calme, en fait."

days:
  # ─────────────────────────── JOUR 1 ───────────────────────────
  - n: 1
    title: Une bibliothèque sans fin
    decor: Une immense bibliothèque aux rayonnages s'élevant à perte de vue, éclairée par des lanternes suspendues, où des escaliers mobiles permettent d'atteindre les étagères les plus hautes.
    opening:
      - { who: narrateur, text: "Le chemin, après le village suspendu, déboucha sur une porte de pierre gravée, qui s'ouvrit sur une immense bibliothèque aux rayonnages s'élevant à perte de vue." }
      - { who: narrateur, text: "Des escaliers mobiles glissaient le long des étagères, et des lanternes flottaient doucement entre les rayons, éclairant des milliers, voire des millions de livres." }
      - { who: rafaelle, text: "C'est... c'est immense. Je n'ai jamais vu autant de livres au même endroit !" }
      - { who: narrateur, text: "Une silhouette familière descendit l'un des escaliers mobiles avec une agilité surprenante : le Scribe, qu'elles avaient déjà croisé, les accueillit d'un sourire chaleureux." }
      - { who: scribe, text: "Bienvenue dans la Bibliothèque sans Fin, petites voyageuses. Ici sont consignées toutes les histoires qui méritent de ne jamais être oubliées." }
      - { who: axelle, text: "Vraiment toutes les histoires ? Même les plus petites, les plus anciennes ?" }
      - { who: scribe, text: "Toutes, petite Veilleuse. Et aujourd'hui, j'ai quelque chose d'important à vous montrer, qui vous concerne directement, vous et Orvane." }
      - { who: maelle, text: "Qu'est-ce que c'est, exactement ?" }
      - { who: scribe, text: "Patience, petite Cartographe. Laissez-moi d'abord vous faire visiter ces lieux, avant d'en arriver à ce qui compte vraiment." }
    manches:
      - id: m1
        title: Des rayonnages à perte de vue
        tours:
          axelle:
            - { id: ch20-j1-ax-m1a, subject: histoire-geo, level: 1, kind: qcm, prompt: "Comment appelle-t-on un lieu où sont rangés et conservés de nombreux livres ?", choices: ["une bibliothèque", "une boulangerie", "une écurie", "un marché", "un atelier"], answer: "une bibliothèque", hint: "C'est le mot du titre de ce chapitre." }
            - { id: ch20-j1-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 7 + 9.", choices: ["14", "15", "16", "17", "18"], answer: "16", hint: "7 + 9 = 7 + 7 + 2." }
          maelle:
            - { id: ch20-j1-ma-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Pourquoi les grandes bibliothèques utilisent-elles parfois des escaliers mobiles ou des échelles coulissantes ?", choices: ["pour atteindre facilement les étagères les plus hautes sans les démonter", "parce que les escaliers mobiles n'ont aucune utilité réelle", "parce que les livres ne peuvent jamais être rangés en hauteur", "cela n'a aucune explication particulière", "parce que les bibliothèques n'ont jamais d'étagères hautes"], answer: "pour atteindre facilement les étagères les plus hautes sans les démonter", hint: "Pense à l'utilité des escaliers mobiles décrits dans la bibliothèque." }
            - { id: ch20-j1-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 94 + 68.", choices: ["158", "160", "162", "164", "166"], answer: "162", hint: "94 + 70 − 2." }
          rafaelle:
            - { id: ch20-j1-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi les bibliothèques ont-elles, historiquement, joué un rôle essentiel dans la conservation du savoir humain ?", choices: ["parce qu'elles permettent de rassembler et de préserver des écrits qui, sinon, risqueraient de se perdre", "parce que les bibliothèques n'ont jamais conservé aucun savoir", "cela n'a aucune importance pour la transmission du savoir", "parce que les livres se conservent toujours seuls, sans bibliothèque", "parce que le savoir n'a jamais eu besoin d'être écrit"], answer: "parce qu'elles permettent de rassembler et de préserver des écrits qui, sinon, risqueraient de se perdre", hint: "Pense à ce que représente la Bibliothèque sans Fin pour le Scribe." }
            - { id: ch20-j1-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 19 × 5.", choices: ["90", "92", "93", "95", "98"], answer: "95", hint: "19 × 5 = 20 × 5 − 5." }
      - id: m2
        title: Toutes les histoires
        tours:
          axelle:
            - { id: ch20-j1-ax-m2a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le sujet de « Des lanternes flottaient doucement. » ?", choices: ["doucement", "flottaient", "Des lanternes", "des", "lanternes"], answer: "Des lanternes", hint: "Qu'est-ce qui flotte entre les rayons ?" }
            - { id: ch20-j1-ax-m2b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 13 − 5.", choices: ["6", "7", "8", "9", "10"], answer: "8", hint: "13 − 3 = 10, puis − 2." }
          maelle:
            - { id: ch20-j1-ma-m2a, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « chaleureux » dans « un sourire chaleureux » ?", choices: ["nom", "verbe", "adjectif", "adverbe", "pronom"], answer: "adjectif", hint: "Il décrit le sourire du Scribe." }
            - { id: ch20-j1-ma-m2b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 480 ÷ 6.", choices: ["70", "76", "78", "80", "82"], answer: "80", hint: "6 × 80 = 480." }
          rafaelle:
            - { id: ch20-j1-ra-m2a, subject: francais, level: 4, kind: qcm, prompt: "« Toutes les histoires qui méritent de ne jamais être oubliées. » : que révèle cette phrase sur le rôle du Scribe ?", choices: ["qu'il se voit comme un gardien de la mémoire collective", "qu'il déteste écrire des histoires", "qu'il oublie volontairement certaines histoires", "qu'il ne garde que les histoires les plus récentes", "qu'il refuse de conserver quoi que ce soit"], answer: "qu'il se voit comme un gardien de la mémoire collective", hint: "Repense à ce que dit le Scribe sur la Bibliothèque sans Fin." }
            - { id: ch20-j1-ra-m2b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 13² − 90.", choices: ["69", "73", "76", "79", "82"], answer: "79", hint: "169 − 90." }
      - id: m3
        title: Une visite guidée
        tours:
          axelle:
            - { id: ch20-j1-ax-m3a, subject: maths, level: 1, kind: qcm, prompt: "Il y a 5 rayonnages d'un côté de la salle, et 6 de l'autre. Combien de rayonnages en tout ?", choices: ["9", "10", "11", "12", "13"], answer: "11", hint: "5 + 6." }
            - { id: ch20-j1-ax-m3b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi certaines bibliothèques protègent-elles leurs livres anciens de la lumière directe du soleil ?", choices: ["la lumière du soleil peut abîmer et décolorer les pages anciennes", "la lumière n'a jamais aucun effet sur le papier", "les livres anciens n'existent jamais vraiment", "cela n'a aucune explication particulière", "la lumière rend toujours les livres plus solides"], answer: "la lumière du soleil peut abîmer et décolorer les pages anciennes", hint: "Pense à pourquoi la bibliothèque est éclairée par des lanternes plutôt que par le soleil." }
          maelle:
            - { id: ch20-j1-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 56 × 4.", choices: ["212", "216", "220", "222", "224"], answer: "224", hint: "56 × 4 = 56 × 2 × 2." }
            - { id: ch20-j1-ma-m3b, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi un bibliothécaire ou un scribe se montre-t-il souvent attentif et bienveillant envers les visiteurs curieux ?", choices: ["parce que la curiosité pour les livres et les histoires est une qualité qu'il valorise particulièrement", "parce qu'un scribe n'apprécie jamais les visiteurs", "cela n'a aucun lien avec le métier de scribe", "parce que la curiosité est toujours mal vue dans une bibliothèque", "parce que les visiteurs ne sont jamais les bienvenus"], answer: "parce que la curiosité pour les livres et les histoires est une qualité qu'il valorise particulièrement", hint: "Pense à l'accueil que réserve le Scribe aux trois sœurs." }
          rafaelle:
            - { id: ch20-j1-ra-m3a, subject: maths, level: 4, kind: qcm, prompt: "Résous : 6x + 5 = 41.", choices: ["4", "5", "6", "7", "8"], answer: "6", hint: "6x = 36." }
            - { id: ch20-j1-ra-m3b, subject: francais, level: 3, kind: qcm, prompt: "Conjugue au passé composé : « Le Scribe (descendre) l'escalier avec agilité. »", choices: ["est descendu", "descendait", "descendra", "descend", "descendant"], answer: "est descendu", hint: "« Descendre » se conjugue avec être au passé composé." }
      - id: m4
        title: Premiers rayons explorés
        tours:
          axelle:
            - { id: ch20-j1-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 8 × 3.", choices: ["21", "22", "24", "26", "28"], answer: "24", hint: "8 × 3 = 8 + 8 + 8." }
            - { gen: maths.addition }
          maelle:
            - { id: ch20-j1-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 310 − 145.", choices: ["155", "160", "163", "165", "168"], answer: "165", hint: "310 − 150 + 5." }
            - { gen: maths.multiplication }
          rafaelle:
            - { id: ch20-j1-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « La biblioteca no tiene fin. »", choices: ["La bibliothèque est fermée.", "La bibliothèque n'a pas de fin.", "La bibliothèque est petite.", "La bibliothèque brûle.", "La bibliothèque est vide."], answer: "La bibliothèque n'a pas de fin.", hint: "« No tiene fin » = n'a pas de fin." }
            - { gen: maths.fraction-de }
    pause: "Le jeu du titre inventé : chaque sœur invente, à voix haute, le titre d'un livre imaginaire qui pourrait se trouver dans cette bibliothèque sans fin, et les deux autres devinent de quoi il pourrait parler."
    closing:
      - { who: narrateur, text: "La visite se termina devant une porte discrète, gardée par deux statues de pierre représentant des lecteurs penchés sur leurs livres, immobiles depuis des siècles." }
      - { who: scribe, text: "Derrière cette porte se trouve ce que je voulais vous montrer. Mais demain suffira. Reposez-vous cette nuit, vous en aurez besoin." }
      - { who: rafaelle, text: "On a hâte de voir ce qui se cache derrière cette porte !" }
      - { who: narrateur, text: "Et tandis que les trois sœurs s'installaient pour la nuit dans une alcôve tranquille de la bibliothèque, le silence des rayonnages semblait, lui aussi, retenir son souffle." }
    reward: "la découverte de la Bibliothèque sans Fin et de son gardien, le Scribe"
  # ─────────────────────────── JOUR 2 ───────────────────────────
  - n: 2
    title: Le livre qui les attendait
    decor: Une petite salle ronde, derrière la porte gardée, où un unique livre relié de cuir sombre repose sur un pupitre, au centre de la pièce, baigné dans une lumière douce.
    opening:
      - { who: narrateur, text: "Le lendemain, le Scribe ouvrit enfin la porte gardée, révélant une petite salle ronde où un unique livre reposait sur un pupitre, baigné dans une lumière douce." }
      - { who: scribe, text: "Voici le livre que je voulais vous montrer. Il s'intitule « Ce qui lie les voyageurs à Orvane », et il se complète à chaque génération." }
      - { who: maelle, text: "Vous voulez dire que d'autres voyageurs, avant nous, ont déjà écrit dans ce livre ?" }
      - { who: scribe, text: "Exactement, petite Cartographe. Chacun y a laissé une trace, selon ce que son propre voyage lui a appris sur Orvane." }
      - { who: axelle, text: "Et nous aussi, on va pouvoir y écrire quelque chose ?" }
      - { who: scribe, text: "C'est même pour cela que je vous ai conduites jusqu'ici, petite Veilleuse. Demain, ce sera à vous d'écrire votre page." }
      - { who: rafaelle, text: "C'est... c'est une grande responsabilité, en fait." }
      - { who: scribe, text: "Toute vérité importante en est une, petite Archiviste. Mais ne vous inquiétez pas : il n'y a pas de mauvaise façon d'être sincère." }
