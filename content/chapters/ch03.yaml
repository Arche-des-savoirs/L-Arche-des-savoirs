# Chapitre 3 — La Ville de Brume
# Sources : Plan narratif v2 (maisons sans portes, fil de lumière vers le Sablier Gris, Thessaly happée par le Brouillard),
# doc « Saison 1, chapitres 2 à 9 » (thèmes des jours, scène sobre du jour 4), Banque d'exercices S1-C3 (questions),
# doc des variantes (décision : où chercher Thessaly d'abord ?).
# Scène du jour 4 : sobre, sans combat ni cri. Les lanternes s'éteignent ; quand la lumière revient, Thessaly n'est plus là.

id: ch03
number: 3
act: 1
title: La Ville de Brume
introImage: ch03
scene: ville-de-brume

espagnol:
  - { es: "La ciudad duerme.", fr: "La ville dort." }
  - { es: "¿Cuánto cuesta?", fr: "Combien ça coûte ?" }
  - { es: "¿Cómo te llamas?", fr: "Comment t'appelles-tu ?" }
  - { es: "La torre vigila la ciudad.", fr: "La tour veille sur la ville." }
  - { es: "Vamos a buscarla.", fr: "Nous allons la chercher." }

decision:
  prompt: "Thessaly a disparu dans le Brouillard. Il ne reste que sa canne. Où la chercher d'abord ?"
  options:
    A:
      label: Interroger les habitants
      scene: "Les habitants se rassemblent sur la place. Chacun écoute son nom retrouvé, et ils se mettent à chanter avec les apprenties."
      line: { who: habitant, text: "Mon nom… ça me revient !" }
      habillage: "Les noms sont donnés à l'oral par les habitants : il faut les reconnaître et les écrire."
    B:
      label: Suivre la canne
      scene: "La canne tremble dans la rue. Les filles la suivent et lisent les noms sur les façades, dans la direction qu'elle montre."
      line: { who: thessaly, text: "(une voix, très loin) Vers l'est…" }
      habillage: "Les noms sont sur des enseignes, qu'on repère en marchant dans les rues."
    C:
      label: Fouiller la mairie
      scene: "Les grands registres sont ouverts sur la table de la mairie. Les noms se lisent à la lueur de la lampe."
      line: { who: plume, text: "Les noms sont rangés par familles." }
      habillage: "Les noms sont dans un registre : il faut les trier par ordre alphabétique et par famille."

repliquesAbsurdes:
  - "Monsieur le Veilleur, votre tour penche. Ou alors c'est vous."
  - "Je donne la réponse si vous me prêtez votre chapeau. Il est magnifique."
  - "Mon loup dit que vos clés font trop de bruit. Il essaie de dormir."
  - "Vous veillez la nuit ? Moi aussi, quand il y a de l'orage. On est collègues !"

days:
  # ─────────────────────────── JOUR 1 ───────────────────────────
  - n: 1
    title: Les remparts
    decor: Un vieux port entouré de remparts. Les maisons n'ont plus de portes, les ruelles pavées luisent de brume.
    opening:
      - { who: narrateur, text: "Au-delà des Champs, sur la côte, se dresse une ville de pierre aux toits pointus : la Ville de Brume. Autrefois, on l'appelait la Ville des Mille Noms, parce que chacun de ses habitants avait un nom qui chantait." }
      - { who: narrateur, text: "Thessaly y mène les apprenties par un matin pâle. Les remparts sont hauts, couverts de lierre gris. Le port est silencieux. Et dans les ruelles pavées, quelque chose ne va pas : les maisons n'ont plus de portes." }
      - { who: narrateur, text: "Là où devraient s'ouvrir les portes, il n'y a que du mur. Les habitants marchent dans les rues sans se regarder, sans se saluer. Ils se croisent comme des inconnus, parce qu'ils ont oublié leur propre nom." }
      - { who: thessaly, text: "Ici, le Brouillard a pris les noms. Et quand on n'a plus de nom, on ne trouve plus sa maison. Nous allons les leur rendre, un par un." }
      - { who: nilo, text: "Coucou ! Je passais par là. Par hasard. Totalement par hasard. Je ne vous suivais pas du tout." }
      - { who: rafaelle, text: "Nilo… tu as une lettre de Thessaly dans ta poche. Tu nous expliques ?" }
      - { who: nilo, text: "Plus tard ! Promis. Là, on a une ville à sauver, non ? Les explications, c'est pour les jours calmes." }
      - { who: thessaly, to: axelle, text: "Axelle, reste près de moi. Ta lueur nous montre où mettre les pieds, et ces pavés sont glissants." }
      - { who: narrateur, text: "Sur la colline qui domine la ville, une silhouette immense se découpe dans la brume. C'est un sablier, haut comme une tour, en verre et en bronze. Son sable est gris. Et il coule… vers le haut." }
      - { who: plume, text: "Regardez, sur la colline : un sablier immense. Il est tout gris. Et le sable monte au lieu de descendre. Ça ne devrait pas être possible." }
      - { who: thessaly, text: "Ne le regardez pas trop longtemps. Le Sablier Gris attire ceux qui le fixent. Pour l'instant, occupons-nous des remparts." }
    manches:
      - id: m1
        title: À gauche, à droite
        intro: "Pour entrer, il faut se repérer dans les ruelles sans portes."
        tours:
          axelle:
            - { id: ch03-j1-ax-m1a, subject: maths, level: 2, kind: qcm, prompt: "La maison est à gauche de l'église. L'église est donc à… ?", choices: ["gauche de la maison", "droite de la maison", "dans la maison", "au-dessus de la maison", "loin de la maison"], answer: "droite de la maison", hint: "Si tu échanges les deux, la gauche devient la droite." }
            - { id: ch03-j1-ax-m1b, subject: maths, level: 3, kind: qcm, prompt: "Sur un plan, la fontaine est en haut à droite. Où la cherches-tu ?", choices: ["dans le coin en bas à gauche", "dans le coin en haut à gauche", "dans le coin en haut à droite", "dans le coin en bas à droite", "au milieu"], answer: "dans le coin en haut à droite", hint: "Haut et droite : regarde le coin." }
          maelle:
            - { id: ch03-j1-ma-m1a, subject: maths, level: 2, kind: qcm, prompt: "Sur le plan, 1 cm représente 10 m. Combien de mètres représentent 4 cm ?", choices: ["14", "40", "4", "400", "44"], answer: "40", hint: "4 fois 10 m." }
            - { id: ch03-j1-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Deux rues qui se coupent à angle droit sont…", choices: ["parallèles", "obliques", "perpendiculaires", "superposées", "courbes"], answer: "perpendiculaires", hint: "Elles forment un coin d'équerre." }
          rafaelle:
            - { id: ch03-j1-ra-m1a, subject: maths, level: 2, kind: qcm, prompt: "Sur un quadrillage, la tour est au point (3 ; 5). Quelle est son abscisse ?", choices: ["5", "8", "3", "2", "35"], answer: "3", hint: "L'abscisse est le premier nombre, celui de l'axe horizontal." }
            - { id: ch03-j1-ra-m1b, subject: maths, level: 2, kind: qcm, prompt: "Échelle 1/1000 : 5 cm sur la carte représentent combien de mètres ?", choices: ["50", "5 000", "500", "5", "0,5"], answer: "50", hint: "5 cm × 1 000 = 5 000 cm." }
      - id: m2
        title: Les nombres des remparts
        tours:
          axelle:
            - { id: ch03-j1-ax-m2a, subject: maths, level: 1, kind: qcm, prompt: "Quel nombre vient juste avant 40 ?", choices: ["41", "39", "38", "30", "4"], answer: "39", hint: "Recule d'un pas." }
            - { id: ch03-j1-ax-m2b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 9 + 6.", choices: ["16", "14", "15", "3", "13"], answer: "15", hint: "9 + 1 = 10, puis encore 5." }
          maelle:
            - { id: ch03-j1-ma-m2a, subject: maths, level: 1, kind: qcm, prompt: "Calcule 7 × 6.", choices: ["36", "42", "13", "48", "49"], answer: "42", hint: "6 × 7 = 42." }
            - { id: ch03-j1-ma-m2b, subject: maths, level: 1, kind: qcm, prompt: "Écris en chiffres : 5 000 + 300 + 7.", choices: ["5 370", "5 307", "537", "5 037", "5 300"], answer: "5 307", hint: "Pas de dizaines : mets un zéro." }
          rafaelle:
            - { id: ch03-j1-ra-m2a, subject: maths, level: 1, kind: qcm, prompt: "Calcule 18 × 5.", choices: ["95", "90", "13", "85", "23"], answer: "90", hint: "18 × 10 ÷ 2." }
            - { id: ch03-j1-ra-m2b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 4,5 + 3,8.", choices: ["7,3", "8,3", "9,3", "12,3", "8,13"], answer: "8,3", hint: "Aligne les virgules." }
      - id: m3
        title: Les mots de la ville
        tours:
          axelle:
            - { id: ch03-j1-ax-m3a, subject: francais, level: 1, kind: qcm, prompt: "Quelle est la première lettre de « Thessaly » ?", choices: ["H", "T", "t", "S", "Y"], answer: "T", hint: "C'est une majuscule." }
            - { id: ch03-j1-ax-m3b, subject: francais, level: 2, kind: qcm, prompt: "« thessaly marche » : quel mot doit prendre une majuscule ?", choices: ["marche", "Thessaly", "thessaly", "La", "Marche"], answer: "Thessaly", hint: "C'est un prénom." }
          maelle:
            - { id: ch03-j1-ma-m3a, subject: francais, level: 1, kind: qcm, prompt: "« La vieille ville » : quelle est la nature de « vieille » ?", choices: ["nom", "verbe", "adjectif", "adverbe", "pronom"], answer: "adjectif", hint: "Il dit comment est la ville." }
            - { id: ch03-j1-ma-m3b, subject: francais, level: 3, kind: qcm, prompt: "Accorde : « Les maisons (ancien) ».", choices: ["ancien", "anciennes", "anciens", "ancienne", "anciennent"], answer: "anciennes", hint: "Maisons : féminin pluriel." }
          rafaelle:
            - { id: ch03-j1-ra-m3a, subject: francais, level: 1, kind: qcm, prompt: "« Thessaly chante doucement. » Quelle est la nature de « doucement » ?", choices: ["adjectif", "nom", "adverbe", "verbe", "pronom"], answer: "adverbe", hint: "Il dit comment elle chante, et il ne s'accorde pas." }
            - { id: ch03-j1-ra-m3b, subject: francais, level: 2, kind: libre, validation: soeurs, prompt: "Raconte en deux phrases ce que tu vois en entrant dans la ville sans portes." }
      - id: m4
        title: Le Défi des remparts
        tours:
          axelle:
            - { id: ch03-j1-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Compte de 5 en 5 : 0, 5, 10, …, 20. Quel nombre manque ?", choices: ["10", "15", "18", "25", "12"], answer: "15", hint: "10 + 5." }
            - { gen: maths.comparer }
          maelle:
            - { id: ch03-j1-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Compare : 7 108 … 7 180", choices: [">", "≤", "<", "≥", "="], answer: "<", hint: "Regarde le chiffre des dizaines." }
            - { gen: maths.ranger }
          rafaelle:
            - { id: ch03-j1-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « la ciudad ».", choices: ["la maison", "la ville", "la rue", "la mer", "la nuit"], answer: "la ville", hint: "Regarde la phrase du jour." }
            - { gen: maths.arrondi }
    pause: "Les remparts sont hauts : marchez sur la pointe des pieds comme des gardes, puis accroupissez-vous comme des espions, trois fois !"
    closing:
      - { who: narrateur, text: "Les portes de la première rue réapparaissent, une à une, avec un petit « clac » joyeux. Une vieille dame retrouve la sienne, l'ouvre, et respire l'odeur de sa cuisine avec un sourire immense." }
      - { who: narrateur, text: "Puis un fil de lumière dorée s'allume entre les pavés. Il serpente à travers la ville, monte les escaliers, contourne les fontaines… et file droit vers la colline du Sablier." }
      - { who: thessaly, text: "Ce fil mène au Sablier Gris. Nous n'irons pas seules là-bas. Pas encore. Pas sans savoir ce qui nous attend." }
      - { who: plume, text: "Le fil sent… la même chose que la trace de plume sur l'épi. Je ne comprends pas. Pourquoi est-ce que tout me parle de quelque chose que j'ai oublié ?" }
      - { who: narrateur, text: "Ce soir-là, Thessaly reste longtemps à la fenêtre de l'auberge. Elle regarde le Sablier, et sa main serre très fort le pommeau de sa canne." }

  # ─────────────────────────── JOUR 2 ───────────────────────────
  - n: 2
    title: Le marché
    decor: Une place de marché aux étals vides. Les marchands ne savent plus le prix de rien.
    opening:
      - { who: narrateur, text: "Le deuxième jour, les apprenties descendent au marché. C'est une grande place ronde, entourée d'arcades, où se pressent d'habitude des centaines de marchands venus de toutes les mers." }
      - { who: narrateur, text: "Mais aujourd'hui, les étals sont presque vides. Les marchands restent derrière leurs paniers, le regard perdu. Ils ne savent plus le prix de rien. L'un vend une pomme pour mille pièces, un autre donne un tapis pour un caillou." }
      - { who: thessaly, text: "Au marché, les nombres se sont effacés. Sans les nombres, personne ne peut échanger, et une ville qui n'échange plus s'endort. Il faut aider les marchands à compter juste." }
      - { who: nilo, text: "Moi, je suis très fort pour marchander. C'est-à-dire… pour ne rien payer. C'est un talent rare." }
      - { who: plume, text: "Nilo !" }
      - { who: nilo, text: "Je plaisante ! Enfin… à moitié." }
      - { who: narrateur, text: "Un marchand venu du Sud a gardé, lui, une pancarte en espagnol. Il fait de grands gestes vers Rafaelle, soulagé que quelqu'un puisse le comprendre." }
      - { who: thessaly, to: rafaelle, text: "Rafaelle, tu vois ? Une langue est un pont. Celui qui en parle deux traverse deux fois plus de rivières." }
      - { who: thessaly, to: axelle, text: "Axelle, compte les pièces dans ta main. Un euro, deux euros… Chaque pièce bien comptée rend un sourire à un marchand." }
      - { who: narrateur, text: "Mouf est là aussi, on ne sait pas comment. Il essaie d'acheter une écharpe avec une feuille morte. Le marchand, perplexe, accepte." }
    manches:
      - id: m1
        title: Les pièces et les billets
        tours:
          axelle:
            - { id: ch03-j2-ax-m1a, subject: maths, level: 1, kind: qcm, prompt: "Une pomme coûte 2 €, une poire coûte 3 €. Combien faut-il payer pour les deux ?", choices: ["1 €", "5 €", "6 €", "23 €", "4 €"], answer: "5 €", hint: "2 + 3." }
            - { id: ch03-j2-ax-m1b, subject: maths, level: 2, kind: qcm, prompt: "Combien y a-t-il de centimes dans 1 euro ?", choices: ["10", "100", "1 000", "20", "50"], answer: "100", hint: "C'est un nombre rond à trois chiffres." }
          maelle:
            - { id: ch03-j2-ma-m1a, subject: maths, level: 2, kind: qcm, prompt: "Un fromage coûte 4,50 € et un pain 1,20 €. Combien coûtent-ils ensemble ?", choices: ["5,60 €", "6,70 €", "5,70 €", "4,70 €", "3,30 €"], answer: "5,70 €", hint: "4,50 + 1,20, aligne les virgules." }
            - { id: ch03-j2-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Tu paies 6,35 € avec un billet de 10 €. Combien le marchand te rend-il ?", choices: ["3,75 €", "4,65 €", "3,65 €", "3,35 €", "4,35 €"], answer: "3,65 €", hint: "Complète de 6,35 à 7, puis de 7 à 10." }
          rafaelle:
            - { id: ch03-j2-ra-m1a, subject: maths, level: 3, kind: qcm, prompt: "Une cape coûte 40 €. Elle est soldée à −25 %. Quel est son nouveau prix, en euros ?", choices: ["10 €", "35 €", "30 €", "25 €", "15 €"], answer: "30 €", hint: "25 % de 40 = 10." }
            - { id: ch03-j2-ra-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 20 % de 150.", choices: ["15", "20", "30", "50", "75"], answer: "30", hint: "10 % = 15, donc 20 % = …" }
      - id: m2
        title: Les comptes du marchand
        tours:
          axelle:
            - { id: ch03-j2-ax-m2a, subject: maths, level: 2, kind: qcm, prompt: "Tu as 10 €. Tu achètes un pain à 4 €. Combien te reste-t-il ?", choices: ["14 €", "6 €", "4 €", "40 €", "16 €"], answer: "6 €", hint: "10 − 4." }
            - { id: ch03-j2-ax-m2b, subject: maths, level: 2, kind: qcm, prompt: "Calcule 25 + 30.", choices: ["45", "55", "65", "50", "35"], answer: "55", hint: "25 + 30 : ajoute 3 dizaines." }
          maelle:
            - { id: ch03-j2-ma-m2a, subject: maths, level: 3, kind: qcm, prompt: "3 pots de miel à 2,40 € chacun : combien en tout ?", choices: ["6,20 €", "9,60 €", "7,20 €", "5,40 €", "2,40 €"], answer: "7,20 €", hint: "2,40 × 3." }
            - { id: ch03-j2-ma-m2b, subject: maths, level: 3, kind: qcm, prompt: "Pose et calcule : 56 × 4.", choices: ["214", "224", "264", "60", "220"], answer: "224", hint: "50 × 4 = 200, plus 6 × 4." }
          rafaelle:
            - { id: ch03-j2-ra-m2a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 6,3 × 0,5.", choices: ["3,8", "12,6", "3,15", "6,8", "0,315"], answer: "3,15", hint: "Multiplier par 0,5, c'est prendre la moitié." }
            - { id: ch03-j2-ra-m2b, subject: maths, level: 4, kind: qcm, prompt: "Un prix passe de 40 € à 50 €. De combien de pour cent a-t-il augmenté ?", choices: ["10 %", "20 %", "25 %", "50 %", "125 %"], answer: "25 %", hint: "L'augmentation est de 10 €. Combien de % de 40 ?" }
      - id: m3
        title: Le tarif étranger
        intro: "Un marchand venu de loin affiche ses prix en espagnol."
        tours:
          axelle:
            - { id: ch03-j2-ax-m3a, subject: maths, level: 2, kind: qcm, prompt: "3 pièces de 2 € : combien d'euros en tout ?", choices: ["5 €", "23 €", "6 €", "9 €", "8 €"], answer: "6 €", hint: "2 + 2 + 2." }
            - { gen: maths.addition }
          maelle:
            - { id: ch03-j2-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Le marchand te rend 1,50 € sur un billet de 5 €. Combien coûtait ton achat ?", choices: ["6,50 €", "3,50 €", "4,50 €", "1,50 €", "3,00 €"], answer: "3,50 €", hint: "5 − 1,50." }
            - { gen: maths.multiplication }
          rafaelle:
            - { id: ch03-j2-ra-m3a, subject: espagnol, level: 2, kind: qcm, prompt: "L'étiquette dit : « Manzanas : 2 euros el kilo ». Combien coûtent 3 kilos, en euros ?", choices: ["2 €", "5 €", "9 €", "6 €", "23 €"], answer: "6 €", read: "Manzanas: 2 euros el kilo.", hint: "El kilo = le kilo. 3 fois 2 €." }
            - { id: ch03-j2-ra-m3b, subject: espagnol, level: 2, kind: qcm, prompt: "« ¿Cuánto cuesta? » veut dire…", choices: ["Où est-ce ?", "Comment ça va ?", "Combien ça coûte ?", "Quel est ton nom ?", "Quelle heure est-il ?"], answer: "Combien ça coûte ?", hint: "Regarde la phrase du jour." }
      - id: m4
        title: Le Défi du marché
        tours:
          axelle:
            - { id: ch03-j2-ax-m4a, subject: maths, level: 3, kind: qcm, prompt: "Pose et calcule : 48 + 36.", choices: ["74", "84", "94", "12", "78"], answer: "84", hint: "8 + 6 = 14 : on écrit 4 et on retient 1." }
            - { id: ch03-j2-ax-m4b, subject: maths, level: 3, kind: qcm, prompt: "Pose et calcule : 63 − 28.", choices: ["45", "35", "91", "25", "38"], answer: "35", hint: "3 − 8, impossible : on emprunte une dizaine." }
          maelle:
            - { id: ch03-j2-ma-m4a, subject: maths, level: 4, kind: qcm, prompt: "Calcule 12,5 + 3,75.", choices: ["15,25", "16,25", "12,875", "20,00", "8,75"], answer: "16,25", hint: "Écris 12,50 pour aligner les virgules." }
            - { gen: maths.fraction-de }
          rafaelle:
            - { id: ch03-j2-ra-m4a, subject: maths, level: 2, kind: qcm, prompt: "Pour 2 plans, on dessine 3 rues. Combien de rues pour 6 plans ?", choices: ["6", "18", "9", "12", "15"], answer: "9", hint: "6 plans, c'est 3 fois 2 plans." }
            - { gen: maths.fraction-de }
    pause: "Le marché s'anime : faites semblant de porter un panier très lourd, d'un bout à l'autre de la pièce, puis un panier tout léger !"
    closing:
      - { who: narrateur, text: "Les étals se remplissent de couleurs : des oranges, des tissus brodés, des épices qui sentent le soleil. Les marchands crient de nouveau leurs prix, et la place résonne comme une ruche." }
      - { who: narrateur, text: "Un vieux marchand retrouve le prix de ses pommes… et soudain, en riant, le nom de sa fille. Il l'appelle à travers toute la place, et elle accourt dans ses bras." }
      - { who: mouf, text: "J'ai une écharpe ! Je l'ai payée avec une feuille. C'est une bonne affaire ? Je crois que c'est une bonne affaire." }
      - { who: thessaly, text: "Bien. Mais je n'aime pas cette brume qui descend de la colline. Elle est plus épaisse ce soir. Restez près de moi demain." }
      - { who: narrateur, text: "Cette nuit-là, le sable du Sablier Gris monte un peu plus vite. Et dans les rues encore sans portes, des silhouettes de brume se rassemblent, sans bruit." }
    reward: "une Bourse de Pièces Brillantes"

  # ─────────────────────────── JOUR 3 ───────────────────────────
  - n: 3
    title: La mairie des Noms
    decor: Une mairie aux grandes tables couvertes de registres. Les pages se sont vidées de leurs noms.
    opening:
      - { who: narrateur, text: "Le troisième jour, Thessaly conduit les apprenties à la mairie de la ville, un grand bâtiment aux colonnes blanches, surmonté d'une horloge arrêtée." }
      - { who: narrateur, text: "À l'intérieur, une salle immense est remplie de registres, alignés sur des étagères jusqu'au plafond. Chaque registre contient les noms des habitants : ceux qui sont nés ici, ceux qui se sont mariés ici, ceux qui y ont vécu." }
      - { who: narrateur, text: "Mais quand Maelle ouvre le premier registre, les pages sont blanches. Toutes. Le Brouillard a bu l'encre, et les noms se sont envolés comme des papillons." }
      - { who: thessaly, text: "Les noms de la ville étaient gardés ici. Sans eux, les habitants ne savent plus qui ils sont. Retrouvons-les, avec patience, lettre par lettre." }
      - { who: thessaly, text: "Un nom, c'est la première chose qu'on nous offre. Avant même de savoir parler, on sait répondre à son nom." }
      - { who: nilo, text: "Moi, mon nom, je ne l'oublierai jamais. N-I-L-O. Facile. Quatre lettres, zéro problème." }
      - { who: plume, text: "Moi, j'en ai plusieurs. Plume, Plumeau, Plumichou… Heu. Non, juste Plume. Je crois. Pourquoi je dis toujours « je crois » ?" }
      - { who: thessaly, to: axelle, text: "Axelle, toi qui vois les choses minuscules, cherche les lettres qui flottent encore dans la poussière. Elles sont toutes petites." }
      - { who: narrateur, text: "Et c'est vrai : dans les rayons de lumière qui traversent les fenêtres, de minuscules lettres dorées flottent comme de la poussière d'or, en attendant qu'on les remette à leur place." }
    manches:
      - id: m1
        title: L'ordre des registres
        tours:
          axelle:
            - { id: ch03-j3-ax-m1a, subject: francais, level: 1, kind: qcm, prompt: "Quelle lettre vient juste après M dans l'alphabet ?", choices: ["L", "N", "O", "P", "Z"], answer: "N", hint: "M, puis… comme dans Nilo." }
            - { id: ch03-j3-ax-m1b, subject: francais, level: 2, kind: ordre, prompt: "Range ces mots dans l'ordre alphabétique.", choices: ["lune", "arbre", "feu"], answer: ["arbre", "feu", "lune"], hint: "Regarde la première lettre de chaque mot." }
          maelle:
            - { id: ch03-j3-ma-m1a, subject: francais, level: 1, kind: ordre, prompt: "Range ces mots dans l'ordre alphabétique.", choices: ["cloche", "balcon", "avenue"], answer: ["avenue", "balcon", "cloche"], hint: "A, B, C…" }
            - { id: ch03-j3-ma-m1b, subject: francais, level: 3, kind: qcm, prompt: "Choisis : « (Son / Sont) nom est effacé. »", choices: ["Sont", "Se sont", "Son", "Ce sont", "C'est"], answer: "Son", hint: "Remplace par « son nom à lui » : c'est un possessif." }
          rafaelle:
            - { id: ch03-j3-ra-m1a, subject: francais, level: 3, kind: qcm, prompt: "« Plume cherche un nom. » Quelle est la nature et la fonction de « un nom » ?", choices: ["verbe sujet", "groupe nominal sujet", "groupe nominal COD", "groupe nominal COI", "adjectif COI"], answer: "groupe nominal COD", hint: "Plume cherche quoi ?" }
            - { id: ch03-j3-ra-m1b, subject: francais, level: 3, kind: qcm, prompt: "« Thessaly appelle et la ville répond. » Combien de propositions dans cette phrase ?", choices: ["1", "2", "3", "4", "0"], answer: "2", hint: "Compte les verbes conjugués." }
      - id: m2
        title: Les familles de noms
        tours:
          axelle:
            - { id: ch03-j3-ax-m2a, subject: francais, level: 3, kind: qcm, prompt: "Écris un mot de la famille de « chant ».", choices: ["changer", "chantilly", "chanter", "champion", "chaud"], answer: "chanter", hint: "Qu'est-ce qu'on fait avec un chant ?" }
            - { id: ch03-j3-ax-m2b, subject: francais, level: 2, kind: qcm, prompt: "« brouillard » : combien de syllabes ?", choices: ["1", "2", "3", "4", "5"], answer: "2", hint: "Tape dans tes mains : brouil – lard." }
          maelle:
            - { id: ch03-j3-ma-m2a, subject: francais, level: 2, kind: qcm, prompt: "Écris un mot de la famille de « terre ».", choices: ["mer", "terrain", "verre", "pierre", "serre"], answer: "terrain", hint: "Un terrain de foot, par exemple." }
            - { id: ch03-j3-ma-m2b, subject: francais, level: 2, kind: qcm, prompt: "« chanteur » : quel est le suffixe ?", choices: ["-oir", "-eur", "-age", "-ette", "-ion"], answer: "-eur", hint: "C'est la fin ajoutée au radical « chant »." }
          rafaelle:
            - { id: ch03-j3-ra-m2a, subject: francais, level: 2, kind: qcm, prompt: "Écris un mot de la famille de « nom ».", choices: ["non", "nommer", "nord", "notre", "numéro"], answer: "nommer", hint: "Le verbe qui veut dire « donner un nom »." }
            - { id: ch03-j3-ra-m2b, subject: francais, level: 2, kind: qcm, prompt: "« héliotrope » : que signifie la racine grecque hélio- ?", choices: ["eau", "lune", "soleil", "feu", "terre"], answer: "soleil", hint: "L'hélium a été découvert en observant le Soleil." }
      - id: m3
        title: Les noms à rendre
        tours:
          axelle:
            - { id: ch03-j3-ax-m3a, subject: francais, level: 3, kind: qcm, prompt: "« une lanterne » : masculin ou féminin ?", choices: ["masculin", "neutre", "féminin", "les deux", "pluriel"], answer: "féminin", hint: "On dit « une »." }
            - { id: ch03-j3-ax-m3b, subject: francais, level: 3, kind: qcm, prompt: "Copie sans faute : « La ville est grise. »", choices: ["La ville est grises.", "la ville est grise.", "La ville est grise.", "La ville est grise", "La villle est grise."], answer: "La ville est grise.", hint: "N'oublie pas la majuscule et le point." }
          maelle:
            - { id: ch03-j3-ma-m3a, subject: francais, level: 2, kind: qcm, prompt: "« refaire » : que veut dire le préfixe re- ?", choices: ["à nouveau", "pas du tout", "très peu", "très fort", "deux fois"], answer: "à nouveau", hint: "Refaire, c'est faire… encore une fois." }
            - { id: ch03-j3-ma-m3b, subject: francais, level: 3, kind: qcm, prompt: "« Les habitants chantent. » Quel est le sujet de « chantent » ?", choices: ["chantent", "Les habitants", "habitants", "Les", "La ville"], answer: "Les habitants", hint: "Qui est-ce qui chante ?" }
          rafaelle:
            - { id: ch03-j3-ra-m3a, subject: francais, level: 3, kind: qcm, prompt: "Accorde : « Elles se sont (trouvé) ».", choices: ["trouvé", "trouvées", "trouvés", "trouvée", "trouvent"], answer: "trouvées", hint: "Verbe pronominal : accord avec « elles »." }
            - { id: ch03-j3-ra-m3b, subject: francais, level: 2, kind: qcm, prompt: "Mets au passé composé : « Elles (retrouver) ».", choices: ["elles a retrouvé", "elles ont retrouvé", "elles ont retrouvée", "elles sont retrouvé", "elles avaient retrouvé"], answer: "elles ont retrouvé", hint: "Avoir + participe passé." }
      - id: m4
        title: Le Défi des registres
        tours:
          axelle:
            - { id: ch03-j3-ax-m4a, subject: francais, level: 3, kind: qcm, prompt: "« La porte s'ouvre. » Quel mot est le verbe ?", choices: ["porte", "ouvre", "la", "s'", "la porte"], answer: "ouvre", hint: "C'est l'action." }
            - { id: ch03-j3-ax-m4b, subject: francais, level: 4, kind: qcm, prompt: "Un journal, des… ?", choices: ["journals", "journaux", "journaus", "journax", "journeaux"], answer: "journaux", hint: "Comme un cheval, des chevaux." }
          maelle:
            - { id: ch03-j3-ma-m4a, subject: francais, level: 4, kind: qcm, prompt: "« Plume lit un nom. » Quel est le COD ?", choices: ["Plume", "lit", "un nom", "nom", "un"], answer: "un nom", hint: "Plume lit quoi ?" }
            - { id: ch03-j3-ma-m4b, subject: francais, level: 4, kind: qcm, prompt: "Accorde : « Les noms sont (effacer) ».", choices: ["effacé", "effacés", "effacée", "effacées", "effaçés"], answer: "effacés", hint: "Avec être, le participe s'accorde avec le sujet." }
          rafaelle:
            - { id: ch03-j3-ra-m4a, subject: espagnol, level: 3, kind: qcm, prompt: "Traduis : « ¿Dónde está la plaza? »", choices: ["Quand est la place ?", "Où est la place ?", "Où est la maison ?", "Comment est la place ?", "Où est la rue ?"], answer: "Où est la place ?", hint: "Dónde = où." }
            - { id: ch03-j3-ra-m4b, subject: espagnol, level: 4, kind: qcm, prompt: "Traduis : « Ayer busqué el nombre ».", choices: ["Demain, je chercherai le nom", "Hier, j'ai cherché le nom", "Hier, j'ai trouvé le nom", "Hier, je cherche le nom", "Aujourd'hui, j'ai cherché le nom"], answer: "Hier, j'ai cherché le nom", hint: "Ayer = hier. Buscar = chercher." }
    pause: "Appelez-vous ! Chacune dit son prénom en le chantant, de plus en plus fort, puis tout doucement."
    closing:
      - { who: narrateur, text: "Les registres se remplissent de lettres, page après page. Par les fenêtres ouvertes, on entend les habitants s'appeler par leur nom pour la première fois depuis des années." }
      - { who: narrateur, text: "« Marguerite ! » « Anselme ! » « Petit Jo ! » Les portes s'ouvrent dans toute la ville, et des rires montent des rues comme des bulles de savon." }
      - { who: thessaly, text: "Demain, nous monterons à la Tour de Garde. De là-haut, on voit tout le fil de lumière, et peut-être d'où vient le Brouillard." }
      - { who: nilo, text: "La Tour ? Hum. Ma carte dit qu'il ne faut pas y aller la nuit. Enfin… je crois. Elle est un peu effacée. Beaucoup effacée." }
      - { who: narrateur, text: "Dans un registre resté ouvert, une seule page est encore blanche. Rafaelle la regarde longtemps. En bas de la page, presque invisible, il y a le dessin d'une toute petite lanterne." }
    reward: "la Plume des Registres"

  # ─────────────────────────── JOUR 4 ───────────────────────────
  - n: 4
    title: La Tour de Garde
    decor: Une tour de pierre au bout du port. Son gardien, le Veilleur, tient un trousseau de clés rouillées.
    opening:
      - { who: narrateur, text: "Le quatrième jour, le ciel est couleur de cendre. Au bout du port, la Tour de Garde se dresse sur un rocher noir, battu par les vagues. C'est d'elle que les veilleurs d'autrefois surveillaient la mer et allumaient le grand feu pour guider les navires." }
      - { who: narrateur, text: "Devant la porte de la Tour, un vieil homme en manteau rapiécé tient un trousseau de clés rouillées. Il en essaie une, puis une autre, puis une autre, sans jamais trouver la bonne." }
      - { who: veilleur, text: "Halte ! Je suis le Veilleur. Je garde les clés de la ville depuis cinquante ans. Mais j'ai oublié laquelle ouvre la Tour… Et j'ai oublié pourquoi il faut l'ouvrir." }
      - { who: thessaly, text: "Aidons-le. Chaque bonne réponse lui rend une clé. Et du haut de la Tour, nous verrons enfin d'où vient le Brouillard." }
      - { who: narrateur, text: "Thessaly parle calmement, mais les apprenties remarquent qu'elle ne quitte plus des yeux la mer. Là-bas, à l'horizon, une vague de brume grise avance, haute comme une falaise." }
      - { who: plume, text: "Le Brouillard monte vite, ce soir. Je n'aime pas ça. Ma lanterne non plus : elle clignote toute seule." }
      - { who: thessaly, text: "Axelle, Maelle, Rafaelle. Quoi qu'il arrive, restez ensemble. Trois lueurs ensemble sont plus fortes que n'importe quel brouillard. Promettez-le-moi." }
      - { who: narrateur, text: "Les trois sœurs se regardent, un peu surprises par la voix de Thessaly. Puis elles hochent la tête toutes les trois en même temps." }
      - { who: thessaly, to: axelle, text: "Axelle, tiens bien ta lanterne. Elle est plus forte que tu ne le crois." }
    manches:
      - id: m1
        title: Les suites du Veilleur
        tours:
          axelle:
            - { gen: maths.suite, count: 2 }
          maelle:
            - { id: ch03-j4-ma-m1a, subject: maths, level: 3, kind: qcm, prompt: "Thessaly part à 8 h 40 et marche 1 h 25. À quelle heure arrive-t-elle ?", choices: ["9 h 40", "9 h 65", "10 h 05", "10 h 15", "11 h 05"], answer: "10 h 05", clock: "8:40", hint: "8 h 40 + 1 h = 9 h 40. Puis + 25 min." }
            - { gen: maths.suite }
          rafaelle:
            - { id: ch03-j4-ra-m1a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 3/8 + 1/8.", choices: ["1/4", "1/2", "3/4", "1/8", "2/3"], answer: "1/2", hint: "4/8, c'est aussi…" }
            - { gen: maths.suite }
      - id: m2
        title: Les villes d'autrefois
        tours:
          axelle:
            - { id: ch03-j4-ax-m2a, subject: maths, level: 3, kind: qcm, prompt: "7 dizaines et 3 unités : quel nombre ?", choices: ["37", "73", "70", "703", "10"], answer: "73", hint: "7 dizaines = 70." }
            - { id: ch03-j4-ax-m2b, subject: maths, level: 3, kind: qcm, prompt: "Quelle est la moitié de 30 ?", choices: ["60", "15", "10", "20", "25"], answer: "15", hint: "La moitié de 3 dizaines." }
          maelle:
            - { id: ch03-j4-ma-m2a, subject: histoire-geo, level: 2, kind: qcm, prompt: "Au Moyen Âge, comment les villes se protégeaient-elles ?", choices: ["avec des barrières en papier", "avec des murs de bois", "avec des remparts", "avec des tranchées", "avec des fusées"], answer: "avec des remparts", hint: "Comme la ville d'aujourd'hui !" }
            - { id: ch03-j4-ma-m2b, subject: maths, level: 2, kind: qcm, prompt: "De 9 h 15 à 10 h 05 : combien de temps s'est écoulé ?", choices: ["45 min", "50 min", "55 min", "40 min", "1 h 05"], answer: "50 min", clock: "9:15", hint: "De 9 h 15 à 10 h : 45 min. Puis 5 de plus." }
          rafaelle:
            - { id: ch03-j4-ra-m2a, subject: histoire-geo, level: 2, kind: qcm, prompt: "Dans une cité grecque antique, où se réunissaient les citoyens ?", choices: ["dans un château fort", "sur le forum", "sur l'agora", "dans une bibliothèque", "dans une usine"], answer: "sur l'agora", hint: "C'était la grande place publique." }
            - { id: ch03-j4-ra-m2b, subject: histoire-geo, level: 2, kind: qcm, prompt: "Quelle était la capitale de l'Empire romain ?", choices: ["Athènes", "Alexandrie", "Rome", "Carthage", "Paris"], answer: "Rome", hint: "Elle a donné son nom à l'empire." }
      - id: m3
        title: Le poème du guet
        tours:
          axelle:
            - { id: ch03-j4-ax-m3a, subject: francais, level: 2, kind: libre, validation: soeurs, prompt: "Récite à voix haute le poème du guet, sans regarder.", read: "Brume, brume, va-t'en, la lanterne brille au vent." }
            - { id: ch03-j4-ax-m3b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 3 × 8.", choices: ["11", "24", "21", "32", "28"], answer: "24", hint: "8 + 8 + 8." }
          maelle:
            - { id: ch03-j4-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "La grande aiguille est sur 3, la petite entre 7 et 8. Quelle heure est-il ?", choices: ["7 h 45", "7 h 15", "8 h 15", "7 h 03", "3 h 07"], answer: "7 h 15", clock: "7:15", hint: "Grande aiguille sur 3 : un quart d'heure." }
            - { id: ch03-j4-ma-m3b, subject: maths, level: 3, kind: qcm, prompt: "Quelle est la plus grande fraction ?", choices: ["1/4", "1/3", "1/2", "1/5", "1/6"], answer: "1/2", hint: "Une moitié de gâteau, ou un tiers ?" }
          rafaelle:
            - { id: ch03-j4-ra-m3a, subject: maths, level: 3, kind: qcm, prompt: "Combien d'axes de symétrie a un carré ?", choices: ["2", "4", "1", "8", "0"], answer: "4", hint: "Deux médianes et deux diagonales." }
            - { id: ch03-j4-ra-m3b, subject: maths, level: 3, kind: qcm, prompt: "Deux angles complémentaires : combien de degrés font-ils ensemble ?", choices: ["180°", "90°", "45°", "360°", "60°"], answer: "90°", hint: "Ils forment un angle droit." }
      - id: m4
        title: Le dernier verrou
        intro: "Les trois apprenties travaillent ensemble sur le dernier verrou de la Tour. Thessaly tient la lanterne."
        tours:
          axelle:
            - { id: ch03-j4-ax-m4a, subject: maths, level: 4, kind: qcm, prompt: "3 centaines et 7 dizaines : quel nombre ?", choices: ["730", "370", "307", "37", "3070"], answer: "370", hint: "300 + 70." }
            - { id: ch03-j4-ax-m4b, subject: maths, level: 4, kind: qcm, prompt: "Quel est le chemin le plus court ?", choices: ["12 pas", "10 pas", "9 pas", "15 pas", "20 pas"], answer: "9 pas", hint: "Le plus petit nombre de pas." }
          maelle:
            - { id: ch03-j4-ma-m4a, subject: maths, level: 4, kind: qcm, prompt: "Calcule 3 h 50 + 2 h 25.", choices: ["5 h 75", "6 h 15", "5 h 15", "6 h 75", "7 h 15"], answer: "6 h 15", hint: "50 min + 25 min = 75 min = 1 h 15." }
            - { id: ch03-j4-ma-m4b, subject: maths, level: 4, kind: qcm, prompt: "Combien de côtés a un hexagone ?", choices: ["5", "6", "8", "4", "7"], answer: "6", hint: "Hexa veut dire six." }
          rafaelle:
            - { id: ch03-j4-ra-m4a, subject: maths, level: 4, kind: qcm, prompt: "Calcule (−2) × (−3).", choices: ["-6", "6", "5", "-5", "1"], answer: "6", hint: "Moins par moins donne plus." }
            - { id: ch03-j4-ra-m4b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 3/4 ÷ 3.", choices: ["3/4", "1/4", "9/4", "1/12", "1/3"], answer: "1/4", hint: "Partager trois quarts en 3, c'est un quart chacun." }
    pause: "Pause des gardes : tenez-vous droites comme des statues pendant 10 secondes, sans rire… si vous y arrivez !"
    closing:
      - { who: narrateur, text: "Le dernier verrou cède avec un grand « clong » de bronze. La porte de la Tour s'ouvre. Mais au même instant, la vague de brouillard touche le port, monte le long du rocher, et éteint toutes les lanternes d'un seul souffle." }
      - { who: narrateur, text: "Il fait noir. Il fait silence. On n'entend plus que la mer. Pendant un long moment, personne ne bouge." }
      - { who: narrateur, text: "Puis, doucement, les trois lanternes des apprenties se rallument d'elles-mêmes : la dorée, la blanche, la rose. Quand la lumière revient, Thessaly n'est plus là. Sa canne est tombée sur les pavés." }
      - { who: plume, text: "Elle… elle était juste là. Je suis là, moi. On reste ensemble, d'accord ? C'est ce qu'elle a dit. On reste ensemble." }
      - { who: nilo, text: "On va la retrouver. Je vous le promets. Cette fois, c'est une vraie promesse. Pas une promesse de Nilo. Une vraie." }
      - { who: narrateur, text: "Axelle ramasse la canne. Elle est tiède, comme si quelqu'un venait de la lâcher. Et tout en haut, sur le pommeau d'argent, une petite lumière bat doucement, comme un cœur." }
    reward: "la Canne de Thessaly"

  # ─────────────────────────── JOUR 5 ───────────────────────────
  - n: 5
    title: La nuit de la décision
    decor: La place de la ville, de nuit. La canne de Thessaly tremble doucement, posée au milieu des apprenties.
    opening:
      - { who: narrateur, text: "La nuit est tombée sur la Ville de Brume. Sur la grande place, les apprenties se sont assises en cercle, avec Plume, Nilo et Mouf. Personne n'a envie de dormir." }
      - { who: narrateur, text: "Au milieu du cercle, la canne de Thessaly est posée sur les pavés. Sa lumière bat toujours. Et de temps en temps, elle frémit, comme si elle voulait montrer un chemin." }
      - { who: plume, text: "Thessaly nous a appris à chercher ensemble. Alors on décide ensemble, d'abord. Comme elle aurait voulu." }
      - { who: nilo, text: "Il faut que je vous dise quelque chose. La lettre de Thessaly… je l'ai trouvée sur la route, avant de vous rencontrer. Je ne l'ai pas volée. Elle disait juste : « Protégez les trois lueurs. » Je n'ai pas compris. Maintenant, je comprends un peu." }
      - { who: mouf, text: "Moi, je ne comprends rien. Mais je reste avec vous. C'est mieux que de courir dans le brouillard avec des épis." }
      - { who: narrateur, text: "Autour de la place, les habitants qui ont retrouvé leur nom sortent un à un de leurs maisons. Ils apportent des lanternes, des couvertures, des bols de soupe chaude. Ils ne disent rien. Ils sont juste là." }
    manches:
      - id: m1
        title: La Guitare des Noms
        intro: "Chaque nom retrouvé est une note. Axelle lit les initiales, Maelle trie par famille, Rafaelle trouve le sens."
        tours:
          axelle:
            - { id: ch03-j5-ax-m1a, subject: francais, level: 5, kind: qcm, prompt: "« Les noms sont gardés. » Quel est le sujet ?", choices: ["sont gardés", "Les noms", "gardés", "noms", "Thessaly"], answer: "Les noms", hint: "Qu'est-ce qui est gardé ?" }
            - { id: ch03-j5-ax-m1b, subject: francais, level: 4, kind: qcm, prompt: "Choisis : « Il (est / et) grand. »", choices: ["et", "es", "est", "ait", "été"], answer: "est", hint: "Remplace par « était » : ça marche ? Alors c'est le verbe." }
          maelle:
            - { id: ch03-j5-ma-m1a, subject: francais, level: 4, kind: qcm, prompt: "Conjugue à l'imparfait : « Nous (chercher) ».", choices: ["nous cherchons", "nous cherchions", "nous chercherons", "nous cherchâmes", "nous cherchiont"], answer: "nous cherchions", hint: "À l'imparfait, nous se termine par -ions." }
            - { id: ch03-j5-ma-m1b, subject: maths, level: 2, kind: qcm, prompt: "Arrondis 3 478 à la centaine.", choices: ["3 400", "3 500", "3 470", "3 000", "3 580"], answer: "3 500", hint: "Regarde le chiffre des dizaines : 7." }
          rafaelle:
            - { id: ch03-j5-ra-m1a, subject: francais, level: 4, kind: qcm, prompt: "« Je sais que le nom reviendra. » Quelle est la fonction de la subordonnée ?", choices: ["sujet", "complément de temps", "COD", "attribut du sujet", "complément de lieu"], answer: "COD", hint: "Je sais quoi ?" }
            - { id: ch03-j5-ra-m1b, subject: maths, level: 3, kind: qcm, prompt: "Quelle est la formule du périmètre d'un rectangle de longueur L et de largeur l ?", choices: ["L × l", "2 × L × l", "2 × (L + l)", "4 × (L + l)", "L + l"], answer: "2 × (L + l)", hint: "Deux longueurs et deux largeurs." }
      - id: m2
        title: Le défi de la nuit
        intro: "Pour que la canne montre le chemin, chaque apprentie relève un défi de la classe supérieure."
        tours:
          axelle:
            - { id: ch03-j5-ax-m2a, subject: maths, level: 5, kind: qcm, prompt: "Calcule 120 ÷ 4.", choices: ["40", "30", "20", "300", "34"], answer: "30", hint: "12 ÷ 4 = 3." }
            - { id: ch03-j5-ax-m2b, subject: maths, level: 5, kind: qcm, prompt: "Arrondis 478 à la dizaine.", choices: ["470", "480", "500", "400", "48"], answer: "480", hint: "Le chiffre des unités est 8 : on monte." }
          maelle:
            - { id: ch03-j5-ma-m2a, subject: maths, level: 5, kind: qcm, prompt: "5 rues comptent 20 maisons. Combien de maisons pour 8 rues ?", choices: ["35", "32", "40", "28", "24"], answer: "32", hint: "Une rue = 4 maisons." }
            - { id: ch03-j5-ma-m2b, subject: maths, level: 5, kind: qcm, prompt: "Calcule 3,6 ÷ 4.", choices: ["0,8", "0,9", "1,2", "9", "0,09"], answer: "0,9", hint: "36 ÷ 4 = 9, puis place la virgule." }
          rafaelle:
            - { id: ch03-j5-ra-m2a, subject: maths, level: 5, kind: qcm, prompt: "Développe 3(x + 2).", choices: ["3x + 2", "3x + 6", "x + 6", "3x + 5", "5x + 6"], answer: "3x + 6", hint: "3 multiplie x et aussi 2." }
            - { id: ch03-j5-ra-m2b, subject: maths, level: 5, kind: qcm, prompt: "Calcule 5².", choices: ["10", "25", "20", "15", "50"], answer: "25", hint: "5 × 5." }
      - id: m3
        title: Le chant de la ville
        intro: "Les trois apprenties chantent ensemble les noms retrouvés. La ville répond."
        tours:
          axelle:
            - { id: ch03-j5-ax-m3a, subject: musique, level: 3, kind: libre, validation: soeurs, prompt: "Chante ton prénom sur trois notes, puis celui de tes deux sœurs." }
          maelle:
