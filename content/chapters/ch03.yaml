    pause: "La ville chante : chacune tape un rythme sur ses genoux, et les autres doivent le répéter !"
    closing:
      - { who: narrateur, text: "La ville se remet à chanter. Un à un, les habitants chantent leur nom retrouvé, et chaque nom est une note qui monte dans la nuit. La brume recule jusqu'aux remparts, puis jusqu'à la mer." }
      - { who: narrateur, text: "Mais le dernier nom, personne ne le retrouve. C'est celui d'un enfant, inscrit autrefois dans le registre, à côté d'une toute petite lanterne. Personne ne se souvient de lui." }
      - { who: narrateur, text: "Plume baisse les yeux. Il ne dit rien. Sa lanterne, au bout de sa queue, devient toute pâle." }
      - { who: mouf, text: "Ça va, Plume ? Tu veux mon écharpe ? Elle est très chaude. Je l'ai payée avec une feuille." }
      - { who: nilo, text: "Regardez la canne ! Elle tremble… elle tourne… elle se pointe vers l'est, sur la route de brume." }
      - { who: narrateur, text: "Les trois sœurs se lèvent. Devant elles, la route de l'est s'enfonce dans la nuit. Quelque part au bout, Thessaly les attend. Et demain, l'aventure continue." }
