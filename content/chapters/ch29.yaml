            - { id: ch29-j1-ax-m3a, subject: maths, level: 1, kind: qcm, prompt: "Solen connaît 4 chants de courage, et 3 chants de mémoire. Combien de chants en tout, parmi ces deux catégories ?", choices: ["5", "6", "7", "8", "9"], answer: "7", hint: "4 + 3." }
            - { id: ch29-j1-ax-m3b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi chanter ensemble, en groupe, procure-t-il souvent un sentiment de réconfort ou de cohésion particulier ?", choices: ["partager un rythme et une mélodie communs crée un lien immédiat entre les personnes présentes", "chanter ensemble n'a jamais aucun effet sur un groupe", "cela n'a aucune explication particulière", "chanter seul procure toujours plus de réconfort que chanter en groupe", "le chant n'a jamais aucun lien avec la cohésion d'un groupe"], answer: "partager un rythme et une mélodie communs crée un lien immédiat entre les personnes présentes", hint: "Pense à ce que propose Solen avec cette veillée, autour du feu de camp." }
