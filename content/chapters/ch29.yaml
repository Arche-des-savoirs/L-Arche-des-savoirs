            - { id: ch29-j1-ax-m2b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 13 − 6.", choices: ["5", "6", "7", "8", "9"], answer: "7", hint: "13 − 6 = 7." }
          maelle:
            - { id: ch29-j1-ma-m2a, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « chaleureux » dans « un sourire chaleureux » ?", choices: ["nom", "verbe", "adjectif", "adverbe", "pronom"], answer: "adjectif", hint: "Il décrit le sourire de Solen, à l'arrivée des sœurs." }
            - { id: ch29-j1-ma-m2b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 376 ÷ 4.", choices: ["86", "88", "90", "92", "94"], answer: "94", hint: "4 × 94 = 376." }
          rafaelle:
            - { id: ch29-j1-ra-m2a, subject: francais, level: 4, kind: qcm, prompt: "« Je parcours ces chemins depuis des années, en quête de chants à apprendre et à partager. » : que révèle cette phrase sur Solen ?", choices: ["qu'il consacre sa vie à collecter et transmettre des chants au fil de ses voyages", "qu'il reste toujours au même endroit, sans jamais voyager", "qu'il refuse systématiquement d'apprendre de nouveaux chants", "qu'il ne partage jamais ce qu'il connaît avec personne", "qu'il considère les chants comme sans aucune importance"], answer: "qu'il consacre sa vie à collecter et transmettre des chants au fil de ses voyages", hint: "Repense à ce que dit Solen sur sa vie de barde itinérant." }
            - { id: ch29-j1-ra-m2b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 12² − 80.", choices: ["58", "60", "62", "64", "68"], answer: "64", hint: "144 − 80." }
      - id: m3
        title: Une veillée bienvenue
        tours:
