      - { who: solen, text: "Il y a d'abord les chants de courage, petites voyageuses, qui donnent de la force avant une épreuve difficile, comme celle qui vous attend bientôt." }
      - { who: rafaelle, text: "Et les chants de mémoire, vous disiez, ils servent à quoi, exactement ?" }
      - { who: solen, text: "À se souvenir, petite Archiviste. Ils racontent un chemin déjà parcouru, pour qu'on n'en oublie jamais les étapes les plus marquantes." }
