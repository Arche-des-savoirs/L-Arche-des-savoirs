# Chapitre 29 — Le Barde Solen et la Dernière Veillée
# Nouveau personnage : Solen, un barde itinérant rencontré au sommet de l'escalier de
# l'architecte, qui propose aux trois sœurs une dernière veillée de chants avant l'ultime
# ascension. Voix : Achernar. Pas d'effet ORVANE ni de drapeau pour ce chapitre (absent de
# decisions.ts) : décision purement narrative sur le choix du chant à apprendre ensemble.

id: ch29
number: 29
act: 2
title: Le Barde Solen et la Dernière Veillée
introImage: ch29
scene: veillee-du-sommet

espagnol:
  - { es: "El canto une a los viajeros.", fr: "Le chant unit les voyageurs." }
  - { es: "La última noche se acerca.", fr: "La dernière nuit approche." }
  - { es: "Cada canción cuenta una historia.", fr: "Chaque chanson raconte une histoire." }
  - { es: "La cima ya no está lejos.", fr: "Le sommet n'est plus loin." }
  - { es: "Cantar juntos da valor.", fr: "Chanter ensemble donne du courage." }

decision:
  prompt: "Solen accorde doucement son instrument, assis au bord du dernier palier de l'escalier, le sommet déjà visible au loin. « Pour cette dernière veillée avant l'ascension finale, je peux vous apprendre un chant de courage, pour affronter sans peur ce qui vous attend, un chant de mémoire, pour vous souvenir de tout ce chemin parcouru, ou un chant tout simplement joyeux, pour profiter de cette dernière soirée tranquille. Lequel choisissez-vous ? »"
  options:
    A:
      label: Apprendre un chant de courage, pour l'ascension finale
      scene: "Rafaelle demande à Solen de leur apprendre un chant de courage, pour affronter sans peur l'ascension finale qui les attend, quelle qu'en soit la difficulté."
      line: { who: solen, text: "Un choix qui vous servira bien, petite Archiviste. Le courage, en chanson, se partage et se multiplie, bien plus facilement qu'on ne le croit." }
      habillage: "Les épreuves prennent la forme d'un apprentissage vibrant et énergique, porté par des mélodies qui donnent envie d'avancer sans crainte."
    B:
      label: Apprendre un chant de mémoire, pour se souvenir du chemin parcouru
      scene: "Maelle préfère que Solen leur apprenne un chant de mémoire, pour garder le souvenir de tout le chemin parcouru depuis le début de leur voyage."
      line: { who: solen, text: "Un choix empreint de sagesse, petite Cartographe. Se souvenir de son chemin, c'est souvent la meilleure façon d'avancer vers la suite." }
      habillage: "Les épreuves prennent la forme d'un apprentissage nostalgique et tendre, où chaque mélodie rappelle une étape déjà traversée."
    C:
      label: Apprendre un chant joyeux, pour profiter de la soirée
      scene: "Axelle choisit plutôt un chant tout simplement joyeux, pour profiter pleinement de cette dernière soirée tranquille avant l'ascension finale."
      line: { who: solen, text: "Une sage décision aussi, petite Veilleuse. La joie, avant un grand moment, vaut parfois mieux que toutes les préparations sérieuses du monde." }
      habillage: "Les épreuves prennent la forme d'un apprentissage léger et enjoué, plein de rires et de refrains entraînants."

repliquesAbsurdes:
  - "Si chaque chanson raconte une histoire, est-ce que Solen connaît une chanson qui raconte juste l'histoire d'un bâillement, pour les soirs fatigués ?"
  - "Mon renard a essayé de chanter avec Solen. Résultat : un seul « yip » suraigu, et toute la veillée a éclaté de rire."
  - "Est-ce qu'on peut demander à Solen de composer, sur place, une chanson juste sur nous trois, pour l'emporter avec nous jusqu'au sommet ?"
  - "Si chanter ensemble donne du courage, est-ce que chanter tout seul, dans son coin, donne au moins un peu de confiance, ou rien du tout ?"
  - "Après un escalier taillé dans la roche et une distillation réussie, une veillée à chanter autour d'un feu, ça semble presque un cadeau, en fait."

days:
  # ─────────────────────────── JOUR 1 ───────────────────────────
  - n: 1
    title: Le barde du dernier palier
    decor: Le dernier palier de l'escalier de l'architecte, où un feu de camp crépite doucement, et où un homme accorde un instrument de bois et de cordes, le sommet visible au loin.
    opening:
      - { who: narrateur, text: "Le sentier, après l'escalier achevé, menait désormais à un large palier rocheux, où un feu de camp crépitait doucement sous un ciel déjà strié des premières couleurs du soir." }
      - { who: narrateur, text: "Près du feu, un homme au manteau usé par les voyages accordait patiemment un instrument de bois et de cordes, le regard tourné vers le sommet, encore lointain mais désormais bien visible." }
      - { who: rafaelle, text: "Bonsoir ! On ne s'attendait pas à trouver quelqu'un ici, si près du sommet." }
      - { who: narrateur, text: "L'homme leva les yeux, un sourire chaleureux aux lèvres, et posa son instrument sur ses genoux avec une délicatesse évidente." }
      - { who: solen, text: "On m'appelle Solen, petites voyageuses. Je suis barde, et je parcours ces chemins depuis des années, en quête de chants à apprendre et à partager." }
      - { who: axelle, text: "Et vous restez souvent longtemps au même endroit, comme ça ?" }
      - { who: solen, text: "Jamais bien longtemps, petite Veilleuse. Mais ce soir, j'avais justement envie d'une veillée, et votre arrivée tombe à merveille." }
      - { who: maelle, text: "Une veillée, ça veut dire qu'on va chanter ensemble, alors ?" }
      - { who: solen, text: "Exactement, petite Cartographe. Reste à savoir quel chant vous ferait le plus plaisir d'apprendre, ce soir." }
    manches:
      - id: m1
        title: Un palier au bord du ciel
        tours:
          axelle:
            - { id: ch29-j1-ax-m1a, subject: histoire-geo, level: 1, kind: qcm, prompt: "Comment appelle-t-on une personne qui compose et chante des histoires en voyageant, accompagnée d'un instrument ?", choices: ["un barde", "un marchand", "un architecte", "un messager", "un berger"], answer: "un barde", hint: "C'est le métier de Solen, rencontré sur le dernier palier." }
            - { id: ch29-j1-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 7 + 8.", choices: ["13", "14", "15", "16", "17"], answer: "15", hint: "7 + 8 = 7 + 7 + 1." }
          maelle:
            - { id: ch29-j1-ma-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Pourquoi un feu de camp est-il souvent allumé lors d'une veillée en montagne, même en dehors de son utilité pour la chaleur ?", choices: ["il crée une lumière et une atmosphère propices au rassemblement et au partage", "un feu de camp n'a jamais aucun effet sur l'ambiance d'une soirée", "cela n'a aucune explication particulière", "un feu de camp empêche toujours les gens de se rassembler", "la lumière du feu n'a jamais aucune utilité lors d'une veillée"], answer: "il crée une lumière et une atmosphère propices au rassemblement et au partage", hint: "Pense à l'ambiance du feu de camp, autour duquel Solen propose sa veillée." }
            - { id: ch29-j1-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 64 + 58.", choices: ["118", "120", "122", "124", "126"], answer: "122", hint: "64 + 60 − 2." }
          rafaelle:
            - { id: ch29-j1-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi, historiquement, les bardes et conteurs itinérants ont-ils joué un rôle important dans la transmission des histoires et des chants ?", choices: ["parce qu'ils voyageaient de lieu en lieu, partageant et faisant circuler les récits et mélodies entre communautés", "parce que les bardes n'ont jamais eu aucun rôle dans la transmission des histoires", "cela n'a aucune importance historique", "parce qu'il est toujours impossible de transmettre un chant sans l'écrire", "parce que seuls les écrits ont permis de transmettre des histoires"], answer: "parce qu'ils voyageaient de lieu en lieu, partageant et faisant circuler les récits et mélodies entre communautés", hint: "Pense au rôle de Solen, qui parcourt les chemins en quête de chants à apprendre et à partager." }
            - { id: ch29-j1-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 17 × 5.", choices: ["75", "80", "82", "85", "88"], answer: "85", hint: "17 × 5 = 17 × 10 ÷ 2." }
      - id: m2
