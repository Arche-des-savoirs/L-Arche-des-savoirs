            - { id: ch29-j5-ra-m2b, subject: francais, level: 4, kind: qcm, prompt: "« Lequel choisissez-vous ? » : à qui Solen adresse-t-il cette question ?", choices: ["aux trois sœurs", "à lui-même", "à Nilo", "au narrateur", "à personne en particulier"], answer: "aux trois sœurs", hint: "Relis le début du cinquième jour." }
      - id: m3
        title: Le Chant de la Dernière Veillée
        intro: "Solen et les trois sœurs chantent enfin ensemble, sous les étoiles, le chant choisi la veille, pour clore cette dernière soirée avant l'ascension finale."
        tours:
          axelle:
            - { id: ch29-j5-ax-m3a, subject: musique, level: 3, kind: libre, validation: soeurs, prompt: "Tape ta mesure en rythme : noire, noire, blanche." }
          maelle:
            - { id: ch29-j5-ma-m3a, subject: musique, level: 3, kind: libre, validation: soeurs, prompt: "Tape ta mesure en rythme : noire, noire, noire, noire." }
          rafaelle:
            - { id: ch29-j5-ra-m3a, subject: musique, level: 3, kind: libre, validation: soeurs, prompt: "Tape ta mesure en rythme : blanche, blanche." }
    concert:
      measures:
        axelle: { given: [1, 1], missing: 2, prompt: "Noire, noire, blanche" }
        maelle: { given: [1, 1, 1], missing: 1, prompt: "Noire, noire, noire, noire" }
        rafaelle: { given: [2], missing: 2, prompt: "Blanche, blanche" }
    pause: "Le dernier regard vers le sommet : chaque sœur, juste après la dernière note, lève les yeux vers le sommet désormais tout proche, et respire profondément, prête pour le lendemain."
    closing:
      - { who: narrateur, text: "La dernière note du Chant de la Dernière Veillée se répandit sur le palier rocheux, et s'éleva doucement vers le ciel étoilé, comme pour rejoindre le sommet lui-même." }
      - { who: solen, text: "Voilà, petites voyageuses. Vous emporterez ce chant avec vous, demain, pour l'ascension finale. Il vous servira bien, j'en suis certain." }
      - { who: rafaelle, text: "Merci pour tout, Solen. On n'oubliera jamais cette veillée sous les étoiles." }
      - { who: narrateur, text: "Et tandis que l'aube approchait doucement, les trois sœurs s'installèrent pour une dernière nuit de repos, le cœur empli du chant tout juste appris, et le regard déjà tourné vers le sommet." }
      - { who: axelle, text: "Demain, on y sera enfin. Ça paraît presque irréel, après tout ce chemin." }
      - { who: nilo, text: "Irréel, mais bien réel, pourtant. Encore une étape de passée, et l'ascension finale qui nous attend, dès demain." }
    reward: "la dernière veillée avec Solen, et le chant emporté vers le sommet"
