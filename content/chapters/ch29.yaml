          rafaelle:
            - { id: ch29-j1-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « El canto une a los viajeros. »", choices: ["Le chant unit les voyageurs.", "Le chant fatigue les voyageurs.", "Le chant perd les voyageurs.", "Le chant effraie les voyageurs.", "Le chant endort les voyageurs."], answer: "Le chant unit les voyageurs.", hint: "« Une a los viajeros » = unit les voyageurs." }
