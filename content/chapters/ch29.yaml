      - id: m2
        title: Avant la dernière veillée
        intro: "Il faut relier tout ce que la semaine a appris sur les chants et leur transmission, avant la dernière veillée sous les étoiles."
        tours:
          axelle:
            - { id: ch29-j5-ax-m2a, subject: francais, level: 2, kind: qcm, prompt: "Quel nom désigne une soirée passée à discuter, chanter ou raconter des histoires autour d'un feu ?", choices: ["une veillée", "une distillation", "une architecture", "une cartographie", "une astronomie"], answer: "une veillée", hint: "C'est ce que propose Solen aux trois sœurs." }
            - { id: ch29-j5-ax-m2b, subject: maths, level: 2, kind: qcm, prompt: "Calcule 15 − 7.", choices: ["6", "7", "8", "9", "10"], answer: "8", hint: "15 − 7 = 8." }
          maelle:
            - { id: ch29-j5-ma-m2a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi cette dernière veillée avec Solen a-t-elle une importance particulière dans le voyage des trois sœurs ?", choices: ["elle n'a aucune importance réelle", "elle leur offre un moment de choix, de partage et de préparation avant l'ascension finale vers le sommet", "elle les empêche d'avancer vers le sommet", "elle se trouve très loin des montagnes", "personne n'y vient jamais vraiment"], answer: "elle leur offre un moment de choix, de partage et de préparation avant l'ascension finale vers le sommet", hint: "Repense à tout ce que les sœurs ont vécu cette semaine, auprès de Solen." }
            - { id: ch29-j5-ma-m2b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 408 ÷ 6.", choices: ["64", "66", "68", "70", "72"], answer: "68", hint: "6 × 68 = 408." }
          rafaelle:
