            - { id: ch29-j1-ma-m3b, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi une rencontre inattendue, comme celle avec Solen, peut-elle enrichir un voyage de façon particulière ?", choices: ["parce qu'elle apporte un moment de partage et de découverte qui n'était pas prévu au départ", "parce qu'une rencontre inattendue n'a jamais aucune valeur pour un voyage", "cela n'a aucun lien avec l'enrichissement d'un voyage", "parce qu'il vaut toujours mieux éviter toute rencontre imprévue", "parce qu'une veillée improvisée n'apporte jamais rien de particulier"], answer: "parce qu'elle apporte un moment de partage et de découverte qui n'était pas prévu au départ", hint: "Pense à la joie des trois sœurs de rencontrer Solen, juste avant l'ascension finale." }
