      - { who: solen, text: "Exactement, petite Cartographe. Parfois, la joie simple vaut mieux que toute préparation sérieuse, avant un grand moment." }
      - { who: axelle, text: "C'est difficile de choisir entre les trois, en fait." }
      - { who: solen, text: "C'est précisément pour ça que je vous laisse le temps d'y réfléchir, petite Veilleuse." }
