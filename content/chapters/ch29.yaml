    pause: "Le jeu de l'accord improvisé : chaque sœur fredonne, tour à tour, une courte mélodie de son invention, pendant que les autres essaient de deviner l'humeur qu'elle voulait exprimer."
    closing:
      - { who: narrateur, text: "Le feu de camp continua de crépiter doucement, tandis que Solen rangeait son instrument pour la nuit, satisfait, visiblement, de cette rencontre inattendue." }
      - { who: solen, text: "Demain, nous choisirons ensemble le chant de cette veillée. Reposez-vous bien, la décision mérite d'être prise avec l'esprit léger." }
      - { who: axelle, text: "On sera prêtes à décider, demain matin." }
      - { who: narrateur, text: "Et tandis que la nuit tombait doucement sur le palier rocheux, le sommet, au loin, semblait veiller sur eux tous, silencieux et patient." }
    reward: "la découverte du barde Solen, et de sa veillée promise"
  # ─────────────────────────── JOUR 2 ───────────────────────────
