            - { gen: maths.comparer }
          maelle:
            - { id: ch29-j2-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 330 − 157.", choices: ["170", "172", "173", "175", "177"], answer: "173", hint: "330 − 160 + 3." }
            - { gen: maths.ranger }
          rafaelle:
            - { id: ch29-j2-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « La última noche se acerca. »", choices: ["La dernière nuit approche.", "La dernière nuit s'éloigne.", "La dernière nuit disparaît.", "La dernière nuit fait peur.", "La dernière nuit dure peu."], answer: "La dernière nuit approche.", hint: "« Se acerca » = approche." }
            - { gen: maths.duree }
    pause: "Le jeu du refrain partagé : chaque sœur invente une courte phrase rythmée qui pourrait servir de refrain à une chanson, et les deux autres la répètent en chœur, pour s'entraîner à chanter ensemble."
    closing:
      - { who: narrateur, text: "Le soir venu, les trois sœurs observèrent longuement le sommet au loin, essayant d'imaginer quel chant leur ferait le plus de bien pour cette dernière veillée." }
      - { who: solen, text: "Demain, il faudra choisir : un chant de courage, un chant de mémoire, ou un chant joyeux. Réfléchissez-y bien, cette nuit." }
      - { who: rafaelle, text: "On y réfléchira sérieusement, c'est promis." }
      - { who: narrateur, text: "Et tandis que la nuit tombait sur le palier rocheux, Solen accordait encore une fois son instrument, comme pour se préparer, lui aussi, à cette dernière veillée partagée." }
    reward: "la découverte des trois sortes de chants, expliquées par Solen"
  # ─────────────────────────── JOUR 3 ───────────────────────────
  - n: 3
    title: L'histoire d'un chant oublié
    decor: Le palier rocheux, où Solen raconte aux trois sœurs l'histoire d'un chant qu'il a failli oublier à jamais, il y a bien des années.
    opening:
      - { who: narrateur, text: "Le troisième jour, tandis que la lumière du matin baignait le palier rocheux, Solen raconta aux trois sœurs l'histoire d'un chant qu'il avait failli oublier à jamais, il y a bien des années." }
      - { who: solen, text: "C'était un chant de mémoire, justement, appris d'une vieille conteuse rencontrée une seule fois. Je l'ai presque perdu, faute de l'avoir chanté assez souvent." }
      - { who: maelle, text: "Et comment vous avez réussi à vous en souvenir, finalement ?" }
      - { who: solen, text: "Par chance, petite Cartographe, et beaucoup de patience. Il m'a fallu des années pour en retrouver chaque mot, chaque note, une à une." }
      - { who: axelle, text: "C'est pour ça que vous insistez tant sur l'importance de se souvenir, aujourd'hui ?" }
      - { who: solen, text: "Exactement, petite Veilleuse. Une leçon apprise de cette façon-là, on ne l'oublie jamais vraiment, justement parce qu'elle parlait d'oubli." }
      - { who: rafaelle, text: "Merci de nous avoir raconté ça. Ça aide à comprendre pourquoi un chant de mémoire a autant de valeur." }
      - { who: solen, text: "C'est aussi pour ça que je le raconte, petite Archiviste. Pour que d'autres comprennent la fragilité de ce qu'on croit toujours pouvoir retrouver." }
    manches:
      - id: m1
        title: Un chant presque perdu
        tours:
          axelle:
            - { id: ch29-j3-ax-m1a, subject: maths, level: 1, kind: qcm, prompt: "Il y a 6 mots retrouvés la première année, et 3 mots retrouvés l'année suivante. Combien de mots en tout ?", choices: ["7", "8", "9", "10", "11"], answer: "9", hint: "6 + 3." }
            - { id: ch29-j3-ax-m1b, subject: francais, level: 1, kind: qcm, prompt: "Quel est le contraire de « oublié » ?", choices: ["retrouvé", "perdu", "effacé", "disparu", "égaré"], answer: "retrouvé", hint: "Le contraire de ce qu'était le chant de Solen, avant qu'il ne le reconstitue." }
          maelle:
            - { id: ch29-j3-ma-m1a, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi un chant ou une histoire transmise oralement, sans être écrite, peut-elle facilement se perdre avec le temps ?", choices: ["sans trace écrite, la mémoire humaine reste la seule garante de sa conservation, et elle peut faiblir", "un chant transmis oralement ne se perd jamais, quelles que soient les circonstances", "cela n'a aucune explication particulière", "l'écrit n'a jamais aucun avantage sur la transmission orale", "un chant se conserve toujours parfaitement sans aucun effort"], answer: "sans trace écrite, la mémoire humaine reste la seule garante de sa conservation, et elle peut faiblir", hint: "Pense au risque qu'a connu Solen, de perdre ce chant appris d'une vieille conteuse." }
            - { id: ch29-j3-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 87 + 56.", choices: ["138", "140", "142", "143", "145"], answer: "143", hint: "87 + 60 − 4." }
          rafaelle:
            - { id: ch29-j3-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi raconter ses propres difficultés passées à d'autres personnes peut-il avoir une réelle utilité, au-delà du simple récit ?", choices: ["parce que cela permet aux autres de mieux comprendre la valeur de ce qui est facilement oublié", "parce que raconter ses difficultés n'a jamais aucune utilité pour les autres", "cela n'a aucun lien avec la transmission d'une expérience", "parce qu'il vaut toujours mieux cacher ses difficultés passées", "parce qu'une difficulté personnelle ne concerne jamais que soi-même"], answer: "parce que cela permet aux autres de mieux comprendre la valeur de ce qui est facilement oublié", hint: "Repense à ce que dit Solen sur la raison pour laquelle il raconte cette histoire." }
            - { id: ch29-j3-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 14 × 6.", choices: ["80", "82", "84", "86", "88"], answer: "84", hint: "14 × 6 = 14 × 3 × 2." }
      - id: m2
        title: Reconstituer, mot par mot
        tours:
          axelle:
            - { id: ch29-j3-ax-m2a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le sujet de « Un chant s'est presque perdu. » ?", choices: ["presque", "s'est perdu", "Un chant", "un", "chant"], answer: "Un chant", hint: "Qu'est-ce qui s'est presque perdu, dans le récit de Solen ?" }
            - { id: ch29-j3-ax-m2b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 9 + 7.", choices: ["14", "15", "16", "17", "18"], answer: "16", hint: "9 + 7 = 9 + 9 − 2." }
          maelle:
            - { id: ch29-j3-ma-m2a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 364 ÷ 4.", choices: ["86", "88", "90", "91", "93"], answer: "91", hint: "4 × 91 = 364." }
            - { id: ch29-j3-ma-m2b, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « fragilité » dans « la fragilité de ce qu'on croit toujours pouvoir retrouver » ?", choices: ["nom", "verbe", "adjectif", "adverbe", "pronom"], answer: "nom", hint: "C'est l'idée centrale de la leçon de Solen, sur ce qu'on risque de perdre." }
          rafaelle:
            - { id: ch29-j3-ra-m2a, subject: maths, level: 5, kind: qcm, prompt: "Calcule 11² − 70.", choices: ["48", "51", "53", "56", "58"], answer: "51", hint: "121 − 70." }
            - { id: ch29-j3-ra-m2b, subject: espagnol, level: 3, kind: qcm, prompt: "Traduis : « La cima ya no está lejos. »", choices: ["Le sommet n'est plus loin.", "Le sommet reste invisible.", "Le sommet disparaît souvent.", "Le sommet fait peur toujours.", "Le sommet dure longtemps."], answer: "Le sommet n'est plus loin.", hint: "« Ya no está lejos » = n'est plus loin." }
      - id: m3
        title: La valeur de se souvenir
        tours:
          axelle:
            - { id: ch29-j3-ax-m3a, subject: maths, level: 1, kind: qcm, prompt: "Calcule 14 − 6.", choices: ["6", "7", "8", "9", "10"], answer: "8", hint: "14 − 6 = 8." }
            - { id: ch29-j3-ax-m3b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi répéter régulièrement un chant ou une information aide-t-il à ne pas l'oublier, à l'inverse de ce qui est arrivé à Solen ?", choices: ["la répétition renforce la trace laissée dans la mémoire, rendant le souvenir plus durable", "répéter une information n'a jamais aucun effet sur la mémoire", "cela n'a aucune explication particulière", "la mémoire fonctionne toujours mieux sans aucune répétition", "un souvenir se renforce toujours tout seul, sans aucun effort"], answer: "la répétition renforce la trace laissée dans la mémoire, rendant le souvenir plus durable", hint: "Pense au risque qu'a connu Solen, en ne chantant pas assez souvent ce chant de mémoire." }
          maelle:
            - { id: ch29-j3-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 46 × 4.", choices: ["178", "182", "184", "186", "190"], answer: "184", hint: "46 × 4 = 50 × 4 − 4 × 4." }
            - { id: ch29-j3-ma-m3b, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi écouter le récit d'une difficulté passée, racontée par quelqu'un d'expérimenté, peut-il aider à mieux agir à l'avenir ?", choices: ["parce que cela permet de comprendre concrètement l'importance de préserver ce qui pourrait se perdre", "parce qu'un tel récit n'a jamais aucune utilité pour agir ensuite", "cela n'a aucun lien avec la prise de décision", "parce que seules les décisions personnelles ont de la valeur", "parce qu'écouter un récit retarde toujours inutilement une action"], answer: "parce que cela permet de comprendre concrètement l'importance de préserver ce qui pourrait se perdre", hint: "Repense à ce que ressentent les trois sœurs après avoir écouté le récit de Solen." }
          rafaelle:
            - { id: ch29-j3-ra-m3a, subject: maths, level: 4, kind: qcm, prompt: "Résous : 7x − 8 = 34.", choices: ["5", "6", "7", "8", "9"], answer: "6", hint: "7x = 42." }
            - { id: ch29-j3-ra-m3b, subject: francais, level: 4, kind: qcm, prompt: "Conjugue au futur simple : « Nous (chanter) ce chant, ensemble, toutes les trois. »", choices: ["nous chanterons", "nous chantons", "nous chantions", "nous chantâmes", "nous chanterions"], answer: "nous chanterons", hint: "Futur simple de « chanter »." }
      - id: m4
        title: Comprendre la mémoire
        tours:
          axelle:
            - { id: ch29-j3-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 9 × 5.", choices: ["40", "42", "44", "45", "48"], answer: "45", hint: "9 × 5 = 9 × 10 ÷ 2." }
            - { gen: maths.suite }
          maelle:
            - { id: ch29-j3-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 295 − 137.", choices: ["150", "154", "156", "158", "160"], answer: "158", hint: "295 − 140 + 3." }
            - { gen: maths.addition }
          rafaelle:
            - { id: ch29-j3-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « Cantar juntos da valor. »", choices: ["Chanter ensemble donne du courage.", "Chanter ensemble effraie toujours.", "Chanter ensemble n'apprend rien.", "Chanter ensemble prend une minute.", "Chanter ensemble reste inutile."], answer: "Chanter ensemble donne du courage.", hint: "« Da valor » = donne du courage." }
            - { gen: maths.multiplication }
    pause: "Le jeu du récit transmis : chaque sœur raconte, en une phrase, un petit souvenir qu'elle tient particulièrement à ne jamais oublier, pour s'exercer à l'importance de la mémoire, comme Solen."
    closing:
      - { who: narrateur, text: "La soirée se prolongea doucement sur le palier rocheux, entre récits et silences, tandis que le feu de camp éclairait doucement les visages attentifs des trois sœurs." }
      - { who: solen, text: "Demain, il faudra enfin vous décider. Prenez cette dernière nuit pour y réfléchir une dernière fois, à la lumière de tout ce qu'on a partagé." }
      - { who: maelle, text: "On y réfléchira, c'est promis. Merci de nous avoir raconté votre histoire." }
      - { who: narrateur, text: "Et tandis que les trois sœurs regagnaient leur campement pour la nuit, Nilo observait Solen gratter encore quelques notes, pensif, comme s'il comprenait, lui aussi, le poids d'un souvenir presque perdu." }
    reward: "l'histoire du chant presque oublié, et sa leçon de mémoire"
  # ─────────────────────────── JOUR 4 ───────────────────────────
  - n: 4
    title: Se décider ensemble
    decor: Le palier rocheux, dans la lumière grise du petit matin, où les trois sœurs retrouvent Solen pour lui annoncer, enfin, leur décision.
    opening:
      - { who: narrateur, text: "Le quatrième jour, les trois sœurs retrouvèrent Solen sur le palier rocheux, dans la lumière grise du petit matin, prêtes à lui annoncer leur décision." }
      - { who: solen, text: "Pour cette dernière veillée avant l'ascension finale, je peux vous apprendre un chant de courage, un chant de mémoire, ou un chant joyeux. Lequel choisissez-vous ? »" }
      - { who: rafaelle, text: "On y a bien réfléchi, Solen. Et on a pris une décision, toutes les trois ensemble." }
      - { who: solen, text: "Je vous écoute, petite Archiviste. Quelle qu'elle soit, je l'accueillerai avec plaisir." }
    manches:
      - id: m1
        title: Peser le pour et le contre
        tours:
          axelle:
            - { id: ch29-j4-ax-m1a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le contraire de « nostalgique » (en parlant d'un chant) ?", choices: ["joyeux", "mélancolique", "triste", "tendre", "songeur"], answer: "joyeux", hint: "Le contraire de ce qu'est un chant de mémoire, selon la description du chapitre." }
            - { id: ch29-j4-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 8 + 6.", choices: ["12", "13", "14", "15", "16"], answer: "14", hint: "8 + 6 = 8 + 8 − 2." }
          maelle:
            - { id: ch29-j4-ma-m1a, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi une décision prise après avoir écouté l'expérience d'un spécialiste est-elle souvent plus solide qu'une décision prise sans aucune information ?", choices: ["parce qu'elle s'appuie sur des connaissances concrètes plutôt que sur une simple impression", "parce qu'une décision collective n'a jamais aucun avantage", "cela n'a aucun lien avec la qualité d'une décision", "parce qu'une décision sans information est toujours meilleure", "parce qu'écouter un spécialiste retarde toujours inutilement une décision"], answer: "parce qu'elle s'appuie sur des connaissances concrètes plutôt que sur une simple impression", hint: "Pense à tout ce que Solen a enseigné aux sœurs sur les trois sortes de chants, cette semaine." }
            - { id: ch29-j4-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 92 + 59.", choices: ["146", "148", "150", "151", "153"], answer: "151", hint: "92 + 60 − 1." }
          rafaelle:
            - { id: ch29-j4-ra-m1a, subject: francais, level: 4, kind: qcm, prompt: "« Je l'accueillerai avec plaisir. » : que révèle cette phrase sur l'attitude de Solen ?", choices: ["qu'il reste ouvert à tout choix des sœurs, sans en privilégier aucun", "qu'il refusera forcément leur décision", "qu'il attend d'elles une seule réponse précise", "qu'il n'a aucune considération pour leur choix", "qu'il préfère toujours décider seul, à leur place"], answer: "qu'il reste ouvert à tout choix des sœurs, sans en privilégier aucun", hint: "Repense à l'attitude de Solen depuis le début de ce chapitre." }
            - { id: ch29-j4-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 13² − 100.", choices: ["59", "63", "66", "69", "73"], answer: "69", hint: "169 − 100." }
      - id: m2
        title: Les trois propositions
        tours:
          axelle:
            - { id: ch29-j4-ax-m2a, subject: maths, level: 1, kind: qcm, prompt: "Calcule 15 − 8.", choices: ["6", "7", "8", "9", "10"], answer: "7", hint: "15 − 5 = 10, puis − 3." }
            - { id: ch29-j4-ax-m2b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi le choix d'un chant, parmi plusieurs possibles, dépend-il souvent de ce dont on a le plus besoin à un moment donné ?", choices: ["chaque type de chant répond à un besoin différent : courage, souvenir ou légèreté", "le choix d'un chant n'a jamais aucun lien avec un besoin particulier", "cela n'a aucune explication particulière", "il existe toujours un seul chant adapté à toutes les situations", "les besoins d'un groupe n'ont jamais aucune influence sur un choix de chant"], answer: "chaque type de chant répond à un besoin différent : courage, souvenir ou légèreté", hint: "Pense aux trois types de chants proposés par Solen, chacun répondant à un besoin différent." }
          maelle:
            - { id: ch29-j4-ma-m2a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 351 ÷ 3.", choices: ["107", "111", "115", "117", "119"], answer: "117", hint: "3 × 117 = 351." }
            - { id: ch29-j4-ma-m2b, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « solide » dans « une décision solide » ?", choices: ["nom", "adjectif", "verbe", "adverbe", "pronom"], answer: "adjectif", hint: "Il décrit une décision bien réfléchie." }
          rafaelle:
            - { id: ch29-j4-ra-m2a, subject: maths, level: 5, kind: qcm, prompt: "Calcule 8² + 2 × 10.", choices: ["74", "78", "82", "84", "88"], answer: "84", hint: "64 + 20." }
            - { id: ch29-j4-ra-m2b, subject: espagnol, level: 2, kind: qcm, prompt: "Comment dit-on « Le chant unit les voyageurs » en espagnol ?", choices: ["El canto une a los viajeros.", "La última noche se acerca.", "Cada canción cuenta una historia.", "La cima ya no está lejos.", "Cantar juntos da valor."], answer: "El canto une a los viajeros.", hint: "Relis la phrase du jour 1." }
      - id: m3
        title: Annoncer sa décision
        tours:
          axelle:
            - { id: ch29-j4-ax-m3a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le sujet de « Les trois sœurs retrouvèrent Solen. » ?", choices: ["Solen", "retrouvèrent", "Les trois sœurs", "trois", "sœurs"], answer: "Les trois sœurs", hint: "Qui retrouve Solen, sur le palier rocheux ?" }
            - { id: ch29-j4-ax-m3b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 11 − 5.", choices: ["5", "6", "7", "8", "9"], answer: "6", hint: "11 − 5 = 6." }
          maelle:
            - { id: ch29-j4-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 29 × 4.", choices: ["108", "112", "114", "116", "120"], answer: "116", hint: "30 × 4 − 4." }
            - { id: ch29-j4-ma-m3b, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi annoncer une décision claire à un barde lui permet-il de mieux préparer la veillée qui suit ?", choices: ["parce qu'il peut ainsi choisir précisément les mots et les mélodies adaptés au chant demandé", "parce qu'annoncer une décision n'a jamais aucune utilité pour un barde", "cela n'a aucun lien avec la préparation d'une veillée", "parce qu'il vaut toujours mieux rester dans l'incertitude", "parce que la clarté retarde toujours une décision"], answer: "parce qu'il peut ainsi choisir précisément les mots et les mélodies adaptés au chant demandé", hint: "Pense à l'utilité, pour Solen, de connaître la décision des sœurs à l'avance." }
          rafaelle:
            - { id: ch29-j4-ra-m3a, subject: maths, level: 4, kind: qcm, prompt: "Résous : 4x + 11 = 35.", choices: ["4", "5", "6", "7", "8"], answer: "6", hint: "4x = 24." }
            - { id: ch29-j4-ra-m3b, subject: francais, level: 4, kind: qcm, prompt: "« Lequel choisissez-vous ? » : quelle est la nature du mot « lequel » dans cette phrase ?", choices: ["pronom interrogatif", "nom", "adjectif", "adverbe", "verbe"], answer: "pronom interrogatif", hint: "Il reprend l'idée des trois chants proposés, pour poser la question du choix." }
      - id: m4
        title: Un moment de vérité
        tours:
          axelle:
            - { id: ch29-j4-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 7 × 5.", choices: ["30", "32", "33", "35", "38"], answer: "35", hint: "7 × 5 = 7 × 10 ÷ 2." }
            - { gen: maths.comparer }
          maelle:
            - { id: ch29-j4-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 260 − 118.", choices: ["138", "140", "142", "144", "146"], answer: "142", hint: "260 − 120 + 2." }
            - { gen: maths.ranger }
          rafaelle:
            - { id: ch29-j4-ra-m4a, subject: maths, level: 4, kind: qcm, prompt: "Calcule 15 × 6.", choices: ["86", "88", "90", "92", "94"], answer: "90", hint: "15 × 6 = 15 × 3 × 2." }
            - { gen: maths.duree }
    pause: "Le jeu du compte à rebours avant le chant : chaque sœur compte, à voix haute, de 5 à 1, avant de prononcer, toutes ensemble, le mot qui résume leur décision commune."
    closing:
      - { who: narrateur, text: "Les trois sœurs échangèrent un dernier regard, puis, d'une seule voix, annoncèrent à Solen la décision qu'elles avaient prise ensemble, après mûre réflexion." }
      - { who: solen, text: "Je vous entends, petites voyageuses, et votre choix me convient très bien. Préparons-nous, alors, pour cette dernière veillée." }
      - { who: maelle, text: "On a vraiment hâte de chanter avec vous, ce soir." }
      - { who: narrateur, text: "Et tandis que le soir tombait sur le palier rocheux, Solen accorda une dernière fois son instrument, prêt à transmettre ce qu'il savait de mieux." }
    reward: "la décision prise ensemble, annoncée à Solen"
  # ─────────────────────────── JOUR 5 ───────────────────────────
  - n: 5
    title: La dernière veillée
    decor: Le palier rocheux, sous un ciel étoilé, où les trois sœurs vivent leur dernière soirée avec Solen avant l'ascension finale vers le sommet.
    opening:
      - { who: narrateur, text: "Le cinquième jour, sous un ciel étoilé, les trois sœurs retrouvèrent Solen pour leur dernière veillée avant l'ascension finale, selon la décision prise la veille." }
      - { who: solen, text: "Pour cette dernière veillée avant l'ascension finale, je peux vous apprendre un chant de courage, un chant de mémoire, ou un chant joyeux. Lequel choisissez-vous ? »" }
      - { who: nilo, text: "Allez, les filles. Une dernière veillée sous les étoiles, et on reprendra la route dès demain, prêtes pour ce qui nous attend." }
    manches:
      - id: m1
        title: Ce que la veillée a appris
        intro: "Solen interroge chaque sœur sur tout ce que ces quelques jours passés en sa compagnie lui ont appris."
        tours:
          axelle:
            - { id: ch29-j5-ax-m1a, subject: histoire-geo, level: 2, kind: qcm, prompt: "Comment appelle-t-on une personne qui compose et chante des histoires en voyageant, accompagnée d'un instrument ?", choices: ["un barde", "un marchand", "un architecte", "un messager", "un berger"], answer: "un barde", hint: "C'est le métier de Solen." }
            - { id: ch29-j5-ax-m1b, subject: maths, level: 2, kind: qcm, prompt: "Calcule 8 + 5.", choices: ["11", "12", "13", "14", "15"], answer: "13", hint: "8 + 5 = 8 + 2 + 3." }
          maelle:
