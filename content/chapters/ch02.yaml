# Chapitre 2 — Les Champs de Brume
# Sources : Plan narratif v2 (intrigue : graines volées par les Oublions, Mouf, Nilo et sa carte effacée),
# doc « Saison 1, chapitres 2 à 9 » (thèmes des jours), Banque d'exercices S1-C2 (questions),
# doc des variantes (décision : que faire de Nilo qui a volé une gerbe ?).
# Lueurs : dorée (Axelle), blanche (Maelle), rose (Rafaelle). Niveaux : 1 à 3 = classe ; 4 et 5 = classe supérieure.

id: ch02
number: 2
act: 1
title: Les Champs de Brume
introImage: ch02
scene: champs-de-brume

espagnol:
  - { es: "La semilla recuerda.", fr: "La graine se souvient." }
  - { es: "El trigo es de oro.", fr: "Le blé est en or." }
  - { es: "Las manzanas están maduras.", fr: "Les pommes sont mûres." }
  - { es: "El molino gira despacio.", fr: "Le moulin tourne doucement." }
  - { es: "La cosecha vuelve.", fr: "La récolte revient." }

decision:
  prompt: "Nilo s'enfuit avec la dernière gerbe de blé. Que faire de lui ?"
  options:
    A:
      label: L'inviter à partager
      scene: "Nilo s'assoit au milieu du champ et tape le rythme sur une vieille marmite. Autour de lui, la récolte revient en cercle, épi après épi."
      line: { who: nilo, text: "Pour une fois, je suis dans le groupe." }
      habillage: "Les fractions deviennent des parts de gerbe partagées en cercle : une moitié, un quart, un huitième."
    B:
      label: Le rattraper
      scene: "Une course folle de champ en champ ! Les filles récupèrent la gerbe en jouant, et Nilo finit par rire en tombant dans la paille."
      line: { who: nilo, text: "Vous êtes rapides ! Pas assez, quand même." }
      habillage: "Les fractions deviennent des distances de course : la moitié du champ, puis le quart."
    C:
      label: Suivre ses traces
      scene: "Les traces de Nilo dessinent une carte du champ. Les filles les suivent sans bruit, jusqu'à la cachette des épis."
      line: { who: plume, text: "Chut… il laisse des empreintes…" }
      habillage: "Les fractions deviennent des empreintes à compter et à comparer."

repliquesAbsurdes:
  - "Monsieur l'Épouvantail, vous avez une paille dans le nez. Et partout, en fait."
  - "Je réponds si vous arrêtez de faire peur aux pigeons. Ils sont gentils."
  - "Mon loup veut savoir si vous mangez de la soupe de paille."
  - "Vous êtes très bien habillé. Pour un balai."

days:
  # ─────────────────────────── JOUR 1 ───────────────────────────
  - n: 1
    title: Le jardin vide
    decor: Les Champs de l'Arche au crépuscule. Les épis sont gris, la brume rampe entre les sillons.
    opening:
      - { who: narrateur, text: "Le lendemain, l'Arche se réveille sans un grain dans ses greniers. Les cuisiniers ouvrent les sacs : vides. Les boulangers ouvrent les huches : vides. Même les souris de l'Arche, qui ont toujours un petit stock caché, se grattent la tête." }
      - { who: narrateur, text: "Thessaly mène les apprenties à l'avant du navire, là où s'étendent les Champs de l'Arche, de grandes prairies suspendues au-dessus de la mer. D'habitude, le blé y ondule comme une mer d'or." }
      - { who: narrateur, text: "Mais ce matin, les champs sont gris. Les épis sont gris, les fleurs sont grises, et une brume basse rampe entre les sillons comme un chat qui chasse. Et dans cette brume courent de petites créatures rondes, les bras chargés d'épis." }
      - { who: thessaly, text: "Des Oublions. Ce sont des créatures de brouillard. Ils volent les graines… puis ils oublient pourquoi. Il faut rallumer les Champs avant que tout soit effacé." }
      - { who: thessaly, to: axelle, text: "Axelle, ta lueur voit les choses minuscules. Cherche les graines tombées : chacune est une petite étincelle qui attend." }
      - { who: narrateur, text: "Un Oublion plus rond que les autres s'arrête net devant les filles. Il a un épi dans la bouche, deux grands yeux étonnés, et l'air de ne plus savoir du tout ce qu'il fait là." }
      - { who: mouf, text: "Bonjour ! Je suis… heu… je suis venu pour… J'ai oublié. Vous voulez un épi ? Il est très bon. Je crois. Je ne m'en souviens plus." }
      - { who: maelle, text: "Comment tu t'appelles ?" }
      - { who: mouf, text: "Mouf ! Non… Moufle ? Mouf. Allez, Mouf. C'est joli, Mouf." }
      - { who: plume, text: "Regardez cet épi : il y a une trace de plume dessus, toute fine, presque dorée. Je la connais… mais je ne sais pas d'où. C'est comme un mot qu'on a sur le bout de la langue." }
      - { who: thessaly, text: "Garde cette sensation, Plume. Les souvenirs perdus reviennent souvent par le nez avant de revenir par la tête." }
    manches:
      - id: m1
        title: Les graines tombées
        intro: "Les Oublions laissent tomber des graines en courant. Comptez-les et rangez-les."
        tours:
          axelle:
            - { id: ch02-j1-ax-m1a, subject: maths, level: 1, kind: nombre, prompt: "8 gerbes partagées en 2 tas égaux : combien dans chaque tas ?", answer: 4, hint: "Partage 8 en deux parts pareilles." }
            - { gen: maths.comparer }
          maelle:
            - { id: ch02-j1-ma-m1a, subject: maths, level: 1, kind: nombre, prompt: "Dans la fraction 3/5, quel est le dénominateur ?", answer: 5, hint: "C'est le nombre du bas." }
            - { gen: maths.comparer }
          rafaelle:
            - { id: ch02-j1-ra-m1a, subject: maths, level: 1, kind: court, prompt: "Simplifie la fraction 6/8.", answer: "3/4", hint: "Divise le haut et le bas par 2." }
            - { gen: maths.ranger }
      - id: m2
        title: Le calcul des sillons
        tours:
          axelle:
            - { id: ch02-j1-ax-m2a, subject: maths, level: 1, kind: nombre, prompt: "Calcule 7 + 8.", answer: 15, hint: "7 + 3 = 10, puis encore 5." }
            - { id: ch02-j1-ax-m2b, subject: maths, level: 1, kind: nombre, prompt: "Calcule 20 − 6.", answer: 14, hint: "Recule de 6 depuis 20." }
          maelle:
            - { id: ch02-j1-ma-m2a, subject: maths, level: 1, kind: nombre, prompt: "Calcule 8 × 7.", answer: 56, hint: "8 × 7, c'est 7 × 8 : 56." }
            - { id: ch02-j1-ma-m2b, subject: maths, level: 1, kind: nombre, prompt: "Calcule 72 ÷ 9.", answer: 8, hint: "Combien de fois 9 dans 72 ?" }
          rafaelle:
            - { id: ch02-j1-ra-m2a, subject: maths, level: 1, kind: nombre, prompt: "Calcule 84 ÷ 7.", answer: 12, hint: "7 × 12 = 84." }
            - { id: ch02-j1-ra-m2b, subject: maths, level: 1, kind: nombre, prompt: "Calcule 2,5 × 4.", answer: 10, hint: "Deux fois 2,5 font 5." }
      - id: m3
        title: L'étiquette du grenier
        intro: "Une vieille étiquette pend à la porte du grenier. Il faut la lire."
        tours:
          axelle:
            - { id: ch02-j1-ax-m3a, subject: francais, level: 1, kind: court, prompt: "Lis : « Nilo a pris du blé. » Qui a pris du blé ?", answer: "Nilo", read: "Nilo a pris du blé.", hint: "Cherche le nom au début de la phrase." }
            - { id: ch02-j1-ax-m3b, subject: francais, level: 2, kind: court, prompt: "« un champ » : quelle lettre écrit-on à la fin, sans la prononcer ?", answer: "p", hint: "On l'écrit mais on ne la prononce pas." }
          maelle:
            - { id: ch02-j1-ma-m3a, subject: francais, level: 1, kind: court, prompt: "Complète les accords : « Les champ… sont grand… » (écris les deux mots).", answer: "champs grands", accept: ["les champs sont grands"], hint: "Les : c'est pluriel. Ajoute un s." }
            - { id: ch02-j1-ma-m3b, subject: francais, level: 2, kind: court, prompt: "Conjugue au présent : « Ils (récolter) ».", answer: "ils récoltent", accept: ["récoltent"], hint: "Avec ils, la fin est -ent." }
          rafaelle:
            - { id: ch02-j1-ra-m3a, subject: francais, level: 1, kind: court, prompt: "Accorde : « Les champs (couvert) de brume ».", answer: "couverts", accept: ["les champs couverts de brume"], hint: "Le participe s'accorde avec « les champs » : masculin pluriel." }
            - { id: ch02-j1-ra-m3b, subject: espagnol, level: 2, kind: court, prompt: "Traduis : « el trigo ».", answer: "le blé", accept: ["blé"], hint: "C'est ce qui pousse dans le champ et donne la farine." }
      - id: m4
        title: Le cycle de la graine
        tours:
          axelle:
            - { id: ch02-j1-ax-m4a, subject: sciences, level: 2, kind: qcm, prompt: "De quoi une graine a-t-elle besoin pour germer ?", choices: ["D'eau et de chaleur", "De sable et de nuit", "De sel et de vent"], answer: "D'eau et de chaleur", hint: "Pense à ce qu'on donne à une plante pour qu'elle pousse." }
            - { gen: maths.suite }
          maelle:
            - { id: ch02-j1-ma-m4a, subject: sciences, level: 3, kind: ordre, prompt: "Remets dans l'ordre le cycle d'une plante.", choices: ["fleur", "graine", "germination"], answer: ["graine", "germination", "fleur"], hint: "Tout commence par une petite graine." }
            - { id: ch02-j1-ma-m4b, subject: sciences, level: 2, kind: qcm, prompt: "Quel organe de la plante absorbe l'eau ?", choices: ["la racine", "la fleur", "la feuille"], answer: "la racine", hint: "Il est caché sous la terre." }
          rafaelle:
            - { id: ch02-j1-ra-m4a, subject: sciences, level: 3, kind: qcm, prompt: "Que produit une plante grâce à la lumière ?", choices: ["De la matière et du dioxygène", "Du sable", "De l'eau salée"], answer: "De la matière et du dioxygène", hint: "C'est la photosynthèse : elle fabrique sa nourriture et rejette ce que nous respirons." }
            - { gen: maths.arrondi }
    pause: "Les Oublions s'enfuient ! Courez sur place comme eux pendant 10 secondes, puis figez-vous comme un épouvantail."
    closing:
      - { who: narrateur, text: "Les graines ramassées se rallument une à une, comme des braises qu'on souffle. Là où elles tombent, un brin de blé doré perce la brume." }
      - { who: narrateur, text: "Sur la colline, un garçon en gilet vert observe la scène depuis un moment, assis sur un rocher. Il a les cheveux en bataille, des rouleaux de cartes sous le bras, et le sourire de quelqu'un qui en sait plus qu'il ne le dit." }
      - { who: nilo, text: "Pas mal, pour des apprenties. Moi, c'est Nilo. Cartographe. Enfin… presque cartographe. Disons cartographe en devenir." }
      - { who: narrateur, text: "Il déroule une carte pour la leur montrer. Mais les bords de la carte sont effacés, comme rongés par la brume. Là où devraient être les rivières et les villes, il n'y a que du blanc." }
      - { who: plume, text: "Sa carte a des bords tout effacés. Bizarre, non ? Une carte qui oublie… je n'en avais jamais vu." }
      - { who: nilo, text: "C'est… une carte spéciale. Très rare. On ne pose pas de questions sur les cartes rares. C'est la règle des cartographes." }

  # ─────────────────────────── JOUR 2 ───────────────────────────
  - n: 2
    title: Le champ de blé
    decor: Un champ immense où le blé repousse par endroits, doré au milieu de la brume grise.
    opening:
      - { who: narrateur, text: "Le deuxième jour, le soleil se lève rouge sur les Champs. Au milieu du gris, une bande de blé doré brille déjà, là où les graines ont été rallumées hier. Elle ondule doucement, comme si elle respirait." }
      - { who: thessaly, text: "Aujourd'hui, nous faisons repousser le blé. Mais attention : la terre de l'Arche est juste. Elle ne donne qu'à ceux qui partagent justement. Chaque sillon a droit à sa part." }
      - { who: narrateur, text: "Thessaly s'agenouille et pose la main sur la terre. Sous ses doigts, une lumière douce court dans les sillons, comme de l'eau dans des rigoles." }
      - { who: thessaly, text: "Autrefois, on disait que les Champs de l'Arche étaient nés d'une seule graine, offerte par un enfant à un voyageur affamé. Depuis, chaque épi se souvient de ce partage." }
      - { who: nilo, text: "Je peux aider à porter les gerbes. Promis, je ne les garde pas. Enfin… pas toutes. Enfin… je plaisante. Presque." }
      - { who: mouf, text: "Moi je porte celle-là ! Euh… c'est quoi, une gerbe ? Ah, c'est ça ? C'est lourd. Je la pose. Voilà. Mission accomplie." }
      - { who: thessaly, to: axelle, text: "Axelle, regarde les épis : certains sont doubles, d'autres à moitié. Compte-les bien, la terre aime qu'on soit précis." }
      - { who: narrateur, text: "Le fauconneau de Rafaelle s'envole au-dessus du champ et pousse un petit cri. Tout au fond, près de la lisière, des pas ont écrasé le blé pendant la nuit. Des pas de bottes, pas des pattes d'Oublion." }
    manches:
      - id: m1
        title: Doubles et moitiés
        tours:
          axelle:
            - { id: ch02-j2-ax-m1a, subject: maths, level: 2, kind: nombre, prompt: "Quelle est la moitié de 12 gerbes ?", answer: 6, hint: "Partage 12 en deux tas égaux." }
            - { id: ch02-j2-ax-m1b, subject: maths, level: 2, kind: nombre, prompt: "Quel est le quart de 8 ?", answer: 2, hint: "Le quart, c'est la moitié de la moitié." }
          maelle:
            - { id: ch02-j2-ma-m1a, subject: maths, level: 2, kind: nombre, prompt: "Calcule 1/4 de 36.", answer: 9, hint: "Divise 36 par 4." }
            - { id: ch02-j2-ma-m1b, subject: maths, level: 2, kind: court, prompt: "Une gerbe est coupée en 8 parts. 3/4 de la gerbe, c'est combien de huitièmes ? (écris la fraction)", answer: "6/8", hint: "1/4 = 2/8." }
          rafaelle:
            - { id: ch02-j2-ra-m1a, subject: maths, level: 2, kind: nombre, prompt: "Calcule 2/5 de 60.", answer: 24, hint: "1/5 de 60 = 12." }
            - { id: ch02-j2-ra-m1b, subject: maths, level: 2, kind: court, prompt: "Calcule 3/4 + 1/8.", answer: "7/8", hint: "3/4 = 6/8." }
      - id: m2
        title: Les sacs de grain
        tours:
          axelle:
            - { id: ch02-j2-ax-m2a, subject: maths, level: 2, kind: nombre, prompt: "Calcule 46 + 28.", answer: 74, hint: "6 + 8 = 14 : on écrit 4 et on retient 1." }
            - { id: ch02-j2-ax-m2b, subject: maths, level: 2, kind: nombre, prompt: "Calcule 72 − 30.", answer: 42, hint: "Enlève 3 dizaines." }
          maelle:
            - { id: ch02-j2-ma-m2a, subject: maths, level: 2, kind: nombre, prompt: "Pose et calcule : 45 × 8.", answer: 360, hint: "40 × 8 = 320, plus 5 × 8." }
            - { id: ch02-j2-ma-m2b, subject: maths, level: 2, kind: nombre, prompt: "Calcule 168 ÷ 4.", answer: 42, hint: "160 ÷ 4 = 40, il reste 8 ÷ 4." }
          rafaelle:
            - { id: ch02-j2-ra-m2a, subject: maths, level: 2, kind: nombre, prompt: "Calcule 7,2 ÷ 3.", answer: 2.4, hint: "72 ÷ 3 = 24, puis place la virgule." }
            - { id: ch02-j2-ra-m2b, subject: maths, level: 2, kind: nombre, prompt: "3 sacs contiennent 18 gerbes. Combien de gerbes dans 7 sacs ?", answer: 42, hint: "Un sac contient 6 gerbes." }
      - id: m3
        title: Ce dont la plante a besoin
        intro: "Plume a planté trois graines : une à l'ombre, une sans eau, une au soleil avec de l'eau. Laquelle pousse ?"
        tours:
          axelle:
            - { id: ch02-j2-ax-m3a, subject: sciences, level: 2, kind: qcm, prompt: "Quelle graine de Plume va pousser ?", choices: ["Celle sans eau", "Celle au soleil avec de l'eau", "Celle dans le noir sans eau"], answer: "Celle au soleil avec de l'eau", hint: "Elle a besoin de deux choses à la fois." }
            - { gen: maths.multiplication }
          maelle:
            - { id: ch02-j2-ma-m3a, subject: sciences, level: 3, kind: qcm, prompt: "Pour savoir si la lumière est utile, on compare deux pots. Que doit-on changer entre les deux ?", choices: ["Seulement la lumière", "La lumière et l'eau", "Tout"], answer: "Seulement la lumière", hint: "Une expérience juste ne change qu'une chose à la fois." }
            - { gen: maths.multiplication }
          rafaelle:
            - { id: ch02-j2-ra-m3a, subject: sciences, level: 3, kind: ordre, prompt: "Range cette chaîne alimentaire, de celui qui est mangé à celui qui mange.", choices: ["renard", "blé", "mulot"], answer: ["blé", "mulot", "renard"], hint: "Tout commence par une plante." }
            - { id: ch02-j2-ra-m3b, subject: maths, level: 2, kind: nombre, prompt: "Calcule 10 % de 350.", answer: 35, hint: "10 %, c'est diviser par 10." }
      - id: m4
        title: Le Défi des épis
        tours:
          axelle:
            - { id: ch02-j2-ax-m4a, subject: maths, level: 3, kind: nombre, prompt: "3 sacs de 6 gerbes : combien de gerbes en tout ?", answer: 18, hint: "6 + 6 + 6." }
            - { gen: maths.fraction-de }
          maelle:
            - { id: ch02-j2-ma-m4a, subject: maths, level: 3, kind: nombre, prompt: "5 sacs de 28 gerbes : combien de gerbes en tout ?", answer: 140, hint: "28 × 5 = 28 × 10 ÷ 2." }
            - { gen: maths.fraction-de }
          rafaelle:
            - { id: ch02-j2-ra-m4a, subject: francais, level: 3, kind: qcm, prompt: "« La gerbe est volée par Nilo. » La phrase est à quelle voix ?", choices: ["active", "passive"], answer: "passive", hint: "Le sujet subit l'action." }
            - { gen: maths.fraction-de }
    pause: "Le vent passe sur le blé : balancez-vous de gauche à droite comme des épis, trois fois, puis tournez sur vous-mêmes !"
    closing:
      - { who: narrateur, text: "Le blé se redresse, doré, sur la moitié du champ. Il chante quand le vent passe, un chant très ancien, sans paroles, qui fait sourire même Thessaly." }
      - { who: narrateur, text: "Les apprenties empilent les gerbes en un tas magnifique au bord du champ. Mais le soir, quand elles reviennent, une gerbe a disparu du tas." }
      - { who: mouf, text: "C'est pas moi ! Je crois. Je ne me souviens pas. Mais je crois que ce n'est pas moi. J'ai une tête de voleur ?" }
      - { who: plume, text: "Il y a des traces de bottes… et pas des pattes d'Oublion. Quelqu'un avec des bottes est venu ici. Quelqu'un qui sait où il va." }
      - { who: narrateur, text: "Sur la colline, Nilo est assis à la même place qu'hier. Il siffle un air léger, les mains derrière la tête. Il a l'air très, très innocent." }
    reward: "un sac de Graines Dorées"

  # ─────────────────────────── JOUR 3 ───────────────────────────
  - n: 3
    title: Le verger
    decor: Un verger aux pommiers gris. Quelques pommes rouges brillent encore sous la brume.
    opening:
      - { who: narrateur, text: "Le troisième jour, la route mène au verger de l'Arche. Les pommiers sont alignés comme une armée endormie, gris de la racine à la cime. Pas une fleur, pas une feuille verte. Seules quelques pommes rouges brillent encore, cachées sous la brume, comme des lanternes oubliées." }
      - { who: thessaly, text: "Le verger a oublié les saisons. Il ne sait plus quand fleurir, ni quand donner ses fruits. Il faut lui rappeler le temps qui passe : le printemps, l'été, l'automne, l'hiver." }
      - { who: nilo, text: "Je connais un raccourci pour le verger ! Il est sur ma carte… enfin, sur ce qu'il en reste. Par ici ! Non, par là. Bon, suivez-moi, on verra bien." }
      - { who: narrateur, text: "Le raccourci de Nilo les fait passer par un buisson de ronces, un ruisseau et un tas de feuilles mortes. Ils arrivent au verger en même temps que s'ils avaient pris le chemin normal, mais beaucoup plus décoiffés." }
      - { who: thessaly, to: axelle, text: "Axelle, compte les pommes tombées. Chaque pomme comptée reprend sa couleur." }
      - { who: thessaly, text: "Autrefois, les Archivistes cueillaient ces pommes pour faire la compote des fêtes. On disait qu'elle donnait des rêves de voyage." }
      - { who: plume, text: "Moi, j'en ai mangé une fois. J'ai rêvé que j'étais un nuage. C'était très mou." }
      - { who: narrateur, text: "Au milieu du verger se dresse un pommier plus vieux que les autres. Sur son tronc, quelqu'un a gravé il y a longtemps une petite lanterne et une plume. Plume s'arrête devant, la queue immobile." }
    manches:
      - id: m1
        title: Les pommes tombées
        tours:
          axelle:
            - { id: ch02-j3-ax-m1a, subject: maths, level: 2, kind: nombre, prompt: "Calcule 5 × 3.", answer: 15, hint: "5 + 5 + 5." }
            - { id: ch02-j3-ax-m1b, subject: maths, level: 3, kind: nombre, prompt: "Pose et calcule : 91 − 47.", answer: 44, hint: "1 − 7, impossible : on emprunte une dizaine." }
          maelle:
            - { id: ch02-j3-ma-m1a, subject: maths, level: 3, kind: court, prompt: "Calcule 2/7 + 3/7.", answer: "5/7", hint: "Même dénominateur : on ajoute seulement le haut." }
            - { id: ch02-j3-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Quelle est la plus grande fraction ?", choices: ["3/4", "2/3"], answer: "3/4", hint: "3/4 = 9/12 et 2/3 = 8/12." }
          rafaelle:
            - { id: ch02-j3-ra-m1a, subject: maths, level: 3, kind: court, prompt: "Calcule 1/2 × 1/3.", answer: "1/6", hint: "On multiplie les hauts entre eux, et les bas entre eux." }
            - { id: ch02-j3-ra-m1b, subject: maths, level: 3, kind: nombre, prompt: "Calcule 25 % de 240.", answer: 60, hint: "25 %, c'est le quart." }
      - id: m2
        title: Le calendrier du verger
        tours:
          axelle:
            - { id: ch02-j3-ax-m2a, subject: sciences, level: 2, kind: ordre, prompt: "Range les saisons dans l'ordre, en commençant par le printemps.", choices: ["hiver", "été", "automne", "printemps"], answer: ["printemps", "été", "automne", "hiver"], hint: "Après le printemps vient la saison la plus chaude." }
            - { id: ch02-j3-ax-m2b, subject: sciences, level: 2, kind: qcm, prompt: "En quelle saison les pommiers sont-ils en fleurs ?", choices: ["au printemps", "en hiver", "en automne"], answer: "au printemps", hint: "C'est la saison où la nature se réveille." }
          maelle:
            - { id: ch02-j3-ma-m2a, subject: maths, level: 2, kind: nombre, prompt: "3/4 d'heure, c'est combien de minutes ?", answer: 45, hint: "Un quart d'heure = 15 minutes." }
            - { id: ch02-j3-ma-m2b, subject: maths, level: 3, kind: court, prompt: "La cueillette dure de 8 h 30 à 11 h 10. Combien de temps dure-t-elle ?", answer: "2 h 40", accept: ["2h40", "2:40", "160 min"], clock: "8:30", hint: "De 8 h 30 à 10 h 30 : 2 h. Puis jusqu'à 11 h 10." }
          rafaelle:
            - { id: ch02-j3-ra-m2a, subject: maths, level: 3, kind: nombre, prompt: "5 paniers de pommes coûtent 35 pièces. Combien coûtent 8 paniers ?", answer: 56, hint: "Un panier coûte 7 pièces." }
            - { id: ch02-j3-ra-m2b, subject: maths, level: 3, kind: nombre, prompt: "Pour la compote : 6 pommes pour 4 personnes. Combien de pommes pour 10 personnes ?", answer: 15, hint: "Pour 2 personnes : 3 pommes." }
      - id: m3
        title: Les mots du verger
        tours:
          axelle:
            - { id: ch02-j3-ax-m3a, subject: francais, level: 3, kind: court, prompt: "Complète les accords : « Les gerb… sont lourd… » (écris les deux mots).", answer: "gerbes lourdes", accept: ["les gerbes sont lourdes"], hint: "C'est pluriel, et « gerbe » est féminin." }
            - { id: ch02-j3-ax-m3b, subject: francais, level: 3, kind: court, prompt: "« Il récolte » : quel est l'infinitif du verbe ?", answer: "récolter", hint: "L'infinitif se termine souvent par -er." }
          maelle:
            - { id: ch02-j3-ma-m3a, subject: francais, level: 3, kind: court, prompt: "« Nilo vole une gerbe. » Quel est le COD ?", answer: "une gerbe", hint: "Nilo vole quoi ?" }
            - { id: ch02-j3-ma-m3b, subject: francais, level: 3, kind: court, prompt: "Conjugue à l'imparfait : « Nilo (courir) ».", answer: "Nilo courait", accept: ["courait"], hint: "À l'imparfait, il/elle se termine par -ait." }
          rafaelle:
            - { id: ch02-j3-ra-m3a, subject: espagnol, level: 3, kind: court, prompt: "Traduis : « Nosotras cosechamos el trigo ».", answer: "nous récoltons le blé", hint: "Cosechar = récolter." }
            - { id: ch02-j3-ra-m3b, subject: espagnol, level: 2, kind: qcm, prompt: "Comment dit-on « la pomme » en espagnol ?", choices: ["la manzana", "la naranja", "la pera"], answer: "la manzana", hint: "Regarde la phrase du jour." }
      - id: m4
        title: Le Défi des pommiers
        tours:
          axelle:
            - { id: ch02-j3-ax-m4a, subject: maths, level: 3, kind: nombre, prompt: "Calcule 4 × 5.", answer: 20, hint: "Compte de 5 en 5, quatre fois." }
            - { gen: maths.addition }
          maelle:
            - { id: ch02-j3-ma-m4a, subject: maths, level: 3, kind: nombre, prompt: "Écris 3/10 en nombre décimal.", answer: 0.3, hint: "3 dixièmes." }
            - { gen: maths.duree }
          rafaelle:
            - { id: ch02-j3-ra-m4a, subject: sciences, level: 3, kind: qcm, prompt: "Pourquoi protéger les abeilles du verger ?", choices: ["Elles transportent le pollen et aident les fruits à se former", "Elles font peur aux Oublions", "Elles mangent les pommes pourries"], answer: "Elles transportent le pollen et aident les fruits à se former", hint: "Sans pollinisation, pas de fruits." }
            - { gen: maths.multiplication }
    pause: "Cueillette géante : tendez les bras le plus haut possible pour attraper une pomme imaginaire, cinq fois de suite !"
    closing:
      - { who: narrateur, text: "D'un seul souffle, les pommiers se couvrent de fleurs blanches, puis de feuilles vertes, puis de fruits rouges et brillants. Les abeilles reviennent en bourdonnant comme si elles n'étaient jamais parties." }
      - { who: narrateur, text: "Nilo croque une pomme, très content de lui, comme si tout ça était grâce à son raccourci." }
      - { who: nilo, text: "Vous voyez ? Mon raccourci marchait. Enfin, à peu près. Enfin, on est arrivés." }
      - { who: plume, text: "Nilo, ta carte… d'où elle vient, au juste ?" }
      - { who: nilo, text: "Oh, celle-là ? Un cadeau. D'un… monsieur. Un monsieur très gentil, très gris. Peu importe ! Qui veut une pomme ?" }
      - { who: narrateur, text: "Thessaly ne dit rien. Mais elle regarde la carte de Nilo un long moment, et son visage devient soucieux." }
    reward: "un Panier du Verger"

  # ─────────────────────────── JOUR 4 ───────────────────────────
  - n: 4
    title: Le moulin
    decor: Un vieux moulin à vent dont les ailes sont immobiles. À ses pieds, un épouvantail grisâtre se penche lentement.
    opening:
      - { who: narrateur, text: "Le quatrième jour, un bruit manque dans les Champs : le grand moulin de l'Arche s'est tu. Ses quatre ailes, larges comme des voiles de navire, sont immobiles contre le ciel. Sans lui, pas de farine, et sans farine, pas de pain pour personne." }
      - { who: narrateur, text: "Au pied du moulin, un épouvantail grisâtre se penche lentement, d'un côté puis de l'autre, comme quelqu'un qui cherche ses lunettes." }
      - { who: epouvantail, text: "Qui êtes-vous ? Qui suis-je ? Ah oui… l'Épouvantail-Qui-Oublie. Je garde quelque chose ici. Je ne sais plus quoi. Prouvez que vous savez compter, ou partez !" }
      - { who: thessaly, text: "C'est le Gardien du moulin. Le Brouillard lui a pris sa mémoire. Il n'est pas méchant : il a peur, comme tous ceux qui ont oublié." }
      - { who: plume, text: "Il a l'air plus perdu que méchant, celui-là. Il me fait un peu de peine, en fait." }
      - { who: thessaly, text: "Pour réveiller le moulin, il faudra comprendre comment il marche : la roue, le levier, le vent. Et pour réveiller l'Épouvantail, il faudra lui rappeler à quoi il sert." }
      - { who: thessaly, to: axelle, text: "Axelle, regarde les ailes du moulin. Combien en a-t-il ? Et combien de tours feront-elles si le vent revient ?" }
      - { who: mouf, text: "Moi, j'aide ! Je souffle sur les ailes ! Fffff ! … Ça ne marche pas. Je suis un brouillard, pas un vent." }
      - { who: narrateur, text: "Derrière les meules de foin, une ombre en gilet vert se glisse sans bruit. Personne ne la remarque. Personne, sauf le fauconneau de Rafaelle, qui tourne la tête et ne la quitte plus des yeux." }
    manches:
      - id: m1
        title: Les tables du meunier
        tours:
          axelle:
            - { id: ch02-j4-ax-m1a, subject: maths, level: 3, kind: nombre, prompt: "Calcule 12 ÷ 3.", answer: 4, hint: "Partage 12 en 3 tas égaux." }
            - { gen: maths.multiplication, count: 2 }
          maelle:
            - { id: ch02-j4-ma-m1a, subject: maths, level: 4, kind: nombre, prompt: "Calcule 7,5 × 4.", answer: 30, hint: "7 × 4 = 28 et 0,5 × 4 = 2." }
            - { gen: maths.multiplication }
          rafaelle:
            - { id: ch02-j4-ra-m1a, subject: maths, level: 3, kind: nombre, prompt: "Un sac de farine pèse n kilos. Combien pèsent 4 sacs ? Si n = 5, écris le résultat.", answer: 20, hint: "4 sacs = 4 × n." }
            - { id: ch02-j4-ra-m1b, subject: maths, level: 3, kind: court, prompt: "Si une gerbe vaut n, combien valent 4 gerbes ? (écris l'expression)", answer: "4n", accept: ["4 × n", "4 x n", "4*n", "n × 4"], hint: "On écrit 4 × n, ou plus court : 4n." }
      - id: m2
        title: La roue et le levier
        tours:
          axelle:
            - { id: ch02-j4-ax-m2a, subject: sciences, level: 2, kind: qcm, prompt: "Qu'est-ce qui fait tourner les ailes du moulin ?", choices: ["le vent", "la pluie", "la lune"], answer: "le vent", hint: "On ne le voit pas, mais il pousse fort." }
            - { id: ch02-j4-ax-m2b, subject: maths, level: 3, kind: nombre, prompt: "1 m, c'est combien de centimètres ?", answer: 100, hint: "Ta règle mesure souvent 30 cm. Un mètre, c'est bien plus." }
          maelle:
            - { id: ch02-j4-ma-m2a, subject: maths, level: 4, kind: nombre, prompt: "Le champ du moulin est un rectangle de 6 m sur 4 m. Quelle est son aire, en m² ?", answer: 24, hint: "Aire = longueur × largeur." }
            - { id: ch02-j4-ma-m2b, subject: maths, level: 3, kind: nombre, prompt: "Ce même champ de 6 m sur 4 m : quel est son périmètre, en mètres ?", answer: 20, hint: "6 + 4 + 6 + 4." }
          rafaelle:
            - { id: ch02-j4-ra-m2a, subject: maths, level: 3, kind: nombre, prompt: "Aire d'un triangle de base 8 m et de hauteur 5 m, en m² ?", answer: 20, hint: "Base × hauteur ÷ 2." }
            - { gen: maths.conversion }
      - id: m3
        title: La vie au village
        tours:
          axelle:
            - { id: ch02-j4-ax-m3a, subject: francais, level: 4, kind: court, prompt: "Mets au passé composé : « Elles récoltent. »", answer: "elles ont récolté", accept: ["ont récolté"], hint: "Avoir + participe passé." }
            - { id: ch02-j4-ax-m3b, subject: francais, level: 4, kind: court, prompt: "Un cheval, des… ?", answer: "chevaux", hint: "Les mots en -al font souvent -aux." }
          maelle:
            - { id: ch02-j4-ma-m3a, subject: histoire-geo, level: 2, kind: qcm, prompt: "Dans un village rural, que trouve-t-on surtout autour des maisons ?", choices: ["des champs et des fermes", "des gratte-ciel", "des usines géantes"], answer: "des champs et des fermes", hint: "Rural, c'est la campagne." }
            - { id: ch02-j4-ma-m3b, subject: francais, level: 4, kind: court, prompt: "Conjugue au futur : « Elle (planter) ».", answer: "elle plantera", accept: ["plantera"], hint: "Infinitif + a : planter-a." }
          rafaelle:
            - { id: ch02-j4-ra-m3a, subject: sciences, level: 3, kind: qcm, prompt: "La farine du moulin sert surtout à apporter à notre corps…", choices: ["de l'énergie (glucides)", "du calcium", "de la vitamine C"], answer: "de l'énergie (glucides)", hint: "Pain, pâtes : de quoi courir toute la journée." }
            - { id: ch02-j4-ra-m3b, subject: francais, level: 3, kind: qcm, prompt: "« Nilo parle à Plume. » Quelle est la fonction de « à Plume » ?", choices: ["COD", "COI", "sujet"], answer: "COI", hint: "Il parle à qui ? Avec une préposition : complément indirect." }
      - id: m4
        title: Le Défi de l'Épouvantail
        intro: "L'Épouvantail tremble. À chaque bonne réponse, une aile du moulin bouge un peu."
        tours:
          axelle:
            - { id: ch02-j4-ax-m4a, subject: maths, level: 4, kind: nombre, prompt: "Calcule 6 × 8.", answer: 48, hint: "6 × 4 = 24, puis le double." }
            - { id: ch02-j4-ax-m4b, subject: maths, level: 4, kind: nombre, prompt: "2 kg, c'est combien de grammes ?", answer: 2000, hint: "1 kg = 1 000 g." }
          maelle:
            - { id: ch02-j4-ma-m4a, subject: maths, level: 4, kind: nombre, prompt: "Calcule 12,6 − 4,85.", answer: 7.75, hint: "Écris 12,60 pour aligner les virgules." }
            - { id: ch02-j4-ma-m4b, subject: francais, level: 4, kind: qcm, prompt: "Choisis : « Nilo range (ces / ses) gerbes, celles qui lui appartiennent. »", choices: ["ces", "ses"], answer: "ses", hint: "Ce sont les siennes : possessif." }
          rafaelle:
            - { id: ch02-j4-ra-m4a, subject: maths, level: 4, kind: nombre, prompt: "Augmente 80 de 10 %.", answer: 88, hint: "10 % de 80 = 8." }
            - { id: ch02-j4-ra-m4b, subject: maths, level: 4, kind: nombre, prompt: "Calcule −5 − 3.", answer: -8, hint: "Tu descends encore de 3 sous zéro." }
    pause: "Faites tourner vos bras comme les ailes du moulin : dix tours en avant, dix tours en arrière !"
    closing:
      - { who: narrateur, text: "Les ailes du moulin frémissent, puis se mettent à tourner, d'abord lentement, puis de plus en plus vite. À l'intérieur, la meule chante en écrasant le grain, et une farine blanche et lumineuse s'envole par la fenêtre." }
      - { who: narrateur, text: "L'Épouvantail se redresse. Ses yeux de bouton brillent. Pour la première fois, il sourit." }
      - { who: epouvantail, text: "Je me souviens ! Je garde le blé pour qu'il pousse, pas pour faire peur. Merci, petites lueurs. Je vous dois ma mémoire." }
      - { who: narrateur, text: "Mais dans le soleil couchant, une silhouette en gilet vert file entre les meules, la dernière gerbe de blé sous le bras. Elle court vite, très vite, vers la lisière des Champs." }
      - { who: mouf, text: "Hé ! Lui, il n'a pas oublié ce qu'il volait !" }
      - { who: plume, text: "C'était Nilo. J'en suis sûr. Il sentait la pomme et la carte mouillée." }
    reward: "la Farine de Lumière"

  # ─────────────────────────── JOUR 5 ───────────────────────────
  - n: 5
    title: Le Concert de la Récolte
    decor: Au centre des Champs, la Guitare de l'Arche est posée sur une meule de foin. Le blé attend sa musique.
    opening:
      - { who: narrateur, text: "Le cinquième soir, tout le peuple de l'Arche se rassemble dans les Champs. Les cuisiniers, les mousses, les vieux archivistes en robe, même les souris. Au centre, posée sur une meule de foin, la Guitare de l'Arche attend." }
      - { who: thessaly, text: "Ce soir, nous jouons la Mélodie de la Récolte. C'est la plus vieille chanson de l'Arche : elle fait pousser chaque plante qui l'entend. Mais il lui manque une gerbe pour être complète." }
      - { who: plume, text: "Il a pris la dernière gerbe. Sans elle, la mélodie sera incomplète, comme une phrase sans point." }
      - { who: narrateur, text: "Tout le monde se tourne vers la lisière. Là, dans l'ombre, Nilo se tient immobile, la gerbe serrée contre lui. Il a l'air moins fier qu'hier. Il a l'air d'avoir froid." }
      - { who: thessaly, text: "Il nous faut décider ce que nous faisons de lui. C'est à vous, apprenties. Le Conseil de la Lanterne vous appartient." }
    manches:
      - id: m1
        title: Les parts de la gerbe
        intro: "La gerbe retrouvée se partage en morceaux de musique."
        tours:
          axelle:
            - { id: ch02-j5-ax-m1a, subject: maths, level: 3, kind: court, prompt: "Combien font 1/2 + 1/2 ?", answer: "1", accept: ["1 entier", "2/2", "un entier"], hint: "Deux moitiés font une gerbe entière." }
            - { id: ch02-j5-ax-m1b, subject: maths, level: 4, kind: nombre, prompt: "Calcule 1/3 de 12.", answer: 4, hint: "Partage 12 en 3 parts égales." }
          maelle:
            - { id: ch02-j5-ma-m1a, subject: maths, level: 4, kind: court, prompt: "Calcule 5/6 − 1/6.", answer: "4/6", accept: ["2/3"], hint: "Même dénominateur : on soustrait seulement le haut." }
            - { id: ch02-j5-ma-m1b, subject: maths, level: 4, kind: nombre, prompt: "4 gerbes valent 10 pièces. Combien valent 12 gerbes ?", answer: 30, hint: "12, c'est 3 fois 4." }
          rafaelle:
            - { id: ch02-j5-ra-m1a, subject: maths, level: 4, kind: nombre, prompt: "Trouve x : 3x = 21.", answer: 7, hint: "Quel nombre multiplié par 3 donne 21 ?" }
            - { id: ch02-j5-ra-m1b, subject: maths, level: 4, kind: nombre, prompt: "12 km en 3 h : quelle est la vitesse, en km/h ?", answer: 4, hint: "Distance ÷ durée." }
      - id: m2
        title: Le défi de la Récolte
        intro: "La Guitare réclame une dernière épreuve, au niveau supérieur."
        tours:
          axelle:
            - { id: ch02-j5-ax-m2a, subject: maths, level: 5, kind: nombre, prompt: "Calcule 3/4 de 16.", answer: 12, hint: "1/4 de 16 = 4, puis 3 fois." }
            - { id: ch02-j5-ax-m2b, subject: musique, level: 3, kind: nombre, prompt: "Une noire dure 1 temps, une blanche 2 temps. Combien de temps durent 2 blanches ?", answer: 4, hint: "2 + 2." }
          maelle:
            - { id: ch02-j5-ma-m2a, subject: maths, level: 5, kind: nombre, prompt: "Calcule 50 % de 90.", answer: 45, hint: "50 %, c'est la moitié." }
            - { id: ch02-j5-ma-m2b, subject: maths, level: 5, kind: nombre, prompt: "Complète : 2/5 = ?/100.", answer: 40, hint: "Multiplie le haut et le bas par 20." }
          rafaelle:
            - { id: ch02-j5-ra-m2a, subject: maths, level: 5, kind: nombre, prompt: "Résous 2x + 3 = 11.", answer: 4, hint: "Enlève 3 des deux côtés, puis divise par 2." }
            - { id: ch02-j5-ra-m2b, subject: maths, level: 5, kind: nombre, prompt: "Quelle est la moyenne de 4, 6 et 8 ?", answer: 6, hint: "Additionne, puis divise par 3." }
      - id: m3
        title: Le Concert
        intro: "Le métronome bat 4 temps. Chaque apprentie tape sa mesure, puis toutes ensemble."
        tours:
          axelle:
            - { id: ch02-j5-ax-m3a, subject: musique, level: 3, kind: libre, validation: soeurs, prompt: "Tape ta mesure en rythme : noire, blanche, noire." }
          maelle:
            - { id: ch02-j5-ma-m3a, subject: musique, level: 3, kind: libre, validation: soeurs, prompt: "Tape ta mesure en rythme : croche, croche, noire, blanche." }
          rafaelle:
            - { id: ch02-j5-ra-m3a, subject: musique, level: 3, kind: libre, validation: soeurs, prompt: "Tape ta mesure en rythme : noire, croche, croche, blanche." }
    concert:
      measures:
        axelle: { given: [1, 2], missing: 1, prompt: "Noire, blanche, noire" }
        maelle: { given: [0.5, 0.5, 1], missing: 2, prompt: "Croche, croche, noire, blanche" }
        rafaelle: { given: [1, 0.5, 0.5], missing: 2, prompt: "Noire, croche, croche, blanche" }
    pause: "Danse de la récolte : frappez dans vos mains sur le temps, et tapez du pied sur le contretemps !"
    closing:
      - { who: narrateur, text: "La Guitare chante, et sa musique roule sur les Champs comme une vague d'or. Partout où elle passe, le blé se redresse, les épis se gonflent, et la brume recule en grondant doucement." }
      - { who: narrateur, text: "Les Oublions s'arrêtent de courir. Ils écoutent, la bouche ouverte, et certains laissent tomber leurs épis volés pour mieux taper dans leurs mains de brume." }
      - { who: mouf, text: "C'est joli… Je crois que je m'appelle… non, c'est parti. Mais c'était joli. Je m'en souviendrai. Peut-être." }
      - { who: thessaly, text: "La récolte est revenue. Le pain cuira demain dans tous les fours de l'Arche. Mais regardez là-bas : le Brouillard monte du port. La ville n'est pas loin." }
      - { who: narrateur, text: "Thessaly offre aux apprenties une Graine de Lumière. Plantée dans l'Arche, elle fera pousser un petit jardin secret, où l'on pourra se reposer quand tout ira mal." }
      - { who: plume, text: "Dans la paille, une lettre est tombée de la poche de Nilo. Elle porte le sceau de Thessaly… mais elle n'a jamais été envoyée. Pourquoi Nilo l'avait-il ?" }
    reward: "la Graine de Lumière et un nouveau fragment de la Carte Vivante"
