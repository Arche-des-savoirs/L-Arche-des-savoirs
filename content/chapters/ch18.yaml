          rafaelle:
            - { id: ch18-j2-ra-m1a, subject: francais, level: 4, kind: qcm, prompt: "« Une beauté trop facilement offerte perd, souvent, un peu de sa valeur. » : que signifie cette phrase ?", choices: ["qu'une chose rare ou méritée prend souvent plus de valeur qu'une chose immédiate", "qu'il ne faut jamais rien montrer de beau à personne", "que la beauté n'a jamais aucune valeur", "que seule la brume a de la valeur sur ce plateau", "que la rareté n'a aucun lien avec la valeur"], answer: "qu'une chose rare ou méritée prend souvent plus de valeur qu'une chose immédiate", hint: "Relis bien ce que dit la Reine sur la brume qui protège le panorama." }
            - { id: ch18-j2-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 14² − 130.", choices: ["56", "60", "64", "66", "70"], answer: "66", hint: "196 − 130." }
