# Chapitre 18 — La Reine de Brume des Cimes
# Suite directe du chapitre 17 : la carte vivante mène les sœurs toujours plus haut, jusqu'à
# un plateau suspendu dans les nuages où règne une immense silhouette de brume, la Reine
# (déjà établie, voix Callirrhoe). Décision avec effet ORVANE : src/content/decisions.ts
# attribue [2, -1, 1] aux options A/B/C (orvane +2 en A, -1 en B, +1 en C). Le texte reflète
# cet écart : A renforce fortement le lien avec Orvane, B l'abîme, C le renforce légèrement.

id: ch18
number: 18
act: 2
title: La Reine de Brume des Cimes
introImage: ch18
scene: reine-brume-cimes

espagnol:
  - { es: "La reina flota sobre las nubes.", fr: "La reine flotte au-dessus des nuages." }
  - { es: "El respeto abre muchas puertas.", fr: "Le respect ouvre bien des portes." }
  - { es: "La niebla guarda la cima.", fr: "La brume garde le sommet." }
  - { es: "Hablemos con humildad.", fr: "Parlons avec humilité." }
  - { es: "Su silencio dice mucho.", fr: "Son silence en dit long." }

decision:
  prompt: "La Reine de Brume incline lentement sa tête immense vers les trois sœurs. « On me demande rarement la permission avant de traverser mon royaume. Vous, pourtant, vous l'avez fait. Comment comptez-vous honorer ce passage ? »"
  options:
    A:
      label: S'incliner ensemble, en silence, devant elle
      scene: "Axelle entraîne ses sœurs dans une révérence lente et sincère, les trois têtes baissées, sans un mot, devant l'immense silhouette de brume qui domine le plateau."
      line: { who: reine, text: "Peu de voyageurs savent encore s'incliner sans qu'on le leur impose. Ce respect-là, je ne l'oublierai pas." }
      habillage: "Chaque épreuve devient un moment de calme partagé, où le silence et l'attention comptent plus que la précipitation."
    B:
      label: Lui offrir un présent, en échange du passage
      scene: "Rafaelle, pragmatique, tend à la Reine un petit objet du voyage, espérant qu'un échange concret suffira à garantir leur passage sans plus de cérémonie."
      line: { who: reine, text: "Un présent n'est pas un hommage, petite voyageuse. Vous avez confondu ma brume avec un marché. Ce n'en est pas un." }
      habillage: "Les épreuves deviennent des négociations rapides, où il faut conclure vite, quitte à perdre un peu en profondeur."
    C:
      label: Lui raconter, avec honnêteté, pourquoi elles sont là
      scene: "Maelle s'avance et raconte, sans rien cacher, toute l'histoire du voyage et la raison pour laquelle les trois sœurs traversent ce royaume de brume."
      line: { who: reine, text: "Une histoire racontée sans artifice vaut, à mes yeux, bien plus qu'une offrande choisie à la hâte. Je vous écoute, petite Cartographe." }
      habillage: "Les épreuves deviennent des récits à raconter avec clarté, où la vérité compte plus que l'effet recherché."

repliquesAbsurdes:
  - "Si la Reine flotte au-dessus des nuages, est-ce qu'elle a déjà eu le vertige, au moins une fois dans sa vie ?"
  - "Mon renard a essayé de s'incliner devant la Reine. Il a surtout glissé sur le plateau mouillé par la brume."
  - "Est-ce qu'on peut serrer la main d'une reine faite de brume, ou est-ce qu'on finit juste la main toute mouillée ?"
  - "Si je parle trop fort devant la Reine, est-ce que ma voix va se perdre dans son immense silence, ou juste l'agacer ?"
  - "On a déjà vu des tableaux vivants et une galerie entière tissée de lumière. Une reine de brume, à ce stade, ça semble presque logique."

days:
  # ─────────────────────────── JOUR 1 ───────────────────────────
  - n: 1
    title: Le plateau suspendu
    decor: Un plateau rocheux suspendu au-dessus d'une mer de nuages, battu par un vent doux, où une immense silhouette de brume se dresse, immobile, dominant tout le paysage environnant.
    opening:
      - { who: narrateur, text: "La carte vivante mena les trois sœurs toujours plus haut, jusqu'à un plateau rocheux suspendu au-dessus d'une véritable mer de nuages, où le vent soufflait doucement entre les pierres." }
      - { who: narrateur, text: "Au centre du plateau se dressait une silhouette immense, faite tout entière de brume argentée, immobile, dominant le paysage comme une montagne vivante." }
      - { who: rafaelle, text: "C'est... c'est une personne, ça, ou un nuage particulièrement grand ?" }
      - { who: nilo, text: "À ce stade du voyage, je dirais que c'est probablement les deux à la fois, et je ne suis même plus surpris." }
      - { who: narrateur, text: "La silhouette tourna lentement la tête vers elles, et deux yeux d'un bleu profond s'ouvrirent au cœur de la brume." }
      - { who: reine, text: "Bienvenue sur mon plateau, petites voyageuses. On me demande rarement la permission avant de traverser mon royaume." }
      - { who: axelle, text: "On ne voulait pas vous déranger ! On cherchait juste notre chemin vers le sommet." }
      - { who: reine, text: "Vous ne me dérangez pas, petite Veilleuse. Au contraire : rares sont ceux qui s'arrêtent pour me regarder vraiment." }
      - { who: maelle, text: "Vous régnez sur toute cette brume, au-dessus des nuages ?" }
      - { who: reine, text: "Je veille sur elle, plutôt que je ne règne, petite Cartographe. Une distinction importante, que peu de voyageurs prennent la peine de faire." }
    manches:
      - id: m1
        title: Une silhouette immense
        tours:
          axelle:
            - { id: ch18-j1-ax-m1a, subject: histoire-geo, level: 1, kind: qcm, prompt: "Comment appelle-t-on un épais nuage qui touche le sol ou le sommet d'une montagne ?", choices: ["la brume", "la pluie", "la neige", "la grêle", "le vent"], answer: "la brume", hint: "C'est le mot utilisé dans le titre du chapitre." }
            - { id: ch18-j1-ax-m1b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 8 + 7.", choices: ["13", "14", "15", "16", "17"], answer: "15", hint: "8 + 7 = 8 + 8 − 1." }
          maelle:
            - { id: ch18-j1-ma-m1a, subject: sciences, level: 2, kind: qcm, prompt: "Pourquoi trouve-t-on souvent une mer de nuages en dessous d'un sommet élevé ?", choices: ["l'air chaud et humide se condense en altitude, formant des nuages bas", "il n'y a jamais de nuages en montagne", "les nuages montent toujours plus haut que les sommets", "cela n'a aucune explication connue", "parce que les montagnes attirent la pluie uniquement"], answer: "l'air chaud et humide se condense en altitude, formant des nuages bas", hint: "Pense à ce que les sœurs observent depuis le plateau." }
            - { id: ch18-j1-ma-m1b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 86 + 57.", choices: ["138", "141", "143", "145", "148"], answer: "143", hint: "86 + 60 − 3." }
          rafaelle:
            - { id: ch18-j1-ra-m1a, subject: histoire-geo, level: 3, kind: qcm, prompt: "Pourquoi les très hauts sommets étaient-ils souvent associés, dans d'anciens récits, à des figures mystérieuses ou royales ?", choices: ["parce que leur altitude et leur isolement en faisaient des lieux à part, difficiles d'accès", "parce que personne n'a jamais gravi de montagne", "parce que les sommets n'ont jamais inspiré aucun récit", "cela n'a aucune raison particulière", "parce que les montagnes étaient toujours interdites"], answer: "parce que leur altitude et leur isolement en faisaient des lieux à part, difficiles d'accès", hint: "Pense à l'impression que fait la Reine, perchée si haut." }
            - { id: ch18-j1-ra-m1b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 17 × 6.", choices: ["96", "100", "102", "104", "108"], answer: "102", hint: "17 × 6 = 17 × 3 × 2." }
      - id: m2
        title: Veiller plutôt que régner
        tours:
          axelle:
            - { id: ch18-j1-ax-m2a, subject: francais, level: 1, kind: qcm, prompt: "Quel est le sujet de « Deux yeux d'un bleu profond s'ouvrirent. » ?", choices: ["d'un bleu profond", "s'ouvrirent", "Deux yeux", "bleu", "profond"], answer: "Deux yeux", hint: "Qu'est-ce qui s'ouvre dans la brume ?" }
            - { id: ch18-j1-ax-m2b, subject: maths, level: 1, kind: qcm, prompt: "Calcule 13 − 6.", choices: ["5", "6", "7", "8", "9"], answer: "7", hint: "13 − 6 = 7." }
          maelle:
            - { id: ch18-j1-ma-m2a, subject: francais, level: 2, kind: qcm, prompt: "Quelle est la nature du mot « importante » dans « une distinction importante » ?", choices: ["nom", "verbe", "adjectif", "adverbe", "pronom"], answer: "adjectif", hint: "Il décrit la distinction entre régner et veiller." }
            - { id: ch18-j1-ma-m2b, subject: maths, level: 3, kind: qcm, prompt: "Calcule 392 ÷ 7.", choices: ["52", "54", "56", "58", "60"], answer: "56", hint: "7 × 56 = 392." }
          rafaelle:
            - { id: ch18-j1-ra-m2a, subject: francais, level: 4, kind: qcm, prompt: "« Je veille sur elle, plutôt que je ne règne. » : que révèle cette phrase sur la façon dont la Reine conçoit son rôle ?", choices: ["qu'elle se voit comme une protectrice plutôt que comme une souveraine autoritaire", "qu'elle n'a aucune responsabilité sur la brume", "qu'elle déteste la brume qui l'entoure", "qu'elle préfère commander sans jamais protéger", "qu'elle ignore totalement ce qui se passe sur son plateau"], answer: "qu'elle se voit comme une protectrice plutôt que comme une souveraine autoritaire", hint: "Relis bien sa réponse à Maelle." }
            - { id: ch18-j1-ra-m2b, subject: maths, level: 4, kind: qcm, prompt: "Calcule 13² − 100.", choices: ["59", "63", "65", "69", "73"], answer: "69", hint: "169 − 100." }
      - id: m3
        title: Le vent du plateau
        tours:
          axelle:
            - { id: ch18-j1-ax-m3a, subject: maths, level: 1, kind: qcm, prompt: "Il y a 6 pierres sur le plateau, et 3 de plus apparaissent dans la brume. Combien de pierres en tout ?", choices: ["7", "8", "9", "10", "11"], answer: "9", hint: "6 + 3." }
            - { id: ch18-j1-ax-m3b, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi fait-il souvent plus froid et plus venteux en haute altitude qu'en plaine ?", choices: ["l'air y est plus fin et retient moins bien la chaleur", "il fait toujours plus chaud en altitude", "le vent n'existe jamais en montagne", "cela n'a aucune explication connue", "parce que les nuages réchauffent toujours l'air"], answer: "l'air y est plus fin et retient moins bien la chaleur", hint: "Pense à la température en haute montagne, loin au-dessus des nuages." }
          maelle:
            - { id: ch18-j1-ma-m3a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 46 × 4.", choices: ["178", "182", "184", "186", "190"], answer: "184", hint: "46 × 4 = 50 × 4 − 4 × 4." }
            - { id: ch18-j1-ma-m3b, subject: histoire-geo, level: 2, kind: qcm, prompt: "Pourquoi certains lieux naturels impressionnants inspiraient-ils, autrefois, un profond respect chez les voyageurs ?", choices: ["leur grandeur et leur mystère rappelaient la petitesse des humains face à la nature", "parce que ces lieux n'existaient pas vraiment", "parce que c'était toujours interdit d'y aller", "cela n'a jamais inspiré aucun respect", "parce que les lieux impressionnants étaient toujours dangereux"], answer: "leur grandeur et leur mystère rappelaient la petitesse des humains face à la nature", hint: "Pense à l'effet que produit la Reine sur les trois sœurs." }
          rafaelle:
            - { id: ch18-j1-ra-m3a, subject: maths, level: 4, kind: qcm, prompt: "Résous : 5x + 4 = 39.", choices: ["5", "6", "7", "8", "9"], answer: "7", hint: "5x = 35." }
            - { id: ch18-j1-ra-m3b, subject: francais, level: 3, kind: qcm, prompt: "Conjugue au passé composé : « Le vent (souffler) doucement entre les pierres. »", choices: ["a soufflé", "soufflait", "soufflera", "souffle", "soufflant"], answer: "a soufflé", hint: "Passé composé = avoir + participe passé." }
      - id: m4
        title: Premières impressions
        tours:
          axelle:
            - { id: ch18-j1-ax-m4a, subject: maths, level: 2, kind: qcm, prompt: "Calcule 9 × 3.", choices: ["24", "25", "27", "29", "30"], answer: "27", hint: "9 × 3 = 9 + 9 + 9." }
            - { gen: maths.addition }
          maelle:
            - { id: ch18-j1-ma-m4a, subject: maths, level: 3, kind: qcm, prompt: "Calcule 235 − 88.", choices: ["140", "144", "147", "149", "152"], answer: "147", hint: "235 − 90 + 2." }
            - { gen: maths.multiplication }
          rafaelle:
            - { id: ch18-j1-ra-m4a, subject: espagnol, level: 2, kind: qcm, prompt: "Traduis : « La reina flota sobre las nubes. »", choices: ["La reine marche sur les nuages.", "La reine flotte au-dessus des nuages.", "La reine dort dans les nuages.", "La reine tombe des nuages.", "La reine cache les nuages."], answer: "La reine flotte au-dessus des nuages.", hint: "« Flota sobre » = flotte au-dessus." }
            - { gen: maths.fraction-de }
    pause: "Le jeu de la révérence : chaque sœur invente une façon différente de saluer respectueusement une reine imaginaire, sans se moquer, puis les deux autres votent pour la révérence la plus sincère."
    closing:
      - { who: narrateur, text: "Le vent se calmait doucement sur le plateau, et la Reine de Brume, toujours immobile, observait les trois sœurs avec une patience qui semblait n'avoir aucune limite." }
      - { who: reine, text: "Demain, je vous montrerai ce que l'on voit, depuis ce plateau, quand la brume se dissipe un instant. Peu de voyageurs ont eu ce privilège avant vous." }
      - { who: rafaelle, text: "On sera là, avec grand plaisir." }
      - { who: narrateur, text: "En s'éloignant pour la nuit, Axelle se retourna une dernière fois vers la silhouette immense, et crut voir, l'espace d'un instant, un sourire se dessiner au cœur de la brume." }
    reward: "la découverte de la Reine de Brume et de son plateau suspendu"
  # ─────────────────────────── JOUR 2 ───────────────────────────
  - n: 2
    title: Ce que révèle la brume
    decor: Le même plateau, à l'aube, où la brume se dissipe lentement sous les premiers rayons du soleil, révélant un panorama vertigineux sur toute la chaîne de montagnes environnante.
    opening:
      - { who: narrateur, text: "Le lendemain, à l'aube, la Reine les attendait déjà, et sous les premiers rayons du soleil, la brume qui l'entourait commença à se dissiper lentement, révélant un panorama vertigineux sur toute la chaîne de montagnes." }
      - { who: reine, text: "Regardez bien, petites voyageuses. Ce spectacle ne dure jamais longtemps, et peu de voyageurs ont la patience de l'attendre." }
      - { who: maelle, text: "On voit tout le chemin qu'on a parcouru depuis le hall des cartes ! C'est incroyable !" }
      - { who: reine, text: "Et un peu de ce qu'il vous reste à parcourir, aussi, si vous regardez plus loin encore, vers les sommets les plus hauts." }
      - { who: axelle, text: "Ça paraît tellement loin, d'ici !" }
      - { who: reine, text: "Tout paraît loin, vu d'en haut, petite Veilleuse. C'est pourtant bien plus proche qu'il n'y paraît, une fois qu'on avance, un pas après l'autre." }
      - { who: rafaelle, text: "Pourquoi la brume se dissipe-t-elle si rarement, alors, si la vue est aussi belle une fois dégagée ?" }
      - { who: reine, text: "Parce qu'une beauté trop facilement offerte perd, souvent, un peu de sa valeur. La brume protège ce panorama autant qu'elle le cache." }
    manches:
