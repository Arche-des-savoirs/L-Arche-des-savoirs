        title: La brume qui se dissipe
        tours:
          axelle:
            - { id: ch18-j2-ax-m1a, subject: sciences, level: 1, kind: qcm, prompt: "Pourquoi la brume se dissipe-t-elle souvent au lever du soleil ?", choices: ["la chaleur du soleil réchauffe l'air et évapore les gouttelettes d'eau", "la brume disparaît toujours au hasard", "le soleil n'a aucun effet sur la brume", "cela n'a aucune explication connue", "la brume se transforme toujours en pluie le matin"], answer: "la chaleur du soleil réchauffe l'air et évapore les gouttelettes d'eau", hint: "Pense à l'effet des premiers rayons du soleil sur la brume." }
